evidence_id: EVD-000194
provenance:
  sources:
    - SRC-0155
  extracted_at: 2026-10-25
observation:
  summary: >-
    O registo do contrato n.º 15792843 no Portal BASE, publicado em 19 de outubro de 2026, indica que o Município de Évora celebrou em 19 de junho de 2026 com a Tecnovia — Sociedade de Empreitadas, S.A. o contrato da empreitada de reparação de estradas municipais no concelho de Évora, com preço contratual inicial de 745 000 euros e prazo de execução de 304 dias. O texto do contrato anexo, datado de 16 de junho e assinado digitalmente em 19 de junho, fixa um preço unitário de 41,45 euros até 745 000 euros sem IVA e um prazo de 10 meses contado da consignação ou da comunicação da aprovação do plano de segurança e saúde, se esta for posterior.
scope:
  geography:
    level: municipality
    area: Município de Évora
  temporal:
    as_of: 2026-06-19
domains:
  - URB
  - MOB
evidence_nature: fact
claim_authority: authoritative
inference_limits:
  - A celebração do contrato não estabelece a data de consignação, o início efetivo dos trabalhos, a execução física ou a conclusão.
  - O prazo conta-se a partir da consignação ou da aprovação do plano de segurança e saúde; sem essas datas, não é possível saber quando termina.
  - O registo e o texto do contrato não identificam as ruas da cidade incluídas; remetem para peças do procedimento que não foram consultadas.
  - O preço contratual é um limite máximo, não despesa executada.
  - A falta de data de encerramento no registo, na consulta, não demonstra que a obra esteja ou não concluída.
