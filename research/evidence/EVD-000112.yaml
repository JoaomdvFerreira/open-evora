observation:
  summary: A APCE refere que o seu trabalho de acessibilidade no espaço público é
    realizado em parceria com a Câmara Municipal de Évora, porque a intervenção
    no espaço público é da competência municipal; o papel da própria APCE
    consiste na avaliação de acessibilidade in loco, com a participação direta
    de pessoas com mobilidade reduzida, que partem das dificuldades que
    experienciam para ajudar a identificar problemas e correções adequadas.
scope:
  geography:
    level: city
    area: Évora city — public space
  populations:
    - people with reduced mobility
  temporal:
    as_of: 2026-08-12
domains:
  - ACC
  - URB
evidence_nature: fact
claim_authority: authoritative
inference_limits:
  - A Observation descreve o método e a governação do trabalho da APCE; não
    estabelece prevalência de barreiras, cobertura territorial nem confirmação
    independente pela Câmara Municipal.
