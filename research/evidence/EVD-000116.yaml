evidence_id: EVD-000116
provenance:
  sources:
    - SRC-0100
  extracted_at: 2026-08-12
observation:
  summary: O boletim estatístico mensal nacional dos centros de emprego do IEFP
    comunica valores de desemprego, vagas e colocações ao nível da área de
    abrangência do Centro de Emprego (CTEF). A área de abrangência do CTEF Évora
    cobre catorze municípios, e não apenas o concelho de Évora, e o boletim não
    publica, para nenhuma escala geográfica, uma lista discriminada por
    profissão que identifique situações de escassez ou profissões de difícil
    recrutamento.
scope:
  geography:
    level: intermunicipal
    area: área de abrangência do CTEF Évora — 14 municípios
  populations:
    - job seekers
    - employers
  temporal:
    status: unknown
domains:
  - EMP
  - ECO
evidence_nature: fact
claim_authority: authoritative
inference_limits:
  - A unidade territorial do CTEF Évora abrange 14 municípios e não permite uma
    leitura municipal isolada.
  - O boletim não confirma nem refuta profissões específicas como difíceis de
    recrutar no Município de Évora.
