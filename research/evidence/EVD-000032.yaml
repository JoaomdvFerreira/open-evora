evidence_id: EVD-000032
provenance:
  sources:
    - SRC-0028
  extracted_at: 2026-08-10
observation:
  summary: O plano de ação social de 2025 inclui reabilitação habitacional ao
    abrigo da Estratégia Local de Habitação, metas de habitação a custos
    controlados, reabilitação para arrendamento apoiado, respostas de alojamento
    temporário ou partilhado para populações vulneráveis, bem como trabalho
    explícito de avaliação das necessidades de alojamento estudantil e de
    candidatura a financiamento.
scope:
  geography:
    level: municipality
    area: Município de Évora
  populations:
    - residentes affected by housing shortage
    - populações vulneráveis que necessitam de alojamento temporário
    - students
  temporal:
    as_of: "2025"
domains:
  - HOU
  - SOC
evidence_nature: recommendation
claim_authority: authoritative
inference_limits:
  - As ações e metas constantes do plano não estabelecem a sua execução, entrega
    ou eficácia.
