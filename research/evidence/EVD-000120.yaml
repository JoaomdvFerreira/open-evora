evidence_id: EVD-000120
provenance:
  sources:
    - SRC-0104
  extracted_at: 2026-08-12
observation:
  summary: O Regulamento Municipal de Cedência e Utilização de Cartografia Digital
    estabelece o fornecimento de informação nos formatos DWG, SHP, ECW e PDF
    através de um processo formal de cedência mediante pedido e análise caso a
    caso.
scope:
  geography:
    level: municipality
    area: Município de Évora
  populations:
    - cartography/data requesters (professionals, institutions, general public)
  temporal:
    as_of: 2020-12
domains:
  - GEO
  - URB
evidence_nature: fact
claim_authority: authoritative
inference_limits:
  - O regulamento descreve capacidade geral de cedência de cartografia e não
    confirma a existência ou atualidade de uma camada SHP específica da rede
    ciclável.
  - O processo de cedência não permite concluir, por si só, se existem outras
    formas de acesso, incluindo API ou open data.
