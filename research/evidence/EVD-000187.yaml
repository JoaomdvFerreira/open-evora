observation:
  summary: O registo do contrato n.º 15522521 no Portal BASE, publicado em 24 de agosto de 2026, indica que o Município de Évora celebrou em 8 de junho de 2026 com a Construções J.J.R. & Filhos, S.A. o contrato para reabilitar pavimentos na zona da Garraia e Sizuda, nos caminhos CM1090 e CM1090-1 e no troço entre a EN18 e o CM1090, com preço contratual inicial de 554 801,74 euros e prazo de execução de 60 dias.
