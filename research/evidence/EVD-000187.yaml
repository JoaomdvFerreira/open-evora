inference_limits:
  - O prazo de 60 dias é contratual; o registo não estabelece as datas efetivas de início ou de conclusão das obras.
  - O registo não documenta a execução física dos trabalhos nem o estado do pavimento.
  - O objeto do contrato é a zona da Garraia e Sizuda; não identifica ruas da cidade nem documenta a empreitada geral de reparação de estradas no concelho.
  - A falta de data de encerramento no registo, na consulta, não demonstra que a obra esteja ou não concluída.
