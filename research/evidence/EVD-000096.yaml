evidence_id: EVD-000096
provenance:
  sources:
    - SRC-0081
    - SRC-0053
  extracted_at: 2026-10-14
observation:
  summary: "Os autos de transferência de competências de higiene urbana e manutenção de espaços verdes para as uniões de freguesias urbanas foram aprovados, com efeitos apenas a partir de 1 de janeiro de 2027. As tarefas e áreas são delimitadas e diferem entre uniões; a recolha de resíduos urbanos e de monos não é transferida em bloco. A preparação técnica e operacional permanecia necessária."
scope:
  geography:
    level: city
    area: Uniões de freguesias urbanas de Évora, nas áreas delimitadas pelos autos de transferência
  populations:
    - residentes
    - uniões de freguesias urbanas
  temporal:
    start: 2026-07
    end: 2027-01
domains:
  - ENV
  - PUB
evidence_nature: fact
claim_authority: non_authoritative
inference_limits:
  - "A informação sobre competências e áreas provém do relato jornalístico do esclarecimento conjunto das uniões e da comunicação municipal."
  - "A aprovação não significa entrada em vigor em 2026; os efeitos estavam previstos apenas para 1 de janeiro de 2027."
  - "As responsabilidades não são idênticas nem abrangem integralmente os territórios das uniões."
  - "A recolha de resíduos urbanos e de monos não se transfere em bloco para as uniões."
  - "A preparação operacional/ técnica permanecia necessária; a evidência não demonstra o funcionamento efetivo do modelo."
