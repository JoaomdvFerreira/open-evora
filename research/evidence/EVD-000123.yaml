  extracted_at: 2026-08-12
observation:
  summary: >-
    O diagnóstico do Volume I do PMUSE descreve, no Centro Histórico, paragens
    sem abrigo identificadas por uma placa azul e branca com o operador e a
    linha, sem mapa da rede nem horários. Descreve também paragens com abrigo
    cujos painéis apresentam informação básica sobre linhas, paragens e
    horários, mas não incluem elementos de acessibilidade universal como
    informação em braille e avisos sonoros.
scope:
  geography:
    level: city
    area: cidade de Évora
  populations:
    - pessoas que utilizam o transporte público em Évora
    - pessoas que dependem de informação acessível nas paragens, incluindo pessoas com deficiência sensorial
  temporal:
    status: unknown
domains:
  - MOB
  - DIG
  - ACC
evidence_nature: fact
claim_authority: authoritative
inference_limits:
  - O diagnóstico não identifica neste registo todas as paragens afetadas. A
    descrição e a figura 99 relativas ao Centro Histórico não demonstram que
    todas as paragens sem abrigo de Évora tenham a mesma informação.
  - O estado atual das paragens após o diagnóstico não está estabelecido.
  - Não está estabelecido qualquer impacto prático numa viagem concreta.
