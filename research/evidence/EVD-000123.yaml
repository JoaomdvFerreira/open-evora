observation:
  summary: "O Volume I do PMUSE documenta informação física heterogénea nas
    paragens de autocarro: as paragens sem abrigo têm apenas uma placa
    azul/branca que identifica o operador e a linha, enquanto as paragens com
    abrigo têm um painel que apresenta linhas/paragens/horários — mas o próprio
    plano afirma que este painel não dispõe dos elementos de acessibilidade (por
    exemplo, braille, avisos sonoros) necessários para a acessibilidade
    universal."
