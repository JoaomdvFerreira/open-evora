evidence_id: EVD-000106
lineage_id: MOB-2022-SEATTLE-OPENPARK-SCIREPORTS-STUDY
provenance:
  sources:
    - SRC-0093
  extracted_at: 2026-08-11
observation:
  summary: Uma experiência controlada em contexto real (274 sensores embutidos
    junto ao passeio a alimentar informação de disponibilidade em tempo real no
    sistema OpenPark; 11 condutores, 33 percursos, 495 entregas simuladas; com e
    sem informação de disponibilidade) concluiu que a apresentação de informação
    sobre disponibilidade junto ao passeio reduziu em 27,9 % o tempo de
    circulação à procura de estacionamento e em 12,4 % a distância percorrida
    nessa procura.
scope:
  geography:
    level: local_area
    area: Belltown, Seattle, Washington, EUA
  populations:
    - condutores de veículos de entrega
  temporal:
    status: unknown
domains:
  - MOB
  - DIG
evidence_nature: measurement
claim_authority: authoritative
inference_limits:
  - A experiência envolve condutores de veículos de entrega e não utilizadores
    gerais de estacionamento.
  - O contexto é uma área comercial instrumentada de 10 quarteirões em Belltown,
    Seattle.
  - O estudo não demonstra uma redução proporcional da distância total
    percorrida ou das emissões e não estabelece um efeito equivalente em Évora.
