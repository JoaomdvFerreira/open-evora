observation:
  summary: Existem em Évora vários mecanismos institucionais de apoio à ligação
    entre candidatos e oportunidades de emprego, incluindo iniciativas
    universitárias de carreira e empregabilidade, um Portal de Emprego da
    Universidade de Évora onde estudantes e antigos alunos podem publicar CV,
    receber notificações de correspondências e candidatar-se, mecanismos de
    publicação e pesquisa de perfis por empregadores, ofertas do IEFP e
    mecanismos de formação associados ao NERE/IEFP.
scope:
  geography:
    level: municipality
    area: Município de Évora
  populations:
    - students and recent graduates
    - employers
    - job seekers
  temporal:
    status: unknown
