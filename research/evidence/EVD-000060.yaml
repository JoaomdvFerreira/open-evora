  extracted_at: 2026-08-11
observation:
  summary: O Plano Estratégico para a Cultura de Évora, de 2022, propõe como
    ação prioritária um «Portal do Associativismo». Em 2026, a plataforma Évora
    Associativismo, do Município de Évora, está disponível num endereço
    próprio.
scope:
  geography:
    level: municipality
    area: Município de Évora
  populations:
    - associações culturais e cívicas
    - equipas culturais municipais
  temporal:
    start: "2022"
    end: "2026"
domains:
  - CUL
  - PUB
  - DIG
evidence_nature: fact
claim_authority: authoritative
inference_limits:
  - A existência da plataforma não estabelece a experiência dos utilizadores, a
    completude dos processos ou a sua eficácia para as associações.
  - A disponibilidade da plataforma não estabelece quando entrou em
    funcionamento, que funcionalidades oferece nem em que medida é utilizada
    pelas associações.
