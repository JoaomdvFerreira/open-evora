observation:
  summary: O ecossistema geográfico utilizado pelo Município disponibiliza
    serviços geográficos interativos, enquanto a atividade GEOCIMAC da CIMAC
    para 2026 inclui ArcGIS Enterprise/Portal, serviços de mapas, aplicações
    WebGIS e criação, manutenção e atualização de informação geográfica
    intermunicipal; a CIMAC enquadra também a acessibilidade e a reutilização de
    informação territorial por cidadãos, academia e empresas como objetivos do
    projeto.
