evidence_id: EVD-000079
lineage_id: MOB-2026-03-JN-COLEGIO-PEDRO-FONSECA-PROTEST
provenance:
  sources:
    - SRC-0066
  extracted_at: 2026-08-11
observation:
  summary: Cerca de 30 estudantes da Universidade de Évora manifestaram-se no
    Colégio Pedro da Fonseca, reivindicando horários adicionais de transporte; a
    reportagem referiu uma petição com mais de 250 assinaturas e relatos de
    estudantes sobre uma disponibilidade limitada de opções de transporte
    utilizáveis na prática, autocarros cheios e tempos efetivos de deslocação
    longos. Um estudante descreveu ter recorrido a um serviço TVDE porque, nessa
    manhã, os transportes públicos não ofereciam uma opção de deslocação que lhe
    fosse utilizável.
scope:
  geography:
    level: local_area
    area: zona do Colégio Pedro da Fonseca, Évora
  populations:
    - estudantes da Universidade de Évora
    - utilizadores dos transportes públicos
  temporal:
    as_of: 2026-03-19
domains:
  - MOB
evidence_nature: reported-experience
claim_authority: non_authoritative
inference_limits:
  - O relato corresponde a um único protesto/evento e não permite estimar
    prevalência ou representatividade.
  - Os relatos não foram confrontados neste registo com dados operacionais ou
    horários do serviço.
  - Cobertura sindicada do mesmo evento não constitui corroboração independente.
