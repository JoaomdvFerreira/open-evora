observation:
  summary: O Oxford cidade Conselho afirma que as comunicações dos residentes
    sobre contentores não recolhidos são verificadas com base num sistema de
    registo em tempo real instalado nos veículos de recolha, distinguindo uma
    recolha efetivamente falhada de uma ocorrência já registada pela equipa ou
    de outro motivo para a não recolha — o mecanismo de comunicação de
    ocorrências pelos residentes está integrado com dados operacionais de
    recolha, em vez de constituir uma fila separada de reclamações não
    verificadas.
