evidence_id: EVD-000011
lineage_id: MOB-2026-03-CIMAC-TPAC-ANNUAL-EVALUATION
provenance:
  sources:
    - SRC-0019
  extracted_at: 2026-08-10
observation:
  summary: O conjunto de dados de comunicações de 2023-2025 regista 92
    comunicações relativas a horários, 52 relativas às condições dos veículos,
    24 a atrasos, 8 a paragens e números inferiores relativos a passes,
    bilhética, sobrelotação e alterações de linhas. O relatório afirma que 43%
    das comunicações estavam relacionadas com horários e que muitas diziam
    respeito a pedidos para criar ou sincronizar horários, e não a
    incumprimentos do serviço. A sua avaliação de satisfação de 2025 conclui que
    a experiência a bordo é mais positiva do que a experiência de espera e de
    acesso à informação.
scope:
  geography:
    level: intermunicipal
    area: Alentejo Central
  populations:
    - TPAC users
  temporal:
    as_of: "2025"
domains:
  - MOB
  - ACC
evidence_nature: measurement
claim_authority: authoritative
inference_limits:
  - Os resultados referem-se ao serviço intermunicipal TPAC e não ao serviço
    urbano TREVO.
  - As reclamações e respostas do inquérito não estabelecem, por si só, a
    prevalência de falhas em viagens específicas no Município de Évora.
