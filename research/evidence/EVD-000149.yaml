inference_limits:
  - A ata de 2026 reporta conclusões de um diagnóstico de 2023 e não estabelece
    que estas dificuldades persistam atualmente com a mesma extensão.
  - A observação não mede prevalência, frequência, severidade, grupos mais
    afetados ou jornadas concretas de acesso aos serviços de saúde.
  - Não permite separar dificuldades específicas da condição migrante de
    constrangimentos gerais do sistema de saúde que também possam afetar outros
    residentes.
