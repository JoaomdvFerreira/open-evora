observation:
  summary: Entre julho e agosto de 2026, o Município documentou uma resposta de
    reorganização da higiene urbana que incluiu reforço de pessoal e veículos,
    alterações nos horários e modelos de recolha, medidas logísticas, alterações
    de responsabilidades, monitorização interna e intenção de responder mais
    rapidamente aos pedidos dos munícipes relativos a resíduos volumosos.
scope:
  geography:
    level: municipality
    area: Município de Évora
  populations:
