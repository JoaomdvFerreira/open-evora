evidence_nature: fact
claim_authority: authoritative
inference_limits:
  - As medidas e prioridades da resposta municipal não demonstram que esses
    fatores sejam as causas dominantes nem que a reorganização tenha sido
    plenamente executada ou restaurado a fiabilidade do serviço.
  - As medidas apresentadas como realizadas são descritas pelo próprio
    Município. As fontes não confirmam que as medidas previstas, como as
    equipas externas a partir de 1 de agosto, tenham entrado em funcionamento,
    nem demonstram o funcionamento das medidas depois de julho de 2026.
