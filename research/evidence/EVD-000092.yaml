evidence_id: EVD-000092
lineage_id: SOC-2025-PLANO-CONCELHIO-CUIDADORES-INFORMAIS
provenance:
  sources:
    - SRC-0030
  extracted_at: 2026-08-11
observation:
  summary: Os cuidadores participantes no estudo propuseram acesso mais
    centralizado, simplificado e multicanal à informação, incluindo atendimento
    presencial, virtual e telefónico, um manual ou fluxograma simplificado e
    centralizado e lembretes em dispositivos móveis sobre prazos e novidades.
scope:
  geography:
    level: municipality
    area: Município de Évora
  populations:
    - cuidadores informais participantes no estudo
  temporal:
    as_of: "2025"
domains:
  - SOC
  - HEA
evidence_nature: recommendation
claim_authority: non_authoritative
inference_limits:
  - As recomendações refletem participantes do estudo e não constituem uma
    preferência representativa do conjunto dos cuidadores.
  - A recomendação de um mecanismo de informação não demonstra a sua eficácia
    nem que a informação seja a causa principal das dificuldades de acesso.
