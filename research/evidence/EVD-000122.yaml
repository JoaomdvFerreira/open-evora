  extracted_at: 2026-08-12
observation:
  summary: "O plano de ação do PMUSE enumera explicitamente melhorias na
    informação ao passageiro como intervenções propostas: melhorar as condições
    de conforto, acessibilidade e informação nas paragens; implementar sistemas
    de informação em tempo real nas principais paragens de transportes públicos;
    e criar uma aplicação e um sítio web para divulgar informação multimodal
    sobre os diferentes modos de transporte — estando cada intervenção
    associada, na tabela de ações do plano, a uma medida/custo indicativo."
