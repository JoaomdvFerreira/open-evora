evidence_id: EVD-000152
provenance:
  sources:
    - SRC-0123
    - SRC-0150
  extracted_at: 2026-10-14
observation:
  summary: Numa notícia publicada em 3 de novembro de 2025, a Universidade de
    Évora indicou ter assinado com a AIMA, a 29 de outubro, um protocolo para
    criar um gabinete do Centro Local de Apoio à Integração de Migrantes (CLAIM)
    destinado exclusivamente à comunidade académica migrante da Universidade,
    incluindo requerentes e beneficiários de proteção internacional. Em agosto
    de 2026, os Serviços de Ação Social da Universidade mantinham uma página
    pública para o CLAIM, com equipa e contacto institucional identificados.
scope:
  geography:
    level: site
    area: Universidade de Évora, Évora
  temporal:
    start: 2025-10-29
    end: 2026-08-28
  populations:
    - comunidade académica migrante da Universidade de Évora, incluindo
      requerentes e beneficiários de proteção internacional
domains:
  - SOC
  - EDU
evidence_nature: fact
claim_authority: authoritative
inference_limits:
  - O CLAIM destina-se, segundo a Universidade, à sua comunidade académica
    migrante; não estabelece apoio ou cobertura para a restante população
    migrante da cidade ou do concelho.
  - As fontes não fornecem número de pessoas atendidas, tipos de apoio
    efetivamente prestados, encaminhamentos para serviços de saúde, apoio de
    interpretação em unidades de saúde, resultados ou eficácia.
  - A notícia de 2025 descreve a assinatura do protocolo para criar o gabinete;
    não estabelece a data de início de funcionamento nem a atividade do serviço
    depois de agosto de 2026.
  - Não estabelece que as barreiras de língua ou as dificuldades de acesso à
    saúde tenham diminuído.
lineage_id: MIG-2026-UE-CLAIM
