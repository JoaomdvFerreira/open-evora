    efeitos observados de fluxo de tráfego, segurança, ruído, poluição,
    emissões ou redução de tráfego na envolvente urbana.
  - A entrada em funcionamento da via não deve, por si só, ser tratada como
    efeito realizado no tráfego, na segurança, no ruído, na poluição, nas
    emissões ou noutros resultados daí decorrentes.
