inference_limits:
  - O diagnóstico não estabelece que as barreiras descritas permaneçam
    inalteradas após intervenções posteriores.
  - As descontinuidades e o subdimensionamento descritos referem-se à rede
    pedonal fora do Centro Histórico e não estabelecem essas mesmas condições
    no interior do Centro Histórico.
