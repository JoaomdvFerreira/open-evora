evidence_id: EVD-000117
lineage_id: MOB-2022-2023-CME-TRANSPORT-AUTHORITY-HISTORICAL-REPORTS
provenance:
  sources:
    - SRC-0102
    - SRC-0101
  extracted_at: 2026-08-12
observation:
  summary: Os relatórios anuais de 2022 e 2023 da autoridade municipal de
    transportes afirmam ambos, com formulação idêntica à do relatório atual de
    2026 (EVD-000002/EVD-000024), que a rede urbana cobre praticamente toda a
    zona urbana de Évora durante o dia, mas reduz a oferta de serviço à noite,
    aos fins de semana e nos feriados. Isto estabelece esse padrão temporal de
    redução do serviço como uma característica documentada da rede ao longo de
    vários anos (pelo menos de 2022 a 2026), e não como uma condição observada
    apenas recentemente ou transitória.
scope:
  geography:
    level: municipality
    area: cidade / município
  populations:
    - urbana transporte público utilizadores
    - residentes de lower-demand settlements
  temporal:
    start: "2022"
    end: "2023"
domains:
  - MOB
evidence_nature: fact
claim_authority: authoritative
inference_limits:
  - A Evidência é histórica e pertence à mesma família institucional de
    relatórios municipais, não constituindo uma voz independente adicional.
  - Os relatórios de 2022-2023 não estabelecem a severidade atual por linha ou
    corredor em 2026.
