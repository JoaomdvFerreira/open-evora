evidence_id: EVD-000090
lineage_id: SOC-2025-PLANO-CONCELHIO-CUIDADORES-INFORMAIS
provenance:
  sources:
    - SRC-0030
  extracted_at: 2026-08-11
observation:
  summary: No questionário a 133 cuidadores, as necessidades referidas deram
    prioridade ao apoio na prestação de cuidados (aprox. 40,8 %), ao descanso do
    cuidador (aprox. 40,0 %), ao apoio financeiro (aprox. 36,8 %) e ao apoio
    psicológico (aprox. 31,2 %), com valores superiores aos de várias
    necessidades relacionadas com orientação; quando lhes foi pedido que
    indicassem uma única necessidade mais importante, o descanso do cuidador e o
    apoio na prestação de cuidados foram os mais destacados.
scope:
  geography:
    level: municipality
    area: Município de Évora
  populations:
    - cuidadores informais incluídos no questionário
  temporal:
    as_of: "2025"
domains:
  - SOC
  - HEA
evidence_nature: measurement
claim_authority: authoritative
inference_limits:
  - O questionário foi recrutado através de organizações/projetos de apoio a
    cuidadores e a amostra é geograficamente concentrada, não sendo
    representativa do conjunto dos cuidadores do Município.
  - As prioridades reportadas não estabelecem relações causais nem a eficácia de
    respostas específicas.
