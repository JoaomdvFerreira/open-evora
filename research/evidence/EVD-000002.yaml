evidence_id: EVD-000002
lineage_id: MOB-2026-07-CME-TRANSPORT-AUTHORITY-ANNUAL-REPORT
provenance:
  sources:
    - SRC-0018
  extracted_at: 2026-08-10
observation:
  summary: O relatório de 2026 da Autoridade de Transportes municipal indica que a
    rede urbana cobre praticamente toda a zona urbana de Évora durante o dia,
    reduzindo a oferta à noite, aos fins de semana e nos feriados. Desde 2023,
    as localidades de baixa procura de Chainha Berlim, Santo Antónico, Barraca
    de Pau e Garraia passaram a dispor de transporte público flexível baseado em
    táxi em substituição de linhas fixas. A rede urbana integra 11 linhas
    urbanas regulares e duas linhas da Linha Azul.
scope:
  geography:
    level: municipality
    area: cidade / município
  populations:
    - urbana transporte público utilizadores
    - residentes de lower-demand settlements
  temporal:
    as_of: "2025"
domains:
  - MOB
evidence_nature: fact
claim_authority: authoritative
inference_limits:
  - A cobertura diurna ampla e o transporte flexível não estabelecem a adequação
    prática do serviço em todas as linhas, horários ou deslocações.
  - A existência do transporte flexível não demonstra a sua eficácia ou
    conveniência para todos os residentes das localidades abrangidas.
