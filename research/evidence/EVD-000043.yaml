    level: municipality
    area: Município de Évora
  populations:
    - students
  temporal:
    start: "2025"
    end: "2026"
domains:
  - HOU
  - EDU
evidence_nature: fact
claim_authority: authoritative
inference_limits:
  - A capacidade nominal não equivale necessariamente à capacidade efetivamente
    disponível durante as obras.
  - O encaminhamento para alojamento alternativo não quantifica a procura não
    satisfeita nem demonstra a sua resolução.
