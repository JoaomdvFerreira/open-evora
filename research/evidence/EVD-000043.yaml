observation:
  summary: As páginas públicas de alojamento da Universidade de Évora e dos SASUÉ
    documentam uma capacidade nominal de 525 lugares em sete residências,
    encerramentos temporários de residências para obras durante 2025/2026 e o
    encaminhamento dos estudantes para alojamento privado ou alternativo quando
    a disponibilidade nas residências é limitada.
scope:
