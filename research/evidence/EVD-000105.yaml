inference_limits:
  - A página do fornecedor não estabelece cobertura, precisão ou adoção da
    camada Parking Buddy nas zonas relevantes de Évora.
  - A disponibilidade do serviço de pagamento Via Verde Estacionar em Évora não
    prova que a previsão Parking Buddy esteja operacional em cada zona.
