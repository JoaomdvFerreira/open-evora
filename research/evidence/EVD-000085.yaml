observation:
  summary: A APCE descreve o Acesso Universal 1.3 como uma continuação de edições
    anteriores destinada a promover a participação ativa das pessoas com
    deficiência na melhoria da acessibilidade no Centro Histórico de Évora — as
    pessoas afetadas fazem explicitamente parte da identificação e melhoria das
    barreiras, não sendo apenas objeto de uma declaração institucional sobre
    acessibilidade.
