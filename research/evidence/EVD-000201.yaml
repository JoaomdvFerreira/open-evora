evidence_id: EVD-000201
provenance:
  sources:
    - SRC-0161
  extracted_at: 2026-11-14
observation:
  summary: >-
    Segundo comunicação do Município de 30 de outubro de 2026 sobre uma reunião da Câmara Municipal, um vereador anunciou a entrada em funcionamento, a partir de 4 de novembro, de um Centro Municipal de Recolha Temporária de Volumosos junto ao Largo de Machede Velho, para entrega de colchões, móveis e outros resíduos volumosos, excluindo resíduos de construção e demolição e resíduos verdes. Informou também que, a partir da mesma data, seria implementado trabalho por turnos para a recolha de resíduos se processar com horário mais alargado. Na reunião foram aprovados dois protocolos com a GESAMB que permitem aos munícipes entregar gratuitamente resíduos volumosos nas instalações da GESAMB, até 5 m³ por habitação e por ano, e foi simplificada a entrega de resíduos de pequenas obras particulares. O vereador referiu que, só em outubro, a linha dedicada à recolha de volumosos ao domicílio recebeu 119 pedidos e procedeu à recolha de 108 em 18 dias; que já tinham sido recebidos contentores de indiferenciados, para substituir os deteriorados, substituição já em curso, e para sistemas porta-a-porta; e que a recolha porta-a-porta em zonas do Centro Histórico e um canal para comércio e serviços (HORECA) estavam a ser trabalhados com a GESAMB, a alargar à medida que a Câmara tiver condições.
scope:
