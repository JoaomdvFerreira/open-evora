claim_authority: authoritative
inference_limits:
  - O anúncio não comprova que o centro de volumosos abriu em 4 de novembro, o seu horário ou a sua utilização, nem que o trabalho por turnos foi implementado, em que equipas ou em que circuitos.
  - A referência a 18 dias não permite determinar o tempo médio de resposta, o prazo de conclusão de cada pedido ou a duração total das operações descritas.
  - Os 119 pedidos e as 108 recolhas são números comunicados pelo Município e dizem respeito apenas à linha de recolha de volumosos ao domicílio em outubro de 2026; não medem a recolha regular de resíduos indiferenciados, outros meses, nem o funcionamento da recolha na cidade.
  - A recolha porta-a-porta no Centro Histórico e o canal HORECA são descritos como projetos em preparação; a fonte não estabelece calendário, zonas abrangidas nem execução.
  - A comunicação diz respeito ao concelho e não indica a distribuição destas medidas pelas zonas da cidade de Évora.
  - O objetivo declarado de reduzir a deposição e o abandono ilegal de resíduos volumosos não demonstra que esse efeito ocorra.
