evidence_id: EVD-000107
lineage_id: MOB-2014-SFPARK-SFMTA-PILOT-EVALUATION
provenance:
  sources:
    - SRC-0094
  extracted_at: 2026-08-11
observation:
  summary: A avaliação oficial do piloto SFpark da SFMTA indicou uma redução de 43
    % no tempo de procura de estacionamento nas zonas-piloto, face a 13 % nas
    zonas de controlo; os quarteirões foram classificados como «too full» com
    uma frequência 16 % inferior nas zonas-piloto, enquanto nas zonas de
    controlo essa frequência aumentou 51 %; e as milhas percorridas por veículos
    à procura de estacionamento e as emissões de gases com efeito de estufa
    associadas a essa procura diminuíram 30 % nas zonas-piloto, face a 6 % nas
    zonas de controlo.
scope:
  geography:
    level: local_area
    area: zonas-piloto e zonas de controlo do SFpark, São Francisco, Califórnia, EUA
  populations:
    - drivers
  temporal:
    status: unknown
domains:
  - MOB
  - DIG
evidence_nature: measurement
claim_authority: authoritative
inference_limits:
  - O piloto combinou sensing, informação em tempo real, preços ajustados à
    procura e alterações de pagamento, pelo que o efeito da informação isolada
    não é identificado.
  - Os resultados não estabelecem transferibilidade causal para Évora.
