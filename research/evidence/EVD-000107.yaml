evidence_id: EVD-000107
lineage_id: MOB-2014-SFPARK-SFMTA-PILOT-EVALUATION
provenance:
  sources:
    - SRC-0094
  extracted_at: 2026-08-11
observation:
  summary: A avaliação oficial do piloto SFpark da SFMTA indicou que o tempo que
    a maioria dos inquiridos declarou ter demorado a encontrar estacionamento
    diminuiu 43 % nas zonas-piloto, face a 13 % nas zonas de controlo, onde a
    avaliação não identificou uma variação estatisticamente significativa; os
    quarteirões foram classificados como «too full» com uma frequência 16 %
    inferior nas zonas-piloto, enquanto nas zonas de controlo essa frequência
    aumentou 51 %; e, segundo estimativas do relatório, as milhas diárias
    percorridas em circulação à procura de estacionamento com parquímetro e as
    emissões de gases com efeito de estufa associadas, expressas em CO2,
    diminuíram 30 % nas zonas-piloto, face a 6 % nas zonas de controlo, em dias
    úteis, das 9h às 18h.
scope:
  geography:
    level: local_area
    area: zonas-piloto e zonas de controlo do SFpark, São Francisco, Califórnia, EUA
  populations:
    - condutores
  temporal:
    status: unknown
domains:
  - MOB
  - DIG
evidence_nature: measurement
claim_authority: authoritative
inference_limits:
  - O piloto combinou sensing, informação em tempo real, preços ajustados à
    procura e alterações de pagamento, pelo que o efeito da informação isolada
    não é identificado.
  - Os resultados não estabelecem transferibilidade causal para Évora.
