evidence_nature: recommendation
claim_authority: authoritative
inference_limits:
  - A expansão é uma proposta e não infraestrutura entregue.
  - A proposta remonta a 2017 e a sua representação cartográfica não estabelece
    quanto foi executado posteriormente.
