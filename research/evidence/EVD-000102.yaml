observation:
  summary: O PlaQuaR é um mecanismo explicitamente concebido para alinhar a oferta
    de formação com as necessidades efetivas dos empregadores e instituições da
    região, através do mapeamento da formação disponível, da manutenção de
    informação atualizada e do reforço das redes de cooperação entre prestadores
    de educação/formação e empregadores.
