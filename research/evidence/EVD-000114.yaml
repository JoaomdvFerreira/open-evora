observation:
  summary: A APCE descreve um programa continuado de acessibilidade dirigido a
    estabelecimentos comerciais no Centro Histórico de Évora, iniciado com a
    Associação Comercial e posteriormente continuado com o NERE, utilizando
    selos graduados de acessibilidade; num seguimento, refere que cerca de 30
    estabelecimentos foram avaliados na versão 1.2 e que houve participação
    adicional de estabelecimentos na versão 1.3.
