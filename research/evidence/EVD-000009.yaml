evidence_id: EVD-000009
provenance:
  sources:
    - SRC-0016
    - SRC-0002
  extracted_at: 2026-08-10
observation:
  summary: O PMUSE afirma que o plano local de acessibilidade de 2022 deve ser
    revisto para acompanhar a implementação e alargar a análise a outras
    centralidades. O Social Development Plan 2024-2027 preconiza um levantamento
    atualizado de obstáculos, intervenções no espaço público para acesso a
    edifícios públicos, melhoria do acesso Terminal Rodoviário–Praça do Giraldo
    e medidas para a mobilidade pedonal e o transporte público em torno das
    escolas.
scope:
  geography:
    level: city
    area: city / Historic Centre and other centralities
  populations:
    - people with reduced mobility
    - the wider pedestrian population
  temporal:
    as_of: "2022"
domains:
  - ACC
  - MOB
  - URB
evidence_nature: recommendation
claim_authority: authoritative
inference_limits:
  - As ações previstas ou recomendadas não estabelecem que permaneçam por
    executar nem que tenham sido concluídas ou eficazes.
