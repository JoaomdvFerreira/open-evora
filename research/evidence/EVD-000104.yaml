evidence_id: EVD-000104
lineage_id: ACC-2025-APCE-ACESSO-UNIVERSAL-1.3
provenance:
  sources:
    - SRC-0091
  extracted_at: 2026-08-11
observation:
  summary: A APCE e a Câmara Municipal de Évora comunicam que, na sequência da
    verificação de equipamentos culturais geridos pelo município, produziram
    conjuntamente um levantamento que identifica condições de acessibilidade
    existentes, condições de acessibilidade em falta e possíveis soluções de
    melhoria para o conjunto de equipamentos avaliado. O texto público não
    enumera os equipamentos específicos nem as barreiras específicas em formato
    legível por máquina ou em forma textual detalhada, nem estabelece que cada
    défice identificado ainda estivesse presente em agosto de 2026.
scope:
  geography:
    level: city
    area: Évora city — municipal cultural facilities
  populations:
    - people with disabilities
  temporal:
    as_of: 2025-12-15
domains:
  - ACC
  - CUL
evidence_nature: claim
claim_authority: non_authoritative
inference_limits:
  - O texto público não enumera em detalhe os equipamentos e barreiras avaliados
    nem disponibiliza essa informação de forma estruturada.
  - O inventário não estabelece que cada défice identificado permanecesse
    presente em agosto de 2026 nem a prevalência de barreiras na cidade.
