verified_claims:
  - locator: "Título e destinatário da petição; linha de data de criação sob o texto"
    statement: "Petição pública dirigida à Câmara Municipal de Évora, com data de criação indicada de 28 de janeiro de 2026, que pede, com caráter de urgência, a requalificação da rede de estradas do concelho de Évora."
  - locator: "Texto da petição, 1.º parágrafo"
    statement: "Os signatários exprimem insatisfação com o estado degradado das vias rodoviárias do concelho, que afirmam arrastar-se há vários anos, e atribuem a responsabilidade tanto ao executivo municipal em funções como a executivos anteriores."
  - locator: "Texto da petição, 2.º parágrafo"
    statement: "Segundo os peticionários, há buracos e pavimento em mau estado de forma generalizada, a par de manutenção insuficiente, o que, na sua alegação, põe em causa a segurança rodoviária e causa danos materiais nos veículos."
  - locator: "Texto da petição, 2.º parágrafo"
    statement: "Os peticionários alegam também que esta situação afeta negativamente a circulação e a mobilidade, o bem-estar e as condições de vida de quem reside no concelho, bem como a imagem deste."
  - locator: "Texto da petição, 3.º parágrafo"
    statement: "A petição pede à Câmara que faça com urgência uma avaliação técnica das vias, que torne público um plano de requalificação com calendário definido e que execute intervenções de fundo duradouras em todo o concelho."
