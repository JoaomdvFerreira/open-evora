verified_claims:
  - locator: p. 10 impressa (PDF p. 6), Executive summary, Secondary benefits;
      p. 92 impressa (PDF p. 47), cap. 5, Parking search time, quadro do
      inquérito de interceção
    statement: No sumário executivo, o relatório indica que o tempo que a
      maioria das pessoas declarou ter demorado a encontrar lugar desceu 43 %
      nas áreas-piloto, face a uma descida de 13 % nas áreas de controlo. No
      capítulo 5, as mesmas percentagens correspondem à variação, antes e
      depois, do tempo de procura declarado em respostas a um inquérito de
      interceção, em dias úteis, das 9h às 18h.
  - locator: p. 92 impressa (PDF p. 47), cap. 5, Parking search time, texto
      antes e depois do quadro do inquérito de interceção
    statement: O relatório indica que, nas áreas de controlo, nenhum dos dois
      inquéritos utilizados (inquérito de interceção e inquérito manual ao
      tempo de procura) mostrou uma variação estatisticamente significativa do
      tempo de procura de estacionamento.
  - locator: p. 8 impressa (PDF p. 5), Executive summary, SFpark improved
      parking availability; p. 36 impressa (PDF p. 19), cap. 2, Parking
      availability, quadro de dias úteis
    statement: A métrica de quarteirões demasiado cheios corresponde à
      frequência horária com ocupação entre 90 % e 100 %, em dias úteis, das 9h
      às 18h. Comparando o período anterior ao piloto (primavera de 2011) com o
      período após a décima revisão de tarifas, essa frequência desceu 16 % nas
      áreas-piloto (de 17 % para 14 % do tempo) e subiu 51 % nas áreas de
      controlo (de 8 % para 12 % do tempo).
  - locator: p. 93 impressa (PDF p. 47), cap. 5, Traffic congestion and
      greenhouse gas emissions, quadros de VMT e de CO2 e nota 3; p. 10–11
      impressas (PDF p. 6)
    statement: Segundo estimativas do relatório, calculadas com dados de
      pagamento e cumprimento nos parquímetros, dos inquéritos ao tempo de
      procura e com taxas de emissão EMFAC 2011, as milhas diárias percorridas
      em circulação à procura de estacionamento com parquímetro e as emissões
      de gases com efeito de estufa associadas, expressas em CO2, desceram 30 %
      nas áreas-piloto e 6 % nas áreas de controlo, em dias úteis, das 9h às
      18h, entre 2011 e 2013.
