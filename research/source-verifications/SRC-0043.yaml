verified_claims:
  - locator: "Capa, página 1"
    statement: "A capa identifica o documento como relatório final do plano, datado de fevereiro de 2022, referindo um volume de caracterização do ecossistema cultural e um volume de estratégia e plano de ação."
  - locator: "Sumário executivo, página 5"
    statement: "O plano propõe um plano de ação com 25 ações organizadas em 5 eixos estratégicos, com entidades responsáveis, parcerias potenciais e horizonte temporal de execução, e uma proposta de modelo de gestão e governação para a sua implementação."
  - locator: "Ação A3 «Rede de Equipamentos Culturais Municipais de Évora», página 20"
    statement: "Na ação A3, o plano propõe intervenções na rede de equipamentos culturais municipais, incluindo um novo centro cultural de utilizações múltiplas e a reabilitação de edifícios como os antigos Celeiros da EPAC e os Armazéns da Palmeira."
  - locator: "Ação A5 «Évora Capital Europeia da Cultura 2027», página 22"
    statement: "A ação A5 descreve a decisão de Évora de se candidatar a Capital Europeia da Cultura 2027, sob liderança do Município e com outras sete entidades na comissão executiva, e indica que o resultado da candidatura seria conhecido no final de 2022."
  - locator: "Ação A9 «Portal do Associativismo», página 27"
    statement: "Entre as ações prioritárias a desenvolver no eixo 2, a ação A9 descreve um Portal do Associativismo como ferramenta digital para informação, apresentação de projetos, prestação de contas e participação das associações, no quadro da intenção municipal de melhorar a relação com o ecossistema cultural."
