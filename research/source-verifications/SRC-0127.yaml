  - locator: "Cabeçalho da notícia (data de atualização); corpo, 1.ª frase"
    statement: "Na versão capturada da notícia, cujo cabeçalho indica atualização em 15 de junho de 2026, a Câmara Municipal de Évora descreve como estando em curso trabalhos de aplicação de microaglomerado a frio nas avenidas Cartaxo Júnior e das Fontanas."
  - locator: "Cabeçalho da notícia (data de atualização); corpo, 2.ª frase"
    statement: "Na mesma versão capturada da notícia, a Câmara refere a Avenida de São João de Deus e apresenta como já feita a correção da calçada nessa avenida."
