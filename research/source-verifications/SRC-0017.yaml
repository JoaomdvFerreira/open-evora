verified_claims:
  - locator: "p. 7, secção 2 (Breve caracterização da situação existente), quadro-síntese (Quadro I), linha Pedonal, 3.º parágrafo"
    statement: "Para a rede pedonal situada fora do Centro Histórico, o diagnóstico aponta, de modo geral, percursos com descontinuidades e sem lógica clara, sobretudo nas travessias, bem como infraestruturas pedonais subdimensionadas, entre outras deficiências."
  - locator: "p. 7, secção 2, quadro-síntese (Quadro I), linha Pedonal, 4.º parágrafo"
    statement: "O diagnóstico identifica a quantidade de barreiras arquitetónicas e urbanísticas como um problema que abrange a cidade no seu conjunto, com impacto no quotidiano de grupos vulneráveis, como pessoas com deficiência, pessoas idosas, crianças e pessoas que utilizam carrinhos de bebé."
  - locator: "p. 9, secção 2, quadro-síntese (Quadro I, continuação), linha Transporte público iniciada na p. 8, parágrafo sobre as interfaces"
    statement: "O terminal rodoviário de Évora é descrito como tendo vários constrangimentos para quem tem mobilidade reduzida, percursos pedonais frágeis e de baixa qualidade e uma ligação deficiente à mobilidade ciclável."
  - locator: "p. 9, secção 2, quadro-síntese (Quadro I, continuação), linha Transporte público iniciada na p. 8, parágrafo sobre as interfaces"
    statement: "No mesmo parágrafo, a estação ferroviária de Évora é descrita como estando em bom estado de conservação e com acessibilidade considerada boa para pessoas com mobilidade reduzida."
  - locator: "p. 7, secção 2, Quadro I, linha Ciclável, primeiro parágrafo"
    statement: "O diagnóstico do PUE indica que a bicicleta representava cerca de 0,5% das deslocações dos residentes de Évora no período analisado."
  - locator: "pp. 7–8, secção 2, Quadro I, linha Ciclável, parágrafo sobre ciclistas inquiridos"
    statement: "Segundo os ciclistas inquiridos no diagnóstico, as preocupações incluíam a ausência de faixas próprias, a velocidade dos veículos motorizados, o estado do piso e o desrespeito da distância de segurança pelos condutores."
  - locator: "p. 8, secção 2, Quadro I, linha Ciclável, parágrafo sobre a rede existente"
    statement: "O diagnóstico do PUE descreve a rede ciclável então existente em Évora como reduzida em extensão e abrangência, descontínua entre percursos e sem ligação à generalidade dos equipamentos, serviços e núcleos residenciais mais relevantes."
