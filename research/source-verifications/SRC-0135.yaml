  - locator: "Ata n.º 2/2026, reunião de 22 de janeiro de 2026, p. 72; intervenção de residente no Centro Histórico"
    statement: "O residente descreveu como extremamente deficiente a recolha de lixo no Centro Histórico e relatou que o ponto junto à Igreja da Misericórdia estava frequentemente cheio, em qualquer altura do dia."
