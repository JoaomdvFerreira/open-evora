verified_claims:
  - locator: "Corpo da notícia, parágrafo sobre os riscos apresentados na sessão"
    statement: "Na sessão com participantes mais novos, o Município apresentou para Évora riscos climáticos projetados: mais ondas de calor, menos precipitação média anual e secas mais frequentes e severas."
  - locator: "Corpo da notícia, parágrafo sobre situações identificadas pelos participantes"
    statement: "A notícia inclui o calor como dificuldade já sentida pelos mais novos quando caminham ou usam bicicleta."
  - locator: "Corpo da notícia, aviso sobre água futura no mesmo parágrafo"
    statement: "A sessão alertou para a possibilidade de, no futuro, a água não bastar para todos os usos hoje assumidos e para a necessidade de melhorar a gestão desse recurso."
