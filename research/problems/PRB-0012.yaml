problem_id: PRB-0012
created_at: 2026-08-28
updated_at: 2026-10-25
title: Escola Básica do Chafariz d'El-Rei fechada desde novembro de 2025
domain:
  - EDU
  - URB
geography:
  level: site
  area: Escola Básica do Chafariz d'El-Rei, Évora
affected_populations:
  - alunos do 1.º ciclo da Escola Básica do Chafariz d'El-Rei
  - pais e encarregados de educação
  - comunidade educativa da escola
problem_statement: >-
  A Escola Básica do Chafariz d'El-Rei fechou em 14 de novembro de 2025,
  após a queda de estuque numa sala. Foram identificados problemas estruturais
  no edifício e os alunos passaram temporariamente para a Escola André de
  Resende.


  Em setembro de 2026, foram reportados 16 monoblocos instalados junto à
  escola para as aulas. A solução anunciada previa acesso ao refeitório e ao
  recreio da escola por uma ligação pedonal. Estes relatos não confirmam o
  início efetivo das aulas nos monoblocos nem mostram como funcionaram, na
  prática, as refeições e o uso dos espaços.


  A reabilitação do edifício continuava prevista. O Município declarou como objetivo o regresso dos alunos à escola antes do final do ano letivo 2026/2027, depois de concluídos os trabalhos e reunidas as condições de segurança; não é uma data de reabertura confirmada. Em 4 de setembro, a
  vereadora responsável disse que ainda aguardava a avaliação da laje
  superior e que não havia data definida para o início da obra. A pesquisa
  pública delimitada até 14 de outubro não identificou concurso, adjudicação,
  contrato ou calendário confirmado para a reabilitação; isso não demonstra
  que não exista um procedimento.
investigation:
  open_questions:
    - question: Quando começa e quando termina a obra de reabilitação da escola?
      latest_result: Em 4 de setembro de 2026, a vereadora disse que a avaliação
        da laje superior ainda estava pendente e que não havia data definida
        para o início da obra. A pesquisa pública delimitada até 14 de outubro
        não identificou concurso, adjudicação, contrato nem calendário
        confirmado para esta reabilitação.
      why_open: O âmbito técnico da intervenção pode depender da avaliação da
        laje superior; não estão documentados marcos contratuais ou de execução
        que permitam confirmar o calendário de reabertura.
      current_action: Em 25 de outubro de 2026 foi enviado à área de Educação
        da Câmara Municipal um pedido de informação sobre a avaliação técnica do
        edifício, a contratação e o calendário da reabilitação; aguarda-se
        resposta.
      resolution_condition: Evidência institucional que estabeleça os trabalhos
        necessários, o estado de execução e marcos verificáveis para a
        reabertura.
      evidence:
        - EVD-000159
        - EVD-000160
        - EVD-000185
    - question: Que condições estão previstas para as aulas nos monoblocos e como está a decorrer a sua utilização, caso já tenha começado?
      latest_result: Em abril, o Município referiu uma situação ligada às
        refeições dos alunos na Escola André de Resende e uma resposta imediata.
        Em setembro, as notícias apontavam o início das aulas nos monoblocos
        para meados desse mês e descreviam acesso previsto ao refeitório e ao
        recreio da escola por uma ligação pedonal. Não foi encontrada confirmação
        datada do início efetivo dessa operação.
      why_open: Falta evidência sobre o funcionamento efetivo das refeições,
        da circulação entre instalações, da acessibilidade, do conforto das
        salas, do uso do recreio e das rotinas e deslocações de alunos e famílias.
      current_action: O início efetivo das aulas nos monoblocos e os efeitos
        quotidianos sobre alunos e famílias continuam sem confirmação documentada.
      resolution_condition: Evidência atual da experiência de alunos, famílias ou
        escola que permita caracterizar efeitos concretos das instalações
        temporárias e distinguir constrangimentos resolvidos dos que persistem.
      evidence:
        - EVD-000160
        - EVD-000161
        - EVD-000182
        - EVD-000183
        - EVD-000184
