        onde o Município referiu uma situação ligada às refeições em abril. Em
        setembro, foram reportados 16 monoblocos junto à escola de origem, com
        utilização prevista do refeitório e recreio. A avaliação da laje superior
        ainda estava pendente em 4 de setembro.
      evidence:
        - EVD-000160
        - EVD-000161
        - EVD-000182
        - EVD-000184
        - EVD-000185
    delimitation:
      summary: A informação diz respeito a esta escola em Évora. Não estabelece
        problemas semelhantes noutras escolas, efeitos na aprendizagem ou
        inadequação dos monoblocos. A solução temporária foi anunciada, mas
        faltam confirmação do seu funcionamento e informação sobre a experiência
        diária de alunos e famílias.
      evidence:
        - EVD-000159
        - EVD-000160
        - EVD-000161
