history:
  - date: 2026-08-31
    summary: O desafio direto não resolveu se a disponibilidade de informação de
      estacionamento é uma causa material; o enquadramento físico e operacional
      de tráfego e estacionamento mantém-se distinto da hipótese informacional,
      que reabre apenas com evidência local direta de contribuição causal
      material.
  - date: 2026-09-16
    summary: A Variante Nascente de Évora (IP2) foi identificada pela
      Infraestruturas de Portugal como aberta à circulação; o Município estima
      uma redução de 30-40% no tráfego urbano envolvente, sobretudo de pesados,
      mas trata-se de uma estimativa atribuída, não de uma medição, e os efeitos
      reais pós-abertura permanecem por estabelecer na evidência revista nesta
      pesquisa delimitada.
  - date: 2026-09-25
    summary: A formulação do problema foi delimitada para deixar de atribuir
      causalidade conjunta aos fatores de tráfego e estacionamento. A evidência
      disponível documenta congestionamento, tráfego lento, velocidades
      excessivas, sinistralidade, pressão de estacionamento e estacionamento
      abusivo ou ilegal, mas não quantifica a contribuição relativa de cada
      fator nem estabelece relações causais entre eles.
  - date: 2026-10-12
    summary: O estacionamento e a hipótese de informação sobre estacionamento
      foram retirados deste problema, agora centrado no tráfego motorizado, no
      efeito mensurável da Variante Nascente e na segurança rodoviária atual.
