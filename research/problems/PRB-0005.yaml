problem_id: PRB-0005
created_at: 2026-08-28
updated_at: "2026-10-12"
title: Tráfego motorizado em Évora, efeito da Variante Nascente e segurança rodoviária
domain:
  - MOB
  - URB
  - ACC
geography:
  level: city
  area: Évora, incluindo o Centro Histórico
affected_populations:
  - residentes
  - condutores
  - peões
problem_statement: O diagnóstico de mobilidade do PUE regista congestionamento
  em torno das muralhas e na circular sul, velocidades excessivas de veículos
  em corredores com forte presença pedonal e um problema significativo de
  sinistralidade, incluindo no Centro Histórico. O período de observação não é
  conhecido, pelo que o diagnóstico não mostra se estas condições persistem.
  Para 2025, o Município atribuiu atrasos recorrentes dos autocarros urbanos a
  tráfego lento nas principais vias, sobretudo nos acessos ao Centro Histórico
  e na circular que serve o Parque Industrial em períodos de ponta, sem isolar
  o peso do tráfego face a outros fatores operacionais. A Variante Nascente de
  Évora (IP2) está aberta à circulação. O Município estimou uma redução de
  cerca de 30-40% no tráfego da envolvente urbana, sobretudo de veículos
  pesados; não se trata de uma medição antes e depois da abertura, e o efeito
  real continua por apurar.
investigation:
  open_questions:
    - question: Que efeito mensurável teve a Variante Nascente no volume e na
        composição do tráfego na envolvente urbana de Évora e em que dados ou
        método assenta a estimativa municipal de redução de 30-40%?
      why_open: A via está aberta, mas a redução estimada pelo Município não é
        uma medição antes e depois da abertura; o efeito real continua por
        apurar.
      latest_result: A pesquisa delimitada até 16 de setembro de 2026 não
        identificou contagens comparáveis após a abertura que estabeleçam a
        redução efetiva.
      current_action: Está por verificar se existem dados oficiais públicos de
        contagem antes e depois da abertura para as vias relevantes, incluindo
        material da Infraestruturas de Portugal, serviços de dados de tráfego e
        outras fontes públicas oficiais. Está preparada, mas não foi enviada,
        uma questão delimitada ao Município de Évora sobre os dados e o método
        da estimativa de 30-40%, a existência de contagens antes e depois da
        abertura, as vias ou pontos de contagem, a distinção entre veículos
        ligeiros e pesados, o período e a referência usados e se a redução
        efetiva já foi medida.
      resolution_condition: Contagens comparáveis antes e depois da abertura,
        com vias ou pontos de contagem, área abrangida, período de referência,
        método e composição dos veículos identificados, que permitam avaliar o
        efeito real no volume e na composição do tráfego na envolvente urbana
        e a base da estimativa.
      evidence:
        - EVD-000166
        - EVD-000167
    - question: O tráfego lento registado para 2025 mantém-se nos acessos ao
        Centro Histórico e na circular que serve o Parque Industrial durante
        os períodos de ponta?
      why_open: A atribuição municipal refere-se a 2025 e não demonstra a
        situação atual nem isola o peso do tráfego face a outros fatores dos
        atrasos dos autocarros.
      latest_result: O Município atribuiu atrasos recorrentes dos autocarros
        urbanos a tráfego lento nas principais vias, sobretudo nesses acessos
        e nessa circular durante os períodos de ponta.
      current_action: Permanece por verificar se há dados públicos atuais e
        localizados sobre o tráfego nesses percursos; uma eventual clarificação
        ao Município fica dependente dessa verificação.
      resolution_condition: Dados atuais, com localização e períodos de ponta
        identificados, que permitam avaliar se o tráfego lento persiste.
      evidence:
        - EVD-000139
    - question: Qual é a situação atual das velocidades excessivas de veículos
        em corredores com forte presença pedonal e da sinistralidade rodoviária
        em Évora, incluindo no Centro Histórico?
      why_open: O diagnóstico de mobilidade do PUE não indica o período de
        observação e não estabelece que as condições descritas persistam.
      latest_result: O diagnóstico regista velocidades excessivas nesses
        corredores e um problema significativo de sinistralidade, incluindo
        no Centro Histórico, sem quantificar a situação atual.
      current_action: Está por verificar se relatórios ou painéis públicos da
        Autoridade Nacional de Segurança Rodoviária fornecem dados atuais com
        detalhe temporal e geográfico suficiente para distinguir a cidade de
        Évora de agregados distritais, tipos e gravidade de acidentes e locais
        urbanos ou tipos de via relevantes.
      resolution_condition: Dados oficiais atuais com detalhe temporal,
        geográfico e de gravidade suficiente para avaliar as condições de
        segurança nas zonas relevantes.
      evidence:
        - EVD-000007
  path:
    initial_signal:
      summary: O diagnóstico de mobilidade do PUE regista congestionamento em
        torno das muralhas e na circular sul, velocidades excessivas de
        veículos em corredores com forte presença pedonal e um problema
        significativo de sinistralidade, incluindo no Centro Histórico. O
        período de observação não é conhecido.
      evidence:
        - EVD-000007
    development:
      summary: Para 2025, o Município atribuiu atrasos recorrentes dos
        autocarros urbanos a tráfego lento nas principais vias, sobretudo nos
        acessos ao Centro Histórico e na circular que serve o Parque
        Industrial em períodos de ponta, sem isolar o contributo do tráfego
        face a outros fatores operacionais. A Variante Nascente está aberta; a
        redução de cerca de 30-40% estimada pelo Município para o tráfego da
        envolvente urbana, sobretudo de pesados, não está demonstrada por
        contagens comparáveis antes e depois da abertura na evidência revista.
      evidence:
        - EVD-000139
        - EVD-000166
        - EVD-000167
    delimitation:
      summary: PRB-0001 trata da oferta e da pontualidade dos autocarros
        urbanos; aqui, a atribuição municipal dos atrasos serve apenas para
        investigar o tráfego lento. PRB-0003 trata das barreiras e condições
        para peões; aqui, o foco são as velocidades dos veículos e a segurança
        rodoviária. A degradação física e a manutenção do pavimento rodoviário
        pertencem a PRB-0010.
      evidence:
        - EVD-000007
        - EVD-000139
