history:
  - date: 2026-08-31
    summary: O desafio direto não resolveu se a disponibilidade de informação de
      estacionamento é uma causa material; o enquadramento físico e operacional
      de tráfego e estacionamento mantém-se distinto da hipótese informacional,
      que reabre apenas com evidência local direta de contribuição causal
      material.
  - date: 2026-09-16
    summary: A Variante Nascente de Évora (IP2) entrou em funcionamento a 3 de
      setembro de 2026, criando um desvio físico para o tráfego de
      atravessamento sem destino em Évora; o Município estima uma redução de
      30-40% no tráfego urbano envolvente, sobretudo de pesados, mas trata-se de
      uma estimativa atribuída, não de uma medição, e os efeitos reais
      pós-abertura permanecem por estabelecer na evidência revista nesta
      pesquisa delimitada.
  - date: 2026-09-25
    summary: A formulação do problema foi delimitada para deixar de atribuir
      causalidade conjunta aos fatores de tráfego e estacionamento onde a
      evidência disponível apenas documenta a sua ocorrência em conjunto.
      Mantém-se documentada a associação com congestionamento, segurança e
      qualidade do espaço pedonal, mas a contribuição relativa de cada fator não
      está quantificada.
