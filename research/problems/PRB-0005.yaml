problem_id: PRB-0005
created_at: 2026-08-28
updated_at: 2026-10-09
title: A evidência institucional documenta, em diferentes locais de Évora,
  questões distintas de tráfego e congestionamento, de pressão de
  estacionamento e estacionamento abusivo ou ilegal e de condições de
  segurança pedonal
domain:
  - MOB
  - URB
  - ACC
geography:
  level: city
  area: Évora, incluindo o Centro Histórico
affected_populations:
  - residentes
  - condutores
  - peões
problem_statement: A evidência institucional documenta em Évora fenómenos
  distintos, que variam de local para local e não estão estabelecidos como uma
  cadeia causal conjunta. O diagnóstico de mobilidade do PUE, cujo período de
  referência não está determinado e que não estabelece que a situação se
  mantenha inalterada, regista congestionamento no sistema viário em torno das
  muralhas e da circular sul, velocidades excessivas de veículos em corredores
  com forte presença pedonal e um problema significativo de sinistralidade,
  incluindo no Centro Histórico; o mesmo diagnóstico identifica pressão de
  estacionamento em partes da cidade e estacionamento abusivo ou ilegal, sem
  quantificar a sua prevalência ou severidade. O relatório anual municipal de
  2026 atribui atrasos recorrentes do serviço urbano a tráfego lento nas
  principais vias, em especial nos acessos ao Centro Histórico e na circular
  que serve o Parque Industrial durante os períodos de ponta, sem isolar o
  peso do tráfego face a outros fatores operacionais. Paralelamente, o PUE
  recomenda que a distribuição da oferta de estacionamento, as condições de
  acesso e as tarifas sejam imediatamente compreensíveis para os utilizadores;
  trata-se de uma recomendação, que não estabelece uma falha atual nem a
  necessidade de uma aplicação.
causal_reading: "Esta é uma leitura deliberadamente delimitada: os fenómenos
  documentados de tráfego e estacionamento — congestionamento, tráfego lento,
  pressão de estacionamento e estacionamento abusivo ou ilegal — permanecem
  distintos da hipótese informacional, que é tratada separadamente. A evidência
  disponível não estabelece que a falta ou inadequação de informação sobre a
  ocupação e a disponibilidade de estacionamento seja uma causa material dos
  fenómenos de tráfego, estacionamento ou segurança documentados."
investigation:
  open_questions:
    - question: A falta ou inadequação de informação sobre a ocupação e a
        disponibilidade de estacionamento é uma causa material de algum dos
        fenómenos de tráfego, estacionamento ou segurança documentados neste
        problema?
      why_open: As páginas de serviço da Via Verde Estacionar incluem Évora entre os
        municípios onde o pagamento do estacionamento na via pública está
        disponível, e a funcionalidade Parking Buddy do mesmo serviço oferece
        previsões da probabilidade de encontrar estacionamento; não está, contudo,
        estabelecido que essas previsões estejam operacionais nas zonas
        relevantes de Évora, nem com que cobertura, precisão ou adoção. A
        evidência atual não estabelece que a falta de informação sobre a
        ocupação do estacionamento seja uma causa material dos fenómenos de
        tráfego, estacionamento ou segurança documentados.
      latest_result: A investigação realizada não estabeleceu se a disponibilidade de
        informação sobre estacionamento contribui materialmente para os
        fenómenos de tráfego, estacionamento ou segurança documentados neste
        problema, e a evidência comparativa de outras
        cidades não estabelece essa relação causal em Évora.
      current_action: O projeto não prossegue, no âmbito atual, a validação desta
        hipótese ao nível da deslocação, por não ser proporcional.
      resolution_condition: A questão só é retomada perante evidência local direta
        capaz de estabelecer contribuição causal material da falta ou
        inadequação de informação sobre a ocupação e a disponibilidade de
        estacionamento para os fenómenos de tráfego, estacionamento ou
        segurança documentados neste problema.
      evidence:
        - EVD-000105
        - EVD-000106
        - EVD-000107
    - question: Que efeito observável tem a Variante Nascente de Évora (IP2) no volume
        e na composição do tráfego de atravessamento na rede viária urbana de
        Évora, e existe um impacto mensurável no congestionamento ou nas
        condições de segurança documentados neste problema?
      why_open: A Infraestruturas de Portugal identifica a Variante Nascente de
        Évora (IP2) como aberta à circulação; a evidência disponível não
        estabelece a data exata de abertura, as características da via nem um
        mecanismo físico de desvio do tráfego de atravessamento. O Município de
        Évora estima uma redução de cerca de 30-40% no volume de tráfego na
        envolvente urbana, sobretudo de veículos pesados, mas esta
        estimativa é atribuída ao vice-presidente da Câmara e não corresponde a
        uma medição observada antes/depois; a fonte que a reproduz regista
        também que a magnitude real só poderia ser avaliada após a entrada em
        funcionamento da via.
      latest_result: A pesquisa delimitada realizada não identificou, até 16 de
        setembro de 2026, um conjunto de dados de contagem de tráfego
        pós-abertura, comparável e quantitativo, que estabeleça a variação de
        tráfego efetivamente registada. A estimativa de redução de 30-40%
        mantém-se atribuída ao Município e não constitui uma medição
        antes/depois.
      current_action: WATCH — monitorizar a disponibilidade de medições de tráfego
        pós-abertura adequadas; a abertura da via, por si só, não deve ser
        tratada como impacto realizado, e a estimativa de 30-40% mantém-se
        distinta de uma medição.
      resolution_condition: Medição pós-abertura comparável, com geografia, período,
        linha de base/método e composição de veículos adequados, que permita
        avaliar o efeito real no volume e na composição do tráfego de
        atravessamento.
      evidence:
        - EVD-000166
        - EVD-000167
  path:
    initial_signal:
      summary: O planeamento institucional documentou congestionamento, velocidades
        excessivas em corredores com forte presença pedonal, pressão de
        estacionamento e estacionamento abusivo ou ilegal, e recomendou maior
        legibilidade da oferta, acessos e tarifas de estacionamento.
      evidence:
        - EVD-000007
        - EVD-000008
        - EVD-000142
    development:
      summary: O relatório municipal de 2026 mede, para 2025, uma regularidade de 99,5
        % e um índice de pontualidade IP-5min de 84,4 % no serviço urbano, e o
        Município atribui atrasos recorrentes a tráfego lento nas principais
        vias, nomeadamente nos acessos ao Centro Histórico e na circular do
        Parque Industrial em períodos de ponta, sem isolar o peso do tráfego face
        a outros fatores operacionais. A participação preventiva na revisão do
        PUE registou também, entre outras, participações formais sobre a
        circulação e o estacionamento na envolvente de uma escola; o registo
        estabelece que foram apresentadas, não que sejam corretas,
        representativas ou aprovadas. Nenhum destes elementos estabelece que a
        informação sobre disponibilidade de estacionamento seja uma causa
        material do problema.
      evidence:
        - EVD-000003
        - EVD-000139
        - EVD-000012
    delimitation:
      summary: A degradação e a manutenção do pavimento rodoviário foram separadas
        deste problema e são tratadas em PRB-0010, para manter aqui o foco nos
        fenómenos documentados de tráfego, estacionamento e segurança. As
        previsões de disponibilidade do Parking Buddy e a evidência comparativa
        de outras cidades foram analisadas, mas não estabelecem causalidade
        material para Évora.
      evidence:
        - EVD-000105
        - EVD-000106
        - EVD-000107
