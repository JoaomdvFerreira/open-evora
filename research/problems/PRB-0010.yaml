decision_basis:
  contract_version: "0.1"
  eligibility_basis: A manifestação histórica na cidade assenta no relato de uma vereadora registado em ata em janeiro de 2026 (EVD-000175). A petição e o diagnóstico municipal referem-se ao concelho (EVD-000082, EVD-000154), pelo que não alargam por si a manifestação à cidade. O relatório da junta contém registos classificados e refere observação direta, sem inventário publicado por rua (EVD-000190). As intervenções em três avenidas (EVD-000156) mostram atividade localizada, não a extensão dos danos. A condição atual das ruas da cidade continua por apurar.
  corroboration_basis: O relato registado em ata de janeiro (EVD-000175) sustenta uma manifestação histórica reportada em várias vias da cidade, incluindo a circular. Não é uma medição independente nem representativa. A petição e o diagnóstico municipal são de âmbito concelhio (EVD-000082, EVD-000154). O relatório da junta (EVD-000190) acrescenta registos administrativos e referência a identificação de buracos, sem resultados por rua; não confirma a extensão ou o estado atual da cidade. As obras localizadas também não confirmam a extensão ou persistência atual da degradação na cidade.
  manifestation:
    kind: buracos e pavimento degradado em vias da cidade
    summary: Em janeiro de 2026, uma vereadora relatou buracos em várias vias da cidade, incluindo a circular (EVD-000175). Uma petição relatou degradação no concelho (EVD-000082), e o Município descreveu degradação da rede municipal em fevereiro (EVD-000154).
    evidence:
      - EVD-000175
      - EVD-000082
      - EVD-000154
  consequence:
    summary: A petição de janeiro referiu preocupações de segurança e danos em veículos associados ao estado das vias do concelho. A vereadora associou os buracos que relatou na cidade a dificuldades de mobilidade e segurança. São consequências relatadas, sem medição independente ou representativa.
    evidence:
      - EVD-000082
      - EVD-000175
  currentness:
    assessment: Os relatos iniciais são de janeiro e o diagnóstico municipal é de fevereiro de 2026. O relatório da junta regista ocorrências de Vias, Passeios e Pavimentos até 18 de setembro e refere identificação de buracos e de outras situações de degradação que afirma terem-se agravado, além de comunicações e observação direta, sem resultados publicados por rua. Foram comunicadas intervenções em três avenidas até junho e, em setembro, foi noticiado o início de uma correção na Estrada Nacional 114, com outras intervenções previstas. Nenhum destes elementos estabelece a condição atual das ruas da cidade ou a execução completa da empreitada geral.
    evidence:
      - EVD-000175
      - EVD-000082
      - EVD-000154
      - EVD-000156
      - EVD-000188
      - EVD-000190
  contradiction_search:
    performed: true
    summary: Foram considerados os trabalhos reportados nas três avenidas (EVD-000156), a correção do pavimento noticiada em setembro na Estrada Nacional 114 e as intervenções então previstas (EVD-000188), e os registos classificados e a observação direta referidos pela junta (EVD-000190). Os trabalhos podem alterar condições locais; os registos da junta indicam necessidades no território da freguesia sem quantificar danos nas ruas da cidade. Nenhum elemento comprova a resolução geral, a continuação generalizada dos danos ou o estado atual da cidade.
    evidence:
      - EVD-000156
      - EVD-000188
      - EVD-000190
  overlap_check:
    performed: true
    summary: Não foi identificado outro problema registado com a mesma manifestação de degradação física do pavimento nas vias da cidade.
    related_problems: []
  corroboration_statement: Há um relato histórico registado em ata de buracos em várias vias da cidade em janeiro de 2026. A petição e o diagnóstico municipal descrevem o concelho. Os registos administrativos e a referência a observação direta da junta não quantificam os danos por rua. Os dois procedimentos e as intervenções conhecidas documentam a resposta, mas não estabelecem a condição atual das ruas da cidade. O estado atual do pavimento continua por estabelecer.
  supporting_evidence:
    - EVD-000175
    - EVD-000082
    - EVD-000154
  boundary_evidence:
    - EVD-000155
    - EVD-000156
    - EVD-000176
    - EVD-000177
    - EVD-000178
    - EVD-000179
    - EVD-000188
    - EVD-000190
  independence_assessment: O relato de uma vereadora em reunião pública, a petição e o diagnóstico do Município têm origens e âmbitos diferentes. A ata regista uma declaração, sem medição independente; a petição não é uma amostra representativa. As comunicações do Município sobre diagnóstico, concursos, adjudicações e obras pertencem à mesma voz institucional e não contam como confirmações independentes da condição atual. O relatório da junta reúne comunicações recebidas e refere observação direta, sem discriminar os seus resultados por rua; os registos administrativos não são uma verificação independente de cada dano nem uma avaliação representativa. A notícia de setembro relata trabalhos do Município e também não é uma verificação independente do estado das vias.
  limitations: A manifestação inicial na cidade é histórica e relatada, sem inventário público por rua. O relatório da junta cobre apenas uma união de freguesias; a categoria Vias, Passeios e Pavimentos inclui tipos diferentes de situações, e o anexo não descreve o dano, data ou desfecho de cada ocorrência. A referência a observação direta não vem acompanhada de resultados por rua. A petição e o diagnóstico municipal não permitem atribuir ao conjunto da cidade a extensão referida para o concelho. Os preços base dos dois concursos somam 1 494 990 euros sem IVA, mas são limites dos procedimentos, não despesa executada; a adjudicação da Garraia e Sizuda foi comunicada por valor inferior ao preço base, e essa empreitada não mostra reparações nas ruas da cidade. A decisão de adjudicação e a aprovação da minuta não provam assinatura, consignação ou conclusão. As intervenções em três avenidas e as noticiadas em setembro não demonstram que integrem a empreitada geral, e as de setembro não têm conclusão documentada. A notícia de setembro não identifica o troço preciso nem a responsabilidade pela conservação da Estrada Nacional 114. Não há avaliação atual representativa da cidade.
history:
  - date: 2026-08-28
    summary: Nova evidência oficial documentou uma cronologia da resposta — levantamento técnico em fevereiro, procedimento geral com prazo contratual de 10 meses e intervenções locais reportadas até junho — sem estabelecer a execução completa do procedimento geral; a investigação passa a perguntar pela condição atual da rede em todo o município.
    evidence:
      - EVD-000154
      - EVD-000155
      - EVD-000156
  - date: 2026-10-14
    summary: A ficha passou a delimitar o relato histórico de buracos em vias da cidade e a distinguir dois procedimentos de reparação, adjudicações e trabalhos comunicados. Permanecem por apurar as ruas intervencionadas pela empreitada geral, a execução completa e o estado atual do pavimento na cidade.
    evidence:
      - EVD-000175
      - EVD-000176
      - EVD-000177
      - EVD-000178
      - EVD-000179
      - EVD-000180
  - date: 2026-10-14
    summary: A ficha passou a centrar-se nas ruas da cidade. A empreitada da Garraia e Sizuda, um procedimento distinto, ficou apenas como contexto do programa de reparação. Foi acrescentada uma notícia de setembro sobre o início de uma correção do pavimento na Estrada Nacional 114 e outras intervenções previstas na cidade. Continuam por apurar as ruas abrangidas e a execução da empreitada geral, bem como o estado atual do pavimento nas ruas da cidade.
    evidence:
      - EVD-000187
      - EVD-000188
  - date: 2026-10-15
    summary: >-
      Foi integrado o relatório da União das Freguesias de Bacelo e Senhora da Saúde, com registos classificados em vias, passeios e pavimentos até 18 de setembro, referência a identificação de buracos e de situações de degradação que a junta diz terem-se agravado, e menção a comunicações e observação direta. Os registos não foram equiparados a danos específicos em cada local. A localização e os resultados do levantamento, o estado atual das ruas da cidade e a execução da empreitada geral continuam por esclarecer; os estados canónicos permanecem inalterados.
    evidence:
      - EVD-000190
  - date: 2026-10-15
    summary: >-
      A revisão de admissibilidade retirou o relato individual de julho na N114 da fundamentação atual. A notícia sobre o início de uma intervenção em setembro permanece como registo de uma resposta localizada, sem confirmar retroativamente esse relato nem estabelecer o estado atual das ruas da cidade. Os estados canónicos permanecem inalterados.
    evidence:
      - EVD-000188
