    development:
      summary: O Município reconheceu, através de cobertura jornalística independente,
        a necessidade de manutenção/requalificação — não atribuível apenas ao
        clima — e respondeu com um programa de reparações na ordem dos 1,5
        milhões de euros. Em fevereiro, descreveu níveis significativos de
        degradação e um levantamento técnico exaustivo; o procedimento geral de
        reparação fixou um prazo contratual de 10 meses.
      evidence:
        - EVD-000083
        - EVD-000154
        - EVD-000155
    delimitation:
      summary: Um sinal público posterior (julho de 2026), relativo a uma localização
        específica (entrada da N114 em Évora), alegou persistência do problema;
        este sinal, de natureza social/comunitária, não está verificado e não é
        generalizado ao município. Até junho, o Município reportou intervenções
        em execução ou concluídas em três avenidas da cidade; esses registos
        locais não estabelecem a condição da rede municipal nem a conclusão da
        empreitada geral.
      evidence:
        - EVD-000084
        - EVD-000156
