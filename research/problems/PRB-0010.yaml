problem_statement: "Uma petição de janeiro de 2026 relatou a existência generalizada de buracos e pavimento degradado no município, com impactos na segurança e danos nos veículos; o Município reconheceu a necessidade de manutenção/requalificação e respondeu com reparações na ordem dos 1,5 milhões de euros. Um sinal público posterior, relativo a uma localização específica (entrada da N114 em Évora), alegou persistência do problema; este sinal, de natureza social/comunitária, não está verificado. Estes elementos evidenciam um problema real de degradação do pavimento rodoviário e de fiabilidade da manutenção, embora a evidência disponível — uma petição e um sinal público posterior não verificado — não permita estimar a prevalência atual em todo o município."
