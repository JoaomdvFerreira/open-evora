problem_id: PRB-0010
created_at: 2026-08-28
updated_at: 2026-10-15
title: Buracos e pavimento degradado nas ruas de Évora
domain:
  - URB
  - MOB
geography:
  level: city
  area: Évora
affected_populations:
  - residentes
  - condutores
problem_statement: |-
  Em janeiro de 2026, uma vereadora relatou buracos em várias vias da cidade de Évora, incluindo a circular, e uma petição pública denunciou buracos e pavimento degradado nas estradas do concelho. Em fevereiro, o Município reconheceu uma degradação significativa da rede viária municipal. A petição e esse diagnóstico abrangem todo o concelho e não mostram a extensão do problema na cidade.

  Em maio, o Município aprovou a adjudicação à Tecnovia, por 745 000 euros mais IVA, de uma empreitada geral de reparação de estradas municipais no concelho. Uma segunda obra, nos caminhos municipais da Garraia e Sizuda, não mostra reparações na cidade. Até junho, o Município comunicou trabalhos em três avenidas da cidade; outras intervenções foram noticiadas em setembro.

  O relatório da União das Freguesias de Bacelo e Senhora da Saúde regista situações classificadas em vias, passeios e pavimentos até 18 de setembro e refere a identificação de buracos e de situações de degradação que, segundo a junta, se agravaram, sem publicar uma avaliação do estado das ruas da cidade. Não se sabe que ruas foram reparadas pela empreitada geral, em que fase está essa obra, nem se as intervenções comunicadas fazem parte dela.
investigation:
  open_questions:
    - question: Que ruas da cidade foram selecionadas para reparação e em que ponto estão os trabalhos?
      why_open: A empreitada geral abrange todo o concelho. A decisão de adjudicação não identifica as ruas da cidade selecionadas, nem mostra quais foram intervencionadas ou concluídas.
      latest_result: Em maio de 2026, o Município aprovou a adjudicação da empreitada geral à Tecnovia e a minuta do contrato. Até junho, comunicou trabalhos em curso nas avenidas Cartaxo Júnior e das Fontanas e uma correção da calçada já feita na Avenida de São João de Deus. Em setembro, a DianaFM noticiou o início de uma correção do pavimento na Estrada Nacional 114 e intervenções previstas junto à Escola do Bairro da Câmara e nas passadeiras das Portas da Lagoa. Não está demonstrado que alguma destas intervenções integre a empreitada geral.
      current_action: Não estão confirmadas a assinatura do contrato nem a consignação da empreitada geral. Continuam sem documentação as ruas da cidade selecionadas, as ordens de trabalho, as datas de execução e as intervenções concluídas. O pedido de informação ao Município ainda não foi enviado.
      resolution_condition: Contrato e registos municipais de execução suficientes para identificar as ruas da cidade incluídas, os trabalhos realizados e as datas de conclusão.
      evidence:
        - EVD-000155
        - EVD-000156
        - EVD-000176
        - EVD-000177
        - EVD-000188
    - question: Qual é o estado atual do pavimento nas ruas da cidade de Évora?
      why_open: Os relatos de janeiro e o diagnóstico municipal de fevereiro são históricos. O relatório da junta acrescenta registos classificados e refere observação direta, mas não publica um levantamento com resultados por rua. As intervenções conhecidas dizem respeito a vias determinadas; falta uma avaliação atual que cubra as ruas da cidade de forma suficiente.
      latest_result: A junta de Bacelo e Senhora da Saúde registou 19 ocorrências em Vias, Passeios e Pavimentos entre 1 de julho e 18 de setembro, 9 em julho e 6 de 1 a 18 de setembro; o anexo identifica locais, incluindo a Avenida Heróis do Ultramar, a Avenida Dona Leonor de Oliveira Fernandes e a Rua de Timor, mas não descreve os danos em cada local. A junta refere um levantamento de arruamentos, a identificação de buracos e de outras situações de degradação dos pavimentos que afirma terem-se agravado, e a conjugação de comunicações com observação direta, sem publicar os resultados por rua. Uma vereadora relatou buracos na cidade em janeiro; a petição e o diagnóstico municipal abrangem o concelho. O Município reportou trabalhos em três avenidas até junho e, em setembro, a DianaFM noticiou uma correção localizada iniciada na Estrada Nacional 114 e outras intervenções previstas, sem documentar o estado posterior. Estes elementos não medem o estado atual das ruas da cidade.
      current_action: O pedido de informação e do levantamento técnico ao Município ainda não foi enviado. É necessário obter os resultados e a localização das observações diretas referidas pela junta; a pesquisa pública disponível ainda não produziu uma avaliação atual e representativa das ruas da cidade.
      resolution_condition: Levantamento técnico atual, informação municipal por rua ou outra evidência verificável com cobertura suficiente para avaliar o estado do pavimento nas ruas da cidade após as intervenções.
      evidence:
        - EVD-000082
        - EVD-000154
        - EVD-000156
        - EVD-000175
        - EVD-000188
        - EVD-000190
  path:
    initial_signal:
      summary: Em janeiro de 2026, uma vereadora relatou buracos em várias vias da cidade, incluindo a circular. Uma petição pública relatou degradação das estradas do concelho e preocupações de segurança e danos em veículos.
      evidence:
        - EVD-000175
        - EVD-000082
    development:
      summary: Em fevereiro, o Município descreveu a degradação da rede municipal e aprovou dois procedimentos de reparação distintos, apresentados em conjunto como um programa de cerca de 1,5 milhões de euros. Em maio, comunicou as decisões de adjudicação de ambos.
      evidence:
        - EVD-000154
        - EVD-000155
        - EVD-000176
        - EVD-000177
        - EVD-000178
        - EVD-000179
    delimitation:
      summary: O Município reportou trabalhos em três avenidas da cidade até junho e, em setembro, foi noticiado o início de uma correção do pavimento na Estrada Nacional 114, com outras intervenções previstas na cidade. O relatório da junta regista situações classificadas em Vias, Passeios e Pavimentos até 18 de setembro e refere observação direta e identificação de buracos, mas não publica resultados por rua nem permite converter cada ocorrência em dano no pavimento. A empreitada da Garraia e Sizuda, com contrato celebrado em junho e obras apresentadas como iniciadas em outubro, ficou delimitada como contexto do programa e não como prova de reparações nas ruas da cidade. Nenhum destes registos estabelece a condição atual das ruas da cidade nem a execução da empreitada geral.
      evidence:
        - EVD-000156
        - EVD-000188
        - EVD-000180
        - EVD-000187
        - EVD-000190
