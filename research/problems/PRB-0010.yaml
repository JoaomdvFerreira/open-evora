problem_id: PRB-0010
created_at: 2026-08-28
updated_at: 2026-10-14
title: Buracos e pavimento degradado nas ruas de Évora
domain:
  - URB
  - MOB
geography:
  level: city
  area: Évora
affected_populations:
  - residentes
  - condutores
problem_statement: |-
  Em janeiro de 2026, uma vereadora relatou buracos em várias vias da cidade de Évora, incluindo a circular. Uma petição pública do mesmo mês denunciou buracos e pavimento degradado no concelho, com preocupações de segurança e danos em veículos. Em fevereiro, o Município reconheceu uma degradação significativa da rede viária municipal e informou ter feito um levantamento técnico.

  O Município aprovou dois procedimentos de reparação, com preços base que somam 1 494 990 euros sem IVA: um para estradas municipais do concelho e outro para a zona da Garraia e Sizuda. Em maio, anunciou decisões de adjudicação distintas. Comunicou também trabalhos em curso nas avenidas Cartaxo Júnior e das Fontanas e uma correção já feita na Avenida de São João de Deus. Em outubro, comunicou o início de obras na Garraia e Sizuda.

  Não está estabelecido que ruas da cidade foram selecionadas e reparadas pela empreitada geral, nem o estado completo da sua execução. Também não foi encontrada, nas fontes consultadas, uma avaliação atual e representativa do pavimento nas ruas da cidade. Os relatos disponíveis não demonstram que a degradação continue de forma generalizada nem que tenha sido resolvida.
investigation:
  open_questions:
    - question: Que ruas da cidade foram selecionadas para reparação e em que ponto estão os trabalhos?
      why_open: O concurso geral abrange o concelho, mas o anúncio não identifica as ruas da cidade a reparar. A decisão de adjudicação não mostra quais foram efetivamente intervencionadas nem o avanço da empreitada.
      latest_result: O Município aprovou a adjudicação da empreitada geral à Tecnovia em maio de 2026. As intervenções comunicadas nas avenidas Cartaxo Júnior e das Fontanas estavam em curso, e a correção da calçada na Avenida de São João de Deus já tinha sido feita; não está demonstrado que integrem a empreitada geral. A obra da Garraia e Sizuda pertence a outro procedimento e foi apresentada como iniciada em outubro.
      current_action: O pedido de informação ao Município está pendente de preparação e não foi enviado. Faltam o contrato assinado da empreitada geral, a consignação e a data de início, as ordens de trabalho, a lista das ruas selecionadas e reparadas, as datas, alterações e o estado de conclusão. Para a Garraia e Sizuda, faltam confirmação do contrato assinado e documentação da execução e conclusão.
      resolution_condition: Contrato e registos municipais suficientes para identificar as ruas da cidade selecionadas e reparadas, as datas das intervenções e o estado de execução e conclusão de cada empreitada.
      evidence:
        - EVD-000155
        - EVD-000156
        - EVD-000176
        - EVD-000177
        - EVD-000178
        - EVD-000179
        - EVD-000180
    - question: Qual é o estado atual do pavimento nas ruas da cidade de Évora?
      why_open: Os relatos de janeiro e o diagnóstico municipal de fevereiro são históricos. As intervenções conhecidas dizem respeito a vias determinadas; falta uma avaliação atual que cubra as ruas da cidade de forma suficiente.
      latest_result: Uma vereadora relatou buracos em várias vias da cidade em janeiro. A petição e o diagnóstico municipal referem-se ao concelho. O Município reportou intervenções em três avenidas da cidade. Um relato de julho sobre a entrada pela N114 continua não verificado, e o troço preciso e a responsabilidade pela via estão por esclarecer. Estes elementos não medem o estado atual da cidade.
      current_action: O pedido de informação e do levantamento técnico ao Município está pendente de preparação e não foi enviado. A pesquisa pública disponível ainda não produziu uma avaliação atual e representativa das ruas da cidade.
      resolution_condition: Levantamento técnico atual, informação municipal por rua ou outra evidência verificável com cobertura suficiente para avaliar o estado do pavimento nas ruas da cidade após as intervenções.
      evidence:
        - EVD-000082
        - EVD-000084
        - EVD-000154
        - EVD-000156
        - EVD-000175
