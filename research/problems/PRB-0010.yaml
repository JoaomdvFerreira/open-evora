decision_basis:
  contract_version: "0.1"
  eligibility_basis: A manifestação histórica na cidade assenta no relato de uma vereadora registado em ata em janeiro de 2026 (EVD-000175). A petição e o diagnóstico municipal referem-se ao concelho (EVD-000082, EVD-000154), pelo que não alargam por si a manifestação à cidade. As intervenções em três avenidas (EVD-000156) mostram atividade localizada, não a extensão dos danos. A condição atual das ruas da cidade continua por apurar.
  corroboration_basis: O relato registado em ata de janeiro (EVD-000175) sustenta uma manifestação histórica reportada em várias vias da cidade, incluindo a circular. Não é uma medição independente nem representativa. A petição e o diagnóstico municipal são de âmbito concelhio (EVD-000082, EVD-000154). As obras localizadas e o relato não verificado na N114 não confirmam a extensão ou persistência atual da degradação na cidade. A evidência ainda não confirma o estado atual da cidade.
  manifestation:
    kind: buracos e pavimento degradado em vias da cidade
    summary: Em janeiro de 2026, uma vereadora relatou buracos em várias vias da cidade, incluindo a circular (EVD-000175). Uma petição relatou degradação no concelho (EVD-000082), e o Município descreveu degradação da rede municipal em fevereiro (EVD-000154).
    evidence:
      - EVD-000175
      - EVD-000082
      - EVD-000154
  consequence:
    summary: A petição de janeiro referiu preocupações de segurança e danos em veículos associados ao estado das vias do concelho. A vereadora associou os buracos que relatou na cidade a dificuldades de mobilidade e segurança. São consequências relatadas, sem medição independente ou representativa.
    evidence:
      - EVD-000082
      - EVD-000175
  currentness:
    assessment: Os relatos sobre a manifestação são de janeiro e o diagnóstico municipal é de fevereiro de 2026. Foram comunicadas intervenções em três avenidas da cidade até junho e o início de obras distintas na Garraia e Sizuda em outubro. O relato de julho sobre a N114 é único, não verificado e de localização e responsabilidade ainda incertas. Nenhum destes registos estabelece a condição atual das ruas da cidade ou a execução completa da empreitada geral.
    evidence:
      - EVD-000175
      - EVD-000082
      - EVD-000154
      - EVD-000084
      - EVD-000156
      - EVD-000180
  contradiction_search:
    performed: true
    summary: Foram considerados os trabalhos reportados nas três avenidas (EVD-000156), o início de obras na Garraia e Sizuda (EVD-000180) e o relato não verificado na N114 (EVD-000084). Os trabalhos podem alterar condições locais; nenhum registo comprova a resolução geral, a continuação generalizada dos danos ou o estado atual da cidade.
    evidence:
      - EVD-000156
      - EVD-000180
      - EVD-000084
  overlap_check:
    performed: true
    summary: Não foi identificado outro problema registado com a mesma manifestação de degradação física do pavimento nas vias da cidade.
    related_problems: []
  corroboration_statement: Há um relato histórico registado em ata de buracos em várias vias da cidade em janeiro de 2026. A petição e o diagnóstico municipal descrevem o concelho. Os dois procedimentos e as intervenções conhecidas documentam a resposta, mas não estabelecem a condição atual das ruas da cidade. O estado atual do pavimento continua por estabelecer.
  supporting_evidence:
    - EVD-000175
    - EVD-000082
    - EVD-000154
  boundary_evidence:
    - EVD-000084
    - EVD-000155
    - EVD-000156
    - EVD-000176
    - EVD-000177
    - EVD-000178
    - EVD-000179
    - EVD-000180
  independence_assessment: O relato de uma vereadora em reunião pública, a petição e o diagnóstico do Município têm origens e âmbitos diferentes. A ata regista uma declaração, sem medição independente; a petição não é uma amostra representativa. As comunicações do Município sobre diagnóstico, concursos, adjudicações e obras pertencem à mesma voz institucional e não contam como confirmações independentes da condição atual.
  limitations: A manifestação na cidade é histórica e relatada, sem inventário público por rua. A petição e o diagnóstico municipal não permitem atribuir ao conjunto da cidade a extensão referida para o concelho. Os preços base dos dois concursos somam 1 494 990 euros sem IVA, mas são limites dos procedimentos, não despesa executada; a adjudicação da Garraia e Sizuda foi comunicada por valor inferior ao preço base. A decisão de adjudicação e a aprovação da minuta não provam assinatura, consignação ou conclusão. As intervenções em três avenidas não demonstram que integrem a empreitada geral. O relato da N114 não está verificado; o troço preciso e a responsabilidade pela via permanecem incertos. Não há avaliação atual representativa da cidade.
