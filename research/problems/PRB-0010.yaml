problem_id: PRB-0010
created_at: 2026-08-28
updated_at: 2026-08-28
title: Degradação do pavimento rodoviário em Évora, com extensão atual ainda por
  confirmar
domain:
  - URB
  - MOB
geography:
  level: municipality
  area: Évora
affected_populations:
  - residentes
  - condutores
problem_statement: Uma petição de janeiro de 2026 relatou a existência
  generalizada de buracos e pavimento degradado no município, com impactos na
  segurança e danos nos veículos; o Município reconheceu a necessidade de
  manutenção/requalificação e respondeu com reparações na ordem dos 1,5 milhões
  de euros. Um sinal público posterior, relativo a uma localização específica
  (entrada da N114 em Évora), alegou persistência do problema; este sinal, de
  natureza social/comunitária, não está verificado. Em fevereiro de 2026, o
  Município descreveu níveis significativos de degradação e informou ter
  realizado um levantamento técnico exaustivo das vias municipais com
  necessidade de intervenção. O procedimento geral de reparação fixou um prazo
  contratual de 10 meses e, até junho, o Município reportou trabalhos em
  execução ou concluídos em várias avenidas da cidade. Estes registos refinam a
  resposta como faseada/em curso, mas não estabelecem a condição atual da rede
  viária em todo o município.
causal_reading: A degradação do pavimento rodoviário é um mecanismo físico de
  manutenção/infraestrutura, distinto do mecanismo de tráfego/pressão de
  estacionamento de PRB-0005. A alavancagem digital sobre este mecanismo físico
  central é esperada como baixa; esta leitura não está validada.
investigation:
  open_questions:
    - question: Qual é a condição atual da rede viária municipal durante a
        implementação faseada das reparações e em que medida a degradação
        permanece material à escala do concelho?
      why_open: Os novos registos clarificam a cronologia da resposta — incluindo
        levantamento técnico em fevereiro, um procedimento com prazo contratual
        de 10 meses e intervenções locais reportadas até junho — mas não
        disponibilizam um conjunto de dados de agosto de 2026 sobre a condição
        municipal, um estado agregado de execução/conclusão ou uma avaliação
        pós-reparação.
      latest_result: Registos oficiais refinam o estado da resposta de um programa de
        reparação anunciado para uma contratação de longo prazo com intervenções
        locais documentadas; não confirmam nem resolução geral nem persistência
        geral.
      resolution_condition: Um conjunto de dados público municipal, inventário
        técnico, registo agregado de execução/conclusão ou equivalente
        autoritativo que estabeleça a condição atual da rede viária à escala do
        município, desde agosto de 2026.
      evidence:
        - EVD-000084
        - EVD-000154
        - EVD-000155
        - EVD-000156
  path:
    initial_signal:
      summary: >-
        Uma petição pública de janeiro de 2026 relatou a existência generalizada
        de

        buracos e pavimento degradado no município, com impactos na segurança e
