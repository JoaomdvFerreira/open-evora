decision_basis:
  contract_version: "0.1"
  eligibility_basis: >-
    PRB-0010 delimita um problema de investigação relativo à degradação física do
    pavimento rodoviário no Município de Évora, com residentes e condutores como
    populações afetadas.

    A manifestação histórica é documentada por EVD-000082, que regista as
    alegações de uma petição pública de janeiro de 2026. EVD-000083 regista,
    através de cobertura jornalística pública, o reconhecimento municipal da
    necessidade de manutenção ou requalificação e descreve um programa municipal
    de reparação. A petição relata também consequências relacionadas com segurança
    e danos em veículos.

    O problema não é formulado como uma solução, como a necessidade de uma
    aplicação de reporte rodoviário. A revisão de sobreposição é registada
    separadamente no decision_basis.
  corroboration_basis: >-
    A Corroboration é sustentada apenas para uma afirmação histórica e

    temporalmente delimitada, relativa ao episódio de degradação documentado no

    início de 2026. Não é sustentada uma afirmação de persistência atual, à
    escala

    de todo o município, nem sobre o estado agregado de execução do procedimento
    geral de reparação.


    EVD-000082, com provenance em SRC-0069, regista as alegações apresentadas
    numa

    petição pública criada em janeiro de 2026. EVD-000083, com provenance em

    SRC-0070 e SRC-0071, documenta através de cobertura jornalística o

    reconhecimento municipal da necessidade de manutenção ou requalificação e um

    programa municipal de reparação avaliado em aproximadamente 1,5 milhões de
    euros. O processo de
    petição

    e a documentação da resposta institucional constituem unidades de evidência

    materialmente distintas que convergem na leitura histórica de que existiu um

    problema relevante de degradação do pavimento no início de 2026.


    EVD-000084 documenta um relato público posterior, de julho de 2026, relativo

    apenas à entrada da N114 em Évora. Trata-se de um sinal não verificado e

    geograficamente limitado, utilizado para delimitar e refinar a leitura
    atual.

    Não permite generalizar a persistência da degradação ao conjunto do
    município.


    EVD-000154 regista o diagnóstico municipal e o levantamento técnico
    exaustivo de fevereiro. EVD-000155 fixa um prazo contratual de 10 meses para
    o procedimento geral, sem estabelecer o seu início, execução ou conclusão.
    EVD-000156 documenta intervenções locais em execução ou concluídas até
    junho, sem medir a condição da rede municipal. Estes registos refinam a
    cronologia da resposta, mas não corroboram persistência nem resolução geral.


    Assim, permanece em aberto saber se a degradação documentada em

    janeiro-fevereiro de 2026 persiste hoje a uma escala comparável. Os registos
    disponíveis não estabelecem a condição municipal atual nem o estado agregado
    de execução do procedimento geral, razão pela qual a decisão humana de Corroboration para a
    afirmação

    de persistência atual permanece HOLD.
  manifestation:
    kind: degradação física do pavimento rodoviário
    summary: >-
      Uma petição pública de janeiro de 2026 (EVD-000082) relatou a existência
      generalizada de buracos e pavimento rodoviário degradado no Município de
      Évora.


      A cobertura jornalística independente (EVD-000083) registou o reconhecimento
      pelo Município de que a degradação não era atribuível apenas às condições
      meteorológicas, que exigia manutenção/requalificação, e descreveu um
      programa municipal de reparação avaliado em aproximadamente 1,5 milhões
      de euros.
    evidence:
      - EVD-000082
      - EVD-000083
  consequence:
    summary: >-
      A petição pública de janeiro de 2026 (EVD-000082) refere preocupações de segurança, danos em veículos e efeitos na mobilidade e na qualidade de vida associados à degradação do pavimento.


      Estas são alegações registadas na petição; o registo não constitui uma medição representativa nem uma verificação independente da ocorrência, extensão ou prevalência dessas consequências.


      EVD-000083 documenta a resposta institucional descrita através de cobertura jornalística e não é utilizado como evidência dessas consequências, pelo que não é citado nesta secção.
    evidence:
      - EVD-000082
  currentness:
    assessment: >-
      A manifestação histórica de âmbito municipal está documentada no início de
      2026. O registo contém ainda evidência sobre a resposta e um sinal local até
      julho de 2026, mas não estabelece a condição atual da rede municipal.


      A petição de janeiro de 2026 (EVD-000082) documenta o problema histórico.
      A resposta anunciada (EVD-000083) é refinada pelo diagnóstico e
      levantamento técnico municipal de fevereiro (EVD-000154), pelo prazo
      contratual de 10 meses do procedimento geral (EVD-000155) e pelas
      intervenções locais reportadas até junho (EVD-000156). Estes registos
      documentam a cronologia do procedimento e intervenções locais, mas não o
      estado agregado de execução do procedimento geral.


      O relato de julho de 2026 relativo à entrada da N114 em Évora (EVD-000084)
      continua não verificado e geograficamente limitado. Nem ele, nem os novos
      registos, permitem sustentar persistência atual em todo o município.


      Os registos citados neste decision_basis não estabelecem, desde agosto de
      2026, a condição da rede viária municipal, o estado agregado de
      execução/conclusão ou uma avaliação pós-reparação.
    evidence:
      - EVD-000082
      - EVD-000083
      - EVD-000084
      - EVD-000154
      - EVD-000155
      - EVD-000156
  contradiction_search:
    performed: true
    summary: >-
      Na procura deliberada registada neste decision_basis foram considerados
      EVD-000084, EVD-000155 e EVD-000156 como elementos capazes de limitar uma
      leitura de persistência municipal.

      EVD-000155 fixa um prazo contratual de 10 meses, mas não demonstra início,
      progresso ou conclusão do procedimento. EVD-000156 documenta intervenções
      locais, mas não estabelece a condição da rede municipal nem a conclusão
      agregada do procedimento geral. EVD-000084 é um relato não verificado
      relativo a uma localização específica e não sustenta persistência à escala
      do município.

      Estes registos não estabelecem nem resolução geral nem persistência geral.
      A condição atual da rede municipal permanece, por isso, em aberto.
    evidence:
      - EVD-000084
      - EVD-000155
      - EVD-000156
  overlap_check:
    performed: true
    summary: >-
      A revisão de sobreposição está registada como realizada; este
      decision_basis não contém relações related_problems autoradas. O âmbito
      substantivo deste Problem é a degradação física do pavimento rodoviário e a
      condição atual da rede municipal, que permanece por estabelecer.
    related_problems: []
  corroboration_statement: Uma petição de janeiro de 2026 relatou a existência
    generalizada de buracos e pavimento degradado no município, com impactos na
    segurança e danos nos veículos; cobertura jornalística pública registou o
    reconhecimento municipal da necessidade de manutenção/requalificação e
    descreveu um programa municipal de reparação avaliado em aproximadamente
    1,5 milhões de euros. Em fevereiro de 2026, o Município descreveu níveis
    significativos de degradação e informou ter realizado um levantamento técnico
    exaustivo das vias municipais com necessidade de intervenção. Um sinal público
    posterior, relativo a uma localização específica (entrada da N114 em Évora),
    alegou persistência do problema; este sinal não está verificado. Estes
    elementos sustentam uma manifestação histórica de degradação documentada no
    início de 2026 e documentam uma resposta municipal através de diagnóstico,
    procedimento de reparação e intervenções locais, mas não estabelecem a
    prevalência atual da degradação, o estado agregado de execução do procedimento
    geral nem a condição atual da rede em todo o município.
  supporting_evidence:
    - EVD-000082
    - EVD-000083
    - EVD-000154
  boundary_evidence:
    - EVD-000084
    - EVD-000155
    - EVD-000156
  independence_assessment: >-
    EVD-000082 e EVD-000083 assentam em processos materialmente diferentes de

    produção de evidência: uma petição cidadã e a documentação jornalística de
    uma

    resposta institucional municipal. Esta distinção contribui para sustentar a

    manifestação histórica, mas a existência de Sources ou registos distintos
    não

    é, por si só, tratada como prova automática de independência.


    EVD-000083 utiliza SRC-0070 e SRC-0071 como provenance do mesmo registo de

    Evidence; não existe no modelo vNext uma distinção entre Source principal e

    Source adicional.


    EVD-000084 corresponde a uma terceira unidade de fonte/evento, mas essa

    distinção não lhe confere força suficiente para corroborar uma afirmação de

    persistência atual à escala municipal. É um único relato público não
    verificado,

    relativo a uma localização específica, sem base para inferir
    representatividade

    no conjunto do município.


    A independência ou distinção do processo de origem não transforma, por si
    só,

    um sinal geograficamente restrito e não verificado em corroboração
    suficiente

    do estado atual.
  limitations: >-
    A afirmação sustentada está limitada ao seguinte: em janeiro e fevereiro de

    2026 existia um problema material de degradação do pavimento rodoviário em

    Évora, reportado através de uma petição pública e posteriormente acompanhado

    por reconhecimento municipal e por um programa municipal de reparação
    descrito em cobertura jornalística pública como avaliado em aproximadamente
    1,5 milhões de euros.


    EVD-000154 documenta um diagnóstico e levantamento técnico municipais em
    fevereiro; EVD-000155 define um prazo contratual de 10 meses; e EVD-000156
    documenta intervenções locais até junho. Os registos documentam um diagnóstico
    municipal, um procedimento geral com prazo contratual e intervenções locais,
    mas não estabelecem a execução agregada do procedimento nem a condição da rede
    municipal.


    A evidência disponível não sustenta a conclusão de que a degradação persiste

    hoje a uma escala comparável em todo o município. EVD-000084, relativa à

    entrada da N114 em julho de 2026, é mantida apenas como um sinal posterior
    de

    limite e de estado potencial: não está verificada, refere-se a uma única

    localização e não permite generalização ao município.


    Os registos citados neste decision_basis não estabelecem a condição do
    pavimento rodoviário à escala de todo o município desde agosto de 2026 nem o
    estado agregado de execução do procedimento geral.


    Por essa razão, este decision_basis não produz uma afirmação de âmbito atual
    e

    delimitado para a persistência do problema. A evidência canónica permite

    delimitar o episódio histórico de janeiro-fevereiro de 2026 e um sinal

    posterior específico, mas não uma geografia, população e período atuais que

    sustentem honestamente uma afirmação de degradação continuada à escala

    municipal. Criar esse âmbito excederia o que EVD-000084 suporta.


    A decisão humana de Corroboration permanece HOLD para a questão da
    persistência

    atual precisamente por esta limitação.
history:
