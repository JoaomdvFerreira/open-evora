decision_basis:
  contract_version: "0.1"
  eligibility_basis: >-
    PRB-0010 constitui um problema de investigação distinto e bem delimitado:

    identifica um mecanismo específico de falha física — degradação do pavimento

    rodoviário e fiabilidade da resposta municipal de manutenção ou

    requalificação —, uma geografia delimitada ao Município de Évora e uma

    população afetada identificada, incluindo residentes e condutores.


    A manifestação histórica está documentada por EVD-000082, que regista as

    alegações de uma petição pública de janeiro de 2026, e por EVD-000083, que

    documenta através de cobertura jornalística o reconhecimento municipal da

    necessidade de manutenção ou requalificação e a existência de um programa de

    reparações. A própria petição documenta ainda consequências reportadas

    relacionadas com segurança e danos em veículos.


    O problema não é formulado como uma solução, como a necessidade de uma

    aplicação de reporte rodoviário, e o seu mecanismo é materialmente distinto
    do

    conflito entre tráfego, pressão de estacionamento e espaço pedonal tratado
    em

    PRB-0005.
  corroboration_basis: >-
    A Corroboration é sustentada apenas para uma afirmação histórica e

    temporalmente delimitada, relativa ao episódio de degradação documentado no

    início de 2026. Não é sustentada uma afirmação de persistência atual, à
    escala

    de todo o município durante a implementação faseada das reparações.


    EVD-000082, com provenance em SRC-0069, regista as alegações apresentadas
    numa

    petição pública criada em janeiro de 2026. EVD-000083, com provenance em

    SRC-0070 e SRC-0071, documenta através de cobertura jornalística o

    reconhecimento municipal da necessidade de manutenção ou requalificação e um

    programa de reparações na ordem dos 1,5 milhões de euros. O processo de
    petição

    e a documentação da resposta institucional constituem unidades de evidência

    materialmente distintas que convergem na leitura histórica de que existiu um

    problema relevante de degradação do pavimento no início de 2026.


    EVD-000084 documenta um relato público posterior, de julho de 2026, relativo

    apenas à entrada da N114 em Évora. Trata-se de um sinal não verificado e

    geograficamente limitado, utilizado para delimitar e refinar a leitura
    atual.

    Não permite generalizar a persistência da degradação ao conjunto do
    município.


    EVD-000154 regista o diagnóstico municipal e o levantamento técnico
    exaustivo de fevereiro. EVD-000155 fixa um prazo contratual de 10 meses para
    o procedimento geral, sem estabelecer o seu início, execução ou conclusão.
    EVD-000156 documenta intervenções locais em execução ou concluídas até
    junho, sem medir a condição da rede municipal. Estes registos refinam a
    cronologia da resposta, mas não corroboram persistência nem resolução geral.


    Assim, permanece em aberto saber se a degradação documentada em

    janeiro-fevereiro de 2026 persiste hoje a uma escala comparável durante a
    implementação faseada

    de reparações. Nenhum registo canónico estabelece essa condição atual à
    escala

    municipal, razão pela qual a decisão humana de Corroboration para a
    afirmação

    de persistência atual permanece HOLD.
  manifestation:
    kind: degradação física do pavimento rodoviário
    summary: >-
      Uma petição pública de janeiro de 2026 (EVD-000082) relatou a existência
      generalizada de buracos e pavimento rodoviário degradado no Município de
      Évora.


      O reconhecimento do próprio Município, documentado através de cobertura
      jornalística independente (EVD-000083), confirmou que a degradação não era
      atribuível apenas às condições meteorológicas, que exigia
      manutenção/requalificação e que seria objeto de um programa de reparações
      na ordem dos 1,5 milhões de euros.
    evidence:
      - EVD-000082
      - EVD-000083
  consequence:
    summary: >-
      A própria petição (EVD-000082) documenta consequências concretas
      reportadas por residentes e condutores: preocupações de segurança
      associadas à degradação do pavimento, danos em veículos e impactos na
      mobilidade e na qualidade de vida.


      Trata-se de evidência sobre as consequências associadas à manifestação do
      problema, e não sobre a resposta municipal. O programa de reparações
      (EVD-000083) é tratado como evidência da resposta institucional e da
      alteração do estado do problema, e não como evidência das consequências,
      pelo que não é citado aqui.
    evidence:
      - EVD-000082
  currentness:
    assessment: >-
      ALTA. O registo canónico inclui evidência relativa ao problema e à
      resposta até julho de 2026, mas a recência não estabelece a condição
      municipal atual.


      A petição de janeiro de 2026 (EVD-000082) documenta o problema histórico.
      A resposta anunciada (EVD-000083) é refinada pelo diagnóstico e
      levantamento técnico municipal de fevereiro (EVD-000154), pelo prazo
      contratual de 10 meses do procedimento geral (EVD-000155) e pelas
      intervenções locais reportadas até junho (EVD-000156). Estes registos
      indicam uma implementação faseada, não um estado necessariamente posterior
      à execução integral.


      O relato de julho de 2026 relativo à entrada da N114 em Évora (EVD-000084)
      continua não verificado e geograficamente limitado. Nem ele, nem os novos
      registos, permitem sustentar persistência atual em todo o município.


      Nenhum registo disponível estabelece, desde agosto de 2026, a condição da
      rede viária municipal, o estado agregado de execução/conclusão ou uma
      avaliação pós-reparação.
    evidence:
      - EVD-000082
      - EVD-000083
      - EVD-000084
      - EVD-000154
      - EVD-000155
      - EVD-000156
  contradiction_search:
    performed: true
    summary: >-
      Foi realizada uma procura deliberada de evidência que pudesse contradizer
      ou ultrapassar a manifestação histórica documentada, ou que permitisse
      estabelecer, num sentido ou noutro, se o problema persiste atualmente à
      escala de todo o município.


      EVD-000155 introduz uma explicação temporal material: o procedimento geral
      prevê 10 meses de execução, mas não demonstra início, progresso ou
      conclusão. EVD-000156 documenta trabalhos locais, mas não uma condição
      municipal nem uma conclusão agregada. Também não foi encontrado nenhum
      registo que estabeleça que a degradação continua atualmente de forma
      generalizada.


      O único sinal posterior, EVD-000084, restringe a conclusão em vez de
      resolver a questão: trata-se de um relato não verificado relativo a uma
      única localização, a entrada da N114 em Évora, sem corroboração através de
      dados operacionais ou municipais. Por isso, não é tratado como evidência
      de persistência da degradação em todo o município.


      A ausência simultânea de evidência que confirme ou contrarie a
      persistência atual é precisamente a razão pela qual esta questão permanece
      em aberto.
    evidence:
      - EVD-000084
      - EVD-000155
      - EVD-000156
  overlap_check:
    performed: true
    summary: >-
      A degradação física do pavimento rodoviário e a fiabilidade da resposta de

      manutenção ou requalificação são materialmente distintas do mecanismo de

      tráfego, pressão de estacionamento e conflito com o espaço pedonal tratado
      em

      PRB-0005. Nenhum outro PRB canónico trata a degradação do pavimento
      rodoviário;

      PRB-0010 não duplica nem se sobrepõe materialmente a outro registo.
    related_problems: []
  corroboration_statement: Uma petição de janeiro de 2026 relatou a existência
    generalizada de buracos e pavimento degradado no município, com impactos na
    segurança e danos nos veículos; o Município reconheceu a necessidade de
    manutenção/requalificação e respondeu com reparações na ordem dos 1,5
    milhões de euros. Um sinal público posterior, relativo a uma localização
    específica (entrada da N114 em Évora), alegou persistência do problema; este
    sinal, de natureza social/comunitária, não está verificado. Estes elementos
    evidenciam um problema real de degradação do pavimento rodoviário e de
    fiabilidade da manutenção, embora a evidência disponível — uma petição e um
    sinal público posterior não verificado — não permita estimar a prevalência
    atual em todo o município.
  supporting_evidence:
    - EVD-000082
    - EVD-000083
    - EVD-000154
  boundary_evidence:
    - EVD-000084
    - EVD-000155
    - EVD-000156
  independence_assessment: >-
    EVD-000082 e EVD-000083 assentam em processos materialmente diferentes de

    produção de evidência: uma petição cidadã e a documentação jornalística de
    uma

    resposta institucional municipal. Esta distinção contribui para sustentar a

    manifestação histórica, mas a existência de Sources ou registos distintos
    não

    é, por si só, tratada como prova automática de independência.


    EVD-000083 utiliza SRC-0070 e SRC-0071 como provenance do mesmo registo de

    Evidence; não existe no modelo vNext uma distinção entre Source principal e

    Source adicional.


    EVD-000084 corresponde a uma terceira unidade de fonte/evento, mas essa

    distinção não lhe confere força suficiente para corroborar uma afirmação de

    persistência atual à escala municipal. É um único relato público não
    verificado,

    relativo a uma localização específica, sem base para inferir
    representatividade

    no conjunto do município.


    A independência ou distinção do processo de origem não transforma, por si
    só,

    um sinal geograficamente restrito e não verificado em corroboração
    suficiente

    do estado atual.
  limitations: >-
    A afirmação sustentada está limitada ao seguinte: em janeiro e fevereiro de

    2026 existia um problema material de degradação do pavimento rodoviário em

    Évora, reportado através de uma petição pública e posteriormente acompanhado

    por reconhecimento municipal e por um programa de reparações financiado na

    ordem dos 1,5 milhões de euros.


    EVD-000154 documenta um diagnóstico e levantamento técnico municipais em
    fevereiro; EVD-000155 define um prazo contratual de 10 meses; e EVD-000156
    documenta intervenções locais até junho. Estes registos clarificam que a
    resposta é faseada/em curso, mas não estabelecem a respetiva execução
    agregada ou a condição da rede municipal.


    A evidência disponível não sustenta a conclusão de que a degradação persiste

    hoje a uma escala comparável em todo o município. EVD-000084, relativa à

    entrada da N114 em julho de 2026, é mantida apenas como um sinal posterior
    de

    limite e de estado potencial: não está verificada, refere-se a uma única

    localização e não permite generalização ao município.


    Não foi localizado um conjunto de dados público nem um registo municipal que

    estabeleça a condição do pavimento rodoviário, à escala de todo o município,

    desde agosto de 2026, durante ou após a implementação faseada das
    reparações.


    Por essa razão, este decision_basis não produz uma afirmação de âmbito atual
    e

    delimitado para a persistência do problema. A evidência canónica permite

    delimitar o episódio histórico de janeiro-fevereiro de 2026 e um sinal

    posterior específico, mas não uma geografia, população e período atuais que

    sustentem honestamente uma afirmação de degradação continuada à escala

    municipal. Criar esse âmbito excederia o que EVD-000084 suporta.


    A decisão humana de Corroboration permanece HOLD para a questão da
    persistência

    atual precisamente por esta limitação.
history:
  - date: 2026-08-28
    summary: Nova evidência oficial estabeleceu uma cronologia de resposta faseada/em curso — levantamento técnico em fevereiro, horizonte de contratação de 10 meses e intervenções locais até junho — pelo que a investigação deixa de assumir um estado pós-reparação e passa a perguntar pela condição atual da rede em todo o município durante a implementação.
    evidence:
      - EVD-000154
      - EVD-000155
      - EVD-000156
