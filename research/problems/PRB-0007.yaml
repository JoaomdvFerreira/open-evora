problem_id: PRB-0007
title: "Os cuidadores informais em Évora enfrentam dificuldades no acesso a apoios, incluindo necessidades de informação e orientação"
domain:
  - "SOC"
  - "HEA"
geography:
  level: municipality
  area: "Município de Évora"
affected_populations:
  - "informal caregivers"
  - "cared-for people"
problem_statement: "Os cuidadores informais em Évora têm necessidades documentadas de informação que abrangem saúde, mobilidade, estruturas de apoio e apoio financeiro/social. Um estudo com 68 cuidadores e 89 pessoas cuidadas, integrado no Plano Concelhio dos Cuidadores Informais, apurou que 35% das pessoas cuidadas não utilizava qualquer serviço formal de apoio — um resultado específico dessa amostra, não generalizável ao conjunto dos cuidadores de Évora. Material de grupos focais do mesmo plano identifica, numa amostra distinta, a burocracia e a dificuldade em compreender os direitos dos cuidadores como uma fonte de sobrecarga separada da sobrecarga geral do cuidar; a evidência atual não estabelece uma relação causal entre esta fragmentação da informação e a não utilização de apoio formal reportada no estudo dos 68/89. Um terceiro inquérito, a 133 cuidadores, indica que as necessidades de apoio direto no cuidar, descanso, apoio financeiro e apoio psicológico são reportadas com maior frequência do que necessidades relacionadas com orientação, pelo que estas permanecem uma explicação alternativa, e possivelmente mais prevalente, para as dificuldades de acesso a apoios — apesar de Évora dispor de uma densa rede interinstitucional de apoio social (CLASE / Rede Social)."
investigation:
  open_questions:
    - question: "Os cuidadores estão conscientes do Cantinho do Cuidador e de outros serviços já existentes, e as ações de manual/sistematização do plano 2026-2027 estão a ser entregues e são eficazes?"
      why_open: "O plano municipal 2026-2027 (manual, sistematização de respostas, procedimentos simplificados, publicação digital) visa explicitamente a fricção de informação/navegação descrita neste problema, mas a sua entrega e eficácia ainda não foram verificadas."
      resolution_condition: "Validação com partes interessadas (D5) sobre a consciência dos serviços existentes e sobre a entrega/eficácia das ações do plano 2026-2027."
      evidence:
        - "EVD-000044"
        - "EVD-000045"
    - question: "A burocracia e a dificuldade em compreender os direitos dos cuidadores (identificadas em grupos focais) explicam a não utilização de apoio formal reportada no estudo dos 68/89 cuidadores/pessoas cuidadas?"
      why_open: "Os dois resultados provêm de amostras distintas dentro do mesmo Plano Concelhio dos Cuidadores Informais (mesma fonte SRC-0030); a evidência atual não estabelece uma relação causal entre a fragmentação de informação e a não utilização de apoio formal. Além disso, um terceiro inquérito a 133 cuidadores indica que necessidades de apoio direto no cuidar, descanso, apoio financeiro e apoio psicológico são reportadas com maior frequência do que necessidades de orientação, pelo que permanecem uma explicação alternativa e possivelmente mais prevalente."
      resolution_condition: "Evidência que relacione diretamente a fragmentação de informação com a não utilização de apoio formal, ou que estabeleça a prevalência relativa das diferentes explicações."
      evidence:
        - "EVD-000089"
        - "EVD-000090"
        - "EVD-000091"
  path:
    initial_signal:
      summary: "Foram identificadas necessidades de informação dos cuidadores informais em Évora, abrangendo saúde, mobilidade, estruturas de apoio e apoio financeiro/social, apesar de Évora dispor de uma rede interinstitucional densa de apoio social (CLASE/Rede Social, cerca de 120 instituições)."
      evidence:
        - "EVD-000034"
        - "EVD-000036"
    development:
      summary: "Foi confirmado que a Câmara Municipal reconhece oficialmente 262 pessoas com estatuto de cuidador informal (janeiro de 2026) e implementa ativamente um plano de cuidadores 2026-2027 que visa a fricção de informação/navegação; serviços orientados a cuidadores já operam (UCC, Cantinho do Cuidador, VIVAMENTE), confirmando que a lacuna remanescente é de navegação/coordenação/consciência, não de ausência de serviço."
      evidence:
        - "EVD-000044"
        - "EVD-000045"
    delimitation:
      summary: "Um estudo com 68 cuidadores e 89 pessoas cuidadas apurou que 35% das pessoas cuidadas não utilizava qualquer serviço formal de apoio. Material de grupos focais de uma amostra distinta identificou burocracia e dificuldade em compreender direitos como fricção separada da sobrecarga geral do cuidar. Um terceiro inquérito a 133 cuidadores delimitou o problema: necessidades de apoio direto, descanso, apoio financeiro e apoio psicológico são reportadas com maior frequência do que necessidades de orientação, pelo que o problema não deve ser reduzido a uma questão de descoberta de informação."
      evidence:
        - "EVD-000089"
        - "EVD-000090"
        - "EVD-000091"
        - "EVD-000092"
    current_formulation:
      summary: "A formulação atual mantém as necessidades de informação documentadas como componente do problema, delimitada por evidência que mostra que necessidades diretas de apoio no cuidar, descanso, apoio financeiro e psicológico podem ser mais prevalentes do que necessidades de orientação."
evidence:
