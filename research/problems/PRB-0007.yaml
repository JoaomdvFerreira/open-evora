status: CLOSED
closure:
  reason: OUT_OF_SCOPE
  explanation: >-
    Este registo foi encerrado porque a informação disponível descreve
    necessidades de cuidadores e respostas de apoio no concelho de Évora ou a
    nível nacional, mas não permite identificar uma situação específica na
    cidade de Évora, a área que o Open Évora acompanha. O encerramento não
    significa que estas dificuldades não existam.
  reopen_condition: >-
    Este registo pode ser reconsiderado se surgir informação específica da
    cidade de Évora, ou de uma zona ou local dentro da cidade, que documente
    uma situação concreta e significativa relacionada com este problema. Por
    exemplo: dados sobre dificuldades de cuidadores residentes na cidade no
    acesso a informação ou apoio, ou relatos verificáveis de dificuldades no
    acesso a apoios prestados na cidade. Informação apenas sobre o concelho no
    seu conjunto ou a nível nacional não é suficiente. Uma avaliação municipal
    posterior, incluindo a prevista para 2027, só é suficiente se apresentar
    resultados separados para a cidade ou outra evidência diretamente aplicável
    à cidade.
  closed_at: 2026-10-13
history:
  - date: 2026-08-31
    summary: Não estava disponível um episódio concreto de procura de apoio adequado
      e a recolha não foi alargada apenas para obter evidência; em paralelo, a
      DEIS reconheceu o pedido, solicitou contexto adicional que foi fornecido e
      aguarda-se resposta substantiva. A importância causal da orientação face
      às necessidades diretas de cuidado, descanso, apoio financeiro e
      psicológico mantém-se sem resolução.
  - date: 2026-09-09
    summary: A DEIS reportou que as ações do Plano Concelhio dos Cuidadores
      Informais se encontram operacionalizadas, encerrando a espera
      institucional sobre a operacionalização geral das ações previstas no
      Plano. A implementação é recente e a eficácia e o impacto ainda não estão
      avaliados; permanece também por estabelecer a importância causal das
      dificuldades de orientação face às restantes necessidades dos cuidadores.
  - date: 2026-09-09
    summary: "Corrigida a formulação do resultado do questionário a 133
      cuidadores para refletir a unidade de análise suportada pela evidência:
      35% dos respondentes indicaram que a pessoa de quem cuidavam não utilizava
      qualquer serviço formal de apoio; o resultado não estabelece que 35% do
      conjunto das pessoas cuidadas não utilizava apoio formal."
  - date: 2026-10-13
    summary: O registo foi encerrado porque a evidência disponível é municipal ou
      nacional, sem especificidade para a cidade de Évora. Este encerramento não
      estabelece a ausência das necessidades subjacentes dos cuidadores. A
      reabertura requer evidência aplicável à cidade.
    state_changes:
      status:
        from: OPEN
        to: CLOSED
  - date: 2026-10-13
    summary: A formulação pública foi revista para destacar as necessidades de
      apoio documentadas, distinguir o âmbito municipal da cidade e preservar
      os limites amostrais e causais da evidência.
