problem_id: PRB-0007
created_at: 2026-08-28
updated_at: 2026-10-14
title: Necessidades de apoio e de informação de cuidadores informais no concelho de Évora
domain:
  - SOC
  - HEA
geography:
  level: municipality
  area: Évora
affected_populations:
  - cuidadores informais
  - pessoas cuidadas
problem_statement: >-
  No questionário a 133 cuidadores incluído no Plano Concelhio dos Cuidadores
  Informais, as necessidades mais referidas foram apoio na prestação de
  cuidados (cerca de 41%), descanso do cuidador (40%), apoio financeiro (37%) e
  apoio psicológico (31%). O plano identifica também necessidades de informação
  nas áreas da saúde, mobilidade, estruturas de apoio e apoios financeiros e
  sociais. Em grupos focais de uma amostra distinta, foram referidas burocracia
  e dificuldade em conhecer os direitos dos cuidadores.


  No mesmo questionário, 35% dos respondentes indicaram que a pessoa de quem
  cuidavam não utilizava qualquer serviço formal de apoio. Este resultado
  aplica-se apenas à amostra e não pode ser generalizado ao conjunto dos
  cuidadores do concelho de Évora. A evidência disponível não estabelece uma
  relação causal entre as dificuldades de informação e a não utilização de
  apoio formal. O concelho dispõe também da rede interinstitucional CLASE/Rede
  Social, com cerca de 120 instituições participantes; a dimensão da rede, por
  si só, não demonstra facilidade de navegação ou acesso às respostas.
investigation:
  open_questions:
    - question: Os cuidadores conhecem o Cantinho do Cuidador e outros serviços já
        existentes, e as medidas de criação de um manual e de sistematização das
        respostas previstas no plano 2026-2027 estão a ser executadas e são
        eficazes?
      why_open: O plano municipal 2026-2027 prevê um manual, a sistematização das
        respostas, procedimentos simplificados e publicação digital; a execução
        específica dessas medidas e a sua eficácia ainda não foram verificadas.
      latest_result: A DEIS reportou que as ações do Plano Concelhio dos Cuidadores
        Informais se encontram operacionalizadas. A implementação é recente e
        ainda não estão disponíveis resultados consistentes nem avaliação de
        impacto; a DEIS considera essa avaliação prematura nesta fase.
      current_action: >-
        Nenhuma ação ativa no âmbito atual do programa. Informação futura sobre a
        execução ou avaliação do plano municipal só justifica reavaliação deste PRB
        se produzir evidência específica da cidade compatível com a condição de
        reabertura.
      resolution_condition: Evidência sobre a execução das medidas específicas de
        orientação relevantes para este problema, o conhecimento e a utilização
        pelos cuidadores das respostas disponíveis e o efeito na orientação e no
        acesso; permanece também por estabelecer a importância causal e material
        da orientação face às necessidades de cuidado direto, descanso, apoio
        financeiro e apoio psicológico.
      evidence:
        - EVD-000044
        - EVD-000045
        - EVD-000164
        - EVD-000165
    - question: A burocracia e a dificuldade em conhecer os direitos dos
        cuidadores, identificadas em grupos focais, têm alguma relação com a
        não utilização de apoio formal indicada pelos respondentes do
        questionário a 133 cuidadores?
      why_open: >-
        Os resultados dos grupos focais e do questionário a 133 cuidadores
        provêm de amostras distintas dentro do mesmo Plano Concelhio dos
        Cuidadores Informais e da mesma fonte (SRC-0030). A evidência atual não
        estabelece uma relação causal entre as dificuldades de informação e
        direitos e a não utilização de apoio formal.


        O questionário regista também necessidades de apoio direto no cuidar,
        descanso, apoio financeiro e apoio psicológico, mas não estabelece a
        importância relativa destas necessidades e das dificuldades de
        informação e direitos para a não utilização de apoio formal.
      latest_result: Não estava disponível um episódio concreto de procura de apoio
        que permitisse testar esta relação; a recolha não foi alargada apenas
        para obter evidência de validação.
      current_action: >-
        Nenhuma ação ativa no âmbito atual do programa. Reconsiderar apenas perante
        evidência diretamente aplicável à cidade que satisfaça a condição de
        reabertura.
      resolution_condition: Evidência que relacione diretamente as dificuldades de
        informação e orientação com a não utilização de apoio formal ou que
        permita estabelecer a importância relativa das diferentes explicações.
      evidence:
        - EVD-000143
        - EVD-000090
        - EVD-000091
  path:
    initial_signal:
      summary: Foram identificadas necessidades de informação dos cuidadores informais
        no concelho de Évora, abrangendo saúde, mobilidade, estruturas de apoio e
        apoio financeiro e social. O concelho dispõe da rede interinstitucional
        CLASE/Rede Social, com cerca de 120 instituições.
      evidence:
        - EVD-000034
        - EVD-000036
    development:
      summary: >-
        Informação municipal/CLASE referiu 262 pessoas com estatuto oficial de
        cuidador informal em janeiro de 2026. A DEIS reportou
        que as ações do Plano Concelhio dos Cuidadores Informais para 2026-2027
        se encontram operacionalizadas, num modelo que inclui coordenação
        interinstitucional e facilitação de procedimentos; a implementação é
        recente e os resultados e a eficácia ainda não estão estabelecidos.


        Já existem também iniciativas locais dirigidas a cuidadores, à comunidade e
        à demência, incluindo a Unidade de Cuidados na Comunidade, o Cantinho do
        Cuidador e o VIVAMENTE. A evidência disponível afasta, por isso, uma
        leitura de ausência de serviços e mantém em aberto questões relacionadas
        com o conhecimento das respostas existentes, a orientação e a
        coordenação entre apoios.
      evidence:
        - EVD-000044
        - EVD-000146
        - EVD-000045
        - EVD-000164
        - EVD-000165
    delimitation:
      summary: >-
        No questionário a 133 cuidadores incluído no Plano Concelhio dos
        Cuidadores Informais, 35% dos respondentes indicaram que a pessoa de quem
        cuidavam não utilizava qualquer serviço formal de apoio.
        Material de grupos focais, relativo a uma amostra distinta, registou a
        burocracia e a dificuldade em conhecer os direitos entre as dificuldades
        relativas aos apoios sociais e identificou o acesso a informação e
        direitos como necessidade.


        O mesmo questionário registou necessidades de apoio direto no cuidar,
        descanso, apoio financeiro e apoio psicológico. O problema não deve,
        por isso, ser reduzido a uma questão de descoberta de informação; a
        importância relativa das diferentes necessidades para o acesso a apoios
        permanece por estabelecer.


        As preocupações relativas à saúde mental e à capacidade de resposta
        permanecem distintas deste problema e não são absorvidas por ele.
      evidence:
        - EVD-000143
        - EVD-000090
        - EVD-000091
        - EVD-000035
        - EVD-000046
