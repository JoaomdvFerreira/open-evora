problem_id: PRB-0002
title: "A informação dos transportes públicos apresenta lacunas documentadas, com impacto nas viagens ainda por caracterizar"
domain:
  - "MOB"
  - "DIG"
geography:
  level: intermunicipal
  area: "Alentejo Central; urban Évora to be investigated separately"
affected_populations:
  - "public-transport users"
problem_statement: "Existem lacunas documentadas no ambiente de informação aos passageiros dos transportes públicos — nomeadamente heterogeneidade na informação disponível nas paragens e melhorias de informação em tempo real ainda planeadas, não confirmadas como concretizadas — apesar de existirem atualmente canais de informação destinados aos passageiros (TREVO, TPAC). Em que medida estas lacunas afetam realmente as viagens dos passageiros — a sua frequência, gravidade e os pontos concretos de falha — não está ainda estabelecido."
investigation:
  open_questions:
    - question: "A informação é fiável, utilizável, consistente e interoperável ao longo da viagem real do passageiro, e isso causa falhas reais na viagem?"
      why_open: "A evidência atual estabelece que existem canais de informação digitais e físicos (TREVO, TPAC/GTFS) e que a informação física nas paragens é inconsistente, mas não existe ainda evidência sobre a viagem afetada nem sobre se isso causa falhas reais para os passageiros."
      resolution_condition: "Evidência sobre a viagem afetada do passageiro (affected-journey evidence) que estabeleça se e como estas lacunas de informação causam falha prática na viagem."
      evidence:
        - "EVD-000016"
        - "EVD-000123"
    - question: "Como se relacionam as afirmações institucionais de canais de informação municipal completos com a inconsistência diagnosticada da informação física nas paragens?"
      why_open: "O plano de ação PMUSE confirma melhorias de informação ao passageiro planeadas (paragens, tempo real, aplicação/site multimodal), enquanto o diagnóstico ao nível da paragem do mesmo plano documenta inconsistência física atual (paragens não abrigadas com apenas uma placa; paragens abrigadas com painel mais completo mas sem elementos de acessibilidade como braille/áudio); a evidência atual não resolve esta tensão entre completude planeada e inconsistência física diagnosticada."
      evidence:
        - "EVD-000122"
        - "EVD-000123"
  path:
    initial_signal:
      summary: "Foi identificada heterogeneidade na informação disponível nas paragens e melhorias de informação em tempo real planeadas mas não confirmadas como concretizadas, apesar de já existirem canais de informação (TREVO, TPAC)."
      evidence:
        - "EVD-000010"
        - "EVD-000016"
    development:
      summary: "Foi reconhecido que a questão continha pelo menos dois sub-gaps tecnicamente distintos: qualidade/completude da informação ao passageiro, e interoperabilidade/reutilização de dados para terceiros. Uma decisão estrutural manteve este registo como um único problema, explicitamente restringido à informação orientada ao passageiro; a questão de interoperabilidade de dados para terceiros foi preservada como pista de fundação de dados abertos fora deste PRB, sem criar um segundo registo canónico."
    delimitation:
      summary: "O plano de ação PMUSE propõe melhorias de informação ao passageiro (conforto/acessibilidade/informação nas paragens, informação em tempo real, aplicação/site multimodal), confirmando que estas estão identificadas e planeadas, não que estão entregues. O diagnóstico ao nível da paragem do PMUSE documenta inconsistência física (paragens não abrigadas têm apenas uma placa; paragens abrigadas têm um painel mais completo que ainda assim carece de elementos de acessibilidade como braille/áudio)."
      evidence:
        - "EVD-000122"
        - "EVD-000123"
evidence:
  - "EVD-000010"
  - "EVD-000011"
  - "EVD-000016"
  - "EVD-000080"
  - "EVD-000122"
  - "EVD-000123"
evidence_status: discovered
validation_status: unvalidated
digital_tractability: not_assessed
solution_landscape_status: not_assessed
status: OPEN
