history:
  - date: 2026-08-31
    summary: Não foi possível testar numa deslocação real delimitada se uma lacuna de informação causa falha de viagem, em vez de inconveniência ou falha operacional; a investigação passa a aguardar uma deslocação adequada para testar essa cadeia causal.
