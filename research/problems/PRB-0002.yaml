problem_id: PRB-0002
created_at: "2026-08-28"
updated_at: "2026-10-12"
title: >-
  Informação ao passageiro no TREVO: condições documentadas nas paragens e
  impacto nas viagens por apurar
domain:
  - MOB
  - DIG
  - ACC
geography:
  level: city
  area: Évora cidade
affected_populations:
  - pessoas que utilizam o transporte público urbano TREVO em Évora
  - pessoas que dependem de informação acessível nas paragens
problem_statement: >-
  O diagnóstico do Plano de Mobilidade Urbana Sustentável de Évora (PMUSE)
  descreve, no Centro Histórico, paragens sem abrigo identificadas por uma
  placa com o operador e a linha, sem mapa da rede nem horários. Descreve
  também paragens com abrigo com informação básica sobre linhas, paragens e
  horários, mas sem braille nem avisos sonoros. O sítio TREVO disponibilizava
  informação sobre a rede, horários, notificações e atualizações de percursos
  em agosto de 2026. O PMUSE propôs melhorias na informação ao passageiro,
  mas não estabelece a sua implementação ou eficácia. Não está estabelecido
  se as condições descritas nas paragens persistem, se a informação ao longo
  de uma viagem urbana é fiável, utilizável e consistente, nem se alguma
  lacuna de informação causa falhas em viagens concretas.
investigation:
  open_questions:
    - question: >-
        A informação atualmente disponível ao longo de uma viagem real no
        serviço urbano TREVO é fiável, utilizável e consistente? Alguma lacuna
        documentada causa uma falha prática nessa viagem?
      why_open: >-
        O sítio TREVO disponibilizava canais de informação em agosto de 2026
        e o diagnóstico histórico do PMUSE documenta diferenças na informação
        física das paragens. A disponibilidade de canais não estabelece a
        qualidade da informação numa viagem real. Não existe ainda evidência
        sobre viagens concretamente afetadas nem sobre se as lacunas
        documentadas causam falhas reais para os passageiros.
      latest_result: Não estava disponível uma deslocação real delimitada que
        permitisse distinguir uma falha de viagem causada pela informação de
        inconveniência ou de uma falha operacional.
      current_action: Não é proporcional prosseguir desafio direto a passageiros sem
        uma deslocação real delimitada que permita testar essa cadeia causal.
      resolution_condition: Uma deslocação real delimitada que permita estabelecer se
        e como estas lacunas de informação causam falhas práticas nas deslocações.
      evidence:
        - EVD-000016
        - EVD-000123
    - question: >-
        Qual é o estado atual da informação física nas paragens descritas pelo
        PMUSE? As melhorias propostas pelo plano foram implementadas e, em caso
        afirmativo, alteraram materialmente a experiência dos passageiros?
      why_open: >-
        O plano de ação do PMUSE propõe melhorias na informação ao passageiro — nas
        paragens, em tempo real e através de uma aplicação/sítio Web multimodal —,
        enquanto o seu diagnóstico documenta diferenças na informação física das
        paragens e ausência de certos elementos de acessibilidade nos painéis
        descritos. As propostas não estabelecem implementação, operação ou eficácia,
        e o diagnóstico não estabelece o estado atual das paragens após eventuais
        intervenções.
      evidence:
        - EVD-000122
        - EVD-000123
  path:
    initial_signal:
      summary: >-
        O diagnóstico do PMUSE documentou diferenças na informação disponível
        nas paragens de Évora e o plano propôs melhorias, sem confirmação de
        implementação. O sítio TREVO disponibilizava informação sobre a rede
        urbana em agosto de 2026. Não estava estabelecido se as lacunas
        documentadas causavam falhas em viagens concretas.
      evidence:
        - EVD-000016
        - EVD-000122
        - EVD-000123
    development:
      summary: >-
        Foi reconhecido que a qualidade e completude da informação destinada
        ao passageiro e a reutilização de dados por terceiros são questões
        distintas. Este registo ficou delimitado à informação orientada ao
        passageiro. A avaliação do serviço intermunicipal TPAC documentou
        informação sobre horários e percursos no Google Maps através de dados
        GTFS e insuficiências na informação ao público. Essa evidência é
        contexto intermunicipal e não descreve as condições do serviço urbano
        TREVO.
      evidence:
        - EVD-000010
        - EVD-000011
    delimitation:
      summary: >-
        O plano de ação do PMUSE propõe melhorias na informação ao passageiro —
        conforto, acessibilidade e informação nas paragens, informação em tempo
        real e uma aplicação/sítio Web multimodal —, estabelecendo necessidades e
        intervenções propostas, não a sua implementação, operação ou eficácia.


        O problema centra-se na informação destinada aos passageiros do
        transporte público urbano TREVO em Évora. O diagnóstico do PMUSE
        descreve, no Centro Histórico, paragens sem abrigo identificadas por
        operador e linha, sem mapa da rede nem horários. Descreve painéis de
        paragens com abrigo com informação básica, mas sem braille nem avisos
        sonoros. O diagnóstico não estabelece o estado atual dessas condições
        após eventuais intervenções; a evidência TPAC serve apenas de contexto
        intermunicipal.
      evidence:
        - EVD-000122
        - EVD-000123
