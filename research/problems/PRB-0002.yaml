problem_id: PRB-0002
created_at: "2026-08-28"
updated_at: "2026-10-14"
title: Informação e acessibilidade nas paragens de autocarro de Évora
domain:
  - MOB
  - DIG
  - ACC
geography:
  level: city
  area: cidade de Évora
affected_populations:
  - pessoas que utilizam as paragens de autocarro descritas pelo PMUSE em Évora
  - pessoas que dependem de informação acessível nessas paragens
problem_statement: >-
  O Plano de Mobilidade Urbana Sustentável de Évora (PMUSE) descreve paragens
  sem abrigo no Centro Histórico identificadas apenas pelo operador e pela
  linha, sem mapa nem horários, e paragens com abrigo cujos painéis têm
  informação básica, mas sem braille nem avisos sonoros. Esta descrição não
  abrange automaticamente todas as paragens de Évora. Existem canais mais
  recentes de informação do serviço urbano TREVO, mas não está estabelecido
  se são completos, consistentes, acessíveis ou utilizáveis, se as condições
  descritas pelo PMUSE persistem, se as melhorias propostas foram executadas
  ou se alguma lacuna persistente causa falhas em deslocações concretas.
investigation:
  open_questions:
    - question: >-
        Qual é o estado atual da informação ao passageiro nas paragens
        descritas pelo PMUSE — informação instalada, informação em tempo real e
        elementos de acessibilidade — e foram executadas as medidas de
        informação propostas pelo plano?
      latest_result: >-
        Estão documentados canais de informação do serviço urbano TREVO no
        sítio do operador, em agosto de 2026, e no relatório municipal de
        junho de 2026 sobre 2025. Nenhum destes registos estabelece o estado
        atual das paragens descritas pelo PMUSE ou a execução das melhorias propostas.
      why_open: >-
        A evidência disponível não identifica a condição atual das paragens
        descritas nem o estado de execução das medidas propostas.
      current_action: >-
        Está preparado, mas não enviado, um pedido documental ao Município de Évora, partilhado com o problema da oferta e pontualidade dos autocarros urbanos, sobre intervenções e estado atual das
        paragens, informação ao
        passageiro instalada, informação em tempo real, acessibilidade,
        execução das medidas relevantes do PMUSE e responsabilidades e
        acompanhamento associados.
      resolution_condition: >-
        Documentação pública atual ou resposta documentada da autoridade
        competente ou do operador que identifique as condições presentes nas
        paragens e o estado de execução das medidas.
      evidence:
        - EVD-000016
        - EVD-000122
        - EVD-000123
        - EVD-000168
    - question: >-
        Se persistirem lacunas materiais na informação ao passageiro, causam
        essas lacunas falhas práticas numa deslocação real, distintas de
        inconveniência ou de falhas operacionais do serviço?
      latest_result: >-
        A evidência reunida não estabelece que uma lacuna de informação tenha
        causado uma falha numa deslocação concreta. Não estava disponível uma
        viagem concreta, documentada de forma verificável, que permitisse
        distinguir essa falha de inconveniência ou de uma falha operacional.
      why_open: >-
        Ainda não está estabelecido se persistem lacunas materiais de
        informação; o diagnóstico histórico do PMUSE não demonstra efeitos
        atuais nas deslocações.
      current_action: >-
        A investigação dos efeitos nas deslocações fica a aguardar a resposta à
        primeira questão.
      resolution_condition: >-
        Informação documentada da autoridade competente ou do operador,
        reclamações ou comunicações delimitadas ou, se necessário, uma viagem
        concreta documentada de forma verificável, que permitam estabelecer
        se uma lacuna material atual causa uma falha prática na viagem.
      evidence:
        - EVD-000123
        - EVD-000168
  path:
    initial_signal:
      summary: >-
        O diagnóstico do PMUSE documentou diferenças na informação disponível
        nas paragens que descreve, incluindo paragens sem abrigo do Centro
        Histórico sem mapa da rede nem horários, e o plano propôs melhorias,
        sem confirmação de execução. O sítio TREVO disponibilizava informação
        sobre a rede urbana em agosto de 2026.
      evidence:
        - EVD-000016
        - EVD-000122
        - EVD-000123
    development:
      summary: >-
        Foi reconhecido que a qualidade e a completude da informação destinada
        ao passageiro e a reutilização de dados por terceiros são questões
        distintas; este registo ficou delimitado à informação orientada ao
        passageiro. A avaliação do serviço intermunicipal de transporte público do Alentejo Central documentou a publicação de horários e percursos no Google Maps e insuficiências na informação ao público; essa evidência é apenas
        contexto intermunicipal. O relatório municipal de junho de 2026 sobre
        2025 documentou canais de informação e reclamações do serviço urbano
        TREVO, sem descrever a condição atual das paragens referidas pelo
        PMUSE.
      evidence:
        - EVD-000010
        - EVD-000011
        - EVD-000168
    delimitation:
      summary: >-
        O problema centra-se na informação ao passageiro nas paragens de
        autocarro descritas pelo PMUSE em Évora. As propostas do plano de ação
        do PMUSE são intervenções propostas e não estabelecem a sua execução,
        operação ou eficácia. A investigação distingue as condições
        documentadas historicamente da situação atual das paragens, ainda por
        esclarecer, e não generaliza essas condições a todas as paragens de
        Évora. A avaliação do serviço intermunicipal serve apenas de contexto. A oferta e a pontualidade do serviço urbano, e não a informação nas paragens, são tratadas no problema sobre os autocarros urbanos, com o qual é partilhado o pedido documental ao Município.
      evidence:
        - EVD-000016
        - EVD-000122
        - EVD-000123
        - EVD-000168
