history:
  - date: 2026-08-31
    summary: Não foi possível testar numa deslocação real delimitada se uma lacuna de informação causa falha de viagem, em vez de inconveniência ou falha operacional; a investigação passa a aguardar uma deslocação adequada para testar essa cadeia causal.
  - date: 2026-10-11
    summary: >-
      A investigação foi reformulada para distinguir as condições históricas
      documentadas pelo PMUSE da situação atual das paragens, delimitar o
      problema ao transporte público urbano TREVO em Évora e reorganizar as
      questões em torno da verificação do estado atual e, caso persistam
      lacunas materiais de informação, dos seus efeitos nas deslocações.
      A evidência TPAC foi mantida apenas como contexto intermunicipal.
