problem_id: PRB-0002
created_at: "2026-08-28"
updated_at: "2026-10-10"
title: Lacunas documentadas na informação dos transportes públicos; ainda não
  está estabelecido se causam falhas nas viagens
domain:
  - MOB
  - DIG
geography:
  level: intermunicipal
  area: Alentejo Central; Évora urbana a investigar separadamente
affected_populations:
  - utilizadores dos transportes públicos
problem_statement: >-
  O diagnóstico do PMUSE documenta heterogeneidade na informação física das
  paragens, mas não estabelece o estado atual dessas condições; o plano propõe
  melhorias na informação ao passageiro sem demonstrar implementação, operação
  ou eficácia. Estão também documentados canais de informação destinados aos
  passageiros, incluindo o sítio TREVO e a disponibilização do TPAC em
  GTFS/Google Maps no período documentado. Não está estabelecido se as lacunas
  documentadas causam falhas em viagens concretas, nem a sua frequência ou
  gravidade.
investigation:
  open_questions:
    - question: >-
        Em que medida a informação disponível ao passageiro é fiável, utilizável e
        consistente ao longo de uma viagem real, e as lacunas documentadas causam
        falhas nessa viagem?
      why_open: >-
        A evidência disponível documenta canais de informação destinados aos
        passageiros e, no diagnóstico do PMUSE, heterogeneidade na informação
        física das paragens. O estado atual dessas condições nas paragens não
        está estabelecido, e não existe ainda evidência sobre viagens
        concretamente afetadas nem sobre se as lacunas documentadas causam
        falhas reais para os passageiros.
      latest_result: Não estava disponível uma deslocação real delimitada que
        permitisse distinguir uma falha de viagem causada pela informação de
        inconveniência ou de uma falha operacional.
      current_action: Não é proporcional prosseguir desafio direto a passageiros sem
        uma deslocação real delimitada que permita testar essa cadeia causal.
      resolution_condition: Uma deslocação real delimitada que permita estabelecer se
        e como estas lacunas de informação causam falhas práticas nas deslocações.
      evidence:
        - EVD-000016
        - EVD-000123
    - question: >-
        Como se relacionam as melhorias de informação ao passageiro propostas pelo
        PMUSE com a heterogeneidade diagnosticada na informação física das paragens,
        e qual é o estado atual dessas condições?
      why_open: >-
        O plano de ação do PMUSE propõe melhorias na informação ao passageiro — nas
        paragens, em tempo real e através de uma aplicação/sítio Web multimodal —,
        enquanto o diagnóstico do mesmo plano documenta heterogeneidade na informação
        física das paragens e ausência de certos elementos de acessibilidade nos
        painéis descritos. As propostas não estabelecem implementação, operação ou
        eficácia, e o diagnóstico não estabelece o estado atual das paragens após
        eventuais intervenções. A evidência disponível não resolve, por isso, a
        relação entre a condição diagnosticada, as melhorias propostas e o estado
        atual.
      evidence:
        - EVD-000122
        - EVD-000123
  path:
    initial_signal:
      summary: >-
        Foi documentada heterogeneidade na informação disponível aos passageiros em
        paragens e foram propostas melhorias na informação em tempo real, sem
        confirmação de implementação. Em paralelo, estavam documentados canais de
        informação ao passageiro, incluindo o sítio TREVO e, no serviço TPAC, dados
        em GTFS disponibilizados através do Google Maps; não estava estabelecido se
        as lacunas documentadas causavam falhas em viagens concretas.
      evidence:
        - EVD-000010
        - EVD-000016
        - EVD-000122
        - EVD-000123
    development:
      summary: >-
        Foi reconhecido que a questão continha pelo menos duas lacunas
        tecnicamente distintas: a qualidade e completude da informação destinada
        ao passageiro e a interoperabilidade/reutilização de dados por
        terceiros.


        Uma decisão de delimitação manteve este registo como um único problema,
        explicitamente restringido à informação orientada ao passageiro. A
        questão da interoperabilidade e reutilização de dados por terceiros foi
        preservada como uma linha distinta de investigação sobre dados abertos,
        fora deste PRB, sem criar um segundo registo canónico.
    delimitation:
      summary: >-
        O plano de ação do PMUSE propõe melhorias na informação ao passageiro —
        conforto, acessibilidade e informação nas paragens, informação em tempo
        real e uma aplicação/sítio Web multimodal —, estabelecendo necessidades e
        intervenções propostas, não a sua implementação, operação ou eficácia.


        O diagnóstico do PMUSE documenta heterogeneidade física na informação das
        paragens. Nas paragens sem abrigo descritas no Centro Histórico, refere uma
        placa de identificação de operador e linha, sem cartografia da rede nem
        horários; nas paragens com abrigo, refere painéis com informação básica que
        não incluem elementos de acessibilidade universal como braille ou avisos
        sonoros. O diagnóstico não estabelece o estado atual dessas condições após
        eventuais intervenções.
      evidence:
        - EVD-000122
        - EVD-000123
