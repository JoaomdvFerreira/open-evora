history:
  - date: 2026-08-31
    summary: Não foi possível testar numa deslocação real delimitada se uma lacuna de informação causa falha de viagem, em vez de inconveniência ou falha operacional; a investigação passa a aguardar uma deslocação adequada para testar essa cadeia causal.
  - date: 2026-10-11
    summary: >-
      A investigação foi reformulada para distinguir as condições históricas
      documentadas pelo PMUSE da situação atual das paragens e para delimitar
      o problema às paragens descritas pelo plano. As questões foram
      reorganizadas: primeiro a verificação do estado atual e, só depois,
      caso persistam lacunas materiais de informação, os seus efeitos nas
      deslocações. Foi incorporada evidência municipal relativa a 2025 sobre
      canais de informação e reclamações; a avaliação do serviço intermunicipal foi mantida apenas como contexto.
