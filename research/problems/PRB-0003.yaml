problem_id: PRB-0003
created_at: "2026-08-28"
updated_at: "2026-10-10"
title: Barreiras pedonais e de acessibilidade em partes de Évora, com
  persistência atual ainda por validar
domain:
  - ACC
  - MOB
  - URB
geography:
  level: city
  area: Évora
affected_populations:
  - pessoas com mobilidade reduzida
  - outros grupos de peões vulneráveis
problem_statement: Em Évora, estão documentadas barreiras pedonais e de
  acessibilidade em partes específicas da cidade, mas a evidência disponível não
  permite estabelecer quais permanecem hoje por corrigir em cada localização nem
  caracteriza suficientemente a consequência atualmente vivida pela população
  afetada.
causal_reading: "Esta é uma interpretação não validada: as barreiras apontam
  sobretudo para infraestrutura física; a informação/coordenação digital é lida
  como secundária e contingente, dependente de evidência futura que a
  estabeleça."
investigation:
  open_questions:
    - question: Que barreiras pedonais e de acessibilidade concretas permanecem
        hoje por resolver, e em que localizações da cidade de Évora, e que
        consequência vivida atual produzem para as pessoas com mobilidade
        reduzida e outros peões vulneráveis?
      why_open: A APCE reporta que algumas barreiras identificadas em edições
        anteriores do Acesso Universal foram posteriormente alvo de
        intervenção, mas os registos citados não mapeiam cada diagnóstico à
        intervenção correspondente nem distinguem, por localização, barreiras
        resolvidas e pendentes. Os registos citados também não caracterizam a
        consequência vivida atual pelas pessoas com mobilidade reduzida e
        outros peões vulneráveis. O registo
        da intervenção corretiva prevista para a EB1 da Azaruja é de âmbito de
        sítio e não informa esta questão ao nível da cidade; as plataformas de
        turismo acessível consultadas têm atualidade desconhecida.
      latest_result: A APCE descreveu a avaliação in loco com participação direta
        de pessoas com mobilidade reduzida, referiu que essas avaliações
        identificaram problemas nos acessos associados, entre outros fatores, à
        inclinação e à localização, e reportou que algumas barreiras
        identificadas anteriormente foram posteriormente alvo de intervenção.
        Isto não estabelece se essas intervenções corrigiram as barreiras, que
        localizações estão resolvidas ou pendentes, nem a consequência vivida
        atual.
      current_action: Não é seguro nem proporcional prosseguir observação no local sem
        uma base suficiente de acesso público e salvaguarda.
      resolution_condition: Evidência autoritativa ou proporcional — por exemplo, um
        inventário atual por localização ou uma observação do estado atual
        proporcional e executável em segurança — que estabeleça, no âmbito da
        cidade de Évora, que barreiras concretas permanecem por resolver em cada
        localização, e evidência suficientemente delimitada sobre a consequência
        vivida atual dessas barreiras para as pessoas com mobilidade reduzida e
        outros peões vulneráveis.
      evidence:
        - EVD-000112
        - EVD-000113
        - EVD-000131
  path:
    initial_signal:
      summary: O relatório setorial de mobilidade do PUE documentou, na rede pedonal
        fora do Centro Histórico, descontinuidades e infraestruturas pedonais
        subdimensionadas; à escala da cidade, documentou barreiras
        arquitetónicas e urbanísticas como um problema com impacto em grupos
        vulneráveis e registou constrangimentos de acessibilidade no terminal
        rodoviário de Évora.
      evidence:
        - EVD-000004
        - EVD-000006
    development:
      summary: O programa participativo Acesso Universal da APCE desenvolveu a
        investigação ao nível da cidade. A APCE descreve o Acesso Universal 1.3
        como continuação de edições anteriores, destinada a promover a
        participação ativa de pessoas com deficiência na melhoria da
        acessibilidade no Centro Histórico; a APCE e a Câmara Municipal de
        Évora comunicaram, em dezembro de 2025, um levantamento conjunto de
        condições de acessibilidade existentes e em falta e de possíveis
        soluções para o conjunto de equipamentos culturais municipais avaliado.
        Estes registos documentam trabalho participativo de identificação de
        barreiras e de acessibilidade; não enumeram as barreiras por
        localização nem estabelecem que tenham sido corrigidas ou que
        permaneçam presentes.
      evidence:
        - EVD-000085
        - EVD-000104
    delimitation:
      summary: A resposta institucional direta da APCE (agosto de 2026) descreveu a
        metodologia (avaliação in loco com participação direta de pessoas com
        mobilidade reduzida, em parceria com a Câmara Municipal), referiu
        problemas nos acessos associados a fatores como a inclinação e a
        localização e reportou que algumas barreiras identificadas nas edições
        1.0 e 1.1 do Acesso Universal foram posteriormente alvo de intervenção,
        sem mapeamento diagnóstico-intervenção nem discriminação, por
        localização, entre situações resolvidas e pendentes. Um programa
        distinto de acessibilidade em comércios do Centro Histórico foi
        identificado como uma segunda via de resposta existente. Os registos do
        projeto PRR da EB1 da Azaruja documentam barreiras pré-intervenção
        nesse sítio e uma intervenção corretiva prevista para 2025-2026; são de
        âmbito de sítio, não estabelecem a conclusão da intervenção nem o estado
        posterior e não são usados para estabelecer a manifestação ao nível da
        cidade nem o estado atual na cidade.
      evidence:
        - EVD-000112
        - EVD-000113
        - EVD-000114
        - EVD-000131
        - EVD-000081
        - EVD-000148
