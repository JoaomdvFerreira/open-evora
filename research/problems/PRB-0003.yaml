decision_basis:
  contract_version: "0.1"
  eligibility_basis: >-
    PRB-0003 está suficientemente documentado quanto à existência de uma
    manifestação física delimitada em partes da cidade de Évora para constituir
    um problema de investigação distinto, mas a Eligibility não é promovida:
    permanece HOLD. A manifestação ao nível da cidade assenta no diagnóstico
    institucional de planeamento do PUE (EVD-000004, EVD-000006) e no trabalho
    de avaliação in loco da APCE, que identificou fatores de barreira nos
    acessos (EVD-000113). Os registos de sítio da EB1 da Azaruja (EVD-000081,
    EVD-000148) são mantidos apenas como evidência de limite e não são usados
    como linha de corroboração dessa manifestação.

    Persistem, contudo, duas limitações distintas. Em primeiro lugar, a
    evidência mais recente não permite estabelecer quais as barreiras
    específicas que continuam hoje por corrigir em cada localização:
    EVD-000148 documenta uma resposta corretiva prevista, de âmbito de sítio,
    sem estabelecer a sua conclusão; EVD-000113 e EVD-000131 registam,
    respetivamente, fatores de barreira identificados em avaliação in loco e o
    relato de intervenção posterior sobre algumas barreiras anteriormente
    identificadas, sem mapeamento diagnóstico-intervenção ou discriminação
    completa por localização. Esta é uma limitação de atualidade e
    persistência da manifestação.

    A segunda é de consequência/percurso: os registos citados não fornecem
    evidência concreta suficiente sobre o que as pessoas com mobilidade
    reduzida e outros peões vulneráveis experienciam atualmente em resultado
    destas barreiras. Esta lacuna de consequência/percurso é a razão pela qual
    a Eligibility permanece HOLD / REVIEW_REQUIRED por MISSING_CONSEQUENCE. A
    limitação relativa à atualidade das barreiras não substitui nem explica
    esta lacuna distinta de consequência.
  corroboration_basis: >-
    A Corroboration é sustentada apenas para uma afirmação geográfica e
    temporalmente delimitada: existem barreiras pedonais e de acessibilidade
    documentadas em partes da cidade de Évora. Os registos citados não
    estabelecem prevalência à escala de toda a cidade nem que as barreiras
    identificadas historicamente permaneçam hoje nas mesmas localizações.

    O diagnóstico institucional de planeamento (EVD-000004, EVD-000006;
    SRC-0017) documenta, na rede pedonal fora do Centro Histórico,
    descontinuidades e infraestruturas pedonais subdimensionadas; à escala da
    cidade, documenta barreiras arquitetónicas e urbanísticas como um problema
    com impacto em grupos vulneráveis; e, no terminal rodoviário de Évora,
    regista constrangimentos específicos de acessibilidade. Este diagnóstico é
    histórico e não estabelece o estado das barreiras após intervenções
    posteriores.

    O programa participativo Acesso Universal da APCE acrescenta uma linha
    distinta de suporte e delimitação ao nível da cidade. EVD-000085 e
    EVD-000104 documentam um processo participativo de identificação e melhoria
    das condições de acessibilidade no Centro Histórico e um levantamento
    conjunto, comunicado em dezembro de 2025, de condições de acessibilidade
    existentes e em falta no conjunto de equipamentos culturais municipais
    avaliado. EVD-000086 documenta um estado anterior desse mesmo processo e é
    mantido como evidência de limite e de resposta existente; não acrescenta
    uma nova linha independente de corroboração.

    A resposta institucional direta da APCE de agosto de 2026 (EVD-000112,
    EVD-000113, EVD-000131; SRC-0118) é uma atualização da mesma voz
    institucional: descreve avaliações in loco, refere problemas nos acessos
    associados a fatores como a inclinação e a localização e reporta que
    algumas barreiras anteriormente identificadas foram posteriormente alvo de
    intervenção, sem mapeamento diagnóstico-intervenção nem inventário de
    situações resolvidas ou pendentes por localização.

    EVD-000081 (SRC-0068) documenta barreiras pré-intervenção num sítio
    específico, a EB1 da Azaruja. O seu âmbito de sítio impede que seja usado
    como corroboração da afirmação ao nível da cidade; é mantido apenas como
    evidência de limite, a par de EVD-000148.

    Em conjunto, as linhas ao nível da cidade sustentam a afirmação delimitada
    de que existem barreiras pedonais e de acessibilidade documentadas em
    partes da cidade de Évora. Não estabelecem prevalência à escala da cidade,
    frequência ou severidade quantificadas, persistência atual das barreiras
    historicamente documentadas, uma consequência atual plenamente
    caracterizada para as pessoas afetadas nem uma generalização causal ou
    populacional para além do âmbito destes registos.
  manifestation:
    kind: barreiras físicas de acessibilidade e infraestrutura pedonal
    summary: >-
      O diagnóstico institucional de planeamento (EVD-000004, EVD-000006 —
      Relatório Setorial do PUE: Mobilidade) documenta, na rede pedonal fora do
      Centro Histórico, descontinuidades e infraestruturas pedonais
      subdimensionadas; à escala da cidade, documenta barreiras arquitetónicas
      e urbanísticas como um problema com impacto em grupos vulneráveis; e
      regista constrangimentos específicos de acessibilidade no terminal
      rodoviário de Évora. Este diagnóstico é histórico e não estabelece que
      as barreiras descritas permaneçam inalteradas após intervenções
      posteriores.

      Segundo a APCE (EVD-000113, agosto de 2026), as suas avaliações de
      acessibilidade in loco identificaram problemas nos acessos associados,
      entre outros fatores, à inclinação e à localização; a APCE não fornece
      inventário por localização nem discriminação entre situações corrigidas
      e pendentes.

      Em conjunto, estes elementos estabelecem que as barreiras físicas
      pedonais e de acessibilidade em partes da cidade de Évora constituem uma
      manifestação documentada, e não uma suposição. Não estabelecem
      prevalência à escala da cidade, que cada barreira identificada permaneça
      hoje, nem as consequências atuais vividas pelas pessoas afetadas.
    evidence:
      - EVD-000004
      - EVD-000006
      - EVD-000113
  overlap_check:
    performed: true
    summary: >-
      A revisão de sobreposição está registada como realizada; este
      decision_basis não contém relações related_problems autoradas. Este estado
      não é usado como evidência de que não existam outros PRB canónicos com
      âmbito semelhante.
    related_problems: []
  currentness:
    assessment: >-
      O diagnóstico do PUE (EVD-000004, EVD-000006) é histórico e não
      estabelece o estado das barreiras após intervenções posteriores. A
      evidência mais recente citada provém da APCE, em agosto de 2026: descreve
      avaliações in loco com participação direta de pessoas com mobilidade
      reduzida (EVD-000112), refere que essas avaliações identificaram
      problemas nos acessos associados a fatores como a inclinação e a
      localização (EVD-000113) e reporta que algumas barreiras identificadas
      anteriormente foram posteriormente alvo de intervenção (EVD-000131).
      Estes registos não fornecem inventário atual por localização,
      discriminação entre situações resolvidas e pendentes nem datas
      suficientes para estabelecer o estado atual das barreiras, nem
      estabelecem que as intervenções as tenham corrigido.

      Os registos citados neste decision_basis não estabelecem, portanto, que
      barreiras residuais concretas permanecem hoje por resolver em cada
      localização da cidade.
    evidence:
      - EVD-000004
      - EVD-000006
      - EVD-000112
      - EVD-000113
      - EVD-000131
  contradiction_search:
    performed: true
    summary: >-
      Foi realizada uma procura delimitada de evidência que pudesse contradizer
      ou restringir a leitura corroborada, sobretudo através do contacto
      institucional direto com a APCE (EVD-000112, EVD-000113, EVD-000131).

      EVD-000131 é evidência de limite material: a APCE reporta que algumas
      barreiras identificadas nas edições 1.0 e 1.1 do Acesso Universal foram
      posteriormente alvo de intervenção. Isto impede assumir que as barreiras
      historicamente documentadas permanecem inalteradas, mas não estabelece
      resolução completa, eficácia das intervenções nem um mapa por
      localização de situações resolvidas e pendentes.

      Nos registos considerados nesta procura não foi encontrada evidência de
      que as barreiras documentadas estejam totalmente resolvidas, nem
      evidência que suporte uma afirmação mais abrangente, como prevalência à
      escala da cidade ou uma medida quantificada de severidade ou frequência.
      Nenhuma dessas afirmações é feita neste problema. Esta conclusão está
      limitada aos registos citados e não estabelece ausência de evidência
      contrária fora deles.
    evidence:
      - EVD-000112
      - EVD-000113
      - EVD-000131
  corroboration_statement: Em Évora, estão documentadas barreiras pedonais e
    de acessibilidade em partes específicas da cidade, mas a evidência
    disponível não permite estabelecer quais permanecem hoje por corrigir em
    cada localização nem caracteriza suficientemente a consequência atualmente
    vivida pela população afetada.
  supporting_evidence:
    - EVD-000004
    - EVD-000006
    - EVD-000085
    - EVD-000104
    - EVD-000112
    - EVD-000113
  boundary_evidence:
    - EVD-000081
    - EVD-000086
    - EVD-000088
    - EVD-000114
    - EVD-000131
    - EVD-000148
  independence_assessment: >-
    A independência da evidência é MÉDIA e não é reforçada pelo número de
    registos EVD, de Sources ou de linhagens.

    As linhas relevantes para a afirmação ao nível da cidade são duas: (1) o
    Relatório Setorial do PUE: Mobilidade (EVD-000004, EVD-000006; SRC-0017),
    um único documento municipal de planeamento e uma única voz institucional
    — o Município de Évora; e (2) a APCE, através do programa Acesso Universal
    (EVD-000085, SRC-0073; EVD-000104, SRC-0091; EVD-000086 apenas como
    evidência de limite) e do contacto institucional direto (EVD-000112,
    EVD-000113, EVD-000131; SRC-0118). Os registos do programa e o contacto
    direto correspondem à mesma voz institucional e são contados como uma
    única linha, não como instituições independentes.

    As duas linhas diferem na entidade e no método: diagnóstico documental de
    planeamento municipal, por um lado, e avaliação participativa in loco com
    pessoas com mobilidade reduzida, por outro. A independência entre elas é,
    porém, limitada: a APCE refere que o seu trabalho no espaço público é
    realizado em parceria com a Câmara Municipal (EVD-000112), e o levantamento
    de dezembro de 2025 foi comunicado conjuntamente pela APCE e pela Câmara
    (EVD-000104).

    O registo do projeto PRR da EB1 da Azaruja (EVD-000081, EVD-000148;
    SRC-0068) provém de uma fonte e de um processo públicos materialmente
    distintos, mas é de âmbito de sítio e, por isso, não corrobora a
    manifestação ao nível da cidade nem é contado nesta avaliação de
    independência.

    Em síntese, a avaliação assenta em duas vozes institucionais distintas,
    ligadas por uma relação de parceria, e não na existência confirmada de
    várias instituições observadoras independentes. Por essa razão, a
    independência é MÉDIA e não ALTA.
  scope:
    geography: Circunscrito a partes específicas e documentadas da cidade de
      Évora — as descrições ao nível da cidade do Relatório Setorial do PUE
      (incluindo o Centro Histórico e o terminal rodoviário), o Centro
      Histórico e o conjunto de equipamentos culturais municipais avaliado no
      âmbito do Acesso Universal, e acessos avaliados in loco pela APCE sem
      inventário por localização. Não está corroborado como uma condição
      uniforme em toda a cidade. Os registos de sítio da EB1 da Azaruja são
      mantidos apenas como evidência de limite e não integram este âmbito.
    population: Pessoas com mobilidade reduzida e outros grupos de peões
      vulneráveis. A evidência da APCE diz respeito especificamente a pessoas
      com deficiência ou mobilidade reduzida envolvidas nos seus processos
      participativos e de avaliação in loco, e não à população em geral.
    temporal: >-
      Circunscrito aos períodos documentados: o diagnóstico histórico de
      planeamento do PUE (EVD-000004, EVD-000006), os processos de
      acessibilidade do Acesso Universal 1.3 em 2025, incluindo o levantamento
      comunicado em dezembro de 2025 (EVD-000085, EVD-000104), e as respostas
      da APCE de agosto de 2026 (EVD-000112, EVD-000113, EVD-000131).

      A afirmação não se estende ao estado residual atual das barreiras em cada
      localização documentada, que não está estabelecido.
    bounded: true
  limitations: >-
    A afirmação corroborada está limitada à existência documentada de barreiras
    pedonais e de acessibilidade em partes da cidade de Évora e à existência de
    processos institucionais e participativos de identificação e planeamento da
    acessibilidade, incluindo o relato da APCE de que algumas barreiras
    anteriormente identificadas foram posteriormente alvo de intervenção.

    Os registos citados não sustentam uma afirmação de prevalência à escala da
    cidade, uma medida quantificada de frequência ou severidade, a conclusão de
    que todas as barreiras identificadas historicamente permanecem hoje
    inalteradas em cada localização, nem a conclusão de que uma intervenção
    reportada ou prevista equivale a correção concluída ou eficaz.

    Limite geográfico: EVD-000081 e EVD-000148 são registos de sítio da EB1 da
    Azaruja — barreiras pré-intervenção e uma intervenção corretiva prevista
    para 2025-2026 — e não são usados para corroborar a manifestação ao nível
    da cidade nem para estabelecer o estado atual na cidade. EVD-000148 não
    estabelece a conclusão da obra nem o estado após a intervenção.

    EVD-000088 é mantida apenas como evidência de limite relativa a
    plataformas de turismo acessível cuja atualidade não está estabelecida.
    EVD-000086 documenta um estado anterior do processo Acesso Universal 1.3 e
    é delimitada pelo levantamento comunicado em EVD-000104. EVD-000114
    documenta uma resposta existente de acessibilidade em estabelecimentos
    comerciais do Centro Histórico, não a persistência atual de barreiras
    específicas. EVD-000131 documenta o relato de intervenção posterior sobre
    algumas barreiras, sem mapeamento por localização nem discriminação entre
    situações resolvidas e pendentes.

    Mantêm-se duas lacunas distintas. A primeira é de atualidade e
    persistência: os registos citados não incluem um inventário atual, ao nível
    da localização, que determine quais das barreiras documentadas permanecem
    por corrigir. Esta lacuna limita a Corroboration quanto ao estado presente.
    A segunda é de consequência/percurso: os registos citados não fornecem
    evidência concreta suficiente sobre o que as pessoas com mobilidade
    reduzida e outros peões vulneráveis experienciam atualmente em resultado
    dessas barreiras. Esta segunda lacuna é a razão pela qual a Eligibility
    permanece REVIEW_REQUIRED por MISSING_CONSEQUENCE. Uma lacuna não deve ser
    usada para explicar a outra.
