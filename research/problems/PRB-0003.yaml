    summary: Na resposta ao desafio institucional, a APCE descreveu avaliações in loco e fatores concretos de barreira e reportou que algumas barreiras anteriormente identificadas foram posteriormente alvo de intervenção, sem estabelecer se essas intervenções as corrigiram integralmente, que localizações estão resolvidas ou pendentes, nem a consequência vivida atual; a investigação passa a aguardar um inventário atual ou uma observação seguramente executável.
