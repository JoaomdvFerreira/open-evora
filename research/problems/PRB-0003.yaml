problem_id: PRB-0003
created_at: "2026-08-28"
updated_at: "2026-10-14"
title: Barreiras pedonais e de acessibilidade em diferentes locais da cidade de Évora
domain:
  - ACC
  - MOB
  - URB
geography:
  level: city
  area: Évora
affected_populations:
  - pessoas com mobilidade reduzida
  - pessoas com deficiência
  - pessoas idosas
  - crianças
  - pessoas que utilizam carrinhos de bebé
problem_statement: O diagnóstico do Plano de Urbanização de Évora (PUE) documenta, na cidade de Évora,
  descontinuidades e infraestruturas pedonais subdimensionadas fora do Centro
  Histórico e dificuldades de acesso no Terminal
  Rodoviário de Évora. A APCE identificou problemas nos acessos avaliados; a
  APCE e a Câmara Municipal identificaram condições de acessibilidade em falta
  em equipamentos culturais municipais avaliados.
  A informação reunida não estabelece, local a local, o que foi corrigido e o que permanece, nem caracteriza suficientemente as consequências
  atuais para as pessoas afetadas.
investigation:
  open_questions:
    - question: Que intervenções, se as houve, incidiram sobre as descontinuidades
        e infraestruturas pedonais subdimensionadas documentadas pelo PUE fora do
        Centro Histórico, que barreiras e locais abrangeram e qual é o estado
        atual de cada local?
      why_open: O diagnóstico não data essas observações nem estabelece o estado
        atual ou se houve intervenções posteriores. O levantamento atualizado de
        obstáculos e a revisão do plano local de acessibilidade de 2022 foram recomendados, mas a informação reunida não indica os seus resultados.
      latest_result: O PUE documenta descontinuidades e subdimensionamento fora
        do Centro Histórico. O Plano de Desenvolvimento Social 2024-2027 propõe
        um levantamento atualizado; o plano de mobilidade recomenda rever o
        plano local de acessibilidade para acompanhar a implementação e incluir
        outras centralidades. Estes registos não indicam se houve intervenções
        sobre as barreiras documentadas, nem o seu estado atual por localização.
      current_action: >-
        O pedido documental único ao Município de Évora está
        preparado, mas não enviado. Esta questão integra a componente 1:
        revisão do plano local de acessibilidade, levantamento atualizado de
        obstáculos, intervenções e estado por localização.
      resolution_condition: Documentação municipal que estabeleça se houve
        intervenções, quais obstáculos e locais abrangeram caso tenham ocorrido,
        e o estado atual de cada local relevante, distinguindo correção
        confirmada de situação ainda pendente.
      evidence:
        - EVD-000004
        - EVD-000009
        - EVD-000112
    - question: Foram executadas medidas para melhorar o acesso ao Terminal
        Rodoviário e a ligação à Praça do Giraldo, e que constrangimentos
        identificados persistem nesses percursos?
      why_open: O PUE documenta dificuldades de acesso ao Terminal Rodoviário e
        ligações pedonais deficientes ou degradadas. A melhoria do acesso entre
        o Terminal e a Praça do Giraldo é uma medida proposta, sem resultado ou estado atual estabelecido na informação reunida.
      latest_result: O diagnóstico do PUE refere constrangimentos para pessoas
        com mobilidade reduzida no Terminal e ligações pedonais deficientes ou
        degradadas. O Plano de Desenvolvimento Social 2024-2027 preconiza a
        melhoria da ligação à Praça do Giraldo; não confirma execução ou
        correção dos constrangimentos.
      current_action: >-
        O mesmo pedido municipal, preparado mas não enviado,
        inclui a componente 2: estado da medida Terminal Rodoviário–Praça do
        Giraldo, intervenções no Terminal e na ligação pedonal e resultados por percurso.
      resolution_condition: Registos de execução e avaliação que relacionem os
        constrangimentos identificados com intervenções e estabeleçam quais
        foram corrigidos e quais permanecem no Terminal e na ligação indicada.
      evidence:
        - EVD-000006
        - EVD-000009
        - EVD-000112
    - question: Quais barreiras identificadas nas edições 1.0 e 1.1 do Acesso
        Universal foram objeto de intervenção e qual é o seu estado em cada
        localização?
      why_open: A APCE relatou intervenções posteriores sobre algumas barreiras,
        sem relacionar cada diagnóstico com a intervenção correspondente, indicar
        as datas necessárias ou distinguir correções confirmadas de situações
        pendentes por localização.
      latest_result: A APCE descreveu avaliações no local com participação de
        pessoas com mobilidade reduzida e problemas nos acessos associados,
        entre outros fatores, à inclinação e à localização. Em agosto de 2026,
        relatou que algumas barreiras das edições 1.0 e 1.1 foram posteriormente
        alvo de intervenção; não confirmou que tivessem sido corrigidas.
      current_action: >-
        O pedido único à APCE está preparado, mas não enviado.
        Esta questão integra a componente 1: relação entre diagnósticos das
        edições 1.0 e 1.1, intervenções conhecidas e resultados por local.
        O pedido municipal inclui a componente 3: confirmação documental das
        intervenções no espaço público da competência do Município.
      resolution_condition: Correspondência por localização entre barreiras
        identificadas e intervenções, acompanhada de informação que distinga
        intervenção reportada, correção confirmada e barreira ainda presente.
      evidence:
        - EVD-000112
        - EVD-000113
        - EVD-000131
    - question: Que condições de acessibilidade em falta foram identificadas
        nos equipamentos culturais municipais avaliados e qual é o seu estado
        em cada equipamento?
      why_open: O levantamento conjunto comunicado em dezembro de 2025 não
        enumera no texto público os equipamentos e défices específicos; também
        não estabelece que medidas foram aplicadas ou quais condições em falta
        permanecem.
      latest_result: A APCE comunicou em outubro de 2025 a verificação em curso.
        A APCE e a Câmara Municipal comunicaram em dezembro um levantamento
        conjunto de condições existentes, condições em falta e possíveis
        soluções para os equipamentos avaliados. A conclusão do levantamento
        não confirma a execução dessas soluções.
      current_action: >-
        O pedido municipal, preparado mas não enviado, inclui a
        componente 4: levantamento de dezembro de 2025, medidas executadas e
        estado atual por equipamento.
      resolution_condition: Levantamento detalhado e documentação posterior que
        permitam identificar, para cada equipamento avaliado, as condições em
        falta, as intervenções e o que está corrigido ou continua pendente.
      evidence:
        - EVD-000086
        - EVD-000104
    - question: Que dificuldades concretas enfrentam atualmente as pessoas nos
        locais ou percursos da cidade de Évora onde se confirmar a presença de
        barreiras?
      why_open: O PUE refere impacto no quotidiano de grupos vulneráveis e a
        APCE parte das dificuldades relatadas por pessoas com mobilidade
        reduzida, mas a informação reunida não caracteriza suficientemente uma consequência atual por local ou percurso.
      latest_result: Há indicação de impacto e um método participativo assente
        em dificuldades vividas; falta relacionar situações ainda presentes com
        dificuldades atuais específicas das pessoas afetadas.
      current_action: >-
        A clarificação documental dos locais com barreiras ainda
        presentes está pendente. O pedido único à APCE, preparado mas não enviado,
        inclui a componente 2, condicionada a essa clarificação: dificuldades
        atuais conhecidas nos percursos identificados.
      resolution_condition: Informação delimitada por local ou percurso que
        relacione barreiras atualmente confirmadas com dificuldades atuais
        concretas das pessoas afetadas, sem presumir que diagnósticos antigos
        descrevem a experiência presente.
      evidence:
        - EVD-000004
        - EVD-000112
  path:
    initial_signal:
      summary: O relatório setorial de mobilidade do Plano de Urbanização de Évora
        (PUE), publicado em 2025, apresenta um diagnóstico cuja data não está estabelecida na informação reunida. Descreve
        descontinuidades e infraestruturas pedonais subdimensionadas fora do
        Centro Histórico; identifica barreiras arquitetónicas e urbanísticas
        com impacto no quotidiano de grupos vulneráveis à escala da cidade; e
        refere constrangimentos para pessoas com mobilidade reduzida e ligações
        pedonais deficientes ou degradadas no Terminal Rodoviário de Évora.
      evidence:
        - EVD-000004
        - EVD-000006
    development:
      summary: A investigação do Open Évora incorporou o trabalho participativo
        Acesso Universal da APCE no Centro Histórico. Em outubro de 2025, a
        APCE verificava equipamentos culturais municipais; em dezembro, a APCE
        e a Câmara comunicaram um levantamento conjunto, sem discriminar no
        texto público os défices por equipamento. Em agosto de 2026, a APCE
        descreveu avaliações no local e problemas nos acessos, sem inventário
        atualizado por localização. O planeamento municipal recomendou rever
        o plano local de acessibilidade, atualizar o levantamento de obstáculos
        e melhorar a ligação Terminal–Praça do Giraldo. Em maio de 2026, a Évora 2027 — Capital Europeia da Cultura comunicou o desenvolvimento de um plano de acessibilidade
        cultural com a Acesso Cultura; a sua conclusão não está estabelecida.
      evidence:
        - EVD-000009
        - EVD-000085
        - EVD-000086
        - EVD-000087
        - EVD-000104
        - EVD-000112
        - EVD-000113
    delimitation:
      summary: Em agosto de 2026, a APCE relatou que algumas barreiras das
        edições 1.0 e 1.1 do Acesso Universal foram posteriormente alvo de
        intervenção, sem relacionar diagnósticos e intervenções por local nem
        confirmar as correções. A APCE também descreveu um programa continuado
        de acessibilidade em estabelecimentos comerciais do Centro Histórico,
        iniciado com a Associação Comercial e depois continuado com o NERE;
        cerca de 30 estabelecimentos foram avaliados na versão 1.2, com
        participação adicional na 1.3. Isso não mede a prevalência de barreiras
        nem a eficácia do programa. As plataformas de turismo acessível
        descrevem outras barreiras em Évora, mas não indicam quando foram
        verificadas; não permitem afirmar que persistem hoje. Este problema trata de barreiras e condições pedonais; as velocidades dos veículos, o tráfego motorizado e a segurança rodoviária são tratados no problema sobre tráfego e segurança rodoviária, uma fronteira
        temática sem sobreposição forte estabelecida.
      evidence:
        - EVD-000131
        - EVD-000114
        - EVD-000088
