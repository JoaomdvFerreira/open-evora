problem_id: PRB-0003
title: Barreiras pedonais e de acessibilidade em partes de Évora, com
  persistência atual ainda por validar
domain:
  - ACC
  - MOB
  - URB
geography:
  level: city
  area: Évora
affected_populations:
  - pessoas com mobilidade reduzida
  - outros grupos de peões vulneráveis
problem_statement: Em Évora, estão documentadas barreiras pedonais e de
  acessibilidade e existe um programa estabelecido de planeamento da
  acessibilidade, mas as intervenções físicas em curso e os testes de percursos
  experimentais de 2026 exigem validar, face às condições vividas atuais, quais
  são exatamente as barreiras que ainda persistem.
causal_reading: "Esta é uma interpretação não validada: as barreiras apontam
  sobretudo para infraestrutura física; a informação/coordenação digital é lida
  como secundária e contingente, dependente de evidência futura que a
  estabeleça."
investigation:
  open_questions:
    - question: Quais as barreiras concretas que persistem hoje, a nível de
        localização, face às intervenções físicas em curso e à correção parcial
        já reportada?
      why_open: A APCE confirma que apenas algumas barreiras identificadas foram
        corrigidas, sem fornecer um inventário ao nível da localização; o
        projeto corretivo da EB1 Azaruja é recente (2025-2026) e o seu estado
        pós-intervenção não foi verificado; as plataformas de turismo acessível
        têm atualidade desconhecida.
      current_action: Testes de percursos experimentais de 2026 (4ª revisão do PUE)
        convidam o público a testar fisicamente percursos pedonais/de mobilidade
        suave e contribuir perceções sobre inclusão e acessibilidade.
      resolution_condition: Um inventário de barreiras ao nível da localização/atual
        que estabeleça quais as barreiras concretas que persistem hoje.
      evidence:
        - EVD-000029
        - EVD-000112
        - EVD-000113
        - EVD-000148
  path:
    initial_signal:
      summary: O relatório setorial de mobilidade do PUE documentou descontinuidade da
        infraestrutura pedonal, infraestrutura pedonal subdimensionada e
        numerosas barreiras arquitetónicas/urbanísticas na cidade, incluindo
        constrangimentos de acessibilidade em terminais/estação de autocarros.
      evidence:
        - EVD-000004
        - EVD-000006
    development:
      summary: Um registo de projeto PRR confirmou um conjunto concreto de barreiras
        pré-intervenção numa localização específica (EB1 Azaruja), corroborando
        que o diagnóstico documental teve manifestações locais concretas. O
        programa participativo Acesso Universal 1.3 da APCE documentou um
        processo ativo de identificação e melhoria de barreiras no Centro
        Histórico com participação direta de pessoas com deficiência, culminando
        num inventário conjunto concluído em dezembro de 2025 para equipamentos
        culturais municipais.
      evidence:
        - EVD-000081
        - EVD-000085
        - EVD-000104
    delimitation:
      summary: A resposta institucional direta da APCE (agosto de 2026) confirmou a
        metodologia (avaliação in-loco com participação direta de pessoas com
        mobilidade reduzida) e nomeou fatores de barreira (inclinação,
        localização) em acessos, com correção parcial já realizada mas sem
        inventário ao nível da localização. Um programa distinto de
        acessibilidade em comércios do Centro Histórico foi identificado como
        uma segunda via de solução existente.
      evidence:
        - EVD-000112
        - EVD-000113
        - EVD-000114
