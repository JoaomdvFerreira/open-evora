decision_basis:
  contract_version: "0.1"

  eligibility_basis: "PRB-0003 is sufficiently documented as a real, bounded manifestation to be a distinct problem of investigation, but Eligibility is NOT asserted as PASS: it remains HOLD. Pedestrian/accessibility barriers are documented across materially distinct sources — institutional planning diagnosis (EVD-000004, EVD-000006), a concrete confirmed pre-intervention barrier set at EB1 Azaruja (EVD-000081), and APCE's in-loco assessment work naming barrier factors in accesses (EVD-000113) — so the existence of a bounded physical-accessibility manifestation is not the open question. What remains unresolved, and is the specific reason Eligibility stays HOLD, is that current/boundary evidence (EVD-000081's own current/recent corrective-project status; EVD-000112/EVD-000113's confirmation that only some identified problems have been corrected, without a location-level completed/outstanding breakdown; EVD-000029's 2026 Experimental Actions explicitly treating present-day conditions as requiring contemporary lived testing rather than settled documentary fact) means present-day persistence of specific barriers at exact locations is not established. No concrete, resident-facing consequence or journey evidence — what affected residents actually experience as a result of these barriers today — is characterized on record; ASM-0003 records journey_understanding and remaining_gap_supported as PARTIAL and digital_causality as FAIL for exactly this reason. This basis records why the manifestation side of Eligibility is documented, not why Eligibility should be promoted."

  corroboration_basis: "Corroboration is SUPPORTED only for a geographically/temporally bounded claim: pedestrian/accessibility barriers are documented in parts of Évora, not that they currently persist everywhere identified historically and not at municipality-wide prevalence. Institutional planning diagnosis (EVD-000004, EVD-000006 — PUE Sector Report: Mobilidade, SRC-0017) documents pedestrian-infrastructure discontinuity, undersized pedestrian infrastructure, and numerous architectural/urbanistic barriers across the city, plus specific terminal/bus-station accessibility constraints. A materially distinct primary source (EVD-000081 — PRR project record, SRC-0068) confirms a concrete, factual pre-intervention barrier set at EB1 Azaruja (narrow pavement, five steps, non-compliant vehicle-gate access), corroborating that the planning-document diagnosis has had at least one concrete local manifestation, not only institutional description. The Acesso Universal 1.3 participatory programme (EVD-000085, CONFIRMS + REFINES participatory evidence, and EVD-000104, the stronger completed-inventory CONFIRMS/current-state record that supersedes EVD-000086's earlier 'verification continuing' claim — one shared lineage, APCE/SRC-0073/SRC-0091) documents an active, affected-user-participatory barrier-identification and improvement process in the Historic Centre, culminating in a December 2025 completed joint accessibility inventory (present/missing conditions and possible improvements) for municipal cultural facilities. EVD-000086 itself is retained only as boundary/current-state evidence (its own canonical contribution is CURRENT-STATE-UPDATE + EXISTING-SOLUTION, superseded in substance by EVD-000104) and is not counted as adding independent corroborative weight. APCE's direct D5 institutional response (EVD-000112, EVD-000113 — D5-ENG-OP-003) adds a materially distinct engagement confirming, as of August 2026, that in-loco accessibility assessments identified barrier factors (inclination, location) in accesses and that some identified problems were corrected — without a location-level inventory or a completed/outstanding breakdown. Together these converge on the bounded claim that pedestrian/accessibility barriers are documented, with concrete confirmed instances, in specific parts of Évora (EB1 Azaruja; Historic Centre; municipal cultural facilities; general city-level planning diagnosis). This basis does NOT establish municipality-wide prevalence, quantified frequency or severity, that barriers identified historically still persist today at every documented location, a fully characterized resident journey/consequence, or any causal/population-scale generalization — those remain open, per ASM-0003's PARTIAL journey_understanding/remaining_gap_supported and DEEPEN triage."

  manifestation:
    kind: "physical accessibility / pedestrian-infrastructure barrier"
    summary: "Institutional planning diagnosis (EVD-000004, EVD-000006 — PUE Sector Report: Mobilidade) documents pedestrian-infrastructure discontinuity, undersized pedestrian infrastructure, numerous architectural/urbanistic barriers across the city, and specific terminal/bus-station accessibility constraints for people with reduced mobility. A materially distinct primary source (EVD-000081 — PRR project record for EB1 Azaruja) confirms a concrete, factual pre-intervention barrier set at one specific location: a narrow pavement, five steps at the main pedestrian entrance, and a non-compliant vehicle-gate access. APCE's direct D5 institutional response (EVD-000113) further names barrier factors — inclination and location — identified in accesses through its in-loco assessment work. Together these establish that physical pedestrian/accessibility barriers are a documented, concrete manifestation, not an assumption; they do not by themselves establish current resident-facing consequence (see consequence, deliberately omitted below) or an exhaustive present-day location inventory."
    evidence:
      - "EVD-000004"
      - "EVD-000006"
      - "EVD-000081"
      - "EVD-000113"

  overlap_check:
    performed: true
    summary: "No other canonical PRB-* addresses pedestrian/accessibility barriers in Évora; PRB-0003 does not duplicate or overlap another record. This reflects the existing canonical corpus structure (no other PRB-* record shares this domain/claim) rather than a new assessment performed for this decision_basis."
    related_problems: []

  currentness:
    assessment: "MEDIUM, echoing ASM-0003 evidence_confidence.currentness. EVD-000004/EVD-000006 (February 2025 PUE Sector Report) and EVD-000081's underlying pre-intervention barrier description are HISTORICAL relative to August 2026, and EVD-000081's own corrective project is itself current/recent (2025-2026), so its pre-intervention barrier description must not be read as necessarily still true today without the current-state check the record itself calls for. The most current evidence on record is APCE's direct August 2026 response (EVD-000112, EVD-000113): it confirms barrier factors are still being identified in in-loco assessments and that some corrections have occurred, but provides no location-level inventory of which specific barriers remain uncorrected as of August 2026. No dataset or record establishes an exhaustive present-day barrier state for the whole claim scope."
    evidence:
      - "EVD-000081"
      - "EVD-000112"
      - "EVD-000113"

  contradiction_search:
    performed: true
    summary: "A deliberate search for evidence that would contradict or narrow the corroboration claim was performed, most materially through direct D5 institutional engagement with APCE (EVD-000112, EVD-000113) and by explicitly checking whether EVD-000081's pre-intervention barrier description should be read as a current fact. Neither search surfaced evidence that the documented barriers are now fully resolved: APCE's own response describes only partial, non-location-level correction, and no record establishes that the EB1 Azaruja corrective project's post-intervention state has been verified. The search also did not surface evidence supporting a stronger claim (e.g. municipality-wide prevalence or a quantified severity/frequency); no such claim is made in this basis."
    evidence:
      - "EVD-000112"
      - "EVD-000113"

  corroboration_statement: "Em Évora, estão documentadas barreiras pedonais e de acessibilidade e existe um programa estabelecido de planeamento da acessibilidade, mas as intervenções físicas em curso e os testes de percursos experimentais de 2026 exigem validar, face às condições vividas atuais, quais são exatamente as barreiras que ainda persistem."

