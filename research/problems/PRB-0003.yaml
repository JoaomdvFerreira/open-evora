  independence_assessment: "Independence is MEDIUM, echoing ASM-0003 evidence_confidence.independence, not artificially strengthened by raw EVD count. Materially distinct lineages/source threads are on record: (1) MOB-2025-02-PUE-MOBILIDADE-SECTOR-REPORT (EVD-000004, EVD-000006; SRC-0017, one municipal planning document, one institutional voice — Município de Évora); (2) the standalone PRR EB1 Azaruja project record (EVD-000081; SRC-0068, published through República Portuguesa — PRR Transparência), a materially distinct authoritative public source/thread from the Município's own planning-document family, providing strong factual corroboration of one concrete pre-intervention barrier set at one location; (3) ACC-2025-APCE-ACESSO-UNIVERSAL-1.3 (EVD-000085 and EVD-000104 as supporting evidence, EVD-000086 retained only as boundary/superseded evidence; SRC-0073/SRC-0091, one APCE programme, treated as a single evidentiary thread per ASM-0003's WU018 correction, not multiple independent threads); (4) D5-ENG-OP-003 (EVD-000112, EVD-000113; one direct APCE engagement, the same institutional voice as lineage (3) and therefore not counted as adding a further independent institution beyond it, only as a more current instance of the same voice). Lineage (2) is a materially distinct source/thread from lineage (1) by publisher and source_id, and this distinctness is why it strengthens the bounded claim beyond planning-document characterization alone with concrete, verified factual detail — but distinct source_id/publisher/thread is not itself translated into a proven independently observing institution: the corpus does not establish that the PRR Transparência channel is an independent institution assessing the barrier on its own initiative, as opposed to the authoritative publication surface for the underlying project's own information. This does not reduce EVD-000081's own evidentiary strength — it remains primary-authoritative factual corroboration of the bounded concrete barrier instance it documents — it only means lineage (2) is not counted as a confirmed second fully independent institutional voice on top of lineage (1). Lineages (3) and (4) both trace to APCE and are treated as one institutional voice across both lineages, not two. Net: this basis rests on materially distinct source threads (Município/PUE planning; the PRR project record; APCE), which is a weaker basis than confirmed independent institutions and is why independence remains MEDIUM rather than HIGH, consistent with ASM-0003's rating."

  scope:
    geography: "Bounded to specific documented parts of Évora: the Historic Centre and municipal cultural facilities (Acesso Universal 1.3 lineage), EB1 Azaruja parish-level premises (PRR record), and general city-level planning-diagnosis descriptions (PUE Sector Report). Not corroborated as a uniform, municipality-wide condition."
    population: "people with reduced mobility and other vulnerable pedestrian groups, consistent with PRB-0003.affected_populations; APCE's evidence specifically concerns people with disabilities/reduced mobility engaging its participatory and in-loco assessment processes, not the general population."
    temporal: "Bounded to the periods documented on record: February 2025 planning diagnosis (EVD-000004, EVD-000006), the 2025-2026 EB1 Azaruja pre-intervention/corrective-project window (EVD-000081), the 2025 Acesso Universal 1.3 programme through its December 2025 completed inventory (EVD-000085, EVD-000104), and the August 2026 direct APCE engagement (EVD-000112, EVD-000113). The claim does not extend to, and is not corroborated for, a fully verified August 2026 barrier state at every documented location."
    bounded: true

  limitations: "The corroborated claim is SUPPORTED only as follows: pedestrian/accessibility barriers are documented, with at least one concrete confirmed local manifestation, in specific parts of Évora (EB1 Azaruja; Historic Centre; municipal cultural facilities; general city-level planning diagnosis), and an active institutional/participatory process continues to identify and partially correct such barriers as of August 2026. It is NOT SUPPORTED as: a municipality-wide prevalence claim; a quantified frequency or severity measure; a claim that barriers documented historically (e.g. EVD-000004/EVD-000006's 2025 diagnosis, or EVD-000081's pre-intervention description) still persist unchanged today at every identified location; a fully characterized resident journey or concrete population-scale consequence sufficient for the promotion gate — that characterization remains open per ASM-0003 (journey_understanding: PARTIAL, remaining_gap_supported: PARTIAL, digital_causality: FAIL, triage: DEEPEN); or any causal or population-scale generalization beyond the bounded evidence cited above. EVD-000088 (accessible-tourism platform descriptions) is retained only as a boundary/possible-current-state lead — its freshness is explicitly UNKNOWN and it is not used as supporting evidence. EVD-000086 (APCE's earlier 'verification continuing' claim, superseded in substance by EVD-000104's completed inventory), EVD-000114 and EVD-000131 (shop-accessibility seal programme), and EVD-000029 (2026 Experimental Actions) are retained as boundary/existing-solution/current-state-update evidence, not as confirmation of specific present-day barriers and not counted as adding corroborative weight. Two distinct open gaps exist and must not be conflated: (1) no location-level, present-day inventory of which specific documented barriers remain uncorrected was located — this limits currentness and any claim about which barriers presently persist, and is the reason this Corroboration basis is bounded rather than a claim of current universal persistence; (2) no concrete, resident-facing consequence or journey evidence — what affected residents actually experience as a result of these barriers — is characterized on record, which is the actual, separate reason Eligibility remains REVIEW_REQUIRED / MISSING_CONSEQUENCE. Gap (1) does not cause or explain gap (2): the absence of a present-day location-level barrier inventory is a currentness/persistence limitation on the Corroboration claim, not the reason consequence/journey evidence is missing from the Eligibility basis."
