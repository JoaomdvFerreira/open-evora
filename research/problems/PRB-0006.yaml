evidence_status: corroborated
validation_status: unvalidated
digital_tractability: not_assessed
solution_landscape_status: not_assessed
status: OPEN
history:
  - date: 2026-08-31
    summary: A resposta institucional dos SASUÉ descreveu um processo de candidatura em linha estruturado, que consideram plenamente operacional, e restringiu a hipótese de falha no processo institucional; a usabilidade, clareza, acessibilidade e experiência de espera dos estudantes mantêm-se por estabelecer.
    state_changes:
      validation_status:
        from: unvalidated
        to: partially_validated
  - date: 2026-10-12
    summary: O Problema foi corrigido para representar o financiamento aprovado comunicado pela Universidade de Évora em 2022 para 105 camas adicionais de alojamento estudantil, sem estabelecer entrega, entrada em operação ou efeito na procura não satisfeita.
  - date: 2026-10-12
    summary: >-
      O anterior problema misto foi dividido: PRB-0006 passou a centrar-se no
      alojamento estudantil e a habitação municipal mais ampla passou para
      PRB-0013. A hipótese de navegação digital saiu do problema atual. A
      validação foi reposta porque o desafio anterior incidiu no processo de
      candidatura, e não na capacidade ou procura não satisfeita.
    state_changes:
      validation_status:
        from: partially_validated
        to: unvalidated
  - date: 2026-10-13
    summary: >-
      O proprietário fixou o âmbito na cidade de Évora; o planeamento municipal
      mais amplo passou a contexto e foi retirada imprensa secundária que não
      era necessária à formulação do alojamento estudantil na cidade.
decision_basis:
  contract_version: "0.1"
  eligibility_basis: >-
    O problema diz respeito aos estudantes que procuram alojamento na cidade de Évora,
    particularmente aos lugares nas residências da Universidade de Évora e à
    procura que essas residências não consigam satisfazer. O planeamento
    identifica escassez específica na cidade (EVD-000033), e a informação da
    Universidade e dos SASUÉ documenta capacidade nominal, encerramentos
    temporários e encaminhamento para alternativas (EVD-000043). A delimitação
    distingue este problema da habitação municipal geral em PRB-0013. Não
    pressupõe uma solução digital nem quantifica a procura atual não satisfeita.
    EVD-000031 é contexto de planeamento municipal, não prova direta da cidade.
  corroboration_basis: >-
    EVD-000033 sustenta que o planeamento de 2023–2025 relativo à cidade reconheceu
    escassez de alojamento estudantil. EVD-000031 pertence a planeamento
    municipal mais amplo e não é contado como prova direta da cidade nem como
    voz independente. EVD-000043 acrescenta
    uma linha institucional materialmente distinta, da Universidade de Évora e
    dos SASUÉ: 525 lugares nominais em sete residências, encerramentos
    temporários em 2025/2026 e encaminhamento para alternativas quando a
    disponibilidade é limitada. Em conjunto, estas linhas
    sustentam a leitura delimitada de escassez identificada no planeamento e
    constrangimentos documentados nas residências, não a magnitude ou
    persistência atual da procura não satisfeita. Planos, financiamento e
    publicações sobre obras não são usados para provar a manifestação.
  manifestation:
    kind: escassez identificada de alojamento estudantil e disponibilidade limitada de residências
    summary: >-
      O planeamento de 2023–2025 identifica escassez de alojamento estudantil e
      insuficiência da capacidade das residências face à procura de estudantes
      (EVD-000033). A Universidade e os SASUÉ documentam
      encerramentos temporários para obras em 2025/2026 e disponibilidade
      limitada que pode levar ao encaminhamento para alternativas (EVD-000043).
    evidence: [EVD-000033, EVD-000043]
  consequence:
    summary: >-
      As residências temporariamente encerradas ficam indisponíveis durante as
      obras e a Universidade encaminha estudantes para alojamento privado ou
      alternativo quando os lugares são limitados (EVD-000043). Estes registos
      não demonstram consequências individuais ou académicas determinadas.
    evidence: [EVD-000043]
  currentness:
    assessment: >-
      EVD-000043 abrange a capacidade nominal e os encerramentos de 2025/2026.
      EVD-000100 confirma apenas uma publicação de maio de 2026 sobre a
      reabilitação da Residência Manuel Álvares, não a conclusão ou reabertura.
      EVD-000126 regista em agosto de 2026 que os SASUÉ dizem ter agregados
      operacionais, mas não os seus valores. EVD-000145 regista financiamento
      aprovado em 2022, não camas entregues. O estado efetivo
      atual das residências e a procura não satisfeita permanecem por confirmar.
    evidence: [EVD-000043, EVD-000100, EVD-000126, EVD-000145]
  contradiction_search:
    performed: false
    summary: >-
      O desafio institucional anterior examinou a hipótese de falha no processo
      de candidatura, entretanto retirada. Não constituiu um teste direto da
      atual leitura sobre capacidade e procura não satisfeita. A informação
      sobre encerramentos, alternativas e intervenções delimita essa leitura.
      Não foi realizada uma procura de contradições ou um desafio direto
      para esta formulação.
    evidence: []
  overlap_check:
    performed: true
    summary: >-
      PRB-0006 abrange alojamento estudantil, capacidade das residências da
      Universidade de Évora e procura não satisfeita. PRB-0013 abrange
      habitação a preços comportáveis, social e a custos controlados e a
      intervenção municipal geral. A relação é de delimitação temática,
      sem duplicar a investigação da oferta residencial universitária.
    related_problems: [PRB-0013]
  corroboration_statement: >-
    O planeamento de 2023–2025 identifica escassez de alojamento estudantil em
    Évora; a Universidade e os SASUÉ documentam 525 lugares nominais em sete
    residências, encerramentos temporários em 2025/2026 e encaminhamento para
    alternativas quando os lugares são limitados. A magnitude e a persistência
    atual da procura não satisfeita não estão estabelecidas.
  supporting_evidence: [EVD-000033, EVD-000043]
  boundary_evidence: [EVD-000031, EVD-000032, EVD-000145, EVD-000100, EVD-000126]
  independence_assessment: >-
    EVD-000031 é planeamento municipal mais amplo e partilha o ecossistema de
    fontes de EVD-000033; não é prova direta da cidade nem uma voz independente.
    EVD-000043 provém da Universidade de Évora e dos SASUÉ, uma instituição
    materialmente distinta da família de planeamento municipal, embora a sua
    comunicação também não quantifique a procura não satisfeita. EVD-000126
    é outra comunicação dos SASUÉ, não uma voz
    independente de EVD-000043 nem prova da magnitude da escassez.
  scope:
    geography: >-
      Cidade de Évora. EVD-000033 especifica a cidade e o Centro Histórico;
      EVD-000043, EVD-000145 e EVD-000126 têm âmbito de cidade; EVD-000100
      diz respeito a uma residência concreta. EVD-000031 e EVD-000032 têm
      âmbito municipal e permanecem apenas como contexto de planeamento e
      resposta prevista, sem serem tratados como prova da cidade.
    population: >-
      Estudantes que procuram alojamento na cidade de Évora, em especial candidatos às
      residências da Universidade de Évora. Os dados sobre candidaturas dizem
      respeito apenas a esses candidatos; a evidência não é generalizada aos
      restantes residentes.
    temporal: >-
      Financiamento aprovado em 2022; planeamento em 2023–2025; residências e
      obras em 2025/2026; publicação e declaração dos SASUÉ em 2026. Não se
      infere capacidade efetiva ou procura não satisfeita posterior a
      estes registos.
    bounded: true
  limitations: >-
    Não há magnitude quantificada da procura atual não satisfeita. Os 525
    lugares nominais não equivalem à capacidade efetivamente disponível. A
    aprovação de financiamento para 105 camas não prova a sua entrega ou
    operação. A publicação sobre a Residência Manuel Álvares não prova
    conclusão, reabertura ou capacidade final. O planeamento municipal não
    quantifica a manifestação na cidade. Não há afirmação causal validada sobre
    o processo de candidatura. EVD-000126 confirma apenas que os SASUÉ dizem
    possuir agregados operacionais, sem fornecer valores ou definições.
