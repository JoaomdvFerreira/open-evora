problem_id: PRB-0006
title: "O acesso a habitação adequada e a preços comportáveis é difícil para alguns grupos populacionais"
domain:
  - "HOU"
  - "SOC"
  - "EDU"
geography:
  level: municipality
  area: "Município de Évora"
affected_populations:
  - "residents seeking adequate/affordable housing"
  - "students"
problem_statement: "Os documentos de planeamento institucional identificam preços elevados de compra e arrendamento, uma oferta insuficiente de habitação a preços comportáveis, social e a custos controlados, degradação habitacional e uma escassez específica de alojamento estudantil, reconhecendo simultaneamente que já estão em curso ações de reabilitação habitacional, construção a custos controlados, reabilitação destinada ao arrendamento apoiado e medidas de alojamento estudantil."
causal_reading: "A causa dominante é sobretudo de oferta física/económica e de comportabilidade (preços, oferta insuficiente de habitação a preços comportáveis, degradação habitacional), pelo que a alavancagem de uma intervenção digital sobre esta causa dominante é provavelmente secundária. Esta leitura não está validada."
investigation:
  open_questions:
    - question: "A jornada de informação e transação de habitação/residências da UÉ orientada ao candidato apresenta uma falha material de navegação (descoberta de programa, elegibilidade, duplicação documental, acompanhamento de estado) que um navegador digital de habitação mudaria materialmente?"
      why_open: "A existência de múltiplos programas/superfícies de informação não é, por si só, evidência de falha de navegação; a resposta institucional direta da SASUE descreve um processo de candidatura online estruturado e totalmente operacional, o que desafia materialmente um enquadramento sistémico de falha de informação/processo do lado institucional, mas não estabelece usabilidade, clareza, acessibilidade ou experiência de espera do lado do estudante afetado."
      latest_result: "A resposta institucional da SASUE (2026-08-13) relata uma jornada de candidatura online estruturada através do SIIUE/Perfil de aluno, consulta direta de estado, notificação de resultado e uma via de alteração com suporte de TI, avaliando o processo como totalmente operacional."
      resolution_condition: "Evidência direta do lado do estudante (usabilidade, clareza, acessibilidade, experiência de espera, fricção individual) que estabeleça se existe falha de navegação material."
      evidence:
        - "EVD-000125"
        - "EVD-000126"
        - "EVD-000127"
  path:
    initial_signal:
      summary: "Os documentos de planeamento institucional identificaram preços elevados, oferta insuficiente de habitação a preços comportáveis/social/custos controlados, degradação habitacional e uma escassez específica de alojamento estudantil."
      evidence:
        - "EVD-000031"
        - "EVD-000033"
    development:
      summary: "Foi confirmado que já estão em curso intervenções habitacionais substanciais e financiadas (reabilitação, custos controlados, arrendamento apoiado, alojamento temporário/partilhado, avaliação de necessidades de alojamento estudantil), pelo que este não é um problema de ausência de resposta institucional; a resposta do lado da oferta não resolve, por si só, a necessidade habitacional não satisfeita. A pressão de acomodação estudantil foi mantida como sub-pressão documentada dentro do agregado de habitação, não como problema canónico separado."
      evidence:
        - "EVD-000032"
        - "EVD-000042"
        - "EVD-000043"
    delimitation:
      summary: "Figuras reportadas pela imprensa (quartos por cerca de 500€/mês, T2 por cerca de 1.000€/mês, cerca de 70% dos estudantes da UÉ deslocados para arrendamento) reforçaram a evidência atual de acomodação/exposição estudantil, mantidas como reportadas e não verificadas contra um conjunto de dados primário. A jornada de informação e transação orientada ao candidato foi explicitamente deixada por comprovar, não validada como subproblema."
      evidence:
        - "EVD-000099"
evidence:
  - "EVD-000031"
  - "EVD-000032"
  - "EVD-000033"
  - "EVD-000042"
