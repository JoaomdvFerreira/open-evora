problem_id: PRB-0006
created_at: "2026-08-28"
updated_at: "2026-08-28"
title: O acesso a habitação adequada e a preços comportáveis é difícil para
  alguns grupos populacionais
domain:
  - HOU
  - SOC
  - EDU
geography:
  level: municipality
  area: Évora
affected_populations:
  - residentes que procuram habitação adequada e a preços comportáveis
  - estudantes
problem_statement: Os documentos de planeamento institucional identificam preços
  elevados de compra e arrendamento, uma oferta insuficiente de habitação a
  preços comportáveis, social e a custos controlados, degradação habitacional e
  uma escassez específica de alojamento estudantil, reconhecendo simultaneamente
  que já estão em curso ações de reabilitação habitacional, construção a custos
  controlados, reabilitação destinada ao arrendamento apoiado e medidas de
  alojamento estudantil.
causal_reading: A causa dominante é sobretudo de natureza física e económica,
  relacionada com a oferta e a acessibilidade dos preços — preços elevados,
  oferta insuficiente de habitação a preços comportáveis e degradação
  habitacional —, pelo que o potencial de uma intervenção digital sobre esta
  causa dominante é provavelmente secundário. Esta leitura não está validada.
investigation:
  open_questions:
    - question: O processo de informação e candidatura a alojamento/residências da UÉ
        apresenta uma falha material de navegação — descoberta de programas,
        elegibilidade, duplicação documental ou acompanhamento do estado — que
        pudesse ser significativamente reduzida por uma ferramenta digital de
        orientação habitacional?
      why_open: A existência de vários programas e canais de informação não constitui,
        por si só, evidência de uma falha de navegação. A resposta institucional
        direta da SASUE descreve um processo de candidatura online estruturado e
        totalmente operacional, o que contraria materialmente um enquadramento
        de falha sistémica de informação ou processo do lado institucional. No
        entanto, essa resposta não estabelece a usabilidade, clareza,
        acessibilidade nem a experiência de espera do lado dos estudantes
        afetados.
      latest_result: A resposta institucional da SASUE, de 13 de agosto de 2026,
        descreve um processo de candidatura online estruturado através do
        SIIUE/Perfil de aluno, com consulta direta do estado, notificação do
        resultado e uma via para alterações com suporte dos serviços de
        informática, avaliando o processo como totalmente operacional.
      resolution_condition: Evidência direta da experiência dos estudantes —
        usabilidade, clareza, acessibilidade, experiência de espera e
        dificuldades individuais — que permita estabelecer se existe uma falha
        material de navegação.
      evidence:
        - EVD-000125
        - EVD-000126
        - EVD-000127
  path:
    initial_signal:
      summary: Os documentos de planeamento institucional identificaram preços
        elevados, oferta insuficiente de habitação a preços comportáveis, social
        e a custos controlados, degradação habitacional e uma escassez
        específica de alojamento estudantil.
      evidence:
        - EVD-000031
        - EVD-000033
    development:
      summary: >-
        Foi confirmado que já estão em curso intervenções habitacionais
        substanciais e financiadas — reabilitação, construção a custos
        controlados, arrendamento apoiado, alojamento temporário ou partilhado e
        avaliação das necessidades de alojamento estudantil —, pelo que este não
        é um problema de ausência de resposta institucional. A existência dessas
        respostas do lado da oferta não demonstra, por si só, que a necessidade
        habitacional não satisfeita esteja resolvida.


        A pressão específica sobre o alojamento estudantil foi mantida como uma
        componente documentada deste problema de habitação, e não como um
        problema canónico separado.
      evidence:
        - EVD-000032
        - EVD-000042
        - EVD-000043
        - EVD-000145
    delimitation:
      summary: >-
        Valores divulgados através da imprensa — quartos por cerca de 500 euros
        por mês, T2 por cerca de 1.000 euros por mês e cerca de 70% dos
        estudantes da UÉ deslocados para o mercado de arrendamento — reforçaram
        a evidência atual relativa à exposição dos estudantes aos custos e à
        disponibilidade de alojamento. Estes valores são mantidos como
        informação reportada e não verificada através de um conjunto de dados
        primário.


        O processo de informação e candidatura orientado ao candidato foi
        explicitamente deixado por comprovar e não é tratado como um subproblema
        validado.
      evidence:
        - EVD-000099
