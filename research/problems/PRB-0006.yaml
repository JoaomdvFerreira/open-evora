problem_id: PRB-0006
created_at: "2026-08-28"
updated_at: "2026-10-25"
title: "Alojamento estudantil em Évora: lugares disponíveis e procura não satisfeita"
domain: [HOU, EDU]
geography:
  level: city
  area: Évora
affected_populations:
  - estudantes que procuram alojamento em Évora, incluindo estudantes da Universidade de Évora
problem_statement: >-
  Documentos de planeamento de 2023–2025 identificam escassez de alojamento
  estudantil em Évora. A Universidade de Évora e os Serviços de Ação Social
  (SASUÉ) indicam 525 lugares nominais em sete residências, mas houve
  encerramentos temporários para obras em 2025/2026 e encaminhamento para
  alojamento privado ou alternativo quando os lugares são limitados. Em 2022,
  a Universidade comunicou financiamento aprovado para mais 105 camas, sem
  comprovar entrega ou funcionamento. A publicação de maio de 2026 sobre a
  reabilitação da Residência Manuel Álvares não confirma a conclusão das obras,
  a reabertura ou a capacidade disponível. Em outubro de 2026, o reitor afirmou
  que as obras de requalificação estavam praticamente a terminar e que a
  Universidade vai ter 515 camas requalificadas, sem explicar a relação com os
  525 lugares nominais; segundo a imprensa, a Residência António Gedeão estava
  encerrada para obras no início desse mês. A capacidade disponível em
  2026/2027 não está confirmada. Os SASUÉ dizem dispor de dados
  agregados sobre candidaturas e colocações, mas não forneceram os valores;
  a procura atual não satisfeita permanece por quantificar.
investigation:
  open_questions:
    - question: >-
        Quantos estudantes se candidataram a residência, quantos lugares estavam
        efetivamente disponíveis e quantos ficaram sem colocação ou em lista de
        espera nos últimos anos letivos?
      why_open: >-
        Os SASUÉ referem dispor de dados agregados, mas não forneceram valores,
        definições ou séries anuais. A capacidade nominal não corresponde
        necessariamente aos lugares disponíveis durante as obras.
      latest_result: >-
        Os SASUÉ referiram em agosto de 2026 dispor de informação agregada sobre
        candidaturas, vagas, não colocados, listas de espera e tempos de decisão.
        Os gráficos públicos dos SASUÉ mostram o número de estudantes alojados
        em residência por ano letivo, mas não candidaturas, vagas ou listas de
        espera. Em outubro de 2026, segundo a imprensa, um inquérito da
        Associação Académica a 300 estudantes indicou que 85,7% dos
        participantes que vivem fora da cidade sem alojamento em Évora apontaram
        o custo do alojamento ou a falta de oferta como razão; a divulgação
        indica que os resultados não podem ser extrapolados para o conjunto dos
        estudantes.
      current_action: >-
        Em 25 de outubro de 2026 foram enviados dois pedidos distintos; aguardam-se
        as respostas. Aos SASUÉ foram pedidos dados agregados por ano letivo sobre
        candidaturas, colocações, estudantes não colocados e listas de espera, com
        as respetivas definições. À Associação Académica foi pedido acesso ao
        estudo de outubro de 2026 sobre alojamento estudantil, incluindo a
        metodologia, o questionário e a dimensão das amostras.
      resolution_condition: >-
        Dados agregados por ano letivo, com definições suficientes para comparar
        candidaturas, lugares disponíveis, colocações e procura não satisfeita.
      evidence: [EVD-000126, EVD-000043, EVD-000197, EVD-000199]
    - question: >-
        Quantos lugares estão efetivamente disponíveis nas residências da
        Universidade de Évora e qual é o estado das 105 camas adicionais para
        as quais foi aprovado financiamento PRR e das residências afetadas
        por obras?
      why_open: >-
        A capacidade publicada é nominal; o financiamento aprovado e a publicação
        sobre a Residência Manuel Álvares não estabelecem entrega, reabertura ou
        capacidade efetiva atual. As 515 camas requalificadas referidas pelo
        reitor são um resultado esperado das obras, e os números de estudantes
        alojados publicados pelos SASUÉ não indicam o critério de contagem;
        nenhum destes valores mede os lugares utilizáveis em 2026/2027.
      latest_result: >-
        A informação institucional documenta 525 lugares nominais em sete
        residências, encerramentos temporários em 2025/2026, financiamento
        aprovado em 2022 para 105 camas e uma publicação de maio de 2026 sobre
        reabilitação, sem confirmar os resultados dessas intervenções. Numa
        entrevista publicada em 9 de outubro de 2026, o reitor afirmou que as
        obras de requalificação financiadas pelo PRR estavam praticamente a
        terminar e que a Universidade vai ter as 515 camas requalificadas, e
        descreveu um plano para quase duplicar o número de camas. Segundo a
        imprensa, a Residência António Gedeão estava encerrada para obras entre
        3 e 10 de outubro de 2026. Os gráficos dos SASUÉ, atualizados em maio de
        2026, mostram estudantes alojados por ano letivo, sem valores numéricos.
        As estatísticas publicadas sobre estudantes alojados não permitem
        determinar, por si só, a capacidade efetivamente disponível nem
        quantificar a procura não satisfeita, uma vez que o critério de contagem
        não está identificado.
      current_action: >-
        A informação pública consultada até 25 de outubro de 2026 não confirma
        a capacidade em funcionamento em 2026/2027, a reabertura da Residência
        António Gedeão, a relação entre as 515 camas requalificadas e os 525
        lugares nominais, nem se as 105 camas adicionais com financiamento PRR
        aprovado foram entregues. Em 25 de outubro de 2026 foi enviado aos SASUÉ
        um pedido de informação sobre a capacidade por residência, o critério de
        contagem dos estudantes alojados e a procura não satisfeita; aguarda-se
        resposta.
      resolution_condition: >-
        Informação institucional atual que distinga lugares nominais de lugares
        utilizáveis e confirme o estado de cada expansão ou reabilitação.
      evidence: [EVD-000043, EVD-000145, EVD-000100, EVD-000196, EVD-000198, EVD-000199]
  path:
    initial_signal:
      summary: >-
        O planeamento relativo à cidade identificou escassez de alojamento
        estudantil e capacidade insuficiente das residências face à procura de estudantes. O planeamento municipal mais amplo é contexto e prevê avaliação de necessidades e
        trabalho de candidatura a financiamento, sem demonstrar conclusão.
      evidence: [EVD-000031, EVD-000032, EVD-000033]
    development:
      summary: >-
        A Universidade e os SASUÉ documentaram capacidade nominal, encerramentos
        temporários e encaminhamento para alternativas. O financiamento aprovado
        para 105 camas e a publicação sobre a Residência Manuel Álvares não
        confirmam novos lugares em funcionamento. Os SASUÉ disseram dispor de
        dados agregados sobre candidaturas e colocações, sem fornecer valores.
      evidence: [EVD-000043, EVD-000145, EVD-000100, EVD-000126]
    delimitation:
      summary: >-
        A procura não satisfeita e a capacidade atualmente disponível na cidade
        continuam por quantificar na evidência ligada. O planeamento municipal
        mais amplo não mede por si só a manifestação na cidade.
        A habitação municipal a preços comportáveis e as respetivas intervenções
        são tratadas separadamente no problema sobre habitação a preços comportáveis em Évora.
        As 515 camas requalificadas anunciadas em outubro de 2026 não foram
        tratadas como capacidade em funcionamento, e o inquérito da Associação
        Académica não foi usado para estimar a procura de todos os estudantes.
      evidence: [EVD-000043, EVD-000126, EVD-000031, EVD-000196, EVD-000197]
