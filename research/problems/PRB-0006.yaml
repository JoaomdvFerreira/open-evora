problem_id: PRB-0006
created_at: "2026-08-28"
updated_at: "2026-08-31"
title: O acesso a habitação adequada e a preços comportáveis é difícil para
  alguns grupos populacionais
domain:
  - HOU
  - SOC
  - EDU
geography:
  level: municipality
  area: Évora
affected_populations:
  - residentes que procuram habitação adequada e a preços comportáveis
  - estudantes
problem_statement: Os documentos de planeamento institucional identificam preços
  elevados de compra e arrendamento, uma oferta insuficiente de habitação a
  preços comportáveis, social e a custos controlados, degradação habitacional e
  uma escassez específica de alojamento estudantil. O plano de ação de 2025
  prevê reabilitação habitacional, metas de construção a custos controlados,
  reabilitação para arrendamento apoiado, alojamento temporário ou partilhado
  para populações vulneráveis, avaliação das necessidades de alojamento
  estudantil e candidatura a financiamento, sem estabelecer execução ou entrega
  dessas ações e metas; em janeiro de 2026 foram entregues 12
  habitações para arrendamento apoiado na Malagueira. Em maio de 2026, a Universidade de Évora publicou informação sobre a reabilitação da
  Residência Universitária Manuel Álvares.
causal_reading: Os documentos de planeamento identificam preocupações com os
  preços, a oferta e a degradação habitacional. A contribuição relativa de cada
  fator e o papel de eventuais barreiras no processo de candidatura a
  residência não estão estabelecidos.
investigation:
  open_questions:
    - question: O processo de informação e candidatura a alojamento/residências da UÉ
        apresenta uma falha material de navegação — descoberta de programas,
        elegibilidade, duplicação documental ou acompanhamento do estado — que
        pudesse ser significativamente reduzida por uma ferramenta digital de
        orientação habitacional?
      why_open: Os SASUÉ descrevem um processo de candidatura em linha
        estruturado e canais de informação e apoio. Esta descrição restringe
        a hipótese de falha no processo institucional, mas não estabelece a
        usabilidade, clareza, acessibilidade nem a experiência de espera dos
        estudantes afetados.
      latest_result: Os SASUÉ descreveram um processo de candidatura em linha
        estruturado, com consulta do estado, notificação do resultado e apoio,
        que consideram plenamente operacional. Esta descrição restringe a
        hipótese de falha no processo institucional; não estabelece a
        usabilidade, clareza, acessibilidade nem a experiência de espera dos
        estudantes.
      current_action: Não é proporcional prosseguir desafio direto; qualquer reabertura
        da questão de navegação deve incidir na experiência efetiva dos estudantes.
      resolution_condition: Evidência direta da experiência dos estudantes —
        usabilidade, clareza, acessibilidade, experiência de espera e
        dificuldades individuais — que permita estabelecer se existe uma falha
        material de navegação.
      evidence:
        - EVD-000125
        - EVD-000126
        - EVD-000127
  path:
    initial_signal:
      summary: Os documentos de planeamento institucional identificaram preços
        elevados, oferta insuficiente de habitação a preços comportáveis, social
        e a custos controlados, degradação habitacional e uma escassez
        específica de alojamento estudantil.
      evidence:
        - EVD-000031
        - EVD-000033
    development:
      summary: >-
        O plano de ação de 2025 documenta ações e metas para reabilitação,
        construção a custos controlados, arrendamento apoiado, alojamento
        temporário ou partilhado e avaliação das necessidades de alojamento
        estudantil, sem estabelecer a sua execução. A intervenção municipal de
        2026 documenta financiamento e metas, bem como a entrega de 12
        habitações para arrendamento apoiado na Malagueira em janeiro. Estas
        respostas não demonstram, por si só, que a necessidade habitacional não
        satisfeita esteja resolvida.


        A pressão específica sobre o alojamento estudantil foi mantida como uma
        componente documentada deste problema de habitação, e não como um
        problema canónico separado.
      evidence:
        - EVD-000032
        - EVD-000042
        - EVD-000043
        - EVD-000145
    delimitation:
      summary: >-
        Valores divulgados através da imprensa — quartos por cerca de 500 euros
        por mês, T2 por cerca de 1.000 euros por mês e cerca de 70% dos
        estudantes da UÉ a viver fora de casa e dependentes de alojamento
        arrendado — reforçaram os sinais relativos à exposição dos
        estudantes aos custos e à disponibilidade de alojamento. Estes valores
        são mantidos como informação reportada e não verificada através de um
        conjunto de dados primário.


        O processo de informação e candidatura orientado ao candidato foi
        explicitamente deixado por comprovar e não é tratado como um subproblema
        validado.
      evidence:
        - EVD-000099
