decision_basis:
  contract_version: "0.1"

  eligibility_basis: "PRB-0006 is a distinct, well-formed problem of investigation: it names a bounded civic-service concern (difficulty of access to adequate, affordable housing for some population groups in the Município de Évora) with a bounded geography, two named affected populations (residents seeking adequate/affordable housing; students), and institutionally documented manifestation across multiple planning sources (EVD-000031, EVD-000032, EVD-000033) showing high prices, insufficient affordable/social/controlled-cost supply, housing degradation and a specific student-accommodation shortage are recognized, recurring planning concerns, not an assumption. Concrete resident/student-facing consequence evidence exists for the student sub-population specifically (EVD-000099, EVD-000043), grounding the claim in actual effects rather than only institutional concern. Existing interventions (EVD-000032, EVD-000042, EVD-000100, EVD-000125) are documented but are treated as existing-solution/current-state evidence, not as consequence evidence, and do not themselves establish or negate the problem. It is not framed as a solution ('need for an app') and does not overlap another canonical PRB-*."

  corroboration_basis: "Corroboration is SUPPORTED and bounded, not general. Housing/access pressure in Évora is materially documented by institutional planning evidence: EVD-000031 (PDS 2024-2027, SRC-0002) and EVD-000033 (PUE Habitação sector report, SRC-0029) are materially distinct planning/documentary threads that both identify high prices, insufficient affordable/social/controlled-cost supply, and housing degradation as planning concerns; EVD-000032 (Plano de Ação do PDS 2025, SRC-0028) documents institutional response activity consistent with, but not itself proof of, that pressure. SRC-0002 and SRC-0028 share the same PDS/Rede Social institutional lineage and are not treated as two independent voices. SRC-0029 (EVD-000033) is a distinct document/publication event from the PDS/Rede Social family, but all three sources sit within the same broader Município de Évora / local institutional planning ecosystem; EVD-000033's own notes explicitly warn that repeated institutional claims across SRC-0002/SRC-0028/SRC-0029 are not automatically independent corroboration, so document/source distinction here is not read as full institutional independence — it is treated as convergent characterization from the same institutional planning ecosystem, not as two independent institutions. For students specifically, concrete supporting evidence exists beyond planning-document claims: EVD-000043 (SASUE accommodation page, SRC-0037) is a materially distinct institutional voice, outside the Município planning family (Universidade de Évora rather than the municipality), documenting limited/disrupted residence capacity and explicit referral of students to private accommodation; EVD-000099 (press report, SRC-0085) adds a separate secondary press evidence class with current, REPORTED and UNKNOWN-representativeness affordability/displacement figures, not verified against a primary dataset. This student-specific evidence draws on a materially distinct institutional voice and a separate evidence-generating process, and is treated as concrete supporting evidence, not generalized beyond students. Institutional intervention evidence (EVD-000032, EVD-000042, EVD-000100, EVD-000125/EVD-000126) is existing-solution/current-state/boundary evidence: it shows active institutional response and constrains any claim that nothing is being done, but it does not independently establish manifestation, consequence, prevalence or current severity, and it also does not establish that the underlying unmet need has been resolved. The housing-pressure corroboration claim rests on the direct/supporting evidence identified above (EVD-000031, EVD-000033, EVD-000043, EVD-000099), not on the existence, scale or funding of any intervention."

  manifestation:
    kind: "housing affordability / supply adequacy gap, with a student-accommodation sub-pressure"
    summary: "Institutional planning evidence establishes that access to adequate, affordable housing is a documented, recurring concern in Évora: high purchase and rental prices, insufficient affordable/social/controlled-cost housing supply, and housing degradation (EVD-000031, EVD-000033), alongside a specific, repeatedly documented student-accommodation shortage (EVD-000033, EVD-000043). EVD-000032 documents the institutional response programme (rehabilitation, controlled-cost targets, supported-rental rehabilitation, temporary/shared accommodation, student-housing needs assessment) and is treated as existing-solution/current-state evidence, not manifestation evidence for the pressure itself."
    evidence:
      - "EVD-000031"
      - "EVD-000033"
      - "EVD-000043"

  consequence:
    summary: "Concrete, resident/student-facing consequence evidence is strongest for students: EVD-000043 documents that three UÉ residences were closed for works during 2025/2026, causing a temporary capacity disruption, and that the university explicitly refers students to private or alternative accommodation due to limited places; EVD-000099 reports current press-mediated figures (rooms around EUR500/month, T2 around EUR1,000/month, roughly 70% of UÉ students displaced into rental accommodation). Together these establish actual student-facing effects (displacement into a constrained private rental market, temporary capacity loss), not merely institutional concern or the existence of interventions. No equivalent concrete consequence evidence at population-wide/general-resident scale is on record; the general-population claim rests on institutional planning-document characterization (EVD-000031, EVD-000033), not on documented individual/household-level consequence instances."
    evidence:
      - "EVD-000043"
      - "EVD-000099"

  currentness:
    assessment: "HIGH for the student-accommodation sub-pressure and its institutional characterization; MEDIUM for the general-population housing-pressure claim. EVD-000099 (press report) provides current 2026 evidence specifically for the student-specific affordability/accommodation sub-pressure, subject to its REPORTED / UNKNOWN-representativeness limitations. EVD-000100 (May 2026 residence-renovation completion) is also current 2026 student-accommodation evidence. EVD-000042 (2026, EUR67.1M/459-home agreement, concrete January 2026 deliveries) provides current evidence of municipal intervention/current state; it neither proves current general-population severity nor proves the underlying unmet need has been resolved. EVD-000125/EVD-000126/EVD-000127 (SASUE institutional response, 2026-08-13) establish the current state of the residence-application/operator process as of August 2026 and provide current boundary/contradiction information on that narrow process question only; they are not used, and must not be read, as evidence that broader housing pressure is currently severe, that the student-accommodation shortage has a quantified current magnitude, or that waiting-list/application outcomes demonstrate shortage. EVD-000126 in particular confirms only that aggregate application/capacity/waiting-list/decision-time indicators exist internally; it contains no indicator values, and indicator existence must not be read as current-severity evidence. EVD-000031/EVD-000032/EVD-000033 are 2024-2025 planning documents. General-population currentness remains MEDIUM: it is bounded mainly by that 2024-2025 institutional characterization, plus the absence of evidence sufficient to establish either a quantified current severity or a resolution of the underlying need; EVD-000042's current intervention evidence and EVD-000099's current student-specific evidence do not, by their absence of contradiction, constitute affirmative corroboration of current general-population severity. No 2026 quantified shortage/severity dataset was located for the general-population claim, and none is supplied by EVD-000125/EVD-000126/EVD-000127."
    evidence:
      - "EVD-000042"
      - "EVD-000099"
      - "EVD-000100"
      - "EVD-000125"

  contradiction_search:
    performed: true
    summary: "A deliberate search for evidence that would contradict or narrow the problem was performed, most materially through D5 direct institutional engagement with SASUE (EVD-000125-EVD-000127). SASUE's response (EVD-000127) is treated as a genuine contradiction/boundary result: it disproves the specific hypothesis that a problematic digital residence-application process is a material access barrier, describing a structured, fully operational online application, notification and status-consultation journey (EVD-000125) and routing any needed IT changes through University IT (EVD-000127). This narrows the problem's characterization on the applicant-process dimension only. It does NOT disprove, and is not read as disproving, the broader housing/access pressure or the student-accommodation capacity/affordability sub-pressure (EVD-000043, EVD-000099), which concern supply and cost, not the digital application mechanism. EVD-000042's active, large-scale intervention evidence was also actively considered and preserved as boundary evidence rather than treated as proof the underlying need is resolved."
    evidence:
      - "EVD-000125"
      - "EVD-000127"

  overlap_check:
    performed: true
    summary: "No other canonical PRB-* addresses housing affordability/adequacy or student-accommodation access in Évora; PRB-0006 does not duplicate or overlap another record. Student accommodation is deliberately retained as a sub-pressure within this record rather than split into a separate problem, per the existing Round A cross-domain synthesis referenced in possible_root_causes."
    related_problems: []

  corroboration_statement: "Os documentos de planeamento institucional identificam preços elevados de compra e arrendamento, uma oferta insuficiente de habitação a preços comportáveis, social e a custos controlados, degradação habitacional e uma escassez específica de alojamento estudantil, reconhecendo simultaneamente que já estão em curso ações de reabilitação habitacional, construção a custos controlados, reabilitação destinada ao arrendamento apoiado e medidas de alojamento estudantil."

  supporting_evidence:
    - "EVD-000031"
    - "EVD-000033"
    - "EVD-000043"
    - "EVD-000099"

  boundary_evidence:
    - "EVD-000032"
    - "EVD-000042"
    - "EVD-000100"
    - "EVD-000125"
    - "EVD-000126"
    - "EVD-000127"

  independence_assessment: "The general-population housing-pressure claim rests on materially distinct documentary threads, not on established independent institutions. EVD-000031 (SRC-0002, PDS 2024-2027) and EVD-000032 (SRC-0028, Plano de Ação do PDS 2025) share the same PDS/Rede Social institutional lineage and are treated as one institutional-voice family. EVD-000033 (SRC-0029, PUE Habitação sector report) is a materially distinct planning/documentary thread — a separate report, in a separate publication event — but it is not treated as a fully independent institutional voice from the PDS/Rede Social family: both sit within the same broader Município de Évora / local institutional planning ecosystem, and EVD-000033's own notes explicitly caution that repeated institutional claims across SRC-0002/SRC-0028/SRC-0029 are not automatically independent corroboration. Document/source distinction is therefore not translated into full institutional independence here; EVD-000033 is also flagged in its own record as REFINES rather than an equally weighted standalone primary-authoritative source, so it is not counted as adding independent prevalence/severity detail beyond the PDS family's general characterization. For the student sub-population, EVD-000043 (SRC-0037, SASUE / Universidade de Évora accommodation page) is a materially distinct institutional voice, outside the Município de Évora planning ecosystem entirely (a separate institution, the university rather than the municipality), and EVD-000099 (SRC-0085, press report) is a separate secondary press evidence class, distinct in kind from institutional communication, though its figures are REPORTED and UNKNOWN-representativeness, not verified against a primary dataset. EVD-000125, EVD-000126 and EVD-000127 all share `analysis.lineage_id` D5-ENG-OP-004 (the same SASUE engagement) and are explicitly one institutional voice, not three independent corroborating records; per their own notes they must not be treated as independent corroboration of each other. EVD-000042 and EVD-000100 are intervention/current-state evidence, not corroborating threads for the pressure claim, and are excluded from this independence count. Net: the general-population claim rests on materially distinct documentary threads within one institutional planning ecosystem (Município de Évora / Rede Social / PUE), which is a weaker basis than genuinely independent institutions and is why overall independence for this record is assessed as MEDIUM (consistent with ASM-0006 evidence_confidence.independence: MEDIUM), not artificially strengthened; the student sub-claim is additionally supported by a materially distinct university institutional voice and a separate press evidence class, which is why student evidence is treated as concrete and comparatively stronger than the general-population evidence in this basis."

  scope:
    geography: "Município de Évora (municipality-level); EVD-000033 additionally specifies Évora city, especially the Historic Centre, for the student/alojamento-local concentration detail — used here only to characterize the student sub-pressure, not as the basis for a narrower municipality-wide geography claim."
    population: "Two populations are named, with materially different evidence strength: (1) residents seeking adequate/affordable housing generally — supported by institutional planning-document characterization only (EVD-000031, EVD-000033), with no concrete individual/household-level consequence evidence on record; (2) students — supported by both institutional characterization and concrete, current consequence evidence (EVD-000043, EVD-000099). Student evidence is not generalized to the general-resident population, and general-population evidence is not strengthened by the student-specific consequence evidence."
    temporal: "Bounded to the period documented on record: institutional planning characterization spans 2024-2025 (EVD-000031, EVD-000032, EVD-000033); current-state evidence spans January-August 2026 (EVD-000042, EVD-000099, EVD-000100, EVD-000125-EVD-000127). The claim does not extend to, and is not corroborated for, a quantified 2026 shortage magnitude or a post-August 2026 operational state."
    bounded: true

  limitations: "The corroborated claim is SUPPORTED only as follows: institutional planning documents consistently identify high housing prices, insufficient affordable/social/controlled-cost supply, and housing degradation as recognized concerns, with a specific, better-evidenced student-accommodation shortage and displacement into a constrained private rental market. It is NOT SUPPORTED as: a quantified prevalence claim across all residents; a municipality-wide severity level; a causal attribution to any single mechanism; or a claim that the digital residence-application process is itself a significant access barrier — SASUE's response (EVD-000127) specifically disproves this narrower hypothesis without disproving the broader housing/access pressure (see contradiction_search). Existing institutional interventions (EVD-000032, EVD-000042, EVD-000100, EVD-000125, EVD-000126) are documented as active and substantial but are boundary/current-state evidence, not consequence evidence, and do not themselves establish that unmet housing need is resolved; recent intervention evidence (e.g. EVD-000042's January 2026 deliveries, EVD-000100's May 2026 renovation completion) does not automatically prove current severity, and its absence would not disprove the problem either. General-population consequence evidence is weaker than student-population consequence evidence; this record does not generalize the student-specific findings (EVD-000043, EVD-000099) to all residents. EVD-000125/EVD-000126/EVD-000127 form a single institutional engagement (lineage D5-ENG-OP-004) and are not counted as three independent corroborating records. No 2026 quantified shortage-magnitude or waiting-list dataset was located; SASUE confirmed such internal indicators exist (EVD-000126) but provided no values, definitions, or reuse terms, so indicator existence is not read as evidence of shortage magnitude. EVD-000125/EVD-000126/EVD-000127 establish current state for the residence-application/operator process only; they are not used as evidence that broader housing pressure is currently severe or that the student-accommodation shortage has a quantified current magnitude."
