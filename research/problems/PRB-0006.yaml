problem_id: PRB-0006
created_at: "2026-08-28"
updated_at: "2026-10-12"
title: "Alojamento estudantil em Évora: lugares disponíveis e procura não satisfeita"
domain: [HOU, EDU]
geography:
  level: municipality
  area: Évora
affected_populations:
  - estudantes que procuram alojamento em Évora, incluindo estudantes da Universidade de Évora
problem_statement: >-
  Documentos de planeamento de 2024–2025 identificam escassez de alojamento
  estudantil em Évora. A Universidade de Évora e os seus Serviços de Ação Social
  (SASUÉ) indicam uma capacidade nominal de 525 lugares em sete residências,
  encerramentos temporários para
  obras em 2025/2026 e encaminhamento para alojamento privado ou alternativo
  quando os lugares são limitados. A Universidade comunicou em 2022 financiamento
  aprovado pelo Plano de Recuperação e Resiliência (PRR) para mais 105 camas,
  sem que isso estabeleça a sua entrega ou entrada em funcionamento. Em maio de
  2026, publicou informação sobre a reabilitação da
  Residência Universitária Manuel Álvares; a publicação não confirma a conclusão
  das obras, a reabertura ou a capacidade disponível. A imprensa refere quartos
  por cerca de 500 €/mês, T2 por cerca de 1 000 €/mês e aproximadamente 70% dos
  estudantes da Universidade deslocados e dependentes de alojamento arrendado;
  estes valores não foram verificados em dados primários e a sua representatividade
  é desconhecida. A evidência ligada não quantifica os estudantes atualmente sem
  lugar em residência. Os SASUÉ dizem dispor de dados agregados sobre candidaturas,
  vagas, não colocados e listas de espera, mas não forneceram os valores.
investigation:
  open_questions:
    - question: >-
        Quantos estudantes se candidataram a residência, quantos lugares estavam
        efetivamente disponíveis e quantos ficaram sem colocação ou em lista de
        espera nos últimos anos letivos?
      why_open: >-
        Os SASUÉ referem dispor de dados agregados, mas não forneceram valores,
        definições ou séries anuais. A capacidade nominal não corresponde
        necessariamente aos lugares disponíveis durante as obras.
      latest_result: >-
        Os SASUÉ referiram em agosto de 2026 dispor de informação agregada sobre
        candidaturas, vagas, não colocados, listas de espera e tempos de decisão.
      current_action: >-
        Está preparado, mas não enviado, um pedido aos SASUÉ de séries anuais
        comparáveis, quando disponíveis, sobre candidaturas, vagas, colocados,
        não colocados, listas de espera, tempos de decisão e respetivas definições.
      resolution_condition: >-
        Dados agregados por ano letivo, com definições suficientes para comparar
        candidaturas, lugares disponíveis, colocações e procura não satisfeita.
      evidence: [EVD-000126, EVD-000043]
    - question: >-
        Quantos lugares estão efetivamente disponíveis nas residências da
        Universidade de Évora e qual é o estado das 105 camas adicionais para
        as quais foi aprovado financiamento PRR e das residências afetadas
        por obras?
      why_open: >-
        A capacidade publicada é nominal; o financiamento aprovado e a publicação
        sobre a Residência Manuel Álvares não estabelecem entrega, reabertura ou
        capacidade efetiva atual.
      latest_result: >-
        A informação institucional documenta 525 lugares nominais em sete
        residências, encerramentos temporários em 2025/2026, financiamento
        aprovado em 2022 para 105 camas e uma publicação de maio de 2026 sobre
        reabilitação, sem confirmar os resultados dessas intervenções.
      current_action: >-
        Está por verificar se comunicações públicas atuais da Universidade e dos
        SASUÉ esclarecem reaberturas, encerramentos, capacidade efetiva, se as
        105 camas adicionais com financiamento PRR aprovado foram entregues ou
        entraram em funcionamento, e a execução da reabilitação documentada.
      resolution_condition: >-
        Informação institucional atual que distinga lugares nominais de lugares
        utilizáveis e confirme o estado de cada expansão ou reabilitação.
      evidence: [EVD-000043, EVD-000145, EVD-000100]
  path:
    initial_signal:
      summary: >-
        O planeamento de 2024–2025 identificou escassez de alojamento estudantil
        e capacidade insuficiente das residências face à procura de estudantes.
      evidence: [EVD-000031, EVD-000033]
    development:
      summary: >-
        A Universidade e os SASUÉ documentaram capacidade nominal, encerramentos
        temporários e encaminhamento para alternativas. O financiamento aprovado
        para 105 camas e a publicação sobre a Residência Manuel Álvares não
        confirmam novos lugares em funcionamento. Os SASUÉ disseram dispor de
        dados agregados sobre candidaturas e colocações, sem fornecer valores.
      evidence: [EVD-000043, EVD-000145, EVD-000100, EVD-000126]
    delimitation:
      summary: >-
        A procura não satisfeita e a capacidade atualmente disponível continuam
        por quantificar na evidência ligada. Os preços e a proporção de estudantes
        deslocados referidos pela imprensa não são medições verificadas.
        A habitação municipal a preços comportáveis e as respetivas intervenções
        são tratadas separadamente em PRB-0013.
      evidence: [EVD-000043, EVD-000099, EVD-000126]
