history:
  - date: 2026-10-14
    summary: O âmbito geográfico passou para a cidade porque o hospital aqui considerado se situa em Évora. O diagnóstico do concelho continua a descrever dificuldades identificadas em 2023; não está confirmado se persistem em 2026 nos serviços da cidade.
    evidence:
      - EVD-000149
      - EVD-000181
  - date: 2026-10-14
    summary: A localização do Hospital do Espírito Santo passou a apoiar-se em dados do Portal da Transparência do SNS. O CLAIM da Universidade de Évora passou a ser descrito como destinado à comunidade académica migrante. A questão sobre apoios passou a distinguir disponibilidade, utilização e resultados documentados e a separar a informação a obter junto do Município, da Universidade e da ULS do Alentejo Central. Continua por saber se as barreiras identificadas em 2023 persistem em 2026 nos serviços de saúde da cidade.
    evidence:
      - EVD-000152
      - EVD-000181
