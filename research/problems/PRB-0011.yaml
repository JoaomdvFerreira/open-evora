problem_id: PRB-0011
created_at: 2026-08-28
updated_at: 2026-10-14
title: Barreiras de língua no acesso à saúde para migrantes em Évora
domain:
  - SOC
  - HEA
geography:
  level: city
  area: Évora
affected_populations:
  - população migrante residente no concelho de Évora
problem_statement: >-
  O diagnóstico municipal realizado em 2023 identificou barreiras de língua e
  dificuldades no acesso à saúde e à saúde mental entre pessoas migrantes do
  concelho de Évora. O Hospital do Espírito Santo de Évora situa-se na cidade;
  esta localização permite considerar o diagnóstico um sinal de dificuldades
  no acesso a serviços de saúde na cidade, sem medir quantas pessoas foram
  afetadas aí ou afirmar que recorreram a esse hospital.

  O projeto municipal Acolher no VAGAR prevê respostas de integração e a
  Universidade de Évora mantém um Centro Local de Apoio à Integração de
  Migrantes (CLAIM). A sua existência ou previsão não demonstra cobertura ou
  eficácia no acesso à saúde. A pesquisa pública delimitada de outubro de 2026
  não estabeleceu se as barreiras de 2023 persistem nos serviços da cidade.
investigation:
  open_questions:
    - question: Persistem em 2026 barreiras de língua e dificuldades de acesso à
        saúde ou à saúde mental para pessoas migrantes nos serviços de Évora?
      why_open: O diagnóstico refere-se a 2023 e a sua apresentação numa ata
        municipal de 2026 não confirma a situação atual dos serviços da cidade.
      latest_result: A pesquisa pública delimitada de outubro de 2026 não encontrou
        informação atual específica dos serviços que estabeleça a presença ou
        extensão de barreiras de língua nas unidades de saúde situadas na cidade.
        Foram consultadas informações da ULS do Alentejo Central e do Hospital
        do Espírito Santo, das unidades de cuidados de saúde primários da cidade,
        do Plano Municipal para a Integração de Migrantes, do Acolher no VAGAR,
        de associações de migrantes e comunitárias e dos meios de comunicação
        locais. Esta ausência de informação pública não demonstra que as
        barreiras não existam.
      current_action: O pedido de informação à ULS do Alentejo Central está
        preparado e pendente de autorização; não foi enviado.
      resolution_condition: Informação agregada recente das unidades de saúde
        da cidade ou relatos verificáveis de pessoas que nelas procuraram
        cuidados, suficientes para estabelecer se ocorreram barreiras em 2025
        ou 2026 e delimitar os serviços e situações abrangidos.
      evidence:
        - EVD-000149
        - EVD-000181
    - question: Que apoio existe ou está previsto para superar estas dificuldades
        e que resultados são conhecidos nos serviços de saúde da cidade?
      why_open: Acolher no VAGAR apresenta objetivos e metas e a Universidade
        de Évora mantém um CLAIM, mas a informação disponível não estabelece
        quantas pessoas foram atendidas nem se as dificuldades de acesso à saúde
        diminuíram.
      latest_result: O CLAIM é um serviço anunciado como existente; as medidas
        de Acolher no VAGAR são objetivos previstos. Nenhuma destas fontes
        apresenta resultados que demonstrem melhoria no acesso aos cuidados
        de saúde da cidade.
      current_action: O pedido de informação agregada à ULS do Alentejo Central
        está preparado e pendente de autorização; não foi enviado. Não há
        avaliação documentada dos resultados destas respostas no acesso à saúde.
      resolution_condition: Dados verificáveis sobre execução, utilização e
        resultados das respostas relevantes, com cobertura e período definidos,
        que permitam avaliar o seu contributo para o acesso à saúde na cidade.
      evidence:
        - EVD-000151
        - EVD-000152
  path:
    initial_signal:
      summary: O Município apresentou em 2026 conclusões de um diagnóstico
        de 2023 sobre pessoas migrantes do concelho, incluindo barreiras de
        língua e dificuldades de acesso à saúde e à saúde mental. A AIMA
        contou cidadãos estrangeiros residentes no concelho em 2024; essa
        contagem não mede as barreiras.
      evidence:
        - EVD-000149
        - EVD-000150
    development:
      summary: Foram identificados os objetivos do projeto municipal Acolher
        no VAGAR e o CLAIM da Universidade de Évora. Informação nacional
        descreve dificuldades semelhantes no acesso de pessoas imigrantes aos
        cuidados de saúde primários, sem medir a situação em Évora.
      evidence:
        - EVD-000151
        - EVD-000152
        - EVD-000153
    delimitation:
      summary: A dificuldade aqui descrita é o acesso à saúde e à saúde mental,
        sem abranger emprego ou habitação. O Hospital do Espírito Santo situa-se
        na cidade, mas o diagnóstico municipal de 2023 não mede dificuldades
        nesse hospital nem permite estimar a sua frequência na cidade. A
        existência de respostas de integração não prova que as dificuldades
        tenham sido resolvidas; a sua persistência em 2026 continua por
        confirmar.
      evidence:
        - EVD-000149
        - EVD-000151
        - EVD-000152
        - EVD-000153
        - EVD-000181
