problem_id: PRB-0011
created_at: 2026-08-28
updated_at: 2026-10-25
title: Barreiras de língua no acesso à saúde para migrantes em Évora
domain:
  - SOC
  - HEA
geography:
  level: city
  area: Évora
affected_populations:
  - população migrante residente no concelho de Évora
problem_statement: >-
  O diagnóstico municipal realizado em 2023 identificou barreiras de língua e
  dificuldades no acesso à saúde e à saúde mental entre pessoas migrantes do
  concelho de Évora. O Hospital do Espírito Santo situa-se na cidade de Évora. O diagnóstico não indica quantas pessoas foram afetadas na cidade, não demonstrou que essas dificuldades ocorreram naquele hospital e não estabelece a situação atual em 2026.


  O projeto municipal Acolher no VAGAR prevê medidas e metas de integração. A
  Universidade de Évora anunciou um Centro Local de Apoio à Integração de
  Migrantes (CLAIM) destinado à sua comunidade académica migrante. Nos serviços
  de saúde da cidade, não está verificado que apoio de interpretação ou
  mediação existe nem que resultados teve. A existência ou previsão destas
  respostas não demonstra melhoria no acesso à saúde. A pesquisa pública
  delimitada de outubro de 2026 não estabeleceu se as barreiras de 2023
  persistem nos serviços de saúde da cidade.
investigation:
  open_questions:
    - question: Persistem em 2026 barreiras de língua e dificuldades de acesso à
        saúde ou à saúde mental para pessoas migrantes nos serviços de Évora?
      why_open: O diagnóstico refere-se a 2023 e a sua apresentação numa ata
        municipal de 2026 não confirma a situação atual dos serviços da cidade.
      latest_result: A pesquisa pública delimitada de outubro de 2026 não encontrou
        informação atual específica dos serviços que estabeleça a presença ou
        extensão de barreiras de língua nas unidades de saúde situadas na cidade.
        Foram consultadas informações da ULS do Alentejo Central e do Hospital
        do Espírito Santo, das unidades de cuidados de saúde primários da cidade,
        do Plano Municipal para a Integração de Migrantes, do Acolher no VAGAR,
        de associações de migrantes e comunitárias e dos meios de comunicação
        locais. Esta ausência de informação pública não demonstra que as
        barreiras não existam.
      current_action: Em 25 de outubro de 2026 foi enviado à ULS do Alentejo
        Central um pedido de informação agregada sobre interpretação, tradução e
        mediação cultural nas unidades de saúde da cidade; aguarda-se resposta.
      resolution_condition: Informação agregada recente das unidades de saúde
        da cidade ou relatos verificáveis de pessoas que nelas procuraram
        cuidados, suficientes para estabelecer se ocorreram barreiras em 2025
        ou 2026 e delimitar os serviços e situações abrangidos.
      evidence:
        - EVD-000149
        - EVD-000181
    - question: Que apoios de integração, interpretação ou mediação existem ou
        estão previstos para pessoas migrantes em Évora, quais foram
        efetivamente utilizados e que resultados estão documentados no acesso
        aos cuidados de saúde da cidade?
      why_open: O Acolher no VAGAR apresenta atividades de integração previstas
        e metas de participantes. O CLAIM da Universidade de Évora destina-se à
        comunidade académica migrante da Universidade. As fontes disponíveis não
        estabelecem que apoios foram efetivamente utilizados nem que resultados
        tiveram no acesso aos serviços de saúde da cidade. A informação em falta
        cabe a instituições com responsabilidades diferentes, o Município, a
        Universidade e a Unidade Local de Saúde (ULS) do Alentejo Central.
      latest_result: "Município: o Acolher no VAGAR tem objetivos, medidas
        previstas e metas de destinatários e participantes; a sua execução e os
        resultados no acesso à saúde não estão estabelecidos. Universidade: em
        2025 foi anunciado um CLAIM para a comunidade académica migrante e, em
        agosto de 2026, uma página pública identificava a sua equipa e
        contacto; a utilização, os tipos de apoio prestados e os encaminhamentos
        para cuidados de saúde não estão estabelecidos. ULS do Alentejo Central:
        não foi encontrada informação documentada dos serviços de saúde que
        estabeleça se interpretação, tradução ou mediação reduziram barreiras
        de língua na cidade."
      current_action: Em 25 de outubro de 2026 foram enviados três pedidos de
        informação distintos, todos a aguardar resposta. À ULS do Alentejo
        Central, sobre interpretação, tradução e mediação nas unidades de saúde
        da cidade; à equipa do projeto Acolher no VAGAR do Município, sobre as
        atividades realizadas, a participação e os apoios relacionados com a
        língua e com o acesso à saúde; e à Universidade de Évora, sobre o
        funcionamento e a utilização do CLAIM. Não há números agregados
        verificados sobre a execução e os resultados do Acolher no VAGAR, nem
        sobre a utilização e os encaminhamentos do CLAIM.
      resolution_condition: Informação específica, datada e verificável que
        permita distinguir, para cada apoio, a disponibilidade efetiva, a
        população e a área abrangidas, a utilização quando registada, os
        encaminhamentos para cuidados de saúde quando existam, os resultados no
        acesso à saúde quando mensuráveis e as limitações dos dados. Não se
        exige ao Município ou à Universidade informação clínica. A atividade de
        um programa não basta, por si só, para concluir que melhorou o acesso à
        saúde.
      evidence:
        - EVD-000151
        - EVD-000152
  path:
    initial_signal:
      summary: O Município apresentou em 2026 conclusões de um diagnóstico
        de 2023 sobre pessoas migrantes do concelho, incluindo barreiras de
        língua e dificuldades de acesso à saúde e à saúde mental. A AIMA
        contou cidadãos estrangeiros residentes no concelho em 2024; essa
        contagem não mede as barreiras.
      evidence:
        - EVD-000149
        - EVD-000150
    development:
      summary: Foram identificados os objetivos do projeto municipal Acolher
        no VAGAR e o CLAIM da Universidade de Évora, destinado à comunidade
        académica migrante da Universidade. Informação nacional
        descreve dificuldades semelhantes no acesso de pessoas imigrantes aos
        cuidados de saúde primários, sem medir a situação em Évora.
      evidence:
        - EVD-000151
        - EVD-000152
        - EVD-000153
    delimitation:
      summary: A dificuldade aqui descrita é o acesso à saúde e à saúde mental,
        sem abranger emprego ou habitação. O Hospital do Espírito Santo situa-se
        na cidade, mas o diagnóstico municipal de 2023 não mede dificuldades
        nesse hospital nem permite estimar a sua frequência na cidade. A
        existência de respostas de integração não prova que as dificuldades
        tenham sido resolvidas; a sua persistência em 2026 continua por
        confirmar.
      evidence:
        - EVD-000149
        - EVD-000151
        - EVD-000152
        - EVD-000153
        - EVD-000181
