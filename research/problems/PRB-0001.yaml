decision_basis:
  contract_version: "0.1"

  eligibility_basis: "PRB-0001 is a distinct, well-formed problem of investigation: it names a specific, bounded civic-service concern (practical public-transport utility varying by time period and territory/service context) with a bounded geography (Município de Évora), a named affected population (residents who depend on public transport), and an institutionally documented manifestation (EVD-000001, EVD-000002, EVD-000011, EVD-000117) showing that this variance is a recognized, recurring feature of the service rather than an assumption. Weak/anecdotal lived evidence (EVD-000079, EVD-000080) adds concrete, if unverified, instances of practical journeys and operational incidents consistent with that institutionally documented variance; it is not relied on here to establish population-wide prevalence or equity, only to show the manifestation has concrete, resident-facing instances. EVD-000024 documents an existing flexible-transport solution for named low-demand locations and is deliberately not used as manifestation evidence: it shows a stronger 'absence of service/response in low-demand territories' framing would be inaccurate, while the remaining, evidenced gap is about practical utility, schedule/territory variation and unresolved effectiveness, not absence of any response. It is not framed as a solution ('need for an app') and does not overlap another canonical PRB-*."

  corroboration_basis: "Corroboration rests on institutional evidence that consistently and repeatedly documents practical public-transport utility varying by time period, journey/service context and lower-demand territories, while overall network coverage remains broad. EVD-000001 (PDS 2024-2027, SRC-0002) is a distinct institutional-planning thread that independently raises effective public-transport connectivity as a concern for residents dependent on it. EVD-000002 (2026 municipal Transport Authority annual report, SRC-0018) is the current primary-authoritative source stating that the urban network covers practically all of urban Évora by day but reduces service at night, on weekends and on holidays. EVD-000117 (2022/2023 editions of the same report series) confirms, in wording matching the current 2026 report, that this same day/night-weekend-holiday variance pattern is not a new or transient observation but a documented multi-year feature of the network, strengthening currentness/persistence without adding a new independent institutional voice (same lineage family as SRC-0018). EVD-000011 (CIMAC/ATAC 2026 annual evaluation, SRC-0019) contributes CONFIRMS+REFINES at intermunicipal level: its complaint dataset shows schedule-related communications are the largest category and that access/waiting-related experience is weaker than onboard experience; this is treated as context/refinement consistent with the same time/service-context variance claim, not as an equally weighted, strong independent direct-support thread on its own — a distinct source/lineage (SRC-0019) does not by itself make it equivalent direct corroboration to the primary-authoritative manifestation sources. Weak/anecdotal lived evidence (EVD-000079, EVD-000080) establishes concrete instances and consequences consistent with the institutional claim but is explicitly not used to establish prevalence or equity at population scale, and is not counted as additional independent institutional corroboration. EVD-000024 (existing flexible-transport provision for named low-demand locations), together with rising ridership (EVD-000023) and broad TPAC/TPF coverage (EVD-000027), is boundary/current-state evidence that narrows the claim — showing the network is materially used, broadly present, and already responds in some form to low-demand territories — and is deliberately excluded from direct corroboration/supporting evidence for the manifestation claim."

  manifestation:
    kind: "service-utility variance / temporal-territorial adequacy gap"
    summary: "Institutional evidence establishes that practical public-transport utility in Évora is not uniform: the current municipal Transport Authority annual report (EVD-000002) states the urban network covers practically all of urban Évora during the day but reduces service at night, on weekends and on holidays. The 2022/2023 editions of the same report (EVD-000117) confirm this is a persistent, multi-year pattern rather than a new or transient one. EVD-000001 (municipal social-development plan) independently raises effective public-transport connectivity as a concern for residents dependent on it, citing specific lines and schedules. EVD-000011 (intermunicipal CIMAC/ATAC evaluation) contributes contextual/refining institutional signal — schedule-related communications as the largest complaint category and access/waiting experience weaker than onboard experience — consistent with, but not itself an equally weighted independent establishment of, the same time/service-context variance. EVD-000024 (existing flexible-transport provision for named low-demand locations) is deliberately excluded from this manifestation evidence: it documents an existing solution response, not the variance failure itself, and is treated instead as boundary/current-state evidence (see below)."
    evidence:
      - "EVD-000001"
      - "EVD-000002"
      - "EVD-000011"
      - "EVD-000117"

  consequence:
    summary: "Weak, anecdotal, self-selected lived evidence establishes concrete, if unverified, instances where this institutionally documented variance affected specific journeys, and nothing beyond those instances: EVD-000079 reports university students at a specific campus describing a March 2026 protest over limited practically-usable transport options, full buses, and long effective travel times for a specific campus/industrial-zone commute — one protest/event lineage, reported experience only, representativeness UNKNOWN. EVD-000080 reports individual, self-selected TREVO complaint-surface incidents (a delayed bus, a service interruption, a bus that did not stop) consistent with operational-reliability failure modes — distinct incident reports on one complaint platform, not system-wide rate evidence, representativeness UNKNOWN. Both establish only that concrete instances and consequences occur; neither is treated as, nor may be read as, evidence of the frequency or prevalence of resident-experienced failure, nor as a population-wide or equity conclusion, which remain open and unestablished (ASM-0001 U1/U2)."
    evidence:
      - "EVD-000079"
      - "EVD-000080"

  currentness:
    assessment: "HIGH for the institutional manifestation claim. EVD-000002 (2026 report, SRC-0018, retrieved 2026-08-10) is the current primary-authoritative statement of the day/night-weekend-holiday variance and remains the most current institutional evidence on record. EVD-000117 (2022/2023 editions, directly verified 2026-08-12) confirms the same variance pattern is persistent across at least three annual editions rather than newly observed, which strengthens persistence without changing the current-state claim itself. EVD-000079/EVD-000080 are current-period (2025-2026) lived-experience signals consistent with the institutional claim. No current line/corridor-level severity dataset was located (ASM-0001 U1 remains open); this currentness assessment covers the manifestation claim as scoped, not line-level current severity."
    evidence:
      - "EVD-000002"
      - "EVD-000117"

  contradiction_search:
    performed: true
    summary: "ASM-0001 (2026-08-12, RS-02A) records a deliberate search for evidence that would contradict or supersede the institutionally documented variance claim, including direct verification of the 2022 and 2023 municipal Transport Authority annual reports (EVD-000117) and a check of TREVO's public schedules page and Évora's flexible-transport initiative for evidence that the variance no longer holds. No contradicting evidence was found; EVD-000117 instead confirmed the same pattern is persistent rather than new or transient. Rising ridership (EVD-000023), broad TPAC/TPF coverage (EVD-000027), and existing flexible-transport provision (EVD-000024) were actively considered and preserved as boundary evidence narrowing a broader failure claim, not omitted or treated as contradicting the manifestation."
    evidence:
      - "EVD-000117"

  overlap_check:
    performed: true
    summary: "No other canonical PRB-* addresses public-transport service-utility/temporal-territorial adequacy in Évora; PRB-0001 does not duplicate or overlap another record. EVD-000011 and EVD-000080 are also linked to PRB-0002 for a distinct information/interoperability angle, not for this problem's service-utility-variance claim."
    related_problems: []

  corroboration_statement: "A cobertura dos transportes públicos em Évora é, em termos globais, ampla, mas a evidência institucional indica que a utilidade prática do serviço varia consoante o período horário, o tipo de deslocação e os locais de baixa procura, continuando a articulação entre horários e frequências a ser uma preocupação documentada."

  supporting_evidence:
    - "EVD-000001"
    - "EVD-000002"
    - "EVD-000011"
    - "EVD-000117"

  boundary_evidence:
    - "EVD-000023"
    - "EVD-000024"
    - "EVD-000027"

  independence_assessment: "The direct-support (manifestation/supporting) evidentiary base rests on effectively two institutional voices, not four independent ones (ASM-0001, 2026-08-12 notes). EVD-000002 and EVD-000117 (SRC-0018 and its 2022/2023 predecessors SRC-0101/SRC-0102) share one lineage — the municipal Transport Authority annual report series — and are treated as the same institutional-voice family for independence purposes despite a distinct source_id per year; EVD-000117's role is corroborating persistence of the same claim across editions, not adding a second independent voice. EVD-000011 (SRC-0019, the CIMAC/ATAC annual evaluation) is a materially distinct institution at intermunicipal level, but its canonical contribution is CONFIRMS+REFINES/context rather than a standalone primary-authoritative statement of the urban day/night-weekend-holiday variance itself; distinct source/lineage from SRC-0018 does not by itself make it an equivalent direct-support thread, so it is retained as corroborating context rather than weighted as a second strong independent pillar. EVD-000001 (SRC-0002, PDS 2024-2027) is a genuinely distinct institutional-planning thread and the second materially independent voice supporting the manifestation claim. EVD-000079 (SRC-0066) and EVD-000080 (SRC-0067) are two independent lived-experience threads, distinct in kind from institutional communication, but are explicitly not counted as population-scale prevalence or equity evidence, and EVD-000080 in particular is not treated as representative lived evidence — its role is limited to corroborating that concrete, resident-facing operational incidents consistent with the institutional claim occur, with UNKNOWN representativeness. EVD-000024 (SRC-0018 lineage, EXISTING-SOLUTION contribution) is excluded from this independence count entirely: it is boundary/current-state evidence about an existing flexible-transport response, not a corroborating thread for the variance claim. Net: institutional corroboration for the bounded claim rests on two materially distinct institutional voices (the municipal Transport Authority report family, corroborated for persistence across editions, and the PDS institutional-planning source), with the intermunicipal CIMAC/ATAC evaluation (EVD-000011) contributing supporting context rather than an equally weighted third pillar; this does not establish population-wide materiality or a general equity disparity, which remain open (ASM-0001 U1/U2, evidence_confidence.independence MEDIUM)."

  scope:
    geography: "Município de Évora (municipality-level); EVD-000011/EVD-000027 additionally carry intermunicipal (Alentejo Central / CIMAC) evidence, used here only where it bears on Évora's own service-utility-variance claim, not as a basis for a broader regional claim. EVD-000028 (ATAC region-wide student/young-people passenger-segment share) is not used to bound this scope: its own record notes it must not be interpreted as the demographic split of TREVO urban Évora passengers, so it is kept as contextual prose only and not cited as boundary_evidence here."
    population: "Residents who depend on public transport in the Município de Évora, including identifiable but bounded sub-populations named on record (students commuting to a specific campus, users dependent on evening/weekend/holiday service, residents of named low-demand locations); not evidenced as a population-wide or municipality-wide claim."
    temporal: "Bounded to the period documented on record: institutional evidence spans 2022-2026 (persistent day/night-weekend-holiday pattern, EVD-000117, EVD-000002); lived-experience evidence is dated March 2026 (EVD-000079) and October 2025-February 2025 (EVD-000080, individually dated incidents on a historical-relevance record). The claim does not extend to, and is not corroborated for, a current (2026) line/corridor-level severity comparison, which remains open (ASM-0001 U1)."
    bounded: true

  limitations: "The corroborated claim is SUPPORTED only as follows: institutional evidence consistently shows that practical public-transport utility in Évora varies by time period, journey/service context and lower-demand territories, while overall coverage may still be broad. It is NOT SUPPORTED as: a population-wide materiality claim; a demonstrated general equity disparity; a claim of severe current deficiency on any specific line/corridor; a claim about the frequency or prevalence of resident-experienced failure; or a claim that public transport is generally absent or declining. Rising ridership (EVD-000023), broad TPAC/TPF coverage (EVD-000027), and existing flexible-transport provision (EVD-000024) are included as boundary/current-state evidence narrowing the claim — they show a stronger 'absence of service/response in low-demand territories' framing would be inaccurate, and that the remaining, evidenced gap is about practical utility, schedule/territory variation and unresolved effectiveness, not absence of any response — and are deliberately excluded from manifestation/direct-support evidence and must not be read as showing the practical-utility gap is closed. EVD-000011's canonical contribution is CONFIRMS+REFINES/context at intermunicipal level; it is retained as corroborating context for the same variance claim and is not treated as an equally weighted independent direct-support thread on its own, since a distinct source/lineage does not by itself establish equivalent direct corroboration. EVD-000028 is excluded from boundary_evidence: its own record explicitly warns against interpreting a regional ATAC student/young-people passenger share as the demographic split of TREVO urban Évora passengers, so it does not genuinely bound this claim's geography or population and is kept only as contextual prose (see scope.geography). EVD-000079 and EVD-000080 support only that concrete instances and operational incidents occur; they are anecdotal, self-selected, and UNKNOWN representativeness, and are not treated as, and must not be strengthened into, prevalence or population-wide equity evidence — EVD-000080 in particular is not treated as representative lived evidence. Which specific lines/corridors/time periods experience the strongest reduction, and in what measure, is not established (ASM-0001 U1, U2 remain open); no inference is drawn about current line-level severity from those open critical unknowns. `lineage_id` count is not read as semantic independence: repeated annual-report records from the same institutional voice (SRC-0018 and its 2022/2023 predecessors, EVD-000117) are grouped for independence purposes despite differing source_id per year."
