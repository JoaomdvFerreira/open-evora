decision_basis:
  contract_version: "0.1"
  eligibility_basis: >-
    PRB-0001 constitui um problema de investigação distinto e bem definido:
    diferenças temporais documentadas na oferta de serviço prevista da rede
    urbana de transportes públicos de Évora — redução à noite, aos fins de
    semana e nos feriados — e atrasos recorrentes documentados nas horas de
    ponta em dois corredores, ficando por estabelecer as consequências
    práticas nas deslocações. Tem uma geografia delimitada (Município de
    Évora), uma população afetada identificada (residentes que dependem dos
    transportes públicos) e uma manifestação documentada por fontes
    institucionais (EVD-000002, EVD-000117, EVD-000157, EVD-000158), com a
    preocupação de planeamento do PDS (EVD-000001) como sinal institucional
    distinto.


    Os relatos de experiência vivida (EVD-000079, EVD-000080) registam
    dificuldades e incidentes operacionais reportados, sem verificação
    independente da ocorrência ou do impacto. Não são utilizados para
    estabelecer prevalência, impacto ou desigualdade à escala da população.


    EVD-000002 documenta também uma resposta existente de transporte flexível
    para localidades de baixa procura e não é utilizado, nessa parte, como
    evidência da manifestação; mostra que uma formulação de «ausência de
    serviço ou de resposta» seria incorreta. O problema não é formulado como
    uma solução e distingue-se de PRB-0002, que trata da informação aos
    passageiros nas paragens.
  corroboration_basis: >-
    A corroboração assenta em evidência institucional que documenta, de forma
    repetida, a redução da oferta da rede urbana à noite, aos fins de semana e
    nos feriados, apesar da cobertura diurna de praticamente toda a zona urbana
    de Évora, e em dados oficiais de 2025 sobre a oferta prevista por carreira
    e tipo de dia e sobre atrasos recorrentes nas horas de ponta.


    EVD-000002 (relatório de 2026 da Autoridade de Transportes municipal,
    SRC-0018, referente a 2025) é a fonte primária e oficial mais atual para o
    padrão temporal. EVD-000117 (edições de 2022 e 2023 da mesma série)
    confirma o mesmo padrão em anos anteriores, reforçando a sua persistência
    sem acrescentar uma voz institucional independente.


    EVD-000157 e EVD-000158, do mesmo relatório de 2026, refinam a leitura para
    2025. O quadro anual de oferta prevista mostra diferenças por carreira e
    tipo de dia, com 9 das 13 carreiras e percursos representados sem oferta
    prevista indicada ao domingo/feriado; este quadro não é o horário
    operacional de uma data concreta. O relatório identifica atrasos
    recorrentes nas horas de ponta em dois corredores, com indicadores de
    pontualidade agregados. Ambos pertencem à família institucional de
    SRC-0018.


    EVD-000001 (PDS 2024-2027, SRC-0002) constitui uma linha distinta de
    planeamento institucional que refere as linhas e os horários como
    preocupação para residentes que dependem do serviço; não mede a oferta nem
    os efeitos nas deslocações e não é uma medição específica da cidade.


    EVD-000011 (avaliação anual CIMAC/ATAC de 2026, SRC-0019) acrescenta
    contexto intermunicipal: as comunicações relativas a horários são a maior
    categoria no serviço TPAC, muitas como pedidos de criação ou sincronização
    de horários. Não descreve a rede urbana TREVO e não é contado como
    corroboração direta.


    EVD-000079 e EVD-000080 documentam relatos não verificados e não são
    contabilizados como corroboração institucional independente. O
    crescimento da utilização (EVD-000023), os passageiros dos lotes
    intermunicipais (EVD-000027) e o transporte flexível documentado em
    EVD-000002 limitam uma leitura de ausência geral de serviço e não provam
    adequação prática.
  manifestation:
    kind: redução temporal da oferta de serviço prevista / atrasos recorrentes nas horas de ponta
    summary: >-
      Os relatórios anuais da Autoridade de Transportes municipal documentam que
      a rede urbana cobre praticamente toda a zona urbana de Évora durante o dia
      e reduz a oferta à noite, aos fins de semana e nos feriados: no relatório
      de 2026, referente a 2025 (EVD-000002), e nas edições de 2022 e 2023
      (EVD-000117), da mesma família institucional.


      Para 2025, o quadro anual de oferta prevista por carreira e tipo de dia
      (EVD-000157), medida em quilómetros comerciais, mostra diferenças entre
      carreiras: em 9 das 13 carreiras e percursos representados, o quadro não
      indica oferta prevista ao domingo/feriado, e as carreiras com oferta
      nesse tipo de dia têm um volume previsto inferior ao dos dias úteis. O
      quadro não é o horário operacional de uma data concreta, e células sem
      quilómetros não provam, por si só, ausência de serviço numa data.


      O mesmo relatório (EVD-000158) identifica atrasos recorrentes em 2025 nas
      horas de ponta (08h00–09h30 e 17h00–19h00), que associa a trânsito lento,
      nas principais artérias de acesso ao Centro Histórico e, em particular, na
      circular de acesso ao Parque Industrial. Os indicadores de regularidade
      (99,5%) e o índice de pontualidade de 84,4% (atraso inferior a 5 minutos)
      são agregados e não identificam carreiras, partidas ou paragens.


      O PDS 2024-2027 (EVD-000001) refere as linhas e os horários como
      preocupação de planeamento institucional, sem medir a oferta. A avaliação
      CIMAC/ATAC (EVD-000011) acrescenta contexto intermunicipal sobre
      comunicações relativas a horários no serviço TPAC, sem descrever a rede
      urbana.


      A manifestação consiste em diferenças temporais documentadas na oferta de
      serviço prevista e em atrasos recorrentes documentados nas horas de
      ponta; as consequências práticas nas deslocações permanecem por
      estabelecer. O transporte flexível documentado em EVD-000002 não é
      utilizado como evidência da manifestação; documenta uma resposta
      existente e delimita a conclusão.
    evidence:
      - EVD-000001
      - EVD-000002
      - EVD-000011
      - EVD-000117
      - EVD-000157
      - EVD-000158
  consequence:
    summary: >-
      Evidência de experiência vivida, de natureza anedótica e autosselecionada,
      documenta relatos de dificuldades em deslocações específicas, sem
      verificação independente da ocorrência ou do impacto relatado e sem
      permitir generalizar para a população.


      EVD-000079 relata que cerca de 30 estudantes da Universidade de Évora se
      manifestaram, em março de 2026, pedindo horários adicionais de
      transporte; a reportagem refere uma petição com mais de 250 assinaturas e
      relatos de opções pouco utilizáveis na prática, autocarros cheios e
      tempos efetivos de deslocação longos. Trata-se de experiência reportada
      num único evento, de representatividade desconhecida, e a resposta
      institucional à petição não está estabelecida.


      EVD-000080 documenta três reclamações individuais de 2025 numa plataforma
      pública independente sobre o TREVO: um atraso, uma interrupção do serviço
      e um autocarro que não parou após sinalização. São relatos
      autosselecionados, e não dados sobre a frequência destas ocorrências na
      rede.


      Esta evidência demonstra a existência dos relatos, não a ocorrência
      independente das situações nem o impacto descrito nas deslocações. As
      consequências práticas da oferta e dos atrasos documentados permanecem
      uma questão aberta.
    evidence:
      - EVD-000079
      - EVD-000080
  currentness:
    assessment: >-
      A redução temporal da oferta está documentada nas edições de 2022 e 2023
      e no relatório de 2026 referente a 2025; EVD-000157 e EVD-000158 delimitam
      para 2025 a oferta prevista por carreira e tipo de dia e os atrasos
      recorrentes por corredor e período. Estes registos não estabelecem que a
      mesma configuração de oferta nem os mesmos atrasos persistam em outubro
      de 2026. EVD-000079 e EVD-000080 acrescentam relatos de 2025-2026, mas
      não estabelecem essa persistência. Os horários públicos em vigor ainda
      não foram consultados; essa consulta é uma ação de investigação
      pendente.
    evidence:
      - EVD-000002
      - EVD-000117
      - EVD-000157
      - EVD-000158
  contradiction_search:
    performed: true
    summary: >-
      Foi realizada uma procura deliberada de evidência que pudesse contradizer
      ou ultrapassar a leitura institucional de redução da oferta à noite, aos
      fins de semana e nos feriados.


      A procura considerou as edições de 2022 e 2023 dos relatórios anuais da
      Autoridade de Transportes municipal (EVD-000117) e o transporte flexível
      documentado em EVD-000002 para localidades de baixa procura. Não foi
      encontrada evidência que contradiga a manifestação delimitada; EVD-000117
      confirma o mesmo padrão em anos anteriores. Esta revisão não realizou
      nova pesquisa.


      O crescimento da utilização da rede (EVD-000023), os passageiros dos
      lotes intermunicipais (EVD-000027), o transporte flexível (EVD-000002), a
      regularidade agregada de 99,5% reportada para 2025 (EVD-000158) e a oferta
      prevista ao fim de semana em algumas carreiras, embora reduzida face aos
      dias úteis (EVD-000157), restringem uma leitura mais abrangente. Mostram
      que não há ausência generalizada de serviço, mas não demonstram que a
      oferta seja adequada nem que os atrasos estejam resolvidos.
    evidence:
      - EVD-000117
      - EVD-000157
      - EVD-000158
  overlap_check:
    performed: true
    summary: >-
      Nenhum outro PRB-* canónico aborda a oferta de serviço e a pontualidade
      da rede urbana de transportes públicos de Évora. PRB-0002 está
      relacionado, mas é distinto: trata da informação aos passageiros e de
      elementos de acessibilidade nas paragens descritas pelo PMUSE. Os atrasos
      documentados neste registo não são evidência do problema de informação de
      PRB-0002, e as lacunas de informação nas paragens não explicam a oferta
      nem a pontualidade aqui documentadas. PRB-0005 trata do tráfego motorizado
      e da segurança rodoviária; a atribuição municipal de atrasos dos autocarros
      ao tráfego lento não altera o foco deste problema na oferta e pontualidade.


      EVD-000011 está também ligado a PRB-0002, por uma questão distinta de
      informação aos passageiros. EVD-000080 está ligado apenas a PRB-0001.
    related_problems:
      - PRB-0002
      - PRB-0005
  corroboration_statement: Os relatórios municipais referentes a 2022, 2023 e
    2025 documentam redução da oferta da rede urbana à noite, aos fins de
    semana e nos feriados. Dados oficiais de 2025 mostram diferenças de oferta
    prevista por carreira e tipo de dia e atrasos recorrentes nas horas de
    ponta em dois corredores. Os efeitos práticos nas deslocações não estão
    estabelecidos.
  supporting_evidence:
    - EVD-000001
    - EVD-000002
    - EVD-000117
    - EVD-000157
    - EVD-000158
  boundary_evidence:
    - EVD-000023
    - EVD-000002
    - EVD-000027
  independence_assessment: >-
    A base institucional que sustenta diretamente esta leitura assenta, na
    prática, em duas vozes institucionais materialmente distintas, e não em
    quatro fontes independentes.


    EVD-000002 e EVD-000117 (SRC-0018 e os seus antecedentes de 2022/2023,
    SRC-0101/SRC-0102) pertencem à mesma linhagem — a série de relatórios anuais
    da Autoridade de Transportes municipal — e são tratados como uma única
    família de voz institucional para efeitos de independência, apesar de cada
    edição possuir um identificador de fonte distinto. O papel de EVD-000117 é
    corroborar a persistência da mesma afirmação ao longo de várias edições, e
    não acrescentar uma segunda voz independente. EVD-000157 e EVD-000158
    provêm do mesmo relatório de 2026 (SRC-0018) e refinam a leitura sem
    acrescentar independência.


    EVD-000011 (SRC-0019, avaliação anual CIMAC/ATAC) provém de uma instituição
    materialmente distinta ao nível intermunicipal, mas a sua contribuição
    canónica é de suporte, refinamento e contexto, e não uma afirmação primária
    e oficial autónoma sobre a variação entre serviço diurno, noturno, de fim de
    semana e de feriados na rede urbana. Uma fonte e linhagem distintas de
    SRC-0018 não tornam, por si só, esta evidência numa linha equivalente de
    suporte direto; é mantida como contexto corroborativo, e não como um segundo
    pilar independente com o mesmo peso.


    EVD-000001 (SRC-0002, PDS 2024-2027) constitui uma linha de planeamento
    institucional genuinamente distinta e a segunda voz materialmente
    independente que sustenta a manifestação.


    EVD-000079 (SRC-0066) e EVD-000080 (SRC-0067) constituem duas linhas
    independentes de experiência vivida, distintas das comunicações
    institucionais. Contudo, não são contabilizadas como evidência de
    prevalência ou desigualdade à escala da população. Em particular, EVD-000080
    não é tratado como evidência representativa da experiência vivida; o seu
    papel limita-se a documentar relatos de incidentes operacionais e do
    impacto alegado pelos utilizadores, compatíveis com a afirmação
    institucional, mantendo representatividade DESCONHECIDA.


    O transporte flexível documentado em EVD-000002 funciona como evidência
    de limite e de estado atual, não como linha independente de corroboração.
    A descrição da variação entre a oferta diurna e a oferta à noite, aos fins
    de semana e nos feriados no mesmo registo mantém o seu papel de suporte.


    Em síntese, a corroboração institucional da afirmação delimitada assenta em
    duas vozes institucionalmente distintas — a família de relatórios da
    Autoridade de Transportes municipal, corroborada ao longo de várias edições,
    e a fonte de planeamento institucional do PDS —, sendo complementada pela
    avaliação intermunicipal CIMAC/ATAC como contexto de suporte, e não como um
    terceiro pilar de igual peso. Isto não estabelece materialidade à escala da
    população nem uma desigualdade generalizada. A independência da evidência é,
    por isso, avaliada como MÉDIA.
  scope:
    geography: >-
      Município de Évora. A evidência sobre oferta e pontualidade (EVD-000002,
      EVD-000117, EVD-000157, EVD-000158) refere-se à rede urbana; EVD-000001 e
      a parte de EVD-000002 relativa ao transporte flexível abrangem também
      contexto municipal e localidades de baixa procura. EVD-000011 e
      EVD-000027 incluem evidência à escala intermunicipal do Alentejo
      Central/CIMAC, utilizada apenas quando ajuda a interpretar a situação
      específica de Évora e não como fundamento para uma afirmação regional mais
      ampla.
    population: >-
      Residentes que dependem dos transportes públicos no Município de Évora,
      em particular utilizadores da rede urbana à noite, aos fins de semana e
      nos feriados e nos corredores com atrasos recorrentes nas horas de ponta.
      Os relatos ligados referem também estudantes da Universidade de Évora; o
      transporte flexível abrange residentes de localidades de baixa procura.


      A evidência não permite generalizar a conclusão para toda a população do
      município.
    temporal: >-
      Circunscrito ao período documentado no registo. A evidência institucional
      abrange as edições de 2022 e 2023 e o relatório de 2026 referente a 2025,
      e mostra a persistência do padrão de redução da oferta à noite, aos fins
      de semana e nos feriados (EVD-000117, EVD-000002).


      EVD-000157 documenta a oferta prevista por carreira e tipo de dia em
      2025; EVD-000158 documenta, também para 2025, indicadores agregados e
      corredores e períodos de atrasos recorrentes. Embora constem do relatório
      de 2026, estes elementos não descrevem diretamente o horário nem o
      desempenho em outubro de 2026.


      A evidência de experiência vivida inclui o protesto estudantil de março de
      2026 (EVD-000079) e incidentes individuais reportados entre fevereiro e
      outubro de 2025 (EVD-000080).


      A conclusão não se estende ao horário em vigor nem aos efeitos atuais nas
      deslocações, como espera, ligações ou impossibilidade de viajar à hora
      necessária. Essas questões continuam em aberto.
    bounded: true
  limitations: >-
    A afirmação corroborada é SUPORTADA apenas nos seguintes termos: relatórios
    institucionais documentam, em vários anos, redução da oferta da rede urbana
    à noite, aos fins de semana e nos feriados; para 2025, a oferta prevista
    difere por carreira e tipo de dia e há atrasos recorrentes nas horas de
    ponta em dois corredores identificados de forma agregada.


    NÃO É SUPORTADA como: uma afirmação de que a utilidade prática do serviço
    ou os efeitos nas deslocações estão estabelecidos; uma variação por tipo de
    deslocação; uma afirmação de impacto material à escala da população; uma
    desigualdade geral demonstrada; uma atribuição dos atrasos a carreiras,
    partidas ou paragens concretas; uma afirmação sobre a frequência das falhas
    sentidas pelos residentes; ou uma afirmação de que os transportes públicos
    estão, em termos gerais, ausentes ou em declínio.


    EVD-000157 mede volume de oferta prevista em quilómetros comerciais por
    tipo de dia; não estabelece número de partidas, intervalos, tempos de
    espera, capacidade ou utilidade de uma deslocação concreta. Células sem
    quilómetros no quadro não são tratadas como prova de ausência de serviço
    numa data concreta, e o quadro não substitui a consulta do horário
    operacional. EVD-000158 apresenta indicadores agregados e não permite
    atribuir os atrasos no Parque Industrial a carreiras específicas que
    sirvam essa zona.


    O crescimento da utilização urbana (EVD-000023), os passageiros dos lotes
    intermunicipais (EVD-000027) e a cobertura diurna urbana e o transporte
    flexível documentados em EVD-000002 restringem uma leitura de ausência
    geral de serviço, dentro dos respetivos âmbitos, e não devem ser
    interpretados como demonstração de adequação prática.


    O uso canónico de EVD-000011 é de contexto intermunicipal e não é tratado
    como uma linha independente de suporte direto, uma vez que não descreve a
    rede urbana TREVO.


    EVD-000079 e EVD-000080 suportam a existência de relatos, não a sua
    verificação independente. São evidência anedótica, autosselecionada e de
    representatividade DESCONHECIDA e não são tratados como evidência de
    prevalência ou de desigualdade à escala da população. O número de
    `lineage_id` não é interpretado como independência semântica: registos de
    diferentes edições anuais da mesma voz institucional (SRC-0018 e os seus
    antecedentes de 2022/2023, EVD-000117) são agrupados para efeitos de
    avaliação da independência.
history:
  - date: 2026-08-31
    summary: O contexto de serviço de 2025 foi mais delimitado, mas não foi possível
      estabelecer uma deslocação atual reproduzível por linha, paragem e
      partida; a investigação passa a aguardar dados operacionais atuais ou uma
      deslocação afetada delimitada.
  - date: 2026-10-12
    summary: O problema foi reformulado para descrever a oferta e a pontualidade
      documentadas, sem dar por estabelecida a utilidade prática do serviço.
      Separou as dúvidas sobre oferta atual, atrasos nas horas de ponta,
      resposta à petição estudantil e efeitos nas deslocações, substituiu a
      ação anterior por consulta de fontes públicas e pedido documental e
      passou a distinguir-se do PRB-0002.
