decision_basis:
  contract_version: "0.1"
  eligibility_basis: >-
    PRB-0001 constitui um problema de investigação distinto e bem definido:
    identifica uma preocupação cívica específica e delimitada relativa a um
    serviço público — a utilidade prática dos transportes públicos varia
    consoante o período e o contexto territorial e do serviço —, com uma
    geografia delimitada (Município de Évora), uma população afetada
    identificada (residentes que dependem dos transportes públicos) e uma
    manifestação documentada institucionalmente (EVD-000001, EVD-000002,
    EVD-000011, EVD-000117), mostrando que esta variação é uma característica
    reconhecida e recorrente do serviço, e não uma suposição.


    Evidência de experiência vivida fraca e anedótica (EVD-000079, EVD-000080)
    acrescenta situações concretas, embora não verificadas, de deslocações e
    incidentes operacionais compatíveis com essa variação documentada
    institucionalmente. Esta evidência não é utilizada para estabelecer
    prevalência ou desigualdade à escala da população, mas apenas para
    demonstrar que a manifestação possui situações concretas com impacto nos
    utilizadores.


    EVD-000002 documenta uma solução existente de transporte flexível para
    locais identificados de baixa procura e não é deliberadamente utilizado como
    evidência da manifestação. Mostra que uma formulação mais forte de «ausência
    de serviço ou de resposta nos territórios de baixa procura» seria incorreta;
    a lacuna que permanece documentada diz respeito à utilidade prática, à
    variação consoante horários e territórios e à eficácia ainda por esclarecer,
    e não à ausência de qualquer resposta. O problema não é formulado como uma
    solução («é necessária uma aplicação») e não duplica nem se sobrepõe a outro
    PRB-* canónico.
  corroboration_basis: >-
    A corroboração assenta em evidência institucional que documenta de forma
    consistente e repetida que a utilidade prática dos transportes públicos
    varia consoante o período, o contexto da deslocação ou do serviço e os
    territórios de menor procura, apesar de a cobertura global da rede
    permanecer ampla.


    EVD-000001 (PDS 2024-2027, SRC-0002) constitui uma linha distinta de
    planeamento institucional que identifica de forma independente a
    conectividade efetiva dos transportes públicos como uma preocupação para
    residentes que dependem do serviço.


    EVD-000002 (relatório anual de 2026 da Autoridade de Transportes municipal,
    SRC-0018) é a fonte primária e oficial mais atual, indicando que a rede
    urbana cobre praticamente toda a cidade de Évora durante o dia, mas reduz o
    serviço à noite, aos fins de semana e nos feriados.


    EVD-000117 (edições de 2022 e 2023 da mesma série de relatórios) confirma,
    com formulação equivalente à do relatório atual de 2026, que este padrão de
    variação entre dia, noite, fins de semana e feriados não constitui uma
    observação nova ou transitória, mas uma característica documentada da rede
    ao longo de vários anos. Isto reforça a atualidade e persistência da leitura
    sem acrescentar uma nova voz institucional independente, por pertencer à
    mesma linhagem documental de SRC-0018.


    EVD-000011 (avaliação anual CIMAC/ATAC de 2026, SRC-0019) contribui como
    sustenta e refina a leitura ao nível intermunicipal: o conjunto de
    reclamações mostra que as comunicações relacionadas com horários constituem
    a maior categoria e que a experiência de acesso e espera é menos favorável
    do que a experiência a bordo. É tratado como contexto e refinamento coerente
    com a mesma afirmação de variação temporal e do contexto do serviço, e não,
    por si só, como uma linha independente de suporte direto com o mesmo peso
    das fontes primárias da manifestação. A existência de uma fonte e linhagem
    distintas (SRC-0019) não é suficiente para a tornar equivalente às fontes
    primárias e oficiais de corroboração direta.


    A evidência de experiência vivida fraca e anedótica (EVD-000079, EVD-000080)
    estabelece situações e consequências concretas compatíveis com a afirmação
    institucional, mas não é utilizada para estabelecer prevalência ou
    desigualdade à escala da população, nem é contabilizada como corroboração
    institucional independente adicional.


    EVD-000002, que documenta transporte flexível existente em locais de baixa
    procura, em conjunto com o crescimento da utilização (EVD-000023) e a ampla
    cobertura TPAC/TPF (EVD-000027), constitui evidência de limite e de estado
    atual que restringe a afirmação: mostra que a rede é materialmente
    utilizada, tem presença territorial ampla e já oferece alguma resposta a
    territórios de baixa procura. Por essa razão, estes registos são
    deliberadamente excluídos da corroboração direta e da evidência de suporte
    da manifestação.
  manifestation:
    kind: variação da utilidade do serviço / lacuna de adequação temporal-territorial
    summary: >-
      A evidência institucional estabelece que a utilidade prática dos
      transportes públicos em Évora não é uniforme. O relatório anual atual da
      Autoridade de Transportes municipal (EVD-000002) indica que a rede urbana
      cobre praticamente toda a cidade de Évora durante o dia, mas reduz o
      serviço à noite, aos fins de semana e nos feriados. As edições de 2022 e
      2023 do mesmo relatório (EVD-000117) confirmam que este é um padrão
      documentado ao longo de vários anos, e não uma observação nova ou
      transitória.


      O Plano de Desenvolvimento Social municipal (EVD-000001) identifica, de
      forma independente, a conectividade efetiva dos transportes públicos como
      uma preocupação para residentes que dependem do serviço, incluindo
      referências a linhas e horários específicos.


      A avaliação intermunicipal CIMAC/ATAC (EVD-000011) acrescenta contexto e
      detalhe: as comunicações relacionadas com horários constituem a maior
      categoria de reclamação e a experiência de acesso e espera é avaliada de
      forma menos favorável do que a experiência a bordo. Esta evidência é
      consistente com a mesma variação temporal e de contexto do serviço, mas
      não é tratada, por si só, como uma demonstração independente de igual
      peso.


      O mesmo relatório municipal desagrega para 2025 os quilómetros comerciais
      programados por carreira e tipo de dia (EVD-000157), identificando
      diferenças de oferta de fim de semana entre carreiras, e regista atrasos
      recorrentes em corredores e janelas de hora de ponta, com indicadores
      agregados de regularidade e pontualidade (EVD-000158). Estes dados refinam
      a manifestação por carreira/tipo de dia e corredor/período, sem
      estabelecer frequência, espera, capacidade ou severidade ao nível de cada
      utilizador.


      A existência de transporte flexível para locais de baixa procura
      (EVD-000002) não é utilizada como evidência da manifestação do problema.
      Documenta uma resposta já existente e é considerada evidência que delimita
      a conclusão.
    evidence:
      - EVD-000001
      - EVD-000002
      - EVD-000011
      - EVD-000117
      - EVD-000157
      - EVD-000158
  consequence:
    summary: >-
      Evidência de experiência vivida, de natureza anedótica e autosselecionada,
      documenta situações concretas em que esta variação afetou deslocações
      específicas, sem permitir generalizar para a população.


      EVD-000079 relata que estudantes universitários de um campus específico
      participaram, em março de 2026, num protesto relacionado com opções de
      transporte pouco utilizáveis na prática, autocarros cheios e tempos
      efetivos de viagem elevados numa deslocação específica entre o campus e a
      zona industrial. Trata-se de experiência reportada num único evento, de
      representatividade desconhecida.


      EVD-000080 documenta reclamações individuais na plataforma pública do
      TREVO: um autocarro atrasado, uma interrupção do serviço e um autocarro
      que não parou após sinalização. São incidentes distintos publicados numa
      plataforma de reclamações, e não dados sobre a frequência destas
      ocorrências no conjunto da rede.


      Esta evidência demonstra apenas que existem situações concretas com
      impacto nas deslocações. Não estabelece a frequência ou prevalência dessas
      falhas entre residentes, nem permite concluir pela existência de um efeito
      generalizado ou de uma desigualdade à escala da população.
    evidence:
      - EVD-000079
      - EVD-000080
  currentness:
    assessment: >-
      ALTA para a manifestação institucional documentada, com limites temporais
      explícitos. O relatório da Autoridade de Transportes municipal foi
      publicado em junho de 2026; EVD-000002 confirma a variação entre o serviço
      diurno e o serviço noturno, de fim de semana e de feriados, enquanto
      EVD-000157 e EVD-000158 descrevem a oferta por carreira/tipo de dia e os
      atrasos recorrentes por corredor/período em 2025.


      As edições de 2022 e 2023 do mesmo relatório (EVD-000117) confirmam que
      este padrão está documentado ao longo de vários anos, reforçando a sua
      persistência sem constituir uma voz institucional independente adicional.


      EVD-000079 e EVD-000080 acrescentam sinais de experiência vivida relativos
      a 2025-2026 que são consistentes com a manifestação institucional.


      Os dados de 2025 não estabelecem que o horário, a frequência, os tempos de
      espera ou o impacto para utilizadores sejam idênticos em agosto de 2026. A
      questão mantém-se aberta quanto às partidas, paragens e utilizadores
      atualmente mais afetados.
    evidence:
      - EVD-000002
      - EVD-000117
      - EVD-000157
      - EVD-000158
  contradiction_search:
    performed: true
    summary: >-
      Foi realizada uma procura deliberada de evidência que pudesse contradizer
      ou ultrapassar a leitura institucional de que a utilidade do serviço varia
      consoante o período e o contexto.


      Foram verificadas diretamente as edições de 2022 e 2023 dos relatórios
      anuais da Autoridade de Transportes municipal (EVD-000117), bem como os
      horários públicos do TREVO e a existência de transporte flexível para
      locais de baixa procura.


      Não foi encontrada evidência que contradiga a manifestação delimitada.
      Pelo contrário, EVD-000117 confirma que o mesmo padrão de variação está
      documentado ao longo de vários anos.


      O crescimento da utilização da rede (EVD-000023), a cobertura territorial
      ampla (EVD-000027), a existência de transporte flexível (EVD-000002), a
      regularidade agregada de 99,5% reportada para 2025 (EVD-000158), a oferta
      substancial ao sábado e domingo/feriado em algumas carreiras, em especial
      a carreira 25 (EVD-000157), e os canais atuais do TREVO para consultar
      linhas e horários foram considerados como evidência que restringe uma
      leitura mais abrangente do problema. Estes elementos mostram que não
      estamos perante uma ausência generalizada de serviço, mas não demonstram
      que a variação da sua utilidade prática esteja resolvida.
    evidence:
      - EVD-000117
      - EVD-000157
      - EVD-000158
  overlap_check:
    performed: true
    summary: >-
      Nenhum outro PRB-* canónico aborda a utilidade prática do serviço de
      transporte público e a sua adequação temporal-territorial em Évora;
      PRB-0001 não duplica nem se sobrepõe a outro registo.


      EVD-000011 e EVD-000080 estão também associados a PRB-0002 por uma questão
      distinta relacionada com informação e interoperabilidade, e não pela
      afirmação de variação da utilidade do serviço que define PRB-0001.
    related_problems: []
  corroboration_statement: A cobertura dos transportes públicos em Évora é, em
    termos globais, ampla, mas a evidência institucional indica que a utilidade
    prática do serviço varia consoante o período horário, o tipo de deslocação e
    os locais de baixa procura, continuando a articulação entre horários e
    frequências a ser uma preocupação documentada.
  supporting_evidence:
    - EVD-000001
    - EVD-000002
    - EVD-000011
    - EVD-000117
  boundary_evidence:
    - EVD-000023
    - EVD-000002
    - EVD-000027
  independence_assessment: >-
    A base institucional que sustenta diretamente esta leitura assenta, na
    prática, em duas vozes institucionais materialmente distintas, e não em
    quatro fontes independentes.


    EVD-000002 e EVD-000117 (SRC-0018 e os seus antecedentes de 2022/2023,
    SRC-0101/SRC-0102) pertencem à mesma linhagem — a série de relatórios anuais
    da Autoridade de Transportes municipal — e são tratados como uma única
    família de voz institucional para efeitos de independência, apesar de cada
    edição possuir um identificador de fonte distinto. O papel de EVD-000117 é
    corroborar a persistência da mesma afirmação ao longo de várias edições, e
    não acrescentar uma segunda voz independente.


    EVD-000011 (SRC-0019, avaliação anual CIMAC/ATAC) provém de uma instituição
    materialmente distinta ao nível intermunicipal, mas a sua contribuição
    canónica é de suporte, refinamento e contexto, e não uma afirmação primária
    e oficial autónoma sobre a variação entre serviço diurno, noturno, de fim de
    semana e de feriados na rede urbana. Uma fonte e linhagem distintas de
    SRC-0018 não tornam, por si só, esta evidência numa linha equivalente de
    suporte direto; é mantida como contexto corroborativo, e não como um segundo
    pilar independente com o mesmo peso.


    EVD-000001 (SRC-0002, PDS 2024-2027) constitui uma linha de planeamento
    institucional genuinamente distinta e a segunda voz materialmente
    independente que sustenta a manifestação.


    EVD-000079 (SRC-0066) e EVD-000080 (SRC-0067) constituem duas linhas
    independentes de experiência vivida, distintas das comunicações
    institucionais. Contudo, não são contabilizadas como evidência de
    prevalência ou desigualdade à escala da população. Em particular, EVD-000080
    não é tratado como evidência representativa da experiência vivida; o seu
    papel limita-se a corroborar a existência de incidentes operacionais
    concretos com impacto nos utilizadores e compatíveis com a afirmação
    institucional, mantendo representatividade DESCONHECIDA.


    EVD-000002 é totalmente excluído desta avaliação de independência: documenta
    uma resposta existente de transporte flexível e funciona como evidência de
    limite e de estado atual, não como uma linha de corroboração da afirmação
    sobre a variação da utilidade do serviço.


    Em síntese, a corroboração institucional da afirmação delimitada assenta em
    duas vozes institucionalmente distintas — a família de relatórios da
    Autoridade de Transportes municipal, corroborada ao longo de várias edições,
    e a fonte de planeamento institucional do PDS —, sendo complementada pela
    avaliação intermunicipal CIMAC/ATAC como contexto de suporte, e não como um
    terceiro pilar de igual peso. Isto não estabelece materialidade à escala da
    população nem uma desigualdade generalizada. A independência da evidência é,
    por isso, avaliada como MÉDIA.
  scope:
    geography: >-
      Município de Évora. EVD-000011 e EVD-000027 incluem também evidência à
      escala intermunicipal do Alentejo Central/CIMAC, utilizada apenas quando
      ajuda a interpretar a situação específica de Évora e não como fundamento
      para uma afirmação regional mais ampla.


      EVD-000028 não é utilizado para delimitar este âmbito. O próprio registo
      alerta que a distribuição regional de estudantes e jovens passageiros da
      ATAC não deve ser interpretada como representativa dos passageiros da rede
      urbana TREVO em Évora.
    population: >-
      Residentes que dependem dos transportes públicos no Município de Évora,
      incluindo subpopulações concretas e delimitadas identificadas no registo:
      estudantes que se deslocam para um campus específico, utilizadores
      dependentes do serviço noturno, de fim de semana ou de feriados e
      residentes de locais de baixa procura abrangidos por respostas
      específicas.


      A evidência não permite generalizar a conclusão para toda a população do
      município.
    temporal: >-
      Circunscrito ao período documentado no registo. A evidência institucional
      abrange 2022-2026 e mostra a persistência do padrão de redução do serviço
      à noite, aos fins de semana e nos feriados (EVD-000117, EVD-000002).


      EVD-000157 documenta quilómetros comerciais programados por carreira e
      tipo de dia em 2025; EVD-000158 documenta, também para 2025, indicadores
      agregados e corredores/janelas de atrasos recorrentes. Embora o relatório
      tenha sido publicado em junho de 2026, estes elementos não descrevem
      diretamente o horário ou desempenho em agosto de 2026.


      A evidência de experiência vivida inclui o protesto estudantil de março de
      2026 (EVD-000079) e incidentes individuais reportados entre fevereiro e
      outubro de 2025 (EVD-000080).


      A conclusão não se estende a uma comparação atual, em agosto de 2026, da
      frequência, espera, viabilidade de deslocação, capacidade, severidade ou
      prevalência por linha, corredor, paragem ou período horário. Essa questão
      continua em aberto.
    bounded: true
  limitations: >-
    A afirmação corroborada é SUPORTADA apenas nos seguintes termos: a evidência
    institucional mostra de forma consistente que a utilidade prática dos
    transportes públicos em Évora varia consoante o período, o contexto da
    deslocação ou do serviço e os territórios de menor procura, apesar de a
    cobertura global permanecer ampla.


    NÃO É SUPORTADA como: uma afirmação de impacto material à escala de toda a
    população; uma desigualdade geral demonstrada; uma afirmação de deficiência
    atual grave numa linha ou corredor específico; uma afirmação sobre a
    frequência ou prevalência das falhas sentidas pelos residentes; ou uma
    afirmação de que os transportes públicos estão, em termos gerais, ausentes
    ou em declínio.


    EVD-000157 permite afirmar apenas que o quadro oficial de 2025 desagrega os
    quilómetros comerciais programados por carreira e tipo de dia; EVD-000158
    permite afirmar apenas que o relatório agrega indicadores de desempenho e
    identifica atrasos recorrentes nos corredores e janelas indicados. Nenhum
    dos dois estabelece frequência atual, tempos de espera, ligações inviáveis,
    capacidade, impacto ao nível do utilizador ou prevalência. Em particular,
    células sem quilómetros no quadro não são tratadas como observação
    independente de ausência de serviço numa data concreta.


    O crescimento da utilização (EVD-000023), a ampla cobertura TPAC/TPF
    (EVD-000027) e a existência de transporte flexível (EVD-000002) são
    incluídos como evidência de limite e de estado atual que restringe a
    afirmação. Mostram que uma formulação mais forte de «ausência de serviço ou
    de resposta nos territórios de baixa procura» seria incorreta e que a lacuna
    documentada que permanece diz respeito à utilidade prática, à variação
    consoante horários e territórios e à eficácia ainda por esclarecer, e não à
    ausência de qualquer resposta. Estes registos são deliberadamente excluídos
    da manifestação e da evidência de suporte direto e não devem ser
    interpretados como demonstrando que a lacuna de utilidade prática está
    resolvida.


    O uso canónico de EVD-000011 é de suporte, refinamento e contexto ao nível
    intermunicipal. É mantido como contexto corroborativo da mesma afirmação de
    variação e não é tratado, por si só, como uma linha independente de suporte
    direto com igual peso, uma vez que uma fonte ou linhagem distinta não
    estabelece automaticamente corroboração direta equivalente.


    EVD-000028 é excluído de `boundary_evidence`: o próprio registo alerta
    explicitamente contra a interpretação da proporção regional de estudantes e
    jovens passageiros da ATAC como se fosse a distribuição demográfica dos
    passageiros da rede urbana TREVO em Évora. Por isso, não delimita de forma
    válida a geografia ou a população desta afirmação e é mantido apenas como
    contexto, conforme descrito em `scope.geography`.


    EVD-000079 e EVD-000080 suportam apenas a existência de situações concretas
    e incidentes operacionais. São evidência anedótica, autosselecionada e de
    representatividade DESCONHECIDA e não são tratados, nem devem ser
    reforçados, como evidência de prevalência ou de desigualdade à escala da
    população. Em particular, EVD-000080 não é considerado evidência
    representativa da experiência vivida.


    Está estabelecido para 2025 que a oferta programada em quilómetros
    comerciais varia por carreira e tipo de dia, e que existem corredores e
    janelas de atraso recorrente identificados de forma agregada. Não está
    estabelecido em que medida essas diferenças se traduzem em frequência,
    espera, viabilidade de deslocação, capacidade ou severidade para
    utilizadores, nem quais linhas, paragens ou períodos são atualmente mais
    críticos em agosto de 2026. O número de `lineage_id` não é interpretado como
    independência semântica: registos de diferentes edições anuais provenientes
    da mesma voz institucional (SRC-0018 e os seus antecedentes de 2022/2023,
    EVD-000117) são agrupados para efeitos de avaliação da independência apesar
    de possuírem diferentes `source_id`.
history:
  - date: 2026-08-31
    summary: O contexto de serviço de 2025 foi mais delimitado, mas não foi possível estabelecer uma deslocação atual reproduzível por linha, paragem e partida; a investigação passa a aguardar dados operacionais atuais ou uma deslocação afetada delimitada.
