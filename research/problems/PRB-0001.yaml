problem_id: PRB-0001
created_at: 2026-08-28
updated_at: 2026-10-09
title: A utilidade prática dos transportes públicos varia consoante os horários
  e os territórios
domain:
  - MOB
geography:
  level: municipality
  area: Évora
affected_populations:
  - residentes que dependem dos transportes públicos
problem_statement: O relatório municipal de 2026 indica que a rede urbana cobre
  praticamente toda a cidade de Évora durante o dia, com oferta reduzida à
  noite, aos fins de semana e nos feriados. A evidência institucional indica
  que a utilidade prática do serviço varia consoante o período horário, o
  tipo de deslocação e os locais de baixa procura; o Plano de Desenvolvimento Social aponta a falta de uma rede de transportes
  públicos eficaz, citando as linhas e os horários.
causal_reading: A variação na utilidade prática do serviço está associada
  sobretudo ao desenho e à capacidade do serviço, e não apenas a uma lacuna de
  informação; esta leitura não está validada e não exclui outros fatores
  operacionais que possam contribuir para o problema.
investigation:
  open_questions:
    - question: Em que medida as diferenças de oferta já identificadas por carreira e
        tipo de dia, e os atrasos recorrentes nas horas de ponta, se traduzem em
        tempos de espera, ligações inviáveis ou outros impactos materiais para
        os utilizadores, e quais horários ou paragens são mais críticos?
      why_open: Os quilómetros comerciais programados por carreira e tipo de dia, e as
        janelas/corredores de atraso recorrente, estão agora documentados para
        2025. Porém, quilómetros comerciais não estabelecem frequência, tempo de
        espera, viabilidade de uma deslocação, capacidade ou prevalência dos
        utilizadores afetados.
      latest_result: O contexto de carreiras e corredores de 2025 foi mais delimitado,
        mas não foi possível estabelecer uma deslocação atual reproduzível por
        linha, paragem e partida, nem o seu impacto prático para utilizadores.
      current_action: Não é proporcional prosseguir desafio direto sem dados
        operacionais atuais ao nível de linha/paragem ou uma deslocação afetada
        delimitada.
      resolution_condition: Dados operacionais atuais ao nível de linha/paragem ou uma
        deslocação afetada delimitada que permitam estabelecer o impacto
        prático, mantendo separadas frequência, espera, capacidade e
        prevalência.
      evidence:
        - EVD-000002
        - EVD-000117
        - EVD-000157
        - EVD-000158
  path:
    initial_signal:
      summary: O Plano de Desenvolvimento Social (PDS 2024-2027) identifica
        dificuldades de deslocação para residentes que dependem dos transportes
        públicos, incluindo linhas e horários. O relatório anual da Autoridade
        de Transportes municipal descreve a cobertura diurna da rede urbana em
        praticamente toda a cidade de Évora e a redução da oferta à noite,
        aos fins de semana e nos feriados.
      evidence:
        - EVD-000001
        - EVD-000002
    development:
      summary: A avaliação intermunicipal CIMAC/ATAC regista que as comunicações
        relacionadas com horários constituem a maior categoria entre questões,
        sugestões e reclamações; muitas pedem a criação ou sincronização de
        horários e não resultam de incumprimento do serviço. A experiência de
        acesso e espera é avaliada de forma menos favorável do que a experiência
        a bordo. Estes dados acrescentam contexto intermunicipal, sem medir a
        prevalência de falhas na rede urbana de Évora. O crescimento da
        utilização da rede urbana, os passageiros registados nos lotes
        intermunicipais e a existência de transporte flexível para locais de
        baixa procura delimitam uma leitura de ausência geral de serviço,
        sem estabelecer cobertura populacional TPAC/TPF no município.
      evidence:
        - EVD-000011
        - EVD-000023
        - EVD-000002
        - EVD-000027
    delimitation:
      summary: Um protesto estudantil em março de 2026 e reclamações individuais
        publicadas numa plataforma pública independente sobre o TREVO registam
        relatos não verificados de dificuldades com opções de transporte,
        capacidade, tempos de viagem e incidentes operacionais. Não estabelecem
        a ocorrência independente, prevalência ou representatividade dessas
        situações. Os relatórios institucionais de 2022 e 2023 documentam o
        padrão de redução do serviço à noite, aos fins de semana e nos feriados
        em vários anos. Para 2025, dados oficiais identificam diferenças de
        oferta programada por carreira e tipo de dia, bem como corredores e
        janelas de atraso recorrente nas horas de ponta, sem medir o impacto
        prático em cada deslocação.
      evidence:
        - EVD-000079
        - EVD-000080
        - EVD-000117
        - EVD-000157
        - EVD-000158
