problem_id: PRB-0001
created_at: 2026-08-28
updated_at: "2026-10-12"
title: "Autocarros urbanos: oferta reduzida à noite, fins de semana e feriados e atrasos nas horas de ponta em Évora"
domain:
  - MOB
geography:
  level: municipality
  area: Évora
affected_populations:
  - residentes que dependem dos transportes públicos
problem_statement: >-
  Os relatórios municipais de transportes referentes a 2022, 2023 e 2025
  indicam que a rede urbana de transportes públicos de Évora reduz a oferta à
  noite, aos fins de semana e nos feriados. Para 2025, um quadro anual da
  oferta prevista mostra diferenças entre carreiras e tipos de dia: em 9 das 13
  carreiras e percursos representados, o quadro não indica oferta prevista ao
  domingo e feriados. Este quadro não é o horário de uma data concreta. O
  relatório sobre 2025 regista também atrasos recorrentes nas horas de ponta
  nas principais vias de acesso ao Centro Histórico e na circular de acesso ao
  Parque Industrial. Ainda não está estabelecido que efeitos práticos estas
  condições têm nas deslocações atuais.
investigation:
  open_questions:
    - question: >-
        Quantas partidas tem atualmente cada carreira urbana em dia útil, ao
        sábado, ao domingo e feriados e à noite?
      why_open: >-
        Os dados de 2025 medem o volume anual de oferta prevista por tipo de
        dia, não o número de partidas nem a oferta noturna de cada carreira.
      latest_result: >-
        O quadro de 2025 mostra diferenças entre carreiras e tipos de dia,
        descritas no percurso da investigação; a oferta à noite só é descrita
        como reduzida.
      current_action: >-
        Está pendente a consulta dos horários oficiais em vigor da rede TREVO,
        ainda não consultados, para delimitar a informação institucional necessária.
      resolution_condition: >-
        Horários oficiais em vigor, com data de consulta, que permitam contar as
        partidas de cada carreira por tipo de dia e à noite.
      evidence:
        - EVD-000002
        - EVD-000117
        - EVD-000157
    - question: >-
        Que carreiras, partidas, paragens e sentidos concentram os atrasos
        recorrentes registados em 2025 nas horas de ponta nos acessos ao Centro
        Histórico e ao Parque Industrial, e esses atrasos mantêm-se?
      why_open: >-
        Os indicadores de pontualidade do relatório são agregados para todo o
        serviço e não identificam carreiras, partidas, paragens ou sentidos,
        nem a duração dos atrasos.
      latest_result: >-
        O relatório sobre 2025 identifica os corredores e os períodos de atraso,
        sem desagregação.
      current_action: >-
        Verificar se há informação pública mais recente; o que continuar por
        esclarecer será incluído num pedido documental ao Município de Évora,
        partilhado com o PRB-0002, preparado mas ainda não enviado.
      resolution_condition: >-
        Dados do Município ou do operador que identifiquem as carreiras,
        partidas, paragens e sentidos afetados nos dois corredores e indiquem
        se os atrasos se mantêm.
      evidence:
        - EVD-000158
    - question: >-
        Que resposta institucional, se alguma, foi dada à petição de estudantes
        da Universidade de Évora, de março de 2026, por mais horários de
        transporte?
      why_open: >-
        A notícia ligada relata o protesto e a petição, mas não indica se o
        Município, a Universidade ou o operador responderam.
      latest_result: >-
        Segundo a reportagem, cerca de 30 estudantes manifestaram-se e foi
        referida uma petição com mais de 250 assinaturas. Os registos ligados
        não indicam se houve resposta.
      current_action: >-
        Está pendente a verificação de uma eventual resposta publicada pelo
        Município de Évora, pela Universidade de Évora, pelo operador TREVO ou
        na imprensa. Se não houver resposta pública, a questão integra o pedido
        documental ao Município partilhado com PRB-0002, preparado mas não enviado.
      resolution_condition: >-
        Informação pública ou institucional que indique se houve resposta à
        petição e qual foi.
      evidence:
        - EVD-000079
    - question: >-
        Que efeitos concretos, se os houver, têm a oferta atual e os atrasos nas
        deslocações, como tempos de espera, ligações perdidas ou impossibilidade de viajar à
        hora necessária?
      why_open: >-
        Os dados ligados medem oferta prevista e pontualidade agregada, não
        efeitos nas deslocações; os relatos ligados não estabelecem a frequência
        das situações descritas.
      latest_result: >-
        Os registos ligados não estabelecem efeitos nas deslocações; existem
        apenas relatos individuais não verificados.
      current_action: >-
        Depois de esclarecidas a oferta atual e a localização dos atrasos,
        analisar deslocações concretas, por carreira, paragem e horário, com
        horários oficiais e dados do operador.
      resolution_condition: >-
        Evidência sobre deslocações concretas que mostre esses efeitos,
        distinguindo relatos individuais de situações verificadas.
      evidence:
        - EVD-000079
        - EVD-000080
        - EVD-000157
        - EVD-000158
  path:
    initial_signal:
      summary: >-
        O Plano de Desenvolvimento Social de Évora 2024-2027 refere a falta de
        uma rede de transportes públicos eficaz, citando as linhas e os
        horários, e dificuldades de deslocação no município para quem depende
        destes transportes; é uma preocupação de planeamento, não uma medição.
        O relatório municipal de transportes de 2026 indica que a rede urbana
        cobre praticamente toda a zona urbana de Évora durante o dia e reduz a
        oferta à noite, aos fins de semana e nos feriados.
      evidence:
        - EVD-000001
        - EVD-000002
    development:
      summary: >-
        Os relatórios municipais referentes a 2022, 2023 e 2025 descrevem o
        mesmo padrão de redução da oferta. À noite, indicam oferta reduzida, sem
        detalhe por carreira. Para os fins de semana, um quadro de 2025 indica o volume
        diário de oferta prevista por carreira e tipo de dia. Sem oferta
        prevista no quadro ao fim de semana: carreiras 22, 24, 26 e 32. Com
        oferta prevista ao sábado, mas sem oferta prevista ao domingo e feriados: 21, 34,
        41 e as duas LinhAzul. Com oferta prevista em todos os tipos de dia, mas
        reduzida ao domingo e feriados: 23, 25, 31 e 33. O quadro representa
        oferta anual prevista por tipo de dia e não substitui o horário
        operacional de uma data concreta.
        Nas horas de ponta, o relatório sobre 2025 regista atrasos recorrentes,
        que associa a trânsito lento, nas principais vias de acesso ao Centro
        Histórico e, em particular, na circular de acesso ao Parque Industrial,
        entre as 08h00 e as 09h30 e entre as 17h00 e as 19h00. No conjunto do
        serviço, o índice de pontualidade foi de 84,4% (atraso inferior a 5 minutos); este
        indicador não identifica as carreiras, partidas ou paragens afetadas.
      evidence:
        - EVD-000002
        - EVD-000117
        - EVD-000157
        - EVD-000158
    delimitation:
      summary: >-
        Os dados descrevem oferta prevista e pontualidade agregada, não o
        horário de uma data concreta nem efeitos nas deslocações. Algumas
        carreiras mantêm oferta prevista ao fim de semana, embora reduzida face
        aos dias úteis. A cobertura diurna, o aumento de passageiros na rede
        urbana em 2025, os passageiros dos serviços intermunicipais e o
        transporte flexível em táxi para quatro localidades de baixa procura
        afastam uma leitura de ausência geral de serviço, sem demonstrarem que
        a oferta é adequada. No serviço intermunicipal, a Comunidade
        Intermunicipal do Alentejo Central regista os horários como o tema mais
        frequente das comunicações dos utilizadores, mas estes dados não
        descrevem a rede urbana. O protesto estudantil de 2026 e três
        reclamações individuais de 2025 são relatos que não estabelecem a
        frequência das situações descritas. Este problema trata da oferta e da
        pontualidade do serviço; a informação aos passageiros nas paragens é
        investigada separadamente no PRB-0002. O tráfego lento atribuído pelo
        Município aos atrasos dos autocarros não altera este foco; PRB-0005
        trata do tráfego motorizado e da segurança rodoviária.
      evidence:
        - EVD-000002
        - EVD-000011
        - EVD-000023
        - EVD-000027
        - EVD-000079
        - EVD-000080
        - EVD-000157
        - EVD-000158
