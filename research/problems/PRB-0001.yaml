problem_id: PRB-0001
created_at: "2026-08-28"
updated_at: "2026-08-28"
title: A utilidade prática dos transportes públicos varia consoante os horários
  e os territórios
domain:
  - MOB
geography:
  level: municipality
  area: Évora
affected_populations:
  - residentes que dependem dos transportes públicos
problem_statement: A cobertura dos transportes públicos em Évora é, em termos
  globais, ampla, mas a evidência institucional indica que a utilidade prática
  do serviço varia consoante o período horário, o tipo de deslocação e os locais
  de baixa procura, continuando a articulação entre horários e frequências a ser
  uma preocupação documentada.
causal_reading: A variação na utilidade prática do serviço está associada
  sobretudo ao desenho e à capacidade do serviço, e não apenas a uma lacuna de
  informação; esta leitura não está validada e não exclui outros fatores
  operacionais que possam contribuir para o problema.
investigation:
  open_questions:
    - question: Quais as linhas/corredores/períodos horários concretos que sofrem a
        maior redução de serviço, e em que medida?
      why_open: Nenhum conjunto de dados público ao nível de linha ou corredor foi
        localizado; a evidência institucional disponível documenta o padrão ao
        nível da rede — serviço diurno face a serviço noturno, de fim de semana
        e de feriados —, mas não a severidade por linha.
      current_action: A plataforma de reclamações do TREVO continua a ser uma via
        disponível para recolher e caracterizar situações concretas de
        dificuldade por linha, corredor e período horário.
      evidence:
        - EVD-000002
        - EVD-000117
  path:
    initial_signal:
      summary: O Plano de Desenvolvimento Social (PDS 2024-2027) e o relatório anual
        da Autoridade de Transportes municipal identificaram a conectividade
        efetiva dos transportes públicos como uma preocupação para residentes
        que dependem do serviço, num contexto de cobertura diurna ampla e oferta
        reduzida à noite, aos fins de semana e nos feriados.
      evidence:
        - EVD-000001
        - EVD-000002
    development:
      summary: A evidência intermunicipal (CIMAC/ATAC) confirmou que as comunicações
        relacionadas com horários constituem a maior categoria de reclamação e
        que a experiência de acesso e espera é menos favorável do que a
        experiência a bordo, reforçando a leitura de variação temporal e
        territorial. A utilização crescente e a cobertura territorial ampla,
        incluindo transporte flexível para locais de baixa procura, delimitaram
        a afirmação e afastaram uma leitura de ausência geral de cobertura.
      evidence:
        - EVD-000011
        - EVD-000023
        - EVD-000002
        - EVD-000027
    delimitation:
      summary: Um protesto estudantil concreto (março de 2026) e incidentes reportados
        na plataforma de reclamações do TREVO forneceram exemplos práticos de
        dificuldades relacionadas com frequência, capacidade, tempo de viagem e
        falhas operacionais, sem estabelecer prevalência ou representatividade.
        Os relatórios institucionais de 2022 e 2023 confirmaram que o padrão de
        redução do serviço à noite, aos fins de semana e nos feriados persiste
        ao longo de vários anos e não constitui uma observação nova ou
        transitória.
      evidence:
        - EVD-000079
        - EVD-000080
        - EVD-000117
