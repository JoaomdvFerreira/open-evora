history:
  - date: 2026-08-31
    summary: Não foi identificada uma deslocação quotidiana recorrente que cumprisse o critério delimitado para desafio direto; a investigação deixa de procurar novas deslocações e reabre apenas perante uma deslocação concreta e segura ou evidência operacional atual materialmente melhor.
  - date: 2026-10-12
    summary: A investigação foi reformulada e reaberta para apurar a rede ciclável atual, a execução ou revisão da expansão proposta e a relação com trabalhos posteriores; prevê consulta de informação pública e, onde esta não bastar, pedido delimitado de esclarecimento ao Município de Évora.
