problem_id: PRB-0004
title: "Descontinuidades na rede ciclável de Évora e impacto quotidiano ainda por caracterizar"
domain:
  - "MOB"
  - "URB"
geography:
  level: city
  area: "Évora city"
affected_populations:
  - "current and potential cyclists"
problem_statement: "O planeamento institucional descreve os percursos cicláveis como limitados, descontínuos e insuficientemente ligados a destinos importantes. Não está ainda estabelecido quais as deslocações quotidianas concretas afetadas por esta descontinuidade, nem em que medida esta reduz, na prática, a utilidade da rede para quem se desloca diariamente de bicicleta."
causal_reading: "O problema central é de infraestrutura física (descontinuidade e conectividade da rede ciclável), não de software de planeamento de rotas. Esta leitura não está validada."
investigation:
  open_questions:
    - question: "A Câmara mantém uma camada operacional de dados (GIS) atual da rede ciclável, em que formato, e pode ser reutilizada publicamente?"
      why_open: "A cartografia oficial pública está datada de 2020; um regulamento municipal confirma capacidade de fornecimento em formato estruturado (SHP/DWG/ECW) mediante pedido formal, mas não a existência de um conjunto de dados aberto; uma notícia de março de 2025 confirma pelo menos uma ligação concluída desde a cartografia de 2020, pelo que a cartografia estática não deve ser lida como representando necessariamente a rede operacional atual."
      resolution_condition: "Confirmação institucional (DAM) sobre a existência, formato e condições de reutilização pública de uma camada operacional atual."
      evidence:
        - "EVD-000118"
        - "EVD-000120"
        - "EVD-000121"
    - question: "Quais as deslocações/percursos quotidianos concretos afetados pela descontinuidade da rede ciclável?"
      why_open: "A cartografia oficial confirma a extensão e composição da rede, mas não identifica quais deslocações/percursos do dia a dia são concretamente afetados pela descontinuidade, nem em que medida esta reduz a utilidade prática da rede para quem se desloca diariamente de bicicleta."
      current_action: "Observação direta, análise da rede de percursos e validação com partes interessadas/utilizadores permanecem a via de investigação para caracterizar as deslocações afetadas."
      resolution_condition: "Validação, ao longo das dimensões de conectividade, segurança, manutenção, utilidade do destino e orientação/sinalética, que estabeleça quais as deslocações quotidianas concretas afetadas."
      evidence:
        - "EVD-000118"
  path:
    initial_signal:
      summary: "O planeamento institucional descreveu os percursos cicláveis como limitados, descontínuos e insuficientemente ligados a destinos importantes."
      evidence:
        - "EVD-000005"
    delimitation:
      summary: "Não foi encontrado sinal público independente, recente e suficientemente forte para confirmar ou refinar PRB-0004 como problema de deslocação quotidiana urbana, apesar de pesquisa delimitada explícita; esta é uma lacuna de cobertura de sinal público, não evidência de ausência do problema. A cartografia oficial da rede ciclável existente confirma infraestrutura exclusivamente ciclável (~8,5km) e percursos pedonal-ciclável partilhados (~120km, maioritariamente recreativos), reiterando o diagnóstico de descontinuidade."
      evidence:
        - "EVD-000118"
evidence:
  - "EVD-000005"
  - "EVD-000012"
  - "EVD-000118"
  - "EVD-000119"
  - "EVD-000120"
  - "EVD-000121"
evidence_status: discovered
validation_status: unvalidated
digital_tractability: not_assessed
solution_landscape_status: not_assessed
status: OPEN
