problem_id: PRB-0004
created_at: "2026-08-28"
updated_at: "2026-10-12"
title: Rede ciclável de Évora com limitações documentadas; estado atual e
  execução da expansão proposta por apurar
domain:
  - MOB
  - URB
geography:
  level: city
  area: Évora
affected_populations:
  - ciclistas atuais e potenciais
problem_statement: >-
  O planeamento institucional descreve a rede ciclável de Évora como reduzida,
  espacialmente descontínua e sem ligação a vários equipamentos, serviços e
  zonas residenciais relevantes. A cartografia apresentada no PMUSE distingue
  cerca de 8,5 km de infraestrutura exclusivamente ciclável e cerca de 120 km
  de percursos partilhados por peões e ciclistas, sem estabelecer o estado atual
  da rede. O plano representa também uma proposta de expansão e existe trabalho
  pedonal e ciclável posterior documentado, mas a evidência ligada não permite
  saber quanto da expansão foi executado nem qual é hoje a configuração da rede.
investigation:
  open_questions:
    - question: Que rede ciclável existe hoje em Évora e o que aconteceu à
        expansão representada a partir da proposta municipal de 2017?
      why_open: >-
        Os diagnósticos e a proposta não mostram a configuração atual da rede
        nem quais dos eixos propostos foram executados. O trabalho comunicado em
        março de 2025 não estabelece o estado posterior da ligação para Santa
        Luzia nem a sua relação com a proposta de 2017.
      latest_result: >-
        Estão documentadas uma rede limitada e descontínua, uma proposta de
        expansão e trabalho posterior na ligação Saúde–Xarrama. A relação entre
        esse trabalho e a proposta continua por estabelecer.
      current_action: >-
        Está pendente a consulta de informação pública atual sobre a rede, a
        execução ou revisão da proposta e a ligação Saúde–Xarrama–Santa Luzia.
        Se permanecerem lacunas, está definido um pedido ao Município de Évora
        para obter cartografia atual e esclarecimentos sobre esses pontos.
      resolution_condition: >-
        Informação atual que permita identificar os troços exclusivamente
        cicláveis e os percursos partilhados relevantes, a sua continuidade e
        ligações; o destino dos eixos propostos; e o estado e eventual relação
        da ligação Saúde–Xarrama–Santa Luzia com a proposta.
      evidence:
        - EVD-000005
        - EVD-000118
        - EVD-000119
        - EVD-000120
        - EVD-000121
    - question: A ligação da zona nascente à Escola 2,3 André de Resende foi
        entretanto estudada, programada ou integrada em planos posteriores? Foi
        executada ou permanece fora dos planos atuais?
      why_open: >-
        A proposta de 2017 deixa a zona nascente e essa ligação de fora e remete
        a sua análise para estudo adicional. A evidência ligada não mostra o que
        aconteceu depois a essa ligação.
      latest_result: A ligação estava fora da proposta representada no PMUSE;
        era necessário estudo adicional.
      current_action: >-
        Está pendente a procura de informação pública posterior sobre o estudo,
        programação, planeamento ou execução desta ligação. Se a informação
        disponível não for suficiente, o ponto será incluído no pedido de
        esclarecimento ao Município de Évora.
      resolution_condition: Informação posterior que permita estabelecer se a
        ligação foi estudada, programada, incorporada em planos ou executada, ou
        se permanece fora dos planos atuais.
      evidence:
        - EVD-000119
    - question: Que deslocações concretas são hoje afetadas por descontinuidades
        ou falta de ligações na rede ciclável de Évora, e com que consequência
        demonstrável?
      why_open: >-
        Os diagnósticos descrevem falhas na rede, mas a evidência ligada não
        identifica deslocações atualmente afetadas nem demonstra as suas
        consequências. As preocupações relatadas por ciclistas também não
        permitem estimar a frequência ou a gravidade desses efeitos.
      latest_result: Ainda não estão estabelecidas deslocações concretas
        afetadas nem consequências atuais demonstradas.
      current_action: A investigação de deslocações concretas fica dependente
        de uma delimitação melhor da rede atual; depois disso poderão ser
        analisados os troços ou ligações em falta e os efeitos que possam ser
        documentados.
      resolution_condition: Informação sobre deslocações concretas que permita
        relacionar uma falha atual da rede com uma consequência demonstrável,
        incluindo casos em que a ligação já exista ou não produza esse efeito.
      evidence:
        - EVD-000005
        - EVD-000118
        - EVD-000141
  path:
    initial_signal:
      summary: >-
        Os diagnósticos institucionais descrevem a rede ciclável de Évora como
        limitada em extensão, espacialmente descontínua e sem ligação a vários
        equipamentos, serviços e zonas residenciais relevantes. A cartografia
        apresentada no PMUSE distingue cerca de 8,5 km de infraestrutura
        exclusivamente ciclável e cerca de 120 km de percursos partilhados por
        peões e ciclistas. A figura indica como fonte «Câmara Municipal de
        Évora, 2020», mas essa indicação não data a produção nem a última
        atualização da cartografia.
      evidence:
        - EVD-000005
        - EVD-000118
    development:
      summary: >-
        Para 2020, o diagnóstico do PUE regista a bicicleta em cerca de 0,5 %
        das deslocações dos residentes de Évora; este valor contextualiza o uso
        da bicicleta nesse ano. O PMUSE representa uma expansão baseada numa
        proposta municipal de 2017: cerca de 18 km de novos eixos
        exclusivamente cicláveis, mais 33 km da «Grande Rota do Montado»,
        partilhada por peões e ciclistas. A zona nascente da cidade, incluindo
        a ligação à Escola 2,3 André de Resende, ficou fora dessa proposta e
        exigiria estudo adicional. A proposta não equivale a infraestrutura
        executada. Em março de 2025, a Câmara Municipal de Évora referia
        trabalho já realizado na primeira fase da ligação pedonal e ciclável
        entre o Bairro de N.ª Sr.ª da Saúde e a ponte do Xarrama, com o valor
        comunicado de 90 000 euros. A segunda fase, em direção ao Bairro de
        Santa Luzia, estava em preparação e dependia de um projeto de drenagem
        de águas pluviais. Não está estabelecido se esta ligação integra os
        eixos da proposta de 2017. No diagnóstico do PUE, ciclistas referiram
        falta de infraestrutura dedicada, velocidade dos veículos, estado do
        pavimento e comportamento dos condutores; a data desses relatos é
        desconhecida e não há estimativa da sua frequência, representatividade
        ou gravidade.
      evidence:
        - EVD-000140
        - EVD-000119
        - EVD-000121
        - EVD-000141
    delimitation:
      summary: >-
        O relatório de participação preventiva do PUE de 2026 regista
        participações formais sobre a programação da rede ciclável, entre outros
        temas de mobilidade. São um sinal público recente, mas não uma
        confirmação independente das falhas descritas. O relatório estabelece
        que foram apresentadas, mas não o seu conteúdo detalhado, correção
        factual, representatividade ou aprovação. Também não confirma um
        defeito físico atual nem uma deslocação afetada.
        Os oito registos ligados não estabelecem a configuração da rede em 2026,
        quanto da expansão proposta foi executado, revisto ou abandonado, nem
        os efeitos em deslocações concretas. O regulamento municipal prevê um
        processo formal para pedir cartografia digital, sem confirmar que exista
        cartografia atual específica da rede ciclável. Está por verificar em
        fontes públicas o estado posterior da rede, da expansão proposta e dos
        trabalhos documentados. Se persistirem lacunas, poderá ser pedido
        esclarecimento delimitado ao Município de Évora.
      evidence:
        - EVD-000012
        - EVD-000118
        - EVD-000119
        - EVD-000120
        - EVD-000121
