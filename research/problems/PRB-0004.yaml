problem_id: PRB-0004
created_at: "2026-08-28"
updated_at: "2026-10-10"
title: Descontinuidades documentadas na rede ciclável de Évora; impacto nas
  deslocações quotidianas ainda por estabelecer
domain:
  - MOB
  - URB
geography:
  level: city
  area: Évora
affected_populations:
  - ciclistas atuais e potenciais
problem_statement: >-
  O planeamento institucional documenta uma rede ciclável com extensão e
  conectividade limitadas no período diagnosticado, mas a evidência disponível
  não estabelece a topologia nem o estado atual da rede. Também não está
  estabelecido quais as deslocações quotidianas concretas são hoje afetadas
  pelas descontinuidades documentadas, nem se e em que medida estas reduzem a
  utilidade prática da rede para quem se desloca de bicicleta.
causal_reading: >-
  A hipótese de trabalho centra-se na infraestrutura física — continuidade e
  conectividade da rede ciclável — e não em aplicações de planeamento de
  percursos. Esta interpretação causal não está validada e o estado atual da
  rede permanece por estabelecer.
investigation:
  open_questions:
    - question: A Câmara Municipal mantém uma camada operacional e atual de dados
        geográficos (SIG) sobre a rede ciclável? Em que formato e em que
        condições pode ser reutilizada publicamente?
      why_open: >-
        A cartografia da rede ciclável apresentada no Volume I do PMUSE identifica
        como fonte a Câmara Municipal de Évora, 2020. O regulamento municipal
        estabelece um mecanismo formal de cedência de cartografia digital e prevê
        formatos como SHP, DWG, ECW e PDF, mas não estabelece a existência de uma
        camada operacional atual da rede ciclável nem um conjunto de dados aberto.
        Em março de 2025, o Município reportava trabalho já realizado na primeira
        fase de uma ligação pedonal/ciclável entre o Bairro de N.ª Sr.ª da Saúde e a
        ponte do Xarrama, mantendo a segunda fase em direção ao Bairro de Santa Luzia
        em preparação. Estes elementos mostram que não é seguro tratar a cartografia
        apresentada no PMUSE como representação da topologia operacional atual.
      resolution_condition: Confirmação institucional pela DAM sobre a existência de
        uma camada operacional atual, o seu formato e as respetivas condições de
        reutilização pública.
      evidence:
        - EVD-000118
        - EVD-000120
        - EVD-000121
    - question: Quais são as deslocações e os percursos quotidianos concretamente
        afetados pela descontinuidade da rede ciclável?
      why_open: >-
        O diagnóstico e a cartografia apresentados no PMUSE documentam a extensão,
        composição e descontinuidade da rede no período representado, mas não
        estabelecem a topologia nem o estado atual da rede. Também não identificam
        quais as deslocações ou percursos quotidianos são atualmente afetados, nem se
        e em que medida as descontinuidades documentadas reduzem a utilidade prática
        da rede para quem se desloca diariamente de bicicleta.
      latest_result: Não foi identificada uma deslocação quotidiana recorrente que
        cumprisse o critério delimitado para desafio direto.
      current_action: Não está autorizada nova procura de deslocações no âmbito atual;
        a questão reabre apenas perante uma deslocação concreta e segura ou
        evidência operacional atual materialmente melhor.
      resolution_condition: Uma deslocação quotidiana concreta e segura ou evidência
        operacional atual materialmente melhor que permita estabelecer quais as
        deslocações são afetadas.
      evidence:
        - EVD-000118
  path:
    initial_signal:
      summary: O planeamento institucional descreveu os percursos cicláveis como
        limitados, descontínuos e insuficientemente ligados a destinos
        importantes.
      evidence:
        - EVD-000005
    delimitation:
      summary: >-
        Não foi encontrado um sinal público independente, recente e
        suficientemente forte que permitisse confirmar ou refinar PRB-0004 como
        um problema de deslocação quotidiana urbana, apesar de ter sido
        realizada uma pesquisa explícita e delimitada. Trata-se de uma lacuna na
        cobertura de sinais públicos, e não de evidência da ausência do
        problema.


        A cartografia da rede ciclável apresentada no Volume I do PMUSE, cuja
        figura identifica como fonte a Câmara Municipal de Évora, 2020, documenta
        cerca de 8,5 km de infraestrutura exclusivamente ciclável e cerca de 120
        km de percursos partilhados por peões e ciclistas no diagnóstico
        apresentado, e reitera a caracterização de uma rede reduzida e
        descontínua. Estes valores e essa cartografia não estabelecem a topologia
        nem o estado atual da rede.
      evidence:
        - EVD-000118
    development:
      summary: O mesmo diagnóstico regista uma quota modal da bicicleta de
        aproximadamente 0,5 % no período analisado e recolhe preocupações de
        ciclistas relativas à falta de infraestrutura dedicada, velocidade dos
        veículos, estado do pavimento e comportamento dos condutores. Estes
        sinais contextualizam a baixa utilização e a experiência reportada sem
        estabelecer prevalência nem o estado atual da rede.
      evidence:
        - EVD-000140
        - EVD-000141
