problem_id: PRB-0009
title: "Fiabilidade e qualidade dos serviços de higiene urbana e de recolha de resíduos"
domain:
  - "ENV"
  - "PUB"
geography:
  level: municipality
  area: "Município de Évora"
affected_populations:
  - "residents"
  - "urban parish councils"
problem_statement: "A fiabilidade dos serviços de recolha de resíduos sólidos urbanos e de higiene urbana constitui um problema cívico atual reconhecido institucionalmente: o Município documentou uma interrupção do serviço de recolha em fevereiro de 2026, causada por avarias numa frota envelhecida, e, em julho-agosto de 2026, o Presidente da Câmara e o Município identificaram publicamente a higiene urbana como um dos desafios mais urgentes da gestão municipal, avançando com uma reestruturação substancial da frota, dos recursos humanos, dos modelos de recolha, da distribuição de responsabilidades e da monitorização, ao mesmo tempo que reconheceram explicitamente que persistem dificuldades em algumas zonas."
causal_reading: "A causa dominante é substancialmente operacional/de capacidade — frota envelhecida/avariada, capacidade insuficiente de veículos de reserva, pessoal/logística, organização de rotas/serviço de recolha, e arranjos de responsabilidade entre entidades (Município, Gesamb, juntas de freguesia) — e não informacional ou digital. Esta leitura não está validada; a tratabilidade digital sobre esta causa dominante é avaliada como baixa."
investigation:
  open_questions:
    - question: "Qual é o desempenho operacional atual (tempo de resolução, atrasos, taxa de recolhas falhadas) após agosto de 2026, e existe uma subproblema mais estreito de transparência de estado/coordenação dentro da jornada do serviço de higiene?"
      why_open: "Não foi localizado nenhum conjunto de dados operacional público (tempo de resolução, atrasos, qualidade de encaminhamento) nesta revisão institucional delimitada; a verificação pós-julho no acesso público não encontrou um sinal comparável de colapso de recolha à escala da cidade, mas isto é um resultado de saturação de pesquisa, não prova de que o serviço é agora fiável."
      resolution_condition: "Dados operacionais públicos pós-agosto de 2026, ou avaliação de jornada de utilizador/dados abertos (D2/D5), que estabeleçam o desempenho atual e se existe um subproblema de transparência de estado/coordenação."
      evidence:
        - "EVD-000095"
        - "EVD-000108"
        - "EVD-000109"
        - "EVD-000110"
        - "EVD-000111"
  path:
    initial_signal:
      summary: "O Município documentou uma interrupção do serviço de recolha em fevereiro de 2026, causada por avarias numa frota envelhecida."
      evidence:
        - "EVD-000071"
        - "EVD-000072"
    development:
      summary: "Em julho-agosto de 2026, o Presidente da Câmara e o Município identificaram publicamente a higiene urbana como um dos desafios mais urgentes da gestão municipal, avançando com uma reestruturação substancial da frota, dos recursos humanos, dos modelos de recolha, da distribuição de responsabilidades e da monitorização, reconhecendo explicitamente que persistem dificuldades em algumas zonas."
      evidence:
        - "EVD-000065"
        - "EVD-000066"
        - "EVD-000073"
    delimitation:
      summary: "Sinais públicos diretos (um relato de não-recolha de vários dias, e um relato de acumulação geograficamente específico em Canaviais) confirmaram instâncias concretas, com representatividade desconhecida. Um passo de normalização em maio de 2026 e o reforço da frota para 19 veículos em julho mostraram mudança material desde fevereiro, corrigindo a imagem do estado atual para não assumir o quase-colapso de fevereiro como o estado operacional de agosto."
      evidence:
        - "EVD-000093"
        - "EVD-000094"
        - "EVD-000095"
    current_formulation:
      summary: "A formulação atual mantém a fiabilidade dos serviços de recolha de resíduos e higiene urbana como problema cívico atual reconhecido institucionalmente, com uma reestruturação substancial em curso e dificuldades reconhecidas como persistentes em algumas zonas à data de julho-agosto de 2026."
