problem_id: PRB-0009
title: Fiabilidade e qualidade dos serviços de higiene urbana e de recolha de resíduos
domain:
  - ENV
  - PUB
geography:
  level: municipality
  area: Évora
affected_populations:
  - residentes
  - juntas de freguesia urbanas
problem_statement: "A fiabilidade dos serviços de recolha de resíduos sólidos
  urbanos e de higiene urbana constitui um problema cívico atual reconhecido
  institucionalmente: o Município documentou uma interrupção do serviço de
  recolha em fevereiro de 2026, causada por avarias numa frota envelhecida, e,
  em julho-agosto de 2026, o Presidente da Câmara e o Município identificaram
  publicamente a higiene urbana como um dos desafios mais urgentes da gestão
  municipal, avançando com uma reestruturação substancial da frota, dos recursos
  humanos, dos modelos de recolha, da distribuição de responsabilidades e da
  monitorização, ao mesmo tempo que reconheceram explicitamente que persistem
  dificuldades em algumas zonas."
causal_reading: A causa dominante é sobretudo operacional e de capacidade —
  frota envelhecida ou avariada, capacidade insuficiente de veículos de reserva,
  pessoal e logística, organização das rotas e do serviço de recolha e
  distribuição de responsabilidades entre entidades, incluindo Município, Gesamb
  e juntas de freguesia. Esta leitura não está validada; o potencial de
  intervenção digital sobre este mecanismo dominante é avaliado como baixo,
  embora possam existir oportunidades mais estreitas relacionadas com
  transparência, coordenação e informação, distintas do mecanismo operacional
  dominante.
investigation:
  open_questions:
    - question: Qual é o desempenho operacional atual do serviço de higiene urbana e
        recolha de resíduos em Évora — tempos de resolução, atrasos e recolhas
        falhadas — após agosto de 2026?
      why_open: Não foi localizado nenhum conjunto de dados operacional público sobre
        tempos de resolução, atrasos, recolhas falhadas ou qualidade do
        encaminhamento. A verificação de sinais públicos posteriores a julho não
        encontrou um sinal comparável de colapso da recolha à escala da cidade,
        mas este resultado traduz apenas o limite da pesquisa realizada e não
        constitui prova de que o serviço seja atualmente fiável.
      resolution_condition: Dados operacionais públicos posteriores a agosto de 2026
        que permitam estabelecer o desempenho atual do serviço em Évora.
      evidence:
        - EVD-000095
    - question: Existe um subproblema material de transparência, coordenação ou
        interação com o serviço de higiene urbana, distinto do mecanismo
        operacional e de capacidade dominante?
      why_open: Existem pistas locais relacionadas com avaliação, monitorização e
        coordenação do serviço, bem como evidência comparativa sobre mecanismos
        utilizados noutros municípios, que sugerem a possível existência de uma
        componente de transparência, acompanhamento do estado ou coordenação. A
        evidência atual não estabelece, contudo, que essa componente constitua
        um subproblema material em Évora distinto da causa operacional e de
        capacidade dominante.
      resolution_condition: Análise da experiência dos utilizadores e dos dados
        disponíveis que permita estabelecer se existe, em Évora, um subproblema
        material de transparência, coordenação ou interação com o serviço.
      evidence:
        - EVD-000096
        - EVD-000097
        - EVD-000098
        - EVD-000108
        - EVD-000109
        - EVD-000110
        - EVD-000111
  path:
    initial_signal:
      summary: O Município documentou uma interrupção do serviço de recolha em
        fevereiro de 2026, causada por avarias numa frota envelhecida.
      evidence:
        - EVD-000071
        - EVD-000072
    development:
      summary: Em julho e agosto de 2026, o Presidente da Câmara e o Município
        identificaram publicamente a higiene urbana como um dos desafios mais
        urgentes da gestão municipal e avançaram com uma reestruturação
        substancial da frota, dos recursos humanos, dos modelos de recolha, da
        distribuição de responsabilidades e da monitorização, reconhecendo
        simultaneamente que persistiam dificuldades em algumas zonas.
      evidence:
        - EVD-000065
        - EVD-000066
    delimitation:
      summary: >-
        Sinais públicos diretos — um relato de vários dias sem recolha e um
        relato geograficamente específico de acumulação de resíduos em Canaviais
        — confirmaram situações concretas, mas com representatividade
        desconhecida.


        Uma normalização parcial da frota em maio de 2026 e o reforço para 19
        veículos em julho demonstraram uma alteração material desde fevereiro.
        Esta evolução impede que a situação próxima de colapso documentada em
        fevereiro seja tratada como representando automaticamente o estado
        operacional existente em agosto.
      evidence:
        - EVD-000093
        - EVD-000094
        - EVD-000095
