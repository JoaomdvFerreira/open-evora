decision_basis:
  contract_version: "0.1"
  eligibility_basis: >-
    O problema diz respeito à fiabilidade da recolha de resíduos e da higiene urbana para residentes da cidade de Évora. Os relatos localizados com data vêm de uma intervenção de um residente em janeiro e de queixas referidas numa reunião pública em março. A perturbação comunicada pelo Município em fevereiro diz respeito ao concelho e, por si só, não documenta uma falha na cidade. Em maio, o Município pôs ao serviço quatro veículos de recolha; as medidas de julho/agosto também não demonstram, por si, melhoria da fiabilidade. O relato da zona dos Canaviais não tem data estabelecida. As perguntas em aberto dizem respeito ao funcionamento depois de agosto e às responsabilidades futuras. Este registo não propõe uma solução digital.
  corroboration_basis: >-
    A decisão de confirmar os relatos limita-se a falhas localizadas de recolha ou acumulação documentadas em janeiro e março de 2026 dentro da cidade. Dois registos de janeiro descrevem locais diferentes na mesma intervenção de um residente; não são relatos independentes. Um registo de março contém queixas de residentes referidas por um vereador em reunião pública, num evento separado. O relato adicional da zona dos Canaviais não tem data estabelecida e não sustenta a conclusão sobre janeiro e março. Os registos do Município representam uma só voz institucional. Esta confirmação não estabelece frequência, dimensão na cidade, persistência depois de agosto ou ineficácia da reorganização.
  manifestation:
    kind: Falhas localizadas de recolha e acumulação de resíduos
    summary: >-
      Em janeiro, foram relatadas recolha deficiente e acumulação junto ao ponto perto da Igreja da Misericórdia, no Centro Histórico, e pouca regularidade e acumulação na Estrada de Santo Antonico. Em março, foram referidas queixas sobre acumulação no Bairro António Sérgio / Largo da Boa Vontade. Existe também um relato público sem data estabelecida sobre acumulação de resíduos na zona dos Canaviais. Este último não é uma manifestação datada de 2026.
    evidence:
      - EVD-000171
      - EVD-000172
      - EVD-000173
      - EVD-000094
  consequence:
    summary: >-
      Os relatos de janeiro e março descrevem acumulação de resíduos e recolha deficiente ou irregular nos locais identificados. O relato adicional na zona dos Canaviais também descreve acumulação, mas não tem data estabelecida. A extensão, duração e impacto para além desses relatos não estão estabelecidos.
    evidence:
      - EVD-000171
      - EVD-000172
      - EVD-000173
      - EVD-000094
  currentness:
    assessment: >-
      As falhas relatadas em janeiro e março são anteriores à entrada em serviço de quatro veículos de recolha em maio e às medidas anunciadas em julho/agosto. Os dados públicos consultados não permitem avaliar o funcionamento dos circuitos de recolha na cidade depois de agosto. Nem a recuperação da fiabilidade nem a continuação de falhas generalizadas foram demonstradas.
    evidence:
      - EVD-000171
      - EVD-000172
      - EVD-000173
      - EVD-000095
      - EVD-000065
      - EVD-000066
      - EVD-000174
  contradiction_search:
    performed: true
    summary: >-
      A pesquisa pública até 14 de outubro de 2026 consultou material do Município, reuniões da Câmara e da Assembleia Municipal quando acessíveis, fontes das juntas urbanas, meios locais e regionais e relatos públicos de residentes localizáveis. Não foram encontrados relatos concretos de falhas no funcionamento habitual da recolha depois de agosto nas fontes consultadas. O relatório de atividades de julho a setembro de 2026 da União das Freguesias de Bacelo e Senhora da Saúde e o documento de deliberação da Assembleia Municipal de 25 de setembro de 2026 ficaram por consultar. O STAL comunicou elevada adesão à greve nacional de 2 de outubro nos primeiros serviços noturnos de recolha e higiene urbana em Évora, sem que o impacto efetivo na recolha na cidade tenha sido verificado. O episódio foi considerado separadamente porque não mostra o funcionamento habitual da recolha. Não foram encontrados dados públicos suficientes sobre circuitos programados e realizados, recolhas falhadas, atrasos, pedidos ou tempos de resposta; os indicadores públicos de qualidade do serviço de resíduos identificados não permitem avaliar especificamente os circuitos da cidade depois de agosto. A pesquisa não demonstra resolução nem continuação de falhas.
    evidence:
      - EVD-000186
  overlap_check:
    performed: true
    summary: Nenhum outro PRB-* canónico aborda a fiabilidade dos serviços municipais de higiene urbana e recolha de resíduos; PRB-0009 não duplica nem se sobrepõe a outro registo.
    related_problems: []
  corroboration_statement: >-
    Em janeiro e março de 2026 foram documentadas falhas localizadas de recolha ou acumulação de resíduos dentro da cidade de Évora. A evidência não estabelece frequência, prevalência ou continuidade no conjunto da cidade, nem o desempenho operacional depois da reorganização de julho e agosto.
  supporting_evidence:
    - EVD-000171
    - EVD-000172
    - EVD-000173
    - EVD-000094
  boundary_evidence:
    - EVD-000065
    - EVD-000066
    - EVD-000071
    - EVD-000095
    - EVD-000096
    - EVD-000097
    - EVD-000174
    - EVD-000186
  independence_assessment: >-
    EVD-000171 e EVD-000172 correspondem a um residente, uma reunião e uma intervenção em janeiro, ainda que descrevam dois locais. EVD-000173 corresponde a um evento separado de relato de queixas em março; as queixas individuais subjacentes não estão disponíveis como evidência canónica independente. EVD-000094 é um relato público separado na zona dos Canaviais, sem data estabelecida. O Município representa uma única voz institucional; os seus registos não são vozes institucionais independentes. Os relatos públicos e os registos municipais têm processos distintos, mas não se contam mecanicamente IDs, fontes ou documentos para inferir independência ou representatividade.
  scope:
    geography: Cidade de Évora. Manifestações em locais ou freguesias estabelecem presença dentro da cidade sem generalização ao conjunto.
    population: Residentes da cidade. As uniões urbanas são atores de governação e serviço, não população afetada estabelecida pela evidência.
    temporal: Manifestações localizadas datadas em janeiro e março de 2026; o relato adicional na zona dos Canaviais não tem data estabelecida. O contexto mudou em maio e julho/agosto. O desempenho operacional dos circuitos de recolha posterior a agosto não foi estabelecido.
    bounded: true
  limitations: >-
    Os relatos descrevem locais específicos e não permitem saber a dimensão do problema na cidade. A data do relato da zona dos Canaviais não está estabelecida. O funcionamento dos circuitos de recolha depois de agosto não está quantificado; os indicadores públicos de qualidade do serviço identificados não permitem avaliar especificamente os circuitos da cidade nesse período. Não se afirma falha generalizada e contínua em toda a cidade.
history:
  - date: 2026-10-14
    summary: >-
      A investigação renovada estabeleceu manifestações localizadas dentro da cidade e estreitou a geografia de município para cidade. Foram revistos os limites da evidência e as questões de investigação, e foi desligada a evidência de comparação estrangeira. PRB-0009 permanece OPEN; o desempenho operacional posterior a agosto continua por estabelecer.
  - date: 2026-10-14
    summary: >-
      A revisão confirmou apenas os relatos com data de janeiro e março, manteve o relato da zona dos Canaviais sem data estabelecida e desligou dois registos de evidência contextual que deixaram de integrar a delimitação do problema. A pesquisa pública até 14 de outubro de 2026 foi concluída nas fontes acessíveis, com dois documentos por consultar. O funcionamento da recolha depois das alterações de julho e agosto permanece por esclarecer.
