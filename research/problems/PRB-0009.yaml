decision_basis:
  contract_version: "0.1"
  eligibility_basis: PRB-0009 delimita a fiabilidade da recolha e higiene urbana dentro da cidade de
    Évora, com residentes como população afetada. Manifestações locais concretas são identificadas
    por EVD-000171, EVD-000172, EVD-000173 e EVD-000094. A perturbação municipal de fevereiro
    (EVD-000071/EVD-000072) contextualiza, mas não estabelece isoladamente manifestação na cidade.
    As questões distinguem desempenho posterior a agosto e responsabilidades futuras. O registo não
    prescreve solução digital.
  corroboration_basis: "A leitura corroborada, por decisão humana, é estrita: durante 2026 ocorreram
    múltiplas falhas localizadas de recolha ou acumulação dentro da cidade. A base inclui um relato
    de residente em janeiro sobre dois locais (EVD-000171/172, uma só intervenção e processo),
    queixas de residentes referidas por vereador em reunião pública em março (EVD-000173) e relato
    público sobre Canaviais (EVD-000094). Os processos diferem, com limites de atribuição e
    representatividade. A informação municipal é uma voz institucional e contextualiza a perturbação
    e as respostas; não é contada como vozes independentes nem generalizada para manifestações
    locais. Corroboração não significa falha generalizada, frequência ou prevalência conhecida,
    persistência depois de agosto ou ineficácia da reorganização."
  manifestation:
    kind: Falhas localizadas de recolha e acumulação de resíduos
    summary: Durante 2026 foram documentadas falhas concretas e localizadas perto da Igreja da
      Misericórdia no Centro Histórico, na Estrada de Santo Antonico, no Bairro António Sérgio /
      Largo da Boa Vontade e em Canaviais. Os dois primeiros relatos são da mesma intervenção; o
      relato de março refere queixas transmitidas por vereador; o de Canaviais é outro processo
      público. Isto estabelece presença em locais da cidade, não prevalência no seu conjunto.
    evidence:
      - EVD-000171
      - EVD-000172
      - EVD-000173
      - EVD-000094
  consequence:
    summary: Os relatos localizados descrevem acumulação de resíduos e recolha deficiente ou irregular
      nos locais identificados. A extensão, duração e impacto para além desses relatos não estão
      estabelecidos.
    evidence:
      - EVD-000171
      - EVD-000172
      - EVD-000173
      - EVD-000094
  currentness:
    assessment: As manifestações verificadas ocorreram no início de 2026. A normalização parcial de maio
      (EVD-000095) e as alterações e respostas de julho/agosto (EVD-000066, EVD-000174) mudaram
      materialmente o contexto. Não foi verificada manifestação qualificável depois de agosto. Não
      há evidência de resolução; o desempenho posterior a agosto permanece desconhecido.
    evidence:
      - EVD-000171
      - EVD-000172
      - EVD-000173
      - EVD-000095
      - EVD-000066
      - EVD-000174
  contradiction_search:
    performed: true
    summary: A pesquisa pública renovada procurou evidência posterior a agosto que demonstrasse
      fiabilidade restabelecida ou continuidade de falhas generalizadas. Não foi encontrada
      evidência operacional suficiente para qualquer conclusão nem manifestação direta qualificável
      posterior a agosto. Ausência de relatos ou série pública não prova resolução nem continuidade.
    evidence: []
  overlap_check:
    performed: true
    summary: Nenhum outro PRB-* canónico aborda a fiabilidade dos serviços municipais de higiene urbana
      e recolha de resíduos; PRB-0009 não duplica nem se sobrepõe a outro registo.
    related_problems: []
  corroboration_statement: Durante 2026 ocorreram múltiplas falhas localizadas de recolha ou
    acumulação dentro da cidade de Évora. A evidência não estabelece frequência, prevalência ou
    continuidade no conjunto da cidade, nem o desempenho operacional depois da reorganização de
    julho e agosto.
  supporting_evidence:
    - EVD-000171
    - EVD-000172
    - EVD-000173
    - EVD-000094
  boundary_evidence:
    - EVD-000095
    - EVD-000066
    - EVD-000174
  independence_assessment: O Município é uma só voz institucional; os comunicados e atas em
    EVD-000065/066/071/072/095/174 são registos distintos, não instituições independentes.
    EVD-000171/172 são observações distintas na mesma intervenção de residente em janeiro, não
    processos independentes. EVD-000173 regista queixas referidas por vereador em reunião pública;
    as queixas individuais não estão disponíveis independentemente. EVD-000094 é relato público
    sobre Canaviais, de outro processo. Não se contam mecanicamente IDs de EVD, fontes ou documentos
    para inferir independência ou representatividade.
  scope:
    geography: Cidade de Évora. Manifestações em locais ou freguesias estabelecem presença dentro da
      cidade sem generalização ao conjunto.
    population: Residentes da cidade. As uniões urbanas são atores de governação e serviço, não
      população afetada estabelecida pela evidência.
    temporal: Manifestações localizadas em 2026, com alterações materiais do contexto em maio e
      julho/agosto. O desempenho posterior a agosto não foi estabelecido.
    bounded: true
  limitations: As manifestações são localizadas e a representatividade é desconhecida. A informação
    institucional mais autorizada é sobretudo municipal. O desempenho depois de agosto não está
    quantificado. Não se afirma falha generalizada ou contínua em toda a cidade. Corroborated
    refere-se apenas a múltiplas manifestações localizadas durante 2026.
history:
  - date: 2026-10-14
    summary: A investigação renovada estabeleceu manifestações localizadas dentro da cidade e estreitou
      a geografia de município para cidade. Foram revistos os limites da evidência e as questões de
      investigação, e foi desligada a evidência de comparação estrangeira. PRB-0009 permanece OPEN;
      o desempenho operacional posterior a agosto continua por estabelecer.
