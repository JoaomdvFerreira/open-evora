problem_id: PRB-0009
created_at: 2026-08-28
updated_at: 2026-10-14
title: Fiabilidade da recolha de resíduos e da higiene urbana na cidade de Évora em 2026
domain:
  - ENV
  - PUB
geography:
  level: city
  area: Évora
affected_populations:
  - residentes
problem_statement: >-
  Em janeiro e março de 2026 foram registadas falhas localizadas de recolha ou acumulação de resíduos em vários pontos da cidade de Évora, incluindo o Centro Histórico, a Estrada de Santo Antonico e o Bairro António Sérgio / Largo da Boa Vontade. Existe ainda um relato público sem data estabelecida sobre acumulação de resíduos na zona dos Canaviais. Estes casos não permitem determinar a frequência ou dimensão do problema no conjunto da cidade.


  Em fevereiro, o Município comunicou uma perturbação mais ampla da recolha no concelho. Em maio anunciou uma normalização parcial da frota e, em julho, classificou a higiene urbana como um problema urgente. Entre julho e agosto foram anunciados reforços de pessoal e viaturas, alterações de horários, circuitos e organização do serviço, equipas para o perímetro urbano e monitorização interna. Estas medidas mostram uma resposta municipal, mas não permitem medir o seu efeito na fiabilidade do serviço.


  A pesquisa pública realizada até 14 de outubro de 2026 não encontrou, nas fontes consultadas, uma manifestação qualificável posterior a agosto nem uma série operacional pública que permita medir recolhas falhadas, atrasos, pedidos de munícipes ou tempos de resposta. Permaneceram dois documentos públicos identificados mas não inspecionados por limitações de acesso. Isto não demonstra que o problema tenha sido resolvido; o desempenho depois da reorganização de julho e agosto permanece por estabelecer.
investigation:
  open_questions:
    - question: Qual é o desempenho operacional da recolha de resíduos e da higiene urbana na cidade de Évora após a reorganização de julho e agosto de 2026?
      why_open: >-
        Existem manifestações datadas em janeiro e março. As alterações de maio e de julho/agosto mudaram materialmente o contexto operacional. A pesquisa pública delimitada até 14 de outubro não encontrou uma manifestação qualificável de serviço corrente posterior a agosto, mas dois documentos identificados não puderam ser inspecionados. Também não foi encontrada uma série operacional pública sobre recolhas falhadas, atrasos, pedidos ou tempos de resposta. Tanto a recuperação da fiabilidade como a continuação de falhas generalizadas permanecem por estabelecer.
      latest_result: >-
        Foram verificadas manifestações localizadas em janeiro e março. Existe ainda um relato público sem data estabelecida na zona dos Canaviais. A pesquisa pública realizada até 14 de outubro de 2026 não encontrou uma manifestação qualificável posterior a agosto nas fontes consultadas. Dois documentos públicos identificados não puderam ser inspecionados por limitações de acesso. Não foi encontrada uma série operacional pública sobre recolhas falhadas, atrasos, pedidos de munícipes ou tempos de resposta. Falta verificar se existem indicadores públicos de qualidade do serviço de resíduos aplicáveis a Évora e a que escala.
      current_action: >-
        A pesquisa pública de manifestações posteriores a agosto está saturada até 14 de outubro de 2026, com dois documentos públicos identificados mas não inspecionados. Permanece por verificar a existência e escala de indicadores públicos aplicáveis a Évora. Está por enviar ao Município um pedido de informação/documentação sobre o desempenho e monitorização do serviço, incluindo recolhas falhadas, atrasos, pedidos de munícipes e tempos de resposta, com desagregação geográfica quando existente.
      resolution_condition: Evidência operacional pública ou informação institucional suficiente para estabelecer o desempenho posterior a agosto na cidade, preferencialmente com desagregação geográfica.
      evidence:
        - EVD-000171
        - EVD-000172
        - EVD-000173
        - EVD-000094
        - EVD-000095
        - EVD-000066
        - EVD-000174
    - question: Que tarefas e áreas de higiene urbana passarão efetivamente para as juntas urbanas a partir de 1 de janeiro de 2027, e como serão encaminhadas as falhas entre as juntas e o Município?
      why_open: Os autos aprovados têm efeitos previstos para 1 de janeiro de 2027 e estabelecem responsabilidades e áreas delimitadas que diferem entre uniões. A recolha de resíduos urbanos e de monos não é transferida em bloco. O encaminhamento operacional completo, os mapas e a atribuição de responsabilidades por falhas permanecem por esclarecer.
      latest_result: Os autos aprovados produzem efeitos apenas a partir de 1 de janeiro de 2027. Tarefas e áreas diferem entre uniões e são delimitadas; a recolha de resíduos urbanos e de monos não passa integralmente para as juntas. A preparação técnica e operacional permanecia necessária.
      current_action: A documentação pública disponível ainda não estabelece de forma completa os mapas e áreas finais, o início operacional das competências nem o encaminhamento de pedidos ou falhas entre as juntas urbanas e o Município.
      resolution_condition: Documentação pública autorizada que estabeleça tarefas, áreas, data de entrada em vigor e responsabilidades e encaminhamento de falhas.
      evidence:
        - EVD-000096
        - EVD-000097
  path:
    initial_signal:
      summary: >-
        Em janeiro, um residente relatou recolha deficiente e acumulação junto ao ponto de recolha perto da Igreja da Misericórdia, no Centro Histórico, e pouca regularidade da recolha e acumulação na Estrada de Santo Antonico. Em março, um vereador referiu queixas de residentes sobre acumulação no Bairro António Sérgio / Largo da Boa Vontade. Existe ainda um relato público adicional sem data estabelecida na zona dos Canaviais. O relato de Canaviais não integra a base datada de corroboração.
      evidence:
        - EVD-000171
        - EVD-000172
        - EVD-000173
        - EVD-000094
    development:
      summary: >-
        Em fevereiro, o Município comunicou uma perturbação da recolha no concelho; em maio, comunicou uma normalização parcial. Em julho de 2026, o Município descreveu a higiene urbana como um problema urgente e um desafio urgente de gestão. Entre julho e agosto, documentou reforço de pessoal e viaturas, alterações de horários, modelos e circuitos, medidas logísticas, monitorização interna e equipas externas no perímetro urbano. As competências transferidas para as uniões de freguesias urbanas têm efeitos previstos a partir de 1 de janeiro de 2027.
      evidence:
        - EVD-000071
        - EVD-000095
        - EVD-000065
        - EVD-000066
        - EVD-000174
        - EVD-000096
    delimitation:
      summary: >-
        Os relatos localizados têm representatividade desconhecida; o relato na zona dos Canaviais não tem data estabelecida. A pesquisa pública saturada com lacunas de acesso, realizada até 14 de outubro de 2026, abrangeu material municipal, material de reuniões da Câmara e da Assembleia Municipal quando acessível, fontes das juntas urbanas, meios locais e regionais e relatos públicos de residentes que foi possível descobrir. Não foi encontrada manifestação qualificável de serviço corrente posterior a agosto. O relatório de atividades de julho a setembro de 2026 da União das Freguesias de Bacelo e Senhora da Saúde e o documento de deliberação da Assembleia Municipal de 25 de setembro de 2026 não puderam ser inspecionados. A evidência da greve de 2 de outubro foi excluída da avaliação da atualidade do serviço corrente por corresponder a um evento externo. Não foi encontrada série operacional pública; a existência e escala de indicadores públicos aplicáveis permanecem por verificar. A ausência de evidência pública não demonstra resolução nem continuidade de falhas.
      evidence:
        - EVD-000095
        - EVD-000066
        - EVD-000174
