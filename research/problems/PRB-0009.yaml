problem_id: PRB-0009
created_at: 2026-08-28
updated_at: 2026-10-14
title: Fiabilidade da recolha de resíduos e da higiene urbana na cidade de Évora em 2026
domain:
  - ENV
  - PUB
geography:
  level: city
  area: Évora
affected_populations:
  - residentes
problem_statement: >-
  Durante 2026 foram documentadas falhas concretas e localizadas de recolha de resíduos ou
  acumulação de resíduos em vários locais dentro da cidade de Évora. Em janeiro, um residente
  relatou recolha deficiente e acumulação junto ao ponto de recolha perto da Igreja da Misericórdia,
  no Centro Histórico, e pouca regularidade da recolha e acumulação na Estrada de Santo Antonico.
  Estes dois relatos constam da mesma intervenção. Em março, as atas de uma reunião pública
  registaram um vereador a referir queixas de residentes sobre acumulação de resíduos no Bairro
  António Sérgio, em particular no Largo da Boa Vontade. Um relato público descreve ainda acumulação
  em Canaviais. Estes relatos localizados não permitem inferir frequência ou prevalência na cidade.


  Em fevereiro, o Município documentou uma perturbação mais ampla da recolha no concelho, incluindo
  indisponibilidade de veículos e atrasos. Trata-se de contexto municipal e não estabelece, por si
  só, manifestação dentro da cidade. Em maio, o Município comunicou normalização parcial através da
  entrada em serviço de veículos adicionais. Em julho e agosto, documentou reorganização com reforço
  de pessoal e viaturas, alterações de horários, modelos e circuitos, medidas logísticas,
  monitorização interna e equipas urbanas. Estas medidas documentam resposta, não o seu efeito sobre
  a fiabilidade. Os autos de transferência para as uniões de freguesias urbanas estavam aprovados,
  mas só produziriam efeitos a partir de 1 de janeiro de 2027; as tarefas e áreas são delimitadas e
  diferem entre uniões.


  Na pesquisa pública renovada não foi verificada manifestação direta qualificável na cidade depois
  de agosto de 2026. Não foi encontrada série operacional pública que permita determinar se a
  fiabilidade foi restabelecida ou se persistiram falhas materiais. A ausência de relato público não
  demonstra resolução; o desempenho posterior a agosto permanece por estabelecer. A informação
  institucional mais autorizada é sobretudo municipal e provém do Município; as manifestações
  específicas da cidade provêm de relatos localizados de residentes ou do público, recolhidos por
  processos diferentes, cuja representatividade é desconhecida.
investigation:
  open_questions:
    - question: Qual é o desempenho operacional da recolha de resíduos e da higiene urbana na cidade de
        Évora após a reorganização de julho e agosto de 2026?
      why_open: As manifestações localizadas no início de 2026 estão estabelecidas. A normalização parcial
        de maio e a reorganização de julho e agosto alteraram materialmente o contexto. A pesquisa
        renovada não verificou manifestação direta qualificável depois de agosto, nem série pública
        sobre recolhas falhadas, atrasos, pedidos de residentes ou tempos de resposta. Não se pode
        concluir que a fiabilidade foi restabelecida nem que persiste falha generalizada.
      latest_result: Foram verificadas manifestações da cidade em janeiro e março, além do relato de
        Canaviais; não se verificou manifestação qualificável posterior a agosto. A ERSAR publica
        indicadores anuais de qualidade dos serviços de resíduos ao nível da entidade/concelho;
        falta verificar os indicadores aplicáveis a Évora. Podem contextualizar a qualidade do
        serviço, mas não fornecem automaticamente dados de incidentes por bairro ou cidade.
      current_action: "Concluir a via de fontes públicas: verificar comunicações municipais e das juntas
        urbanas posteriores a agosto de 2026 e os indicadores anuais de qualidade do serviço de
        resíduos publicados pela ERSAR aplicáveis a Évora. Está preparado, mas não será enviado
        nesta fase, um pedido ao Município sobre indicadores da monitorização interna anunciada —
        recolhas falhadas, atrasos, pedidos de munícipes e tempos de resposta, com desagregação por
        freguesia ou zona quando disponível. Eventual contacto fica reservado para fase posterior da
        investigação."
      resolution_condition: Evidência operacional pública ou informação institucional suficiente para
        estabelecer o desempenho posterior a agosto na cidade, de preferência com desagregação
        geográfica.
      evidence:
        - EVD-000171
        - EVD-000172
        - EVD-000173
        - EVD-000094
        - EVD-000095
        - EVD-000066
        - EVD-000174
    - question: Que tarefas e áreas de higiene urbana passarão efetivamente para as juntas urbanas a
        partir de 1 de janeiro de 2027, e como serão encaminhadas as falhas entre as juntas e o
        Município?
      why_open: Os autos aprovados têm efeitos previstos para 1 de janeiro de 2027 e estabelecem
        responsabilidades e áreas delimitadas que diferem entre uniões. A recolha de resíduos
        urbanos e de monos não é transferida em bloco. O encaminhamento operacional completo, os
        mapas e a atribuição de responsabilidades por falhas permanecem por esclarecer.
      latest_result: Os autos aprovados produzem efeitos apenas a partir de 1 de janeiro de 2027. Tarefas
        e áreas diferem entre uniões e são delimitadas; a recolha de resíduos urbanos e de monos não
        passa integralmente para as juntas. A preparação técnica e operacional permanecia
        necessária.
      current_action: Acompanhar fontes públicas sobre mapas e áreas finais, tarefas transferidas, início
        operacional e orientações para encaminhamento de pedidos ou falhas por residentes.
      resolution_condition: Documentação pública autorizada que estabeleça tarefas, áreas, data de entrada
        em vigor e responsabilidades e encaminhamento de falhas.
      evidence:
        - EVD-000096
        - EVD-000097
  path:
    initial_signal:
      summary: Relatos localizados de janeiro e março descrevem falhas ou acumulação no Centro Histórico,
        Estrada de Santo Antonico e Bairro António Sérgio / Largo da Boa Vontade; Canaviais
        constitui outra manifestação localizada. Estes elementos estabelecem manifestação dentro da
        cidade, não a perturbação municipal isoladamente.
      evidence:
        - EVD-000171
        - EVD-000172
        - EVD-000173
        - EVD-000094
    development:
      summary: Em fevereiro, o Município documentou perturbação no concelho; em maio, normalização parcial
        por viaturas adicionais; e em julho/agosto, reorganização e respostas sobre meios, horários,
        modelos, circuitos, logística, monitorização e equipas urbanas. As transferências para
        uniões urbanas só produzem efeitos em 1 de janeiro de 2027.
      evidence:
        - EVD-000071
        - EVD-000072
        - EVD-000095
        - EVD-000065
        - EVD-000066
        - EVD-000174
        - EVD-000096
    delimitation:
      summary: Os relatos localizados têm representatividade desconhecida; a evidência municipal não
        estabelece prevalência dentro da cidade. A pesquisa renovada não verificou manifestação
        qualificável depois de agosto nem encontrou série operacional pública que determine a
        fiabilidade. Ausência de evidência pública não estabelece resolução.
      evidence:
        - EVD-000094
        - EVD-000095
        - EVD-000066
