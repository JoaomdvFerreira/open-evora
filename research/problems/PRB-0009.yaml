decision_basis:
  contract_version: "0.1"
  eligibility_basis: >-
    O problema diz respeito à fiabilidade da recolha de resíduos e da higiene urbana para residentes da cidade de Évora. As situações localizadas com data foram relatadas por um residente em janeiro e referidas como queixas de residentes por um vereador numa reunião pública em março; as atas não verificam as ocorrências. A perturbação comunicada pelo Município em fevereiro diz respeito ao concelho e, por si só, não documenta uma falha na cidade. Em maio, o Município comunicou a entrada em serviço de quatro veículos de recolha; as medidas de julho/agosto também não demonstram, por si, melhoria da fiabilidade. O relatório da junta inclui registos administrativos até setembro, mas não documenta o desempenho dos circuitos municipais. As perguntas em aberto dizem respeito ao funcionamento depois de agosto e às responsabilidades futuras. Este registo não propõe uma solução digital.
  corroboration_basis: >-
    Os registos de janeiro e março documentam declarações sobre recolha deficiente ou acumulação de resíduos em locais da cidade, sem verificar de forma independente as ocorrências. Os dois registos de janeiro vêm da mesma intervenção de um residente; o de março regista queixas referidas por um vereador, sem acesso independente às queixas subjacentes. Os registos do Município representam uma só voz institucional e dizem respeito ao concelho ou a medidas de resposta. As ocorrências classificadas pela junta até setembro não identificam falhas dos circuitos. A evidência atual não é suficiente para confirmar as ocorrências localizadas, a frequência ou dimensão do problema na cidade, a sua persistência depois de agosto ou a eficácia da reorganização.
  manifestation:
    kind: Recolha deficiente e acumulação de resíduos relatadas em locais da cidade
    summary: >-
      Em janeiro, um residente relatou recolha deficiente e acumulação junto ao ponto perto da Igreja da Misericórdia, no Centro Histórico, e pouca regularidade e acumulação na Estrada de Santo Antonico. Em março, um vereador referiu queixas de residentes sobre acumulação no Bairro António Sérgio / Largo da Boa Vontade. As atas registam as declarações, não a verificação das ocorrências.
    evidence:
      - EVD-000171
      - EVD-000172
      - EVD-000173
  consequence:
    summary: >-
      O residente em janeiro descreveu acumulação de resíduos e recolha deficiente ou irregular nos dois locais que indicou. Em março, o vereador referiu queixas de residentes sobre acumulação noutro local. A extensão, duração e impacto para além destas declarações não estão estabelecidos.
    evidence:
      - EVD-000171
      - EVD-000172
      - EVD-000173
  currentness:
    assessment: >-
      As declarações sobre falhas em janeiro e março são anteriores à entrada em serviço de quatro veículos de recolha comunicada pelo Município em maio e às medidas anunciadas em julho/agosto. O relatório da junta regista ocorrências de higiene urbana e resíduos urbanos até 18 de setembro, mas não identifica falhas de recolha nem mede o funcionamento dos circuitos municipais. Nem a recuperação da fiabilidade nem a continuação de falhas generalizadas foram demonstradas.
    evidence:
      - EVD-000171
      - EVD-000172
      - EVD-000173
      - EVD-000095
      - EVD-000065
      - EVD-000066
      - EVD-000174
      - EVD-000189
  contradiction_search:
    performed: true
    summary: >-
      A pesquisa pública até 14 de outubro de 2026 consultou material do Município, reuniões da Câmara e da Assembleia Municipal quando acessíveis, fontes das juntas urbanas, meios locais e regionais e relatos públicos de residentes localizáveis. Em 15 de outubro foi consultado o relatório de atividades da União das Freguesias de Bacelo e Senhora da Saúde, com ocorrências classificadas em Higiene Urbana e Resíduos Urbanos até 18 de setembro. A classificação não permite identificar falhas dos circuitos de recolha, e o relatório também descreve trabalhos de limpeza e papeleiras da junta, sem medir a recolha municipal. O documento de deliberação da Assembleia Municipal de 25 de setembro de 2026 permanece por consultar. O STAL comunicou elevada adesão à greve nacional de 2 de outubro nos primeiros serviços noturnos de recolha e higiene urbana em Évora, sem que o impacto efetivo na recolha na cidade tenha sido verificado. O episódio foi considerado separadamente porque não mostra o funcionamento habitual da recolha. Continuam sem dados suficientes os circuitos programados e realizados, recolhas falhadas, atrasos, pedidos ou tempos de resposta na cidade. A pesquisa não demonstra resolução nem continuação de falhas.
    evidence:
      - EVD-000186
      - EVD-000189
      - EVD-000191
  overlap_check:
    performed: true
    summary: Nenhum outro PRB-* canónico aborda a fiabilidade dos serviços municipais de higiene urbana e recolha de resíduos; PRB-0009 não duplica nem se sobrepõe a outro registo.
    related_problems: []
  corroboration_statement: >-
    Em janeiro e março de 2026 foram documentadas declarações sobre recolha deficiente ou acumulação de resíduos em locais da cidade de Évora. As ocorrências relatadas não foram confirmadas de forma independente. A evidência não estabelece frequência, prevalência ou continuidade no conjunto da cidade, nem o desempenho operacional depois da reorganização de julho e agosto.
  supporting_evidence:
    - EVD-000171
    - EVD-000172
    - EVD-000173
  boundary_evidence:
    - EVD-000065
    - EVD-000066
    - EVD-000071
    - EVD-000095
    - EVD-000096
    - EVD-000097
    - EVD-000174
    - EVD-000186
    - EVD-000189
    - EVD-000191
  independence_assessment: >-
    EVD-000171 e EVD-000172 correspondem a um residente, uma reunião e uma intervenção em janeiro, ainda que descrevam dois locais. EVD-000173 corresponde a um evento separado de relato de queixas em março; as queixas individuais subjacentes não estão disponíveis como evidência canónica independente. A separação das reuniões não confirma as ocorrências descritas. O Município representa uma única voz institucional; os seus registos não são vozes institucionais independentes. Os registos da junta são uma classificação administrativa de comunicações, não verificação operacional independente das falhas de recolha. Não se contam mecanicamente IDs, fontes ou documentos para inferir independência ou representatividade.
  scope:
    geography: Cidade de Évora. As declarações registadas em atas dizem respeito a locais da cidade; não confirmam as ocorrências nesses locais nem permitem generalizar ao conjunto da cidade.
    population: Residentes da cidade. As uniões urbanas são atores de governação e serviço, não população afetada estabelecida pela evidência.
    temporal: Declarações sobre situações localizadas registadas em janeiro e março de 2026, sem confirmação independente das ocorrências. O Município comunicou a entrada em serviço de veículos em maio e anunciou medidas em julho/agosto. A junta registou ocorrências de higiene urbana e resíduos urbanos até 18 de setembro, sem identificar falhas dos circuitos; o desempenho operacional posterior a agosto não foi estabelecido.
    bounded: true
  limitations: >-
    As atas registam declarações sobre locais específicos, sem confirmar as ocorrências ou permitir saber a dimensão do problema na cidade. O relatório da junta cobre uma união de freguesias até 18 de setembro e classifica situações sem identificar recolhas falhadas, datas por ocorrência ou tempos de resolução. O funcionamento dos circuitos depois de agosto não está quantificado para a cidade. Não se afirma falha generalizada e contínua em toda a cidade.
history:
  - date: 2026-10-14
    summary: >-
      A investigação foi aprofundada e estabeleceu falhas localizadas de recolha ou acumulação de resíduos dentro da cidade; o âmbito passou do concelho para a cidade. Foram revistos os limites da informação reunida e as questões de investigação, e deixou de ser usada informação de outros países como termo de comparação. O problema continua em aberto; o funcionamento do serviço depois de agosto continua por estabelecer.
  - date: 2026-10-14
    summary: >-
      A revisão confirmou apenas os relatos com data de janeiro e março, manteve, nessa fase, uma comunicação individual sobre recolha de resíduos sem data estabelecida e desligou dois registos de evidência contextual que deixaram de integrar a delimitação do problema. A pesquisa pública até 14 de outubro de 2026 foi concluída nas fontes acessíveis, com dois documentos por consultar. O funcionamento da recolha depois das alterações de julho e agosto permanece por esclarecer.
  - date: 2026-10-15
    summary: >-
      Foi consultado o relatório de atividades da União das Freguesias de Bacelo e Senhora da Saúde e integrada evidência sobre ocorrências classificadas em higiene urbana e resíduos urbanos até 18 de setembro, além de trabalhos de limpeza da junta. A leitura do período depois de agosto passou a reconhecer esses registos, sem os equiparar a falhas dos circuitos municipais. O desempenho da recolha e os tempos de resolução continuam por esclarecer; não houve alteração dos estados canónicos.
    evidence:
      - EVD-000189
      - EVD-000191
  - date: 2026-10-15
    summary: >-
      A revisão de admissibilidade retirou um relato individual da fundamentação atual e passou a distinguir as declarações registadas em atas das ocorrências relatadas. A evidência restante não confirma de forma independente as falhas localizadas; o estado da evidência passou de corroborated para discovered. Mantêm-se por esclarecer o funcionamento da recolha depois de agosto e os tempos de resolução.
