problem_id: PRB-0009
created_at: 2026-08-28
updated_at: 2026-10-15
title: Fiabilidade da recolha de resíduos e da higiene urbana na cidade de Évora em 2026
domain:
  - ENV
  - PUB
geography:
  level: city
  area: Évora
affected_populations:
  - residentes
problem_statement: >-
  Em janeiro e março de 2026 foram registadas falhas localizadas de recolha ou acumulação de resíduos em vários pontos da cidade de Évora, incluindo o Centro Histórico, a Estrada de Santo Antonico e o Bairro António Sérgio / Largo da Boa Vontade. Há ainda um relato público, sem data estabelecida, de acumulação de resíduos na zona dos Canaviais. Estes casos não mostram a frequência nem a dimensão do problema no conjunto da cidade.


  Em fevereiro, o Município comunicou uma perturbação da recolha no concelho. Em maio, pôs ao serviço quatro veículos de recolha e, entre julho e agosto, anunciou reforços de pessoal e viaturas, alterações de horários e circuitos e a reorganização do serviço.


  O relatório de atividades da União das Freguesias de Bacelo e Senhora da Saúde regista situações de higiene urbana e resíduos urbanos até 18 de setembro, mas não permite identificar falhas nos circuitos municipais de recolha nem avaliar a fiabilidade do serviço depois de agosto.
investigation:
  open_questions:
    - question: Depois da reorganização de julho e agosto de 2026, com que regularidade foram realizados os circuitos de recolha na cidade de Évora, que falhas foram registadas e em quanto tempo foram resolvidas?
      why_open: >-
        Os relatos datados de falhas localizadas na cidade, de janeiro e março de 2026, são anteriores às medidas municipais de maio e de julho/agosto. O relatório da junta regista situações até 18 de setembro, mas não discrimina recolhas falhadas, circuitos realizados ou tempos de resolução. As medidas e os registos administrativos não mostram como passou a funcionar a recolha municipal.
      latest_result: >-
        Os relatos datados de falhas localizadas na cidade são de janeiro e março de 2026. Entre 1 de julho e 18 de setembro, a junta de Bacelo e Senhora da Saúde recebeu 124 comunicações e registou 137 ocorrências distintas, além de 15 reforços; 48 ocorrências foram classificadas em Higiene Urbana (19 em julho, 14 em agosto e 15 de 1 a 18 de setembro) e 11 em Resíduos Urbanos (5 de 1 a 18 de setembro). Estas categorias não identificam quantas situações foram falhas de recolha. Continuam sem dados suficientes os circuitos programados e realizados, atrasos, falhas e tempos de resposta na cidade. O documento de deliberação da Assembleia Municipal de 25 de setembro permanece por consultar.
      current_action: >-
        Consultado o relatório da junta, falta obter registos operacionais dos circuitos municipais depois de agosto, incluindo circuitos programados e realizados, recolhas falhadas ou atrasadas e tempos de resolução por zona ou circuito. O documento de deliberação da Assembleia Municipal de 25 de setembro de 2026 permanece por consultar. O pedido de informação ao Município ainda não foi enviado.
      resolution_condition: >-
        Registos públicos ou informação documentada do Município, na medida em que existam, suficientes para avaliar, na cidade de Évora e num período que cubra o funcionamento depois das alterações de julho e agosto de 2026: os circuitos de recolha programados e efetivamente realizados; as recolhas falhadas ou atrasadas; os incidentes operacionais registados; as queixas e respetivas datas; o tempo de resolução das falhas; e as zonas da cidade ou de recolha a que respeitam. Não é necessário detalhe por rua se informação fiável por zona ou por circuito responder à pergunta.
      evidence:
        - EVD-000171
        - EVD-000172
        - EVD-000173
        - EVD-000094
        - EVD-000095
        - EVD-000066
        - EVD-000174
        - EVD-000189
        - EVD-000191
    - question: Que tarefas e áreas de higiene urbana passarão efetivamente para as juntas urbanas a partir de 1 de janeiro de 2027, e como serão encaminhadas as falhas entre as juntas e o Município?
      why_open: Os acordos aprovados delimitam tarefas e áreas diferentes para cada união de freguesias, com efeitos previstos a partir de 1 de janeiro de 2027. Ainda não está esclarecido como serão encaminhados os pedidos e as falhas entre as juntas urbanas e o Município.
      latest_result: Os acordos aprovados têm efeitos previstos para 1 de janeiro de 2027. A recolha de resíduos urbanos e de monos não passa integralmente para as juntas; tarefas e áreas variam entre uniões. A preparação técnica e operacional ainda era necessária.
      current_action: A documentação pública disponível não estabelece por completo os mapas e áreas finais, o início efetivo das tarefas nem o encaminhamento dos pedidos ou falhas entre as juntas urbanas e o Município.
      resolution_condition: Documentação pública que estabeleça tarefas, áreas, data de início efetivo e responsabilidades pelo encaminhamento de falhas.
      evidence:
        - EVD-000096
        - EVD-000097
  path:
    initial_signal:
      summary: >-
        Em janeiro, um residente relatou recolha deficiente e acumulação junto ao ponto de recolha perto da Igreja da Misericórdia, no Centro Histórico, e pouca regularidade da recolha e acumulação na Estrada de Santo Antonico. Em março, um vereador referiu queixas de residentes sobre acumulação no Bairro António Sérgio / Largo da Boa Vontade. Existe ainda um relato público sem data estabelecida na zona dos Canaviais. A confirmação das falhas em janeiro e março não depende deste relato sem data.
      evidence:
        - EVD-000171
        - EVD-000172
        - EVD-000173
        - EVD-000094
    development:
      summary: >-
        Em fevereiro, o Município comunicou uma perturbação da recolha no concelho. Em maio, o Município pôs ao serviço quatro veículos de recolha. Em julho de 2026, descreveu a higiene urbana como um problema urgente. Entre julho e agosto, anunciou reforços de pessoal e viaturas, alterações de horários e circuitos, reorganização do serviço, medidas logísticas, monitorização interna e equipas externas no perímetro urbano. As competências transferidas para as uniões de freguesias urbanas têm efeitos previstos a partir de 1 de janeiro de 2027.
      evidence:
        - EVD-000071
        - EVD-000095
        - EVD-000065
        - EVD-000066
        - EVD-000174
        - EVD-000096
    delimitation:
      summary: >-
        Os relatos localizados não mostram a frequência das falhas na cidade, e o relato da zona dos Canaviais não tem data estabelecida. O relatório da junta contabiliza ocorrências de higiene urbana e resíduos urbanos até 18 de setembro, incluindo depois de agosto, sem identificar quais correspondem a falhas de recolha ou descrever o desempenho dos circuitos municipais. O documento de deliberação da Assembleia Municipal de 25 de setembro permanece por consultar. O STAL comunicou elevada adesão à greve nacional de 2 de outubro de 2026 nos primeiros serviços noturnos de recolha e higiene urbana em Évora, mas não foi verificado o impacto efetivo na recolha na cidade. Este episódio pontual não permite avaliar a fiabilidade habitual da recolha depois da reorganização; nem a recuperação da fiabilidade nem a continuação de falhas no funcionamento habitual foram demonstradas.
      evidence:
        - EVD-000095
        - EVD-000066
        - EVD-000174
        - EVD-000186
        - EVD-000189
        - EVD-000191
