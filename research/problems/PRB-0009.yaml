decision_basis:
  contract_version: "0.1"
  eligibility_basis: >-
    PRB-0009 delimita a fiabilidade da recolha de resíduos e higiene urbana na cidade de Évora, com residentes como população afetada. A base de manifestações localizadas datadas é composta pela intervenção de janeiro e pelo relato de queixas em reunião pública de março. A perturbação municipal de fevereiro contextualiza o serviço, mas não estabelece isoladamente manifestação na cidade. A documentação de maio e julho/agosto altera o contexto operacional e regista respostas sem demonstrar o seu efeito. O relato na zona dos Canaviais é adicional e não tem data estabelecida. As questões distinguem desempenho posterior a agosto e responsabilidades futuras. O registo não prescreve solução digital.
  corroboration_basis: >-
    A leitura corroborada, por decisão humana, limita-se a falhas localizadas de recolha ou acumulação documentadas em janeiro e março de 2026 dentro da cidade. EVD-000171 e EVD-000172 descrevem dois locais na mesma intervenção de um residente em janeiro e constituem um único processo, não duas linhas independentes. EVD-000173 regista queixas de residentes referidas por vereador em reunião pública em março, um evento separado. EVD-000094 é um relato público adicional, separado e sem data estabelecida; não é necessário para a decisão temporal de corroboração. A informação municipal é uma voz institucional. Esta corroboração não estabelece frequência, prevalência, falha generalizada, persistência depois de agosto ou ineficácia da reorganização.
  manifestation:
    kind: Falhas localizadas de recolha e acumulação de resíduos
    summary: >-
      Em janeiro, foram relatadas recolha deficiente e acumulação junto ao ponto perto da Igreja da Misericórdia, no Centro Histórico, e pouca regularidade e acumulação na Estrada de Santo Antonico. Em março, foram referidas queixas sobre acumulação no Bairro António Sérgio / Largo da Boa Vontade. Existe também um relato público sem data estabelecida sobre acumulação de resíduos na zona dos Canaviais. Este último não é uma manifestação datada de 2026.
    evidence:
      - EVD-000171
      - EVD-000172
      - EVD-000173
      - EVD-000094
  consequence:
    summary: >-
      Os relatos de janeiro e março descrevem acumulação de resíduos e recolha deficiente ou irregular nos locais identificados. O relato adicional na zona dos Canaviais também descreve acumulação, mas não tem data estabelecida. A extensão, duração e impacto para além desses relatos não estão estabelecidos.
    evidence:
      - EVD-000171
      - EVD-000172
      - EVD-000173
      - EVD-000094
  currentness:
    assessment: >-
      As manifestações datadas em janeiro e março são anteriores à normalização parcial comunicada em maio e às alterações de julho/agosto. A pesquisa pública realizada até 14 de outubro de 2026 não encontrou manifestação qualificável de serviço corrente posterior a agosto nas fontes consultadas, com dois documentos identificados não inspecionados por limitações de acesso. Não foi encontrada série operacional pública. A fiabilidade restaurada e a continuação de falhas generalizadas permanecem por estabelecer.
    evidence:
      - EVD-000171
      - EVD-000172
      - EVD-000173
      - EVD-000095
      - EVD-000065
      - EVD-000066
      - EVD-000174
  contradiction_search:
    performed: true
    summary: >-
      Pesquisa pública saturada com lacunas de acesso, com horizonte até 14 de outubro de 2026. Foram consultados material municipal, material de reuniões da Câmara, material da Assembleia Municipal quando acessível, fontes das juntas urbanas, meios locais e regionais e relatos públicos de residentes que foi possível descobrir. Não foi encontrada manifestação qualificável de serviço corrente posterior a agosto. Foi identificada evidência de greve em 2 de outubro, excluída da avaliação de atualidade por ser um evento externo (EXOGENOUS_BOUNDARY_EVENT). O relatório de atividades de julho a setembro de 2026 da União das Freguesias de Bacelo e Senhora da Saúde e o documento de deliberação da Assembleia Municipal de 25 de setembro de 2026 permaneceram inacessíveis. Não foi encontrada série operacional pública sobre recolhas falhadas, atrasos, pedidos ou tempos de resposta. A existência e escala de indicadores públicos aplicáveis a Évora permanecem por verificar. A pesquisa não demonstra resolução nem continuação de falhas.
    evidence: []
  overlap_check:
    performed: true
    summary: Nenhum outro PRB-* canónico aborda a fiabilidade dos serviços municipais de higiene urbana e recolha de resíduos; PRB-0009 não duplica nem se sobrepõe a outro registo.
    related_problems: []
  corroboration_statement: >-
    Em janeiro e março de 2026 foram documentadas falhas localizadas de recolha ou acumulação de resíduos dentro da cidade de Évora. A evidência não estabelece frequência, prevalência ou continuidade no conjunto da cidade, nem o desempenho operacional depois da reorganização de julho e agosto.
  supporting_evidence:
    - EVD-000171
    - EVD-000172
    - EVD-000173
    - EVD-000094
  boundary_evidence:
    - EVD-000065
    - EVD-000066
    - EVD-000071
    - EVD-000095
    - EVD-000096
    - EVD-000097
    - EVD-000174
  independence_assessment: >-
    EVD-000171 e EVD-000172 correspondem a um residente, uma reunião e uma intervenção em janeiro, ainda que descrevam dois locais. EVD-000173 corresponde a um evento separado de relato de queixas em março; as queixas individuais subjacentes não estão disponíveis como evidência canónica independente. EVD-000094 é um relato público separado na zona dos Canaviais, sem data estabelecida. O Município representa uma única voz institucional; os seus registos não são vozes institucionais independentes. Os relatos públicos e os registos municipais têm processos distintos, mas não se contam mecanicamente IDs, fontes ou documentos para inferir independência ou representatividade.
  scope:
    geography: Cidade de Évora. Manifestações em locais ou freguesias estabelecem presença dentro da cidade sem generalização ao conjunto.
    population: Residentes da cidade. As uniões urbanas são atores de governação e serviço, não população afetada estabelecida pela evidência.
    temporal: Manifestações localizadas datadas em janeiro e março de 2026; o relato adicional na zona dos Canaviais não tem data estabelecida. O contexto mudou em maio e julho/agosto. O desempenho posterior a agosto não foi estabelecido.
    bounded: true
  limitations: >-
    As manifestações são localizadas e a representatividade é desconhecida. A data do relato na zona dos Canaviais não está estabelecida. A pesquisa pública posterior a agosto está saturada até 14 de outubro de 2026, com duas lacunas de acesso. O desempenho operacional posterior a agosto não está quantificado; a disponibilidade e escala de indicadores públicos permanecem por verificar. Não se afirma falha generalizada e contínua em toda a cidade.
history:
  - date: 2026-10-14
    summary: >-
      A investigação renovada estabeleceu manifestações localizadas dentro da cidade e estreitou a geografia de município para cidade. Foram revistos os limites da evidência e as questões de investigação, e foi desligada a evidência de comparação estrangeira. PRB-0009 permanece OPEN; o desempenho operacional posterior a agosto continua por estabelecer.
  - date: 2026-10-14
    summary: >-
      A revisão delimitou a base de corroboração datada a janeiro e março, manteve o relato da zona dos Canaviais como não datado e removeu EVD-000093 e EVD-000072 das relações do PRB. A pesquisa pública posterior a agosto foi considerada saturada até 14 de outubro de 2026, com duas lacunas de acesso. O desempenho operacional posterior à reorganização permanece por estabelecer.
