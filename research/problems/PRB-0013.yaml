problem_id: PRB-0013
created_at: "2026-10-12"
updated_at: "2026-10-15"
title: "Habitação a preços comportáveis em Évora: necessidade identificada e respostas municipais"
domain: [HOU, SOC]
geography:
  level: city
  area: Évora
affected_populations:
  - residentes que procuram habitação adequada e a preços comportáveis
problem_statement: >-
  O relatório setorial do Plano de Urbanização de Évora (PUE), datado de maio de 2023, descreve aumento dos preços das casas à venda nas freguesias urbanas e
  oferta muito reduzida de casas para arrendar nas plataformas consultadas,
  face à dimensão da cidade e à procura esperada. O Município documentou a
  entrega de 12 casas para arrendamento apoiado na Malagueira em janeiro de
  2026. Na Rua Alexandre Rosado, documentou uma empreitada de reabilitação
  habitacional em 2025. O programa habitacional municipal mais amplo prevê
  financiamento e intervenções, mas os seus totais não estão desagregados para
  a cidade. Não está estabelecido se as 12 casas integram esse programa, qual
  a execução das restantes intervenções na cidade ou quanta necessidade atual
  permanece por satisfazer.
investigation:
  open_questions:
    - question: >-
        Que intervenções habitacionais municipais documentadas dizem respeito à
        cidade de Évora e qual é o seu estado de execução, entrega e ocupação?
      why_open: >-
        São conhecidas 12 casas entregues na Malagueira e uma empreitada de
        reabilitação na Rua Alexandre Rosado descrita como em curso no
        exercício de 2025. Não está documentada a conclusão, entrega ou
        ocupação das frações desta empreitada. O programa de 459 habitações
        tem âmbito municipal e não está desagregado para a cidade; também não
        está estabelecido se inclui as 12 casas ou a intervenção da Rua
        Alexandre Rosado.
      latest_result: >-
        O Município documentou 12 casas entregues na Malagueira em janeiro de
        2026. Na Rua Alexandre Rosado, documentou a consignação em abril de
        2025 de uma empreitada para reabilitar quatro edifícios com 64 frações
        existentes, descrita como em curso na Prestação de Contas de 2025. O
        Plano de Ação 2026 prevê a reabilitação de 62 fogos naquela rua com
        financiamento do 1.º Direito/PRR. As fontes ligadas não confirmam a
        conclusão, entrega ou ocupação das frações da Rua Alexandre Rosado,
        nem esclarecem a relação exata entre as duas contagens. O programa
        municipal de 459 habitações continua sem desagregação completa para a
        cidade.
      current_action: >-
        Está por verificar se informação pública municipal atual identifica as
        restantes intervenções situadas na cidade e as respetivas conclusões,
        entregas e ocupações, incluindo o estado posterior à informação de
        2025 sobre a Rua Alexandre Rosado. Está preparado, mas não enviado, um
        pedido ao Município para desagregar por localização o programa de 459
        habitações, indicar os números da cidade concluídos, entregues e
        ocupados, quando disponíveis, e esclarecer se as 12 casas da Malagueira
        e a intervenção da Rua Alexandre Rosado integram essa contagem.
      resolution_condition: >-
        Informação municipal com localização que distinga financiamento, obra,
        conclusão, entrega e ocupação na cidade e esclareça a relação da
        intervenção da Rua Alexandre Rosado e das casas da Malagueira com o
        programa municipal.
      evidence: [EVD-000170, EVD-000192, EVD-000193, EVD-000042, EVD-000032]
    - question: >-
        Existem dados oficiais recentes que permitam caracterizar os preços de
        compra e arrendamento e a oferta de habitação a preços comportáveis
        na cidade de Évora com detalhe geográfico adequado?
      why_open: >-
        O diagnóstico de 2023 não mede a necessidade ou os preços atuais;
        a evidência ligada não estabelece se existem dados oficiais recentes
        com detalhe geográfico e definições utilizáveis para essa caracterização.
      latest_result: >-
        O relatório setorial de 2023 descreveu aumento dos preços de venda e
        oferta reduzida de arrendamento nas plataformas consultadas para a
        cidade; as respostas municipais documentadas não medem a
        necessidade residual em 2026 nem confirmam a existência de dados
        recentes, geograficamente adequados e utilizáveis sobre preços e oferta.
      current_action: >-
        Está por verificar se existem dados oficiais sobre preços, oferta e
        necessidade, se são recentes, se têm detalhe geográfico adequado à
        cidade de Évora e se as suas definições permitem utilizá-los nesta análise.
      resolution_condition: >-
        Verificação da existência, recência, cobertura geográfica e definições
        de dados oficiais utilizáveis, ou documentação das limitações das
        fontes consultadas caso não permitam essa caracterização.
      evidence: [EVD-000169, EVD-000032, EVD-000042]
  path:
    initial_signal:
      summary: >-
        O relatório setorial do PUE de 2023 descreveu aumento dos preços de
        venda nas freguesias urbanas, oferta reduzida de arrendamento nas
        plataformas consultadas e problemas de sobrelotação e degradação de
        edifícios em partes da cidade. Não mede a situação em 2026.
      evidence: [EVD-000169]
    development:
      summary: >-
        O plano de 2025 descreveu respostas previstas e o Município documentou
        um programa de 67,1 milhões de euros para 459 habitações, com previsão
        de beneficiar cerca de 500 famílias. São agregados municipais: não
        estabelecem quantas habitações, despesas ou famílias correspondem à
        cidade, nem comprovam entregas. Separadamente, o Município documentou
        12 casas entregues na Malagueira em janeiro de 2026; não estabeleceu
        se integram as 459 habitações. Na Rua Alexandre Rosado, documentou a
        consignação de uma empreitada para reabilitar 64 frações em 2025,
        descrita como em curso na prestação de contas desse exercício; o plano
        de ação de 2026 prevê, separadamente, a reabilitação de 62 fogos nessa
        rua através de financiamento do 1.º Direito/PRR.
      evidence: [EVD-000032, EVD-000042, EVD-000170, EVD-000192, EVD-000193]
    delimitation:
      summary: >-
        Este problema trata da habitação geral na cidade de Évora. Os agregados
        municipais servem apenas de contexto para respostas que exigem
        desagregação geográfica; os projetos do Moinho, do Escurinho e do centro
        de acolhimento não são aqui atribuídos à cidade sem localização
        explícita na fonte ligada. A entrega na Malagueira é uma resposta
        local, não uma medida da necessidade residual da cidade. A empreitada
        da Rua Alexandre Rosado e a programação de 62 fogos referem-se à cidade,
        mas não comprovam conclusão, entrega ou ocupação; não está estabelecida
        a correspondência exata entre as contagens de 64 frações e 62 fogos,
        nem a sua inclusão nas 459 habitações do programa municipal.
        A capacidade das residências universitárias, as listas de espera,
        estudantes sem colocação e a expansão do alojamento universitário
        são tratados no problema sobre alojamento estudantil em Évora.
      evidence: [EVD-000169, EVD-000032, EVD-000042, EVD-000170, EVD-000192, EVD-000193]
