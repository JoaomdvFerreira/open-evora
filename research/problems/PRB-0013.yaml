history:
  - date: 2026-10-12
    summary: >-
      Este problema foi criado pela separação da habitação geral e das respostas municipais antes incluídas no problema sobre alojamento estudantil em Évora, onde o alojamento estudantil permanece.
  - date: 2026-10-13
    summary: >-
      O âmbito passou a ser a cidade de Évora. Os agregados
      do programa municipal foram separados da evidência da cidade e a entrega
      na Malagueira passou a ter evidência própria; os totais municipais
      deixaram de ser tratados como totais da cidade.
  - date: 2026-10-15
    summary: >-
      Foi integrada documentação sobre a empreitada de reabilitação da Rua
      Alexandre Rosado e, separadamente, sobre a programação de 62 fogos com
      financiamento do 1.º Direito/PRR. Permanecem por confirmar a conclusão,
      entrega e ocupação das frações, a relação entre as duas contagens e a
      desagregação das restantes intervenções municipais na cidade.
