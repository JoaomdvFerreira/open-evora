history:
  - date: 2026-10-12
    summary: >-
      PRB-0013 foi criado pela separação da habitação geral e das respostas
      municipais antes incluídas em PRB-0006. O alojamento estudantil
      permanece em PRB-0006.
  - date: 2026-10-13
    summary: >-
      O âmbito foi fixado pelo proprietário na cidade de Évora. Os agregados
      do programa municipal foram separados da evidência da cidade e a entrega
      na Malagueira passou a ter evidência própria; os totais municipais
      deixaram de ser tratados como totais da cidade.
