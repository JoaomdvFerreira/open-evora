status: CLOSED
closure:
  reason: OUT_OF_SCOPE
  explanation: >-
    A evidência canónica inclui um diagnóstico de planeamento autoritativo à escala
    do concelho que identifica um desajustamento entre as qualificações da força
    de trabalho e as necessidades dos empregadores (EVD-000037). Esse diagnóstico
    não quantifica o desajustamento nem identifica as competências concretamente
    em falta. As respostas existentes e previstas estão documentadas sobretudo à
    escala do concelho ou mais ampla. A evidência que identifica profissões em
    escassez é regional (Alentejo, EVD-000115); os dados do CTEF Évora são
    intermunicipais (14 municípios) e não apresentam uma lista de profissões em
    escassez (EVD-000116). Os registos à escala da cidade (EVD-000041, EVD-000147)
    documentam crescimento empresarial e uma feira do emprego prevista, mas não
    estabelecem um desajustamento de competências na cidade. Por isso, a evidência não
    estabelece uma manifestação específica na cidade de Évora. Este encerramento
    não estabelece que não exista um desajustamento de competências.
  reopen_condition: >-
    Reconsiderar este registo se surgir evidência específica da cidade de Évora
    sobre profissões ou competências de difícil recrutamento ou sobre um
    desajustamento entre as competências disponíveis e as necessidades dos
    empregadores. Pode incluir, por exemplo, um levantamento junto de empregadores
    da cidade, dados da Universidade de Évora, do NERE ou de outra entidade com
    esse recorte, ou o mapeamento de competências previsto no PDS caso produza
    evidência aplicável especificamente à cidade. Evidência apenas municipal,
    regional ou intermunicipal não é suficiente, por si só, para satisfazer esta
    condição.
  closed_at: 2026-10-14
history:
  - date: 2026-08-31
    summary: A via institucional terminou sem resposta e essa ausência não é evidência a favor nem contra o problema; a questão municipal sobre competências e profissões em escassez mantém-se em aberto até existir evidência específica do concelho.
  - date: 2026-10-14
    summary: O registo foi encerrado porque a evidência disponível não estabelece
      uma manifestação específica na cidade de Évora; este encerramento não afirma
      que o desajustamento subjacente não exista. A redação pública foi alinhada
      com o limite geográfico da evidência.
    state_changes:
      status:
        from: OPEN
        to: CLOSED
