problem_id: PRB-0008
created_at: "2026-08-28"
updated_at: "2026-10-14"
title: Alinhamento entre competências e necessidades dos empregadores no concelho
  de Évora
domain:
  - EMP
  - EDU
  - ECO
geography:
  level: municipality
  area: Évora
affected_populations:
  - trabalhadores e pessoas à procura de emprego
  - empregadores
  - entidades de formação e ensino
problem_statement: >-
  O diagnóstico do PDS identifica, à escala do concelho de Évora, um desajustamento
  entre as qualificações da força de trabalho e as necessidades dos empregadores,
  mas não quantifica a sua dimensão nem identifica as competências em falta.
  Existem ou estão previstos mecanismos de empregabilidade, formação e articulação
  entre empregadores e entidades de ensino; a sua existência não demonstra que o
  desajustamento esteja resolvido nem a eficácia global dessas respostas.


  Os retratos de ofertas do IEFP e do Indeed mostram procura anunciada ou requisitos
  especializados, mas não demonstram escassez de competências nem recrutamento
  sem sucesso. A EURES identifica profissões em escassez apenas para a região do
  Alentejo. Os dados do CTEF Évora abrangem 14 municípios e não apresentam uma
  lista de profissões em escassez. Nenhuma destas evidências permite estabelecer
  a situação especificamente na cidade de Évora.


  O crescimento empresarial e a feira do emprego prevista são contexto e respostas
  à escala da cidade; nenhum demonstra um desajustamento de competências na cidade.
investigation:
  open_questions:
    - question: Que profissões ou competências estão documentadas como de difícil
        recrutamento especificamente na cidade de Évora?
      why_open: >-
        A EURES identifica profissões em escassez à escala regional do Alentejo.
        O boletim do IEFP para o CTEF Évora cobre 14 municípios e não apresenta
        uma lista de profissões em escassez. O diagnóstico municipal e as ofertas
        anunciadas não respondem à questão específica da cidade.
      latest_result: A via institucional terminou sem resposta após uma sequência de
        contacto delimitada; a ausência de resposta não é evidência a favor nem
        contra o problema.
      current_action: Nenhuma ação ativa no âmbito atual do programa.
      resolution_condition: Evidência específica da cidade ou validação institucional
        com recorte específico para a cidade sobre profissões ou competências de
        difícil recrutamento.
      evidence:
        - EVD-000115
        - EVD-000116
  path:
    initial_signal:
      summary: O diagnóstico de planeamento municipal identificou um desajustamento
        entre as qualificações da força de trabalho e as necessidades dos
        empregadores; foram também previstas medidas de mapeamento de competências,
        adaptação da formação e articulação entre entidades de ensino e empregadores.
        O crescimento empresarial registado à escala da cidade não demonstra esse
        desajustamento.
      evidence:
        - EVD-000037
        - EVD-000144
        - EVD-000040
        - EVD-000041
    development:
      summary: Existem mecanismos de empregabilidade, formação e articulação entre
        empregadores e entidades de ensino, e estão previstos mapeamento de
        competências, adaptação da formação e uma terceira edição da Feira do
        Emprego da Universidade de Évora para outubro de 2026. A evidência não
        demonstra a eficácia global destas respostas. O crescimento empresarial
        e a feira prevista são contexto e resposta à escala da cidade, não prova
        de desajustamento de competências nessa escala.
      evidence:
        - EVD-000048
        - EVD-000144
        - EVD-000147
    delimitation:
      summary: >-
        As listagens públicas de ofertas de emprego, por si só, não permitem
        identificar uma escassez real de competências. O retrato municipal do
        IEFP em Évora, com 102 ofertas, e o retrato municipal do Indeed para o
        setor aeroespacial mostram procura anunciada ou requisitos especializados,
        mas não contêm dados sobre o tempo necessário para preencher as vagas,
        tentativas de recrutamento sem sucesso, limitações salariais ou escassez
        reportada pelos empregadores.


        O sinal de procura especializada no setor aeroespacial não permite
        estabelecer, por si só, uma situação real de escassez.


        Foram ainda identificados o PlaQuaR, concebido à escala regional do
        Alentejo, e o plano de ação anual UÉ/TE Connectivity, à escala do concelho,
        para alinhamento de competências e recolha de informação junto dos
        empregadores. A evidência disponível não permite concluir que estes
        mecanismos sejam sistemáticos ou suficientes para a economia do concelho.
      evidence:
        - EVD-000049
        - EVD-000101
        - EVD-000102
        - EVD-000103
