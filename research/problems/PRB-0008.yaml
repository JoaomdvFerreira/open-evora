problem_id: PRB-0008
created_at: "2026-08-28"
updated_at: "2026-08-28"
title: O alinhamento entre competências e necessidades dos empregadores é uma
  preocupação institucional ativa, mas o desfasamento específico em Évora ainda
  não está caracterizado
domain:
  - EMP
  - EDU
  - ECO
geography:
  level: municipality
  area: Évora
affected_populations:
  - trabalhadores e pessoas à procura de emprego
  - empregadores
  - entidades de formação e ensino
problem_statement: >-
  O planeamento institucional local trata o alinhamento entre as competências da
  força de trabalho e as necessidades dos empregadores — através do mapeamento
  de competências, da adaptação da formação e de uma articulação mais forte
  entre entidades de ensino e empregadores — como uma linha de trabalho atual e
  ativa, e não como uma preocupação resolvida, apesar da considerável
  infraestrutura existente de apoio económico e empresarial e das iniciativas de
  transição entre ensino e emprego.


  Ainda não está estabelecido quais as competências ou profissões concretamente
  em falta no concelho de Évora, por oposição à região do Alentejo em geral,
  para a qual existe uma lista regional de profissões em escassez.
investigation:
  open_questions:
    - question: Quais são as competências ou profissões concretamente em falta no
        concelho de Évora, por oposição à região do Alentejo em geral?
      why_open: >-
        A lista regional de profissões em escassez do EURES para o Alentejo é
        mais informativa do que simples listagens pontuais de ofertas de emprego
        do IEFP ou Indeed, porque identifica profissões em situação de escassez
        e não apenas vagas anunciadas. No entanto, trata-se de evidência à
        escala regional, não municipal, e não deve ser generalizada para Évora
        sem corroboração local.


        O boletim do IEFP confirma ainda que a área estatística do CTEF Évora
        abrange catorze municípios, pelo que os dados dos centros de emprego do
        IEFP também não permitem obter uma lista específica para o concelho de
        Évora.
      current_action: A validação institucional junto da NERE continua a ser a via de
        investigação adequada para esta questão.
      resolution_condition: Dados ou validação institucional específicos do concelho
        de Évora, e não apenas regionais, sobre profissões ou competências em
        situação de escassez.
      evidence:
        - EVD-000115
        - EVD-000116
  path:
    initial_signal:
      summary: O planeamento institucional local identificou o alinhamento entre as
        competências da força de trabalho e as necessidades dos empregadores
        como uma linha de trabalho ativa, através do mapeamento de competências,
        da adaptação da formação e de uma articulação mais forte entre entidades
        de ensino e empregadores.
      evidence:
        - EVD-000037
        - EVD-000144
        - EVD-000040
        - EVD-000041
    development:
      summary: Foi confirmado que já existe uma infraestrutura substancial de
        intermediação entre ofertas de emprego e candidatos — iniciativas
        universitárias de carreira e empregabilidade, ofertas do IEFP,
        mecanismos de formação e o Portal de Emprego da Universidade de Évora.
        Os instrumentos institucionais preveem também mapeamento de
        competências, adaptação da formação e articulação educação-empregadores,
        e a Universidade anunciou uma terceira edição da Feira do Emprego para
        outubro de 2026. Assim, o foco permanece no alinhamento e na sua
        eficácia, não na ausência de uma bolsa de emprego genérica.
      evidence:
        - EVD-000048
        - EVD-000144
        - EVD-000147
    delimitation:
      summary: >-
        As listagens públicas de ofertas de emprego, por si só, não permitem
        identificar uma escassez real de competências. O levantamento do IEFP
        Évora, com 102 ofertas, não contém dados sobre o tempo necessário para
        preencher as vagas, tentativas de recrutamento sem sucesso, limitações
        salariais ou escassez reportada pelos empregadores.


        Foi também identificado um sinal de procura especializada no setor
        aeroespacial, sem que este permita estabelecer, por si só, uma situação
        real de escassez.


        Foram ainda identificados dois mecanismos já em funcionamento para
        alinhamento de competências e recolha de informação junto dos
        empregadores — PlaQuaR e o plano de ação anual UÉ/TE Connectivity —, sem
        que a evidência disponível permita concluir que estes mecanismos são
        sistemáticos ou suficientes para o conjunto da economia de Évora.
      evidence:
        - EVD-000049
        - EVD-000101
        - EVD-000102
        - EVD-000103
