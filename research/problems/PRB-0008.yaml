problem_id: PRB-0008
title: "O alinhamento entre competências e necessidades dos empregadores é uma preocupação institucional ativa, mas o desfasamento específico em Évora ainda não está caracterizado"
domain:
  - "EMP"
  - "EDU"
  - "ECO"
geography:
  level: municipality
  area: "Município de Évora"
affected_populations:
  - "workers and job seekers"
  - "employers"
  - "training/education providers"
problem_statement: "O planeamento institucional local trata o alinhamento entre as competências da força de trabalho e as necessidades dos empregadores — através do mapeamento de competências, da adaptação da formação e de uma articulação mais forte entre educação e empregadores — como uma linha de trabalho atual e ativa, e não como uma preocupação resolvida, apesar da considerável infraestrutura existente de apoio económico/empresarial e das iniciativas de transição da educação para o emprego. Não está ainda estabelecido quais as competências ou profissões concretamente em falta especificamente em Évora, por oposição à região do Alentejo em geral, para a qual existe uma lista regional de profissões em escassez."
investigation:
  open_questions:
    - question: "Quais as competências ou profissões concretamente em falta especificamente em Évora, por oposição à região do Alentejo em geral?"
      why_open: "A lista regional de profissões em escassez do EURES (Alentejo) é mais forte do que as fotografias de vagas anunciadas do IEFP/Indeed porque nomeia profissões como estando em escassez, e não apenas anunciadas — mas é evidência ao nível regional, não municipal, e não deve ser generalizada para Évora sem corroboração local. O boletim do IEFP confirma que a área estatística do CTEF Évora abrange catorze municípios, pelo que os dados dos centros de emprego do IEFP também não conseguem fornecer uma lista específica de Évora."
      current_action: "Via institucional através da NERE (rota D5-OP-006) permanece a via apropriada para esta questão residual."
      resolution_condition: "Dados ou validação institucional específicos do concelho de Évora (não regionais) sobre profissões/competências em escassez."
      evidence:
        - "EVD-000115"
        - "EVD-000116"
  path:
    initial_signal:
      summary: "O planeamento institucional local tratou o alinhamento entre competências da força de trabalho e necessidades dos empregadores como uma linha de trabalho ativa, através do mapeamento de competências, adaptação da formação, e articulação mais forte entre educação e empregadores."
      evidence:
        - "EVD-000037"
        - "EVD-000040"
        - "EVD-000041"
    development:
      summary: "Foi confirmado que já existe infraestrutura substancial de correspondência emprego-candidato (feiras de emprego da UÉ, iniciativas de carreira universitária, listagens do IEFP, mecanismos de formação NERE/IEFP, Portal de Emprego da UÉ), pelo que uma bolsa de emprego genérica duplicaria infraestrutura existente sem uma falha de jornada de utilizador demonstrada. O problema de alinhamento sobrevive como um trabalho institucional atual de 2025/2026, não apenas estratégia histórica."
      evidence:
        - "EVD-000047"
        - "EVD-000048"
    delimitation:
      summary: "Listagens de emprego público por si só não conseguem identificar a escassez real de competências: a fotografia do IEFP Évora (102 listagens) não tem dados de tempo-até-preenchimento, recrutamento falhado, restrição salarial ou escassez reportada pelo empregador. Um sinal de procura especializada (setor aeroespacial) foi acrescentado, sem estabelecer escassez real. Dois mecanismos de alinhamento de competências/feedback do empregador já em funcionamento (PlaQuaR; plano de ação anual UÉ/TE Connectivity) foram identificados, sem estabelecer se são sistemáticos ou suficientes em toda a economia de Évora."
      evidence:
        - "EVD-000049"
        - "EVD-000101"
        - "EVD-000102"
        - "EVD-000103"
    current_formulation:
      summary: "A formulação atual mantém o alinhamento de competências como preocupação institucional ativa e não resolvida, com o desfasamento específico em Évora — por oposição à região do Alentejo em geral, para a qual existe uma lista regional — ainda por caracterizar."
evidence:
