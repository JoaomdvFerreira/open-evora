status: CLOSED
closure:
  reason: OUT_OF_SCOPE
  explanation: >-
    Este registo foi encerrado porque a informação disponível identifica um
    desajustamento entre as qualificações dos trabalhadores e as necessidades
    dos empregadores no concelho de Évora, e profissões em escassez na região
    do Alentejo, mas ainda não demonstra esse desajustamento especificamente na
    cidade de Évora. O encerramento não significa que o problema não exista.
    O diagnóstico municipal de planeamento (EVD-000037) não quantifica o
    desajustamento nem identifica as competências em falta. As profissões em
    escassez identificadas para o Alentejo (EVD-000115) não podem ser
    generalizadas à cidade, e os dados do CTEF Évora abrangem 14 municípios sem
    apresentar uma lista de profissões em escassez (EVD-000116). As respostas
    existentes e previstas estão documentadas sobretudo para o concelho ou para
    áreas mais amplas. A informação sobre a cidade, relativa ao crescimento
    empresarial e a uma feira do emprego prevista (EVD-000041, EVD-000147), não
    demonstra um desajustamento de competências.
  reopen_condition: >-
    Este registo pode ser reconsiderado se surgir informação verificável,
    específica da cidade de Évora, sobre profissões ou competências difíceis de
    recrutar na cidade, ou sobre os requisitos dos empregadores e as
    qualificações dos trabalhadores disponíveis que demonstre um desajustamento
    na cidade. Pode incluir, por exemplo, um levantamento junto de empregadores
    da cidade, dados da Universidade de Évora, do NERE ou de outra entidade com
    esse recorte, ou o mapeamento de competências previsto no PDS, se produzir
    evidência aplicável especificamente à cidade. Informação apenas sobre o
    concelho, a região ou vários municípios não é suficiente, por si só, para
    cumprir esta condição.
  closed_at: 2026-10-14
history:
  - date: 2026-08-31
    summary: A via institucional terminou sem resposta e essa ausência não é evidência a favor nem contra o problema; a questão municipal sobre competências e profissões em escassez mantém-se em aberto até existir evidência específica do concelho.
  - date: 2026-10-14
    summary: O registo foi encerrado porque a evidência disponível não estabelece
      uma manifestação específica na cidade de Évora; este encerramento não afirma
      que o desajustamento subjacente não exista. A redação pública foi alinhada
      com o limite geográfico da evidência.
    state_changes:
      status:
        from: OPEN
        to: CLOSED
