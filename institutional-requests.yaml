    requested_information: Desagregação por localização do programa municipal de 459 habitações, com as habitações situadas na cidade de Évora financiadas, em obra, concluídas, entregues e ocupadas; relação das 12 casas entregues na Malagueira e da intervenção da Rua Alexandre Rosado com esse programa; estado atual das frações da Rua Alexandre Rosado; número de pedidos de habitação registados na Habévora ou no Município, com data de referência, critérios de registo e desagregação para a cidade, quando disponível. Sem dados individuais.
