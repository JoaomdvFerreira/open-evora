  - request_id: IREQ-0005
    prb_references: [PRB-0006]
    intended_recipient: Serviços de Ação Social da Universidade de Évora
    requested_information: Por residência e por ano letivo, de 2023/24 a 2026/27, lugares nominais, camas requalificadas e lugares efetivamente utilizáveis, com datas de encerramento e reabertura, incluindo a Residência António Gedeão; relação entre os 525 lugares nominais publicados e as 515 camas requalificadas referidas pelo reitor; critério de contagem dos estudantes alojados nas estatísticas públicas dos SASUÉ; candidaturas, colocações, não colocados e listas de espera por ano letivo, com as respetivas definições. Sem dados individuais.
    why_needed: A informação pública não distingue de forma verificável lugares nominais, camas requalificadas e oferta utilizável, e os gráficos de estudantes alojados não indicam o critério de contagem nem medem a procura não satisfeita. O inquérito da Associação Académica não é generalizável a todos os estudantes.
    already_known_sources: [SRC-0119, SRC-0157, SRC-0158, SRC-0159, PRB-0006]
    last_known_contact_state: Contacto D5 respondido em agosto de 2026; novo pedido de dados preparado, mas não enviado.
    authorization_status: Novo envio não autorizado.
    send_date: null
    response_date: 2026-08-13
    follow_up_decision: Pedido reformulado em 25 de outubro de 2026 para incluir a capacidade em funcionamento em 2026/2027, o critério de contagem e a procura não satisfeita; não pedir o que as estatísticas públicas já mostram. Qualquer envio depende de autorização expressa do owner.
