# Non-canonical information backlog. It does not authorize contact or change PRB state.
# Dates are null where the canonical record does not establish the event date.
requests:
  - request_id: IREQ-0001
    prb_references: [PRB-0001, PRB-0002]
    intended_recipient: Município de Évora
    requested_information: Horários e partidas atuais da rede urbana, atrasos por carreira e sentido nos acessos ao Centro Histórico e Parque Industrial, resposta à petição estudantil se existente, estado da informação e acessibilidade nas paragens descritas pelo PMUSE e execução das medidas propostas.
    why_needed: Distinguir oferta e condições atuais dos diagnósticos históricos e avaliar efeitos concretos nas deslocações.
    already_known_sources: [PRB-0001, PRB-0002, SRC-0156]
    last_known_contact_state: Pedido documental partilhado preparado, mas não enviado; consulta pública adicional pendente.
    authorization_status: Envio não autorizado.
    send_date: null
    response_date: null
    follow_up_decision: Delimitar o pedido após consultar os horários oficiais e verificar respostas públicas. A adequação/revisão do PMUSE contratada em junho de 2026 não documenta a execução das medidas; verificar se a versão revista é publicada antes de pedir o estado de execução.
