  - request_id: IREQ-0008
    prb_references: [PRB-0009]
    intended_recipient: Assembleia Municipal de Évora
    requested_information: Documento da deliberação de 25 de setembro de 2026 e anexos sobre as tarefas de higiene urbana das juntas, se aplicáveis, incluindo o texto dos autos de transferência para as uniões de freguesias urbanas com efeitos a partir de 1 de janeiro de 2027, as tarefas e mapas das áreas abrangidas e as regras de encaminhamento de pedidos e falhas entre as juntas e o Município.
    why_needed: Confirmar o alcance e a data prevista das mudanças de responsabilidade. O contrato interadministrativo de 2026 com a União das Freguesias de Bacelo e Senhora da Saúde diz respeito a refeitórios escolares, espaços de jogo e recreio e placas toponímicas e não documenta as responsabilidades de higiene urbana a partir de 2027.
    already_known_sources: [SRC-0053, SRC-0081, PRB-0009]
    last_known_contact_state: Documento identificado, ainda não consultado; sem contacto documentado. A pesquisa pública até 25 de outubro de 2026 não localizou o texto dos autos de transferência.
    authorization_status: Envio não autorizado.
    send_date: null
    response_date: null
    follow_up_decision: Verificar primeiro a publicação da deliberação e dos autos nos sítios da Assembleia Municipal e do Município; só depois, e após autorização expressa do owner, solicitar à Assembleia Municipal ou ao Município os elementos ainda em falta.
