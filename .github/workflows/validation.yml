name: Project validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validation:
    name: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci --prefix apps/research-explorer
      - run: npm run research:check
      - run: npm run explorer:build
