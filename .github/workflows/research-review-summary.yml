name: Research semantic review summary

# Publishes the deterministic PT-PT Lane B review summary as one owned
# pull-request comment (docs/investigationstrategy.md §12).
#
# Security model: `Project validation` executes pull-request code and has no
# write token. This workflow runs from the default branch after it completes,
# executes only default-branch tooling, and reads the pull request's base and
# head as Git data. It never checks out or runs pull-request code, and it
# invokes no reviewer or AI service: the summary is derived from the review
# artifact already verified by `research:lane-b:check` semantics.
on:
  workflow_run:
    workflows: ["Project validation"]
    types: [completed]

permissions: {}

concurrency:
  # Serialise per pull-request branch; every run publishes the PR's current state.
  group: research-review-summary-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Creating/updating an issue comment on a pull request.
      pull-requests: write
    steps:
      - name: Resolve the pull request's current state
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            // workflow_run.pull_requests is empty for fork pull requests: fall back to the head label.
            let number = run.pull_requests.find((pr) => pr.base.repo.id === context.payload.repository.id)?.number;
            if (!number) {
              const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", head: `${run.head_repository.owner.login}:${run.head_branch}` });
              number = open.find((pr) => pr.head.repo?.id === run.head_repository.id)?.number;
            }
            if (!number) {
              core.info("No open pull request for this run; nothing to publish.");
              return core.setOutput("found", "false");
            }
            // Always the current state, never the run's: a stale summary is worse than none.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== "open") {
              core.info(`Pull request #${number} is ${pr.state}; nothing to publish.`);
              return core.setOutput("found", "false");
            }
            const eventPath = path.join(process.env.RUNNER_TEMP, "pull-request-event.json");
            fs.writeFileSync(eventPath, JSON.stringify({ pull_request: { base: { sha: pr.base.sha }, head: { sha: pr.head.sha }, body: pr.body } }));
            core.setOutput("found", "true");
            core.setOutput("number", String(number));
            core.setOutput("head-sha", pr.head.sha);
            core.setOutput("event-path", eventPath);

      # Trusted tooling: the default-branch commit this workflow_run runs at, never the PR head.
      - if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pull request head as Git data
        if: steps.pr.outputs.found == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          git cat-file -e "${HEAD_SHA}^{commit}"

      - if: steps.pr.outputs.found == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install trusted tooling dependencies
        if: steps.pr.outputs.found == 'true'
        run: npm ci --ignore-scripts

      - name: Render the semantic review summary
        id: summary
        if: steps.pr.outputs.found == 'true'
        env:
          EVENT_PATH: ${{ steps.pr.outputs.event-path }}
        run: |
          set +e
          node tools/research/lane-b/cli.ts summary --event-path "$EVENT_PATH" --output "$RUNNER_TEMP/review-summary.md"
          code=$?
          set -e
          case "$code" in
            0) status=VERIFIED ;;
            3) status=NOT_APPLICABLE ;;
            4) status=INVALID ;;
            *) echo "summary failed with exit code $code"; exit 1 ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upsert the owned pull-request comment
        if: steps.pr.outputs.found == 'true'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SUMMARY_STATUS: ${{ steps.summary.outputs.status }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const MARKER = "<!-- open-evora:research-semantic-review-summary -->";
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const body = fs.readFileSync(path.join(process.env.RUNNER_TEMP, "review-summary.md"), "utf8");
            if (body.split("\n")[0] !== MARKER) return core.setFailed("rendered summary does not start with the owned marker");

            // Owned = written by this workflow's token and starting with the marker; human comments never match.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const owned = comments.filter((c) => c.user?.login === "github-actions[bot]" && (c.body ?? "").split(/\r?\n/)[0] === MARKER);
            if (owned.length > 1) {
              return core.setFailed(`found ${owned.length} owned summary comments (${owned.map((c) => c.id).join(", ")}); remove the duplicates manually`);
            }
            const [existing] = owned;
            if (!existing) {
              // Not applicable and never published: nothing to correct.
              if (process.env.SUMMARY_STATUS === "NOT_APPLICABLE") return core.info("not applicable; no comment needed");
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              return core.info(`created ${process.env.SUMMARY_STATUS} summary`);
            }
            if (existing.body === body) return core.info("summary unchanged");
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            core.info(`updated ${process.env.SUMMARY_STATUS} summary`);
