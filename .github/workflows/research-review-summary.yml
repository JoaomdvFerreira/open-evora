name: Research semantic review summary

# Publishes the deterministic PT-PT Lane B review summary as one owned
# pull-request comment (docs/investigationstrategy.md §12).
#
# Security model: `Project validation` executes pull-request code and has no
# write token. This workflow runs from the default branch after it completes,
# executes only default-branch tooling, and reads the pull request's base and
# head as Git data. It never checks out or runs pull-request code, and it
# invokes no reviewer or AI service: the summary is derived from the review
# artifact already verified by `research:lane-b:check` semantics.
on:
  workflow_run:
    workflows: ["Project validation"]
    types: [completed]

permissions: {}

concurrency:
  # Serialise per pull-request branch; every run publishes the PR's current state.
  group: research-review-summary-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Creating/updating an issue comment on a pull request.
      pull-requests: write
    steps:
      - name: Resolve the pull request's current state
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const path = require("node:path");
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            // workflow_run.pull_requests is empty for fork pull requests: fall back to the head label.
            let number = run.pull_requests.find((pr) => pr.base.repo.id === context.payload.repository.id)?.number;
            if (!number) {
              const open = await github.paginate(github.rest.pulls.list, { owner, repo, state: "open", head: `${run.head_repository.owner.login}:${run.head_branch}` });
              number = open.find((pr) => pr.head.repo?.id === run.head_repository.id)?.number;
            }
            if (!number) {
              core.info("No open pull request for this run; nothing to publish.");
              return core.setOutput("found", "false");
            }
            // Always the current state, never the run's: a stale summary is worse than none.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== "open") {
              core.info(`Pull request #${number} is ${pr.state}; nothing to publish.`);
              return core.setOutput("found", "false");
            }
            const eventPath = path.join(process.env.RUNNER_TEMP, "pull-request-event.json");
            fs.writeFileSync(eventPath, JSON.stringify({ pull_request: { base: { sha: pr.base.sha }, head: { sha: pr.head.sha }, body: pr.body } }));
            core.setOutput("found", "true");
            core.setOutput("number", String(number));
            core.setOutput("head-sha", pr.head.sha);
            // The exact state the summary is rendered for; re-checked immediately before publication.
            core.setOutput("base-sha", pr.base.sha);
            core.setOutput("body-sha256", crypto.createHash("sha256").update(pr.body ?? "", "utf8").digest("hex"));
            core.setOutput("event-path", eventPath);

      # Trusted tooling: the default-branch commit this workflow_run runs at, never the PR head.
      - if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pull request head as Git data
        if: steps.pr.outputs.found == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          git cat-file -e "${HEAD_SHA}^{commit}"

      - if: steps.pr.outputs.found == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install trusted tooling dependencies
        if: steps.pr.outputs.found == 'true'
        run: npm ci --ignore-scripts

      - name: Render the semantic review summary
        id: summary
        if: steps.pr.outputs.found == 'true'
        env:
          EVENT_PATH: ${{ steps.pr.outputs.event-path }}
        run: |
          set +e
          node tools/research/lane-b/cli.ts summary --event-path "$EVENT_PATH" --output "$RUNNER_TEMP/review-summary.md"
          code=$?
          set -e
          case "$code" in
            0) status=VERIFIED ;;
            3) status=NOT_APPLICABLE ;;
            4) status=INVALID ;;
            *) echo "summary failed with exit code $code"; exit 1 ;;
          esac
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upsert the owned pull-request comment
        if: steps.pr.outputs.found == 'true'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SUMMARY_STATUS: ${{ steps.summary.outputs.status }}
          EXPECTED_BASE_SHA: ${{ steps.pr.outputs.base-sha }}
          EXPECTED_HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          EXPECTED_BODY_SHA256: ${{ steps.pr.outputs.body-sha256 }}
        with:
          script: |
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const path = require("node:path");
            const { pathToFileURL } = require("node:url");
            // Trusted default-branch tooling (checked out above), never PR code.
            const { planSummaryPublication } = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, "tools/research/lane-b/summary.ts")).href);
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const rendered = fs.readFileSync(path.join(process.env.RUNNER_TEMP, "review-summary.md"), "utf8");

            // Publication-time guard: re-read the pull request now; neither the run's SHAs nor the earlier read suffice.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            const current = { baseSha: pr.base.sha, headSha: pr.head.sha, bodySha256: crypto.createHash("sha256").update(pr.body ?? "", "utf8").digest("hex") };
            const expected = { baseSha: process.env.EXPECTED_BASE_SHA, headSha: process.env.EXPECTED_HEAD_SHA, bodySha256: process.env.EXPECTED_BODY_SHA256 };
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });

            const plan = planSummaryPublication({ expected, current, status: process.env.SUMMARY_STATUS, rendered, comments });
            if (plan.action === "fail") return core.setFailed(plan.message);
            if (plan.action === "create") await github.rest.issues.createComment({ owner, repo, issue_number, body: plan.body });
            if (plan.action === "update") await github.rest.issues.updateComment({ owner, repo, comment_id: plan.commentId, body: plan.body });
            core.info(plan.message);
